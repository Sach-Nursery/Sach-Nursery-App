    // Strict DD-MM-YYYY Date Engine
    const todayDDMMYYYY = () => {
      const d = new Date();
      return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
    };
    const daysAgoDDMMYYYY = (n) => {
      const d = new Date(); d.setDate(d.getDate() - n);
      return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
    };
    const parseDDMMYYYY = (str) => {
      if (!str) return null;
      const m = String(str).trim().match(/^(\d{2})-(\d{2})-(\d{4})$/);
      if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
      const iso = String(str).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (iso) return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
      return null;
    };
    const toComparableTime = (str) => { const d = parseDDMMYYYY(str); return d ? d.getTime() : 0; };
    const formatStrictDDMMYYYY = (val) => {
      if (!val) return todayDDMMYYYY();
      if (/^\d{2}-\d{2}-\d{4}$/.test(val)) return val;
      const d = parseDDMMYYYY(val) || new Date(val);
      if (!d || isNaN(d.getTime())) return todayDDMMYYYY();
      return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;

      return v * 60000;

    const idb = {
      open: () => new Promise((res, rej) => {
        const req = indexedDB.open(DB_NAME, 1);

        req.onerror = () => rej(req.error);
      }),
      async get(k) {
        try {
          const db = await this.open();
          return new Promise((res) => {
            const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get(k);
            req.onsuccess = () => res(req.result);
            req.onerror = () => res(null);
          });
        } catch {
          const r = localStorage.getItem('sach6_' + k);
          return r ? JSON.parse(r) : null;
        }
      },
      async set(k, v) {
        try { localStorage.setItem('sach6_' + k, JSON.stringify(v)); } catch {}
        try {
          const db = await this.open();
          return new Promise((res) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(v, k);
            tx.oncomplete = () => res(true);
            tx.onerror = () => res(false);
          });
        } catch { return false; }
      }
    };

    // Hybrid Service Worker + Background Sync Registration
    function registerHybridServiceWorker() {
      if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
      const swCode = `
        const CACHE = 'sach-nursery-hybrid-v1';
        self.addEventListener('install', (e) => { self.skipWaiting(); });
        self.addEventListener('activate', (e) => { e.waitUntil(self.clients.claim()); });
        self.addEventListener('fetch', (e) => {
          if (e.request.method !== 'GET') return;
          e.respondWith(
            fetch(e.request).then((res) => {
              const copy = res.clone();
              caches.open(CACHE).then((c) => c.put(e.request, copy)).catch(() => {});
              return res;
            }).catch(() => caches.match(e.request))
          );
        });
        self.addEventListener('sync', (e) => {
          if (e.tag === 'nursery-bg-sync') {
            e.waitUntil(self.clients.matchAll().then((clients) => {
              clients.forEach((cl) => cl.postMessage({ type: 'RUN_BG_SYNC' }));
            }));
          }
        });
      `;
      try {
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        navigator.serviceWorker.register(url).catch(() => {});
      } catch {}
    }

    function compressImageFile(file, maxDim = 720, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
              else { width = Math.round((width * maxDim) / height); height = maxDim; }
            }
            const c = document.createElement('canvas'); c.width = width; c.height = height;
            c.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(c.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(ev.target.result);
          img.src = ev.target.result;
        };
        r.onerror = reject; r.readAsDataURL(file);
      });
    }

    function smartMatch(item, rawQ) {
      const q = (rawQ || '').trim().toLowerCase();
      if (!q) return true;
      const hay = [item.nameEn||'', item.nameHi||'', item.botanicalName||'', item.category||'', item.categoryHi||'', toHinglish(item.nameHi||''), toHinglish(item.categoryHi||'')].join(' ').toLowerCase();
      if (hay.includes(q)) return true;
      const nq = normPh(q), nh = normPh(hay);
      if (nh.includes(nq)) return true;
      return q.split(/\s+/).every((t) => {
        if (hay.includes(t) || nh.includes(normPh(t))) return true;
        const syns = HINGLISH_SYNONYMS[t] || HINGLISH_SYNONYMS[normPh(t)];
        return syns ? syns.some((s) => hay.includes(s.toLowerCase()) || nh.includes(normPh(s))) : false;
      });
    }

    // Multilingual Voice Billing NLP Engine (Hindi, English, Hinglish)
    const WORD_NUMBERS = {
      ek:1, one:1, एक:1, दो:2, do:2, two:2, तीन:3, teen:3, three:3, चार:4, char:4, four:4,

    const VOICE_STOP_WORDS = new Set(['add','bill','make','invoice','karo','jodo','daalo','aur','and','plus','pieces','pcs','plant','plants','please','जोड़ो','और','दे','दो','चाहिए','का','के','की','बिल','बनाओ']);

    function parseVoiceBillingCommand(transcript, products) {
      const raw = (transcript || '').trim();
      const lower = raw.toLowerCase();
      const triggerCheckout = /\b(checkout|invoice|generate bill|bill banao|बिल बनाओ|पेमेंट|payment)\b/i.test(lower);
      // Split clauses on "and", "aur", "और", ","
      const clauses = lower.split(/\s*(?:,|and|aur|और|\+)\s*/i).filter(Boolean);
      const matchedItems = [];
      const unmatchedClauses = [];

      clauses.forEach((clause) => {
        const tokens = clause.replace(/[।.!?]/g, ' ').split(/\s+/).filter(Boolean);
        let qty = 1;
        const queryTokens = [];
        tokens.forEach((tok) => {
          if (/^\d+$/.test(tok)) qty = Math.max(1, parseInt(tok, 10));
          else if (WORD_NUMBERS[tok] !== undefined) qty = WORD_NUMBERS[tok];
          else if (!VOICE_STOP_WORDS.has(tok)) queryTokens.push(tok);
        });
        const cleanQuery = queryTokens.join(' ').trim();
        if (!cleanQuery) return;
        // Score best matching product
        let best = products.find((p) => (p.nameHi && p.nameHi.toLowerCase() === cleanQuery) || p.nameEn.toLowerCase() === cleanQuery);
        if (!best) best = products.find((p) => smartMatch(p, cleanQuery));
        if (!best && queryTokens.length > 1) {
          for (const tk of queryTokens) {
            best = products.find((p) => smartMatch(p, tk));
            if (best) break;
          }
        }
        if (best) matchedItems.push({ product: best, qty });
        else unmatchedClauses.push(clause);
      });

      return { raw, matchedItems, unmatchedClauses, triggerCheckout };
    }

    async function compileAndSharePDF({ title, subtitle, rows, columns, images = [], fileName }) {
      const W = 1240, H = 1754, padX = 52;
      const pages = [];
      const rowH = images.length ? 260 : 48;
      const perPage = images.length ? 5 : 28;
      const totalPages = Math.max(1, Math.ceil((images.length || rows.length || 1) / perPage));

      for (let pg = 0; pg < totalPages; pg++) {
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#047857'; ctx.fillRect(0, 0, W, 130);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 34px "Plus Jakarta Sans","Noto Sans Devanagari",sans-serif';
        ctx.fillText(title, padX, 58);
        ctx.fillStyle = '#d1fae5'; ctx.font = '600 18px "Plus Jakarta Sans","Noto Sans Devanagari",sans-serif';
        ctx.fillText(`${subtitle}  •  Date: ${todayDDMMYYYY()}  •  Page ${pg + 1}/${totalPages}`, padX, 98);

        if (images.length) {
          const slice = images.slice(pg * perPage, (pg + 1) * perPage);
          for (let i = 0; i < slice.length; i++) {
            const b = slice[i], y = 160 + i * 300;
            ctx.fillStyle = '#f8fafc'; ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.roundRect(padX, y, W - padX * 2, 275, 14); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#0f172a'; ctx.font = 'bold 22px "Plus Jakarta Sans","Noto Sans Devanagari",sans-serif';
            ctx.fillText(`${b.caption} (${b.type} • ${formatStrictDDMMYYYY(b.date)})`, padX + 24, y + 40);
            if (b.image) {
              await new Promise((res) => {
                const im = new Image(); im.crossOrigin = 'anonymous';
                im.onload = () => { ctx.drawImage(im, padX + 24, y + 60, 320, 195); res(); };
                im.onerror = res; im.src = b.image;
              });
            }
          }
        } else {
          // Table Header
          let y = 165;
          ctx.fillStyle = '#ecfdf5'; ctx.fillRect(padX, y, W - padX * 2, 44);
          ctx.fillStyle = '#065f46'; ctx.font = 'bold 16px "Plus Jakarta Sans","Noto Sans Devanagari",sans-serif';
          const colW = (W - padX * 2) / Math.max(1, columns.length);
          columns.forEach((col, ci) => ctx.fillText(String(col.label).slice(0, 24), padX + 10 + ci * colW, y + 28));
          y += 52;
          const slice = rows.slice(pg * perPage, (pg + 1) * perPage);
          slice.forEach((row, ri) => {
            ctx.fillStyle = ri % 2 === 0 ? '#ffffff' : '#f8fafc';
            ctx.fillRect(padX, y - 8, W - padX * 2, 46);
            ctx.fillStyle = '#0f172a'; ctx.font = '500 15px "Plus Jakarta Sans","Noto Sans Devanagari",sans-serif';
            columns.forEach((col, ci) => ctx.fillText(String(row[col.key] ?? '').slice(0, 28), padX + 10 + ci * colW, y + 20));
            y += 48;
          });
        }
        pages.push(c.toDataURL('image/jpeg', 0.9));
      }

      if (window.jspdf?.jsPDF) {
        const doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
        const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
        pages.forEach((im, idx) => { if (idx > 0) doc.addPage(); doc.addImage(im, 'JPEG', 0, 0, pw, ph); });
        const blob = doc.output('blob');
        doc.save(fileName);
        const file = new File([blob], fileName, { type: 'application/pdf' });
        let nativeShared = false;
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ title, text: subtitle, files: [file] }); nativeShared = true; } catch {}
        }
        return { fileName, nativeShared, summaryText: `${title}\n${subtitle}\nDate: ${todayDDMMYYYY()}\nFile: ${fileName}` };
      }
      window.print();
      return { fileName, nativeShared: false, summaryText: `${title}\n${subtitle}` };
    }

    function exportExcelFile(rows, fileBase) {
      if (!rows.length) { alert('No data to export.'); return null; }
      const fn = `${fileBase}.xlsx`;
      if (window.XLSX) {
        const ws = window.XLSX.utils.json_to_sheet(rows), wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, 'Data');
        window.XLSX.writeFile(wb, fn);
      } else {
        const hdr = Object.keys(rows[0]);
        const csv = [hdr.join(','), ...rows.map((r) => hdr.map((h) => `"${String(r[h] ?? '').replace(/"/g, '""')}"`).join(','))].join('\n');
        const l = document.createElement('a');
        l.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        l.download = `${fileBase}.csv`; l.click();
      }
      return { fileName: fn, summaryText: `${fileBase} exported on ${todayDDMMYYYY()} (${rows.length} rows).` };
    }

    async function parseExcelFile(file) {
      const buf = await file.arrayBuffer();
      if (window.XLSX) {
        const wb = window.XLSX.read(buf, { type: 'array' });
        return window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
      }
      const lines = new TextDecoder().decode(buf).split(/\r?\n/).filter(Boolean);
      if (lines.length < 2) return [];
      const hdr = lines[0].split(',').map((h) => h.replace(/^"|"$/g, '').trim());
      return lines.slice(1).map((line) => {
        const vals = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];
        const obj = {}; hdr.forEach((h, i) => { obj[h] = (vals[i] || '').replace(/^"|"$/g, '').replace(/""/g, '"'); });
        return obj;
      });
    }

    function buildWhatsAppBillPayload(sale, nurseryProfile, products) {
      const nName = nurseryProfile?.nurseryName || 'Sach Nursery';
      const oMobile = nurseryProfile?.ownerMobile || '';
      const lines = [
        `*${nName}* — Official Invoice`,
        oMobile ? `Helpline: ${oMobile}` : '',
        `Invoice: *${sale.id}* | Date: ${formatStrictDDMMYYYY(sale.date)} ${sale.time || ''}`,
        `Customer: ${sale.customer || 'Walk-in Customer'}${sale.customerMobile ? ` (${sale.customerMobile})` : ''}`,
        `--------------------------------`,
        `*Purchased Items:*`
      ].filter(Boolean);
      sale.items.forEach((it, idx) => {
        const unitLbl = it.unit ? ` ${it.unit}` : '';
        lines.push(`${idx + 1}. ${it.nameEn}${it.isNonInventory ? ' [Open]' : ''} x ${it.qty}${unitLbl} = Rs.${it.qty * it.price}`);
      });
      lines.push(`--------------------------------`, `Subtotal: Rs.${sale.subtotal}`);
      if (sale.discountAmount > 0) lines.push(`Discount: -Rs.${sale.discountAmount}`);
      lines.push(`*Net Paid: Rs.${sale.total}* (Cash: Rs.${sale.cashAmount} | UPI: Rs.${sale.upiAmount})`);
      const tracked = sale.items.filter((i) => !i.isNonInventory);
      if (tracked.length > 0) {
        lines.push('', `🌱 *पौधों की देखभाल और रखरखाव के निर्देश:*`);
        tracked.forEach((it) => {
          const prod = products.find((p) => p.id === it.productId);
          const care = getHindiCare(prod);
          lines.push(`\n*• ${it.nameHi || it.nameEn}* (${care.botanical})`);
          lines.push(`  📅 मौसम: ${care.season}`);
          lines.push(`  🪴 मिट्टी: ${care.soil}`);
          lines.push(`  💧 पानी: ${care.water}`);
          lines.push(`  ☀️ धूप: ${care.sunlight}`);
          lines.push(`  🧪 खाद: ${care.fertilizer}`);
          lines.push(`  🌿 देखभाल: ${care.care}`);
          lines.push(`  📚 Source: ${care.source}`);
        });
      }
      lines.push(`\nThank you for shopping with *${nName}*!`);
      const text = lines.join('\n');
      const d = (sale.customerMobile || '').replace(/\D/g, '');
      return { text, url: d.length >= 10 ? `https://wa.me/${d.length === 10 ? '91' + d : d}?text=${encodeURIComponent(text)}` : '' };
    }

    // =========================================================================
    // 8. FULLSCREEN QR SCANNER, HINDI CARE MODAL & CHECKOUT / WHATSAPP
    // =========================================================================
    function FullScreenQRScanner({ isOpen, onClose, products }) {
      const [scannedIds, setScannedIds] = useState([]);
      const [checkedMap, setCheckedMap] = useState({});
      const [camOn, setCamOn] = useState(false);
      const [camErr, setCamErr] = useState('');
      const [filter, setFilter] = useState('');
      const qrRef = useRef(null);

      const stopCam = async () => {
        if (qrRef.current) { try { if (camOn) await qrRef.current.stop(); qrRef.current.clear(); } catch {} qrRef.current = null; }
        setCamOn(false);
      };
      useEffect(() => { if (!isOpen) stopCam(); return () => stopCam(); }, [isOpen]);

      const startCam = async () => {
        setCamErr('');
        if (!window.Html5Qrcode) { setCamErr('QR camera library unavailable.'); return; }
        try {
          const qr = new window.Html5Qrcode('qr-reader-region'); qrRef.current = qr;
          await qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 240, height: 240 } }, (txt) => handlePayload(txt), () => {});
          setCamOn(true);
        } catch { setCamErr('Camera unavailable/denied.'); setCamOn(false); }
      };

      const handlePayload = (txt) => {
        const clean = txt.replace('SACH-PLANT:', '').trim();
        const f = products.find((p) => p.id === clean || p.nameEn.toLowerCase() === clean.toLowerCase());
        if (f) setScannedIds((prev) => prev.includes(f.id) ? prev : [f.id, ...prev]);
      };

      if (!isOpen) return null;
      const scanned = scannedIds.map((id) => products.find((p) => p.id === id)).filter(Boolean).filter((p) => smartMatch(p, filter));
      const quick = products.filter((p) => smartMatch(p, filter));

      return (
        <div className="fixed inset-0 z-50 bg-slate-50 dark:bg-slate-950 flex flex-col overflow-hidden">
          <div className="flex flex-wrap items-center justify-between gap-3 px-6 py-4 bg-white dark:bg-slate-900 border-b shadow-sm">
            <div className="flex items-center gap-3"><div style={{ backgroundColor: 'var(--accent-primary)' }} className="p-2.5 rounded-xl text-white"><Icon name="qr" className="w-6 h-6" /></div><div><h2 className="text-xl font-extrabold">QR Plant Scanner</h2><p className="text-xs text-slate-500">ONLY Photo, Name & Category • Check card for Hindi Care & Official Source</p></div></div>
            <div className="flex items-center gap-2">
              {!camOn ? <button onClick={startCam} style={{ backgroundColor: 'var(--accent-primary)' }} className="px-4 py-2 rounded-xl text-white font-bold text-sm">Start Camera</button>
                : <button onClick={stopCam} className="px-4 py-2 rounded-xl bg-amber-600 text-white font-bold text-sm">Stop Camera</button>}
              <button onClick={() => setScannedIds(products.map((p) => p.id))} className="px-4 py-2 rounded-xl bg-slate-800 text-white font-bold text-sm">Load All ({products.length})</button>
              <button onClick={onClose} className="p-2.5 rounded-xl border"><Icon name="close" className="w-5 h-5" /></button>
            </div>
          </div>
          <div className="flex-1 overflow-y-auto p-6 space-y-6">
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="rounded-2xl bg-white dark:bg-slate-900 border p-4 flex flex-col items-center justify-center min-h-[190px]">
                <div id="qr-reader-region" className="w-full max-w-[260px] rounded-xl overflow-hidden" />
                {!camOn && <div className="text-center space-y-2 py-4"><Icon name="qr" className="w-10 h-10 mx-auto opacity-70" /><p className="text-xs text-slate-500">Start camera or select items</p>{camErr && <p className="text-xs text-amber-600">{camErr}</p>}</div>}
              </div>
              <div className="lg:col-span-2 rounded-2xl bg-white dark:bg-slate-900 border p-5 space-y-3">
                <div className="relative"><Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" /><input type="text" value={filter} onChange={(e) => setFilter(e.target.value)} placeholder="Search English / Hindi / Hinglish..." className="w-full pl-10 pr-4 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
                <div className="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto">{quick.map((p) => <button key={p.id} onClick={() => handlePayload(p.id)} className={`px-2.5 py-1 rounded-lg text-[11px] font-semibold border ${scannedIds.includes(p.id) ? 'bg-emerald-600 text-white' : 'bg-slate-50 dark:bg-slate-800'}`}>{p.nameHi} • {p.nameEn}</button>)}</div>
              </div>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
              {scanned.map((item) => {
                const checked = !!checkedMap[item.id], care = getHindiCare(item);
                return (
                  <div key={item.id} className="rounded-xl bg-white dark:bg-slate-900 border shadow-sm overflow-hidden flex flex-col">
                    {item.image && <div className="h-32 bg-slate-100 dark:bg-slate-800 overflow-hidden"><img src={item.image} alt={item.nameEn} className="w-full h-full object-cover" /></div>}
                    <div className="p-3 flex-1 flex flex-col justify-between space-y-2.5">
                      <div><span className="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 mb-1">{item.category}</span><h4 className="text-sm font-extrabold">{item.nameHi || item.nameEn}</h4><p className="text-[11px] text-slate-500">{item.nameEn}</p></div>
                      <label className="flex items-center gap-2 pt-2 border-t cursor-pointer"><input type="checkbox" checked={checked} onChange={() => setCheckedMap((prev) => ({ ...prev, [item.id]: !prev[item.id] }))} className="w-3.5 h-3.5 accent-emerald-600" /><span className="text-[11px] font-bold text-emerald-700 dark:text-emerald-400">पौधे की देखभाल देखें</span></label>
                      {checked && (
                        <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/40 text-[10px] space-y-1">
                          <p><strong>मौसम:</strong> {care.season}</p><p><strong>मिट्टी:</strong> {care.soil}</p><p><strong>पानी:</strong> {care.water}</p><p><strong>धूप:</strong> {care.sunlight}</p><p><strong>खाद:</strong> {care.fertilizer}</p><p><strong>देखभाल:</strong> {care.care}</p>
                          <p className="text-[9px] text-slate-500 pt-1 border-t">Source: {care.source}</p>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function CentralCheckoutModal({ isOpen, cart, setCart, products, onClose, onConfirmSale }) {
      const [customer, setCustomer] = useState('');
      const [customerMobile, setCustomerMobile] = useState('');
      const [discountType, setDiscountType] = useState('flat');
      const [discountValue, setDiscountValue] = useState(0);
      const [payMode, setPayMode] = useState('split');
      const [cashAmount, setCashAmount] = useState(0);
      const [upiAmount, setUpiAmount] = useState(0);
      const [openForm, setOpenForm] = useState({ nameEn: '', price: '', qty: 1, unit: 'kg' });

      const cartDetailed = useMemo(() => cart.map((c) => {
        if (c.isNonInventory) return { ...c, id: c.cartKey };
        const p = products.find((x) => x.id === c.productId);
        return p ? { ...p, cartKey: c.cartKey || p.id, isNonInventory: false, qty: c.qty, unit: 'pcs' } : null;
      }).filter(Boolean), [cart, products]);

      const subtotal = useMemo(() => cartDetailed.reduce((s, i) => s + i.price * i.qty, 0), [cartDetailed]);
      const discountAmount = useMemo(() => {
        const v = Math.max(0, Number(discountValue) || 0);
        return discountType === 'percent' ? Math.min(subtotal, Math.round((subtotal * Math.min(100, v)) / 100)) : Math.min(subtotal, v);
      }, [subtotal, discountType, discountValue]);
      const netTotal = Math.max(0, subtotal - discountAmount);

      useEffect(() => {
        if (!isOpen) return;
        if (payMode === 'cash') { setCashAmount(netTotal); setUpiAmount(0); }
        else if (payMode === 'upi') { setCashAmount(0); setUpiAmount(netTotal); }
        else { setCashAmount((prev) => { const c = Math.min(netTotal, Math.max(0, Number(prev) || 0)); setUpiAmount(netTotal - c); return c; }); }
      }, [netTotal, payMode, isOpen]);

      if (!isOpen) return null;

      const updateQty = (key, q) => {
        const n = parseFloat(q);
        if (isNaN(n) || n <= 0) { setCart((prev) => prev.filter((c) => (c.cartKey || c.productId) !== key)); return; }
        const entry = cartDetailed.find((x) => x.cartKey === key);
        if (entry && !entry.isNonInventory && n > entry.stock) {
          alert(`Out of stock limit! Only ${entry.stock} units of "${entry.nameHi || entry.nameEn}" available.`);
          return;
        }
        setCart((prev) => prev.map((c) => ((c.cartKey || c.productId) === key ? { ...c, qty: n } : c)));
      };

      const addOpenInside = () => {
        if (!openForm.nameEn.trim() || Number(openForm.price) <= 0) return;
        setCart((prev) => [...prev, { cartKey: 'open-' + Date.now() + '-' + Math.random().toString(36).slice(2,5), isNonInventory: true, nameEn: openForm.nameEn.trim(), nameHi: 'गैर-स्टॉक खुला आइटम', category: 'Open Item (Non-Inventory)', price: Math.max(0, Number(openForm.price)||0), qty: Math.max(0.1, parseFloat(openForm.qty)||1), unit: openForm.unit }]);
        setOpenForm({ nameEn: '', price: '', qty: 1, unit: 'kg' });
      };

      const submitSale = () => {
        if (!cartDetailed.length) return;
        const d = customerMobile.replace(/\D/g, '');
        onConfirmSale({
          customer: customer.trim() || 'Walk-in Customer', customerMobile: d,
          items: cartDetailed.map((i) => ({ productId: i.isNonInventory ? i.cartKey : i.id, isNonInventory: !!i.isNonInventory, nameEn: i.nameEn, nameHi: i.nameHi, category: i.category, qty: i.qty, unit: i.unit || 'pcs', price: i.price })),
          subtotal, discountType, discountValue: Number(discountValue)||0, discountAmount, total: netTotal, cashAmount, upiAmount
        });
        setCustomer(''); setCustomerMobile('');
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 backdrop-blur-sm p-4">
          <div className="w-full max-w-2xl rounded-3xl bg-white dark:bg-slate-900 border shadow-2xl overflow-hidden flex flex-col max-h-[92vh]">
            <div style={{ backgroundColor: 'var(--accent-primary)' }} className="flex items-center justify-between px-6 py-4 text-white">
              <div><h3 className="text-lg font-extrabold">POS Checkout & WhatsApp Dispatch</h3><p className="text-xs opacity-90">Optional Customer Info • Open Item Units (kg/pcs/L) • Cash & UPI Split</p></div>
              <button onClick={onClose} className="p-2 rounded-xl hover:bg-black/15"><Icon name="close" className="w-5 h-5" /></button>
            </div>
            <div className="p-6 overflow-y-auto space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label className="block text-xs font-bold uppercase text-slate-500 mb-1">Customer Name (Optional)</label><input type="text" value={customer} onChange={(e) => setCustomer(e.target.value)} placeholder="Walk-in Customer" className="w-full px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold" /></div>
                <div><label className="block text-xs font-bold uppercase text-slate-500 mb-1">WhatsApp Mobile (Optional)</label><input type="tel" value={customerMobile} onChange={(e) => setCustomerMobile(e.target.value)} placeholder="10-digit mobile" className="w-full px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" /></div>
              </div>

              <div className="p-3 rounded-2xl bg-sky-50 dark:bg-sky-950/30 border border-sky-200 dark:border-sky-900 flex flex-wrap items-center gap-2">
                <span className="text-[11px] font-extrabold text-sky-800 dark:text-sky-300 w-full">Open Item (Soil / Loose Materials — Mandatory Unit Selection):</span>
                <input type="text" placeholder="Item (e.g. Garden Soil)" value={openForm.nameEn} onChange={(e) => setOpenForm({ ...openForm, nameEn: e.target.value })} className="flex-1 min-w-[130px] px-3 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs" />
                <input type="number" min="1" placeholder="Rate ₹" value={openForm.price} onChange={(e) => setOpenForm({ ...openForm, price: e.target.value })} className="w-20 px-2 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs font-bold" />
                <input type="number" min="0.1" step="0.1" placeholder="Qty" value={openForm.qty} onChange={(e) => setOpenForm({ ...openForm, qty: e.target.value })} className="w-16 px-2 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs font-bold text-center" />
                <select value={openForm.unit} onChange={(e) => setOpenForm({ ...openForm, unit: e.target.value })} className="px-2 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs font-bold">
                  <option value="kg">kilograms (kg)</option>
                  <option value="pcs">pieces (pcs)</option>
                  <option value="L">liters (L)</option>
                </select>
                <button type="button" onClick={addOpenInside} className="px-3 py-1.5 rounded-lg bg-sky-600 text-white text-xs font-extrabold">+ Add Open</button>
              </div>

              <div className="rounded-2xl border overflow-hidden max-h-48 overflow-y-auto">
                <table className="w-full text-sm">
                  <thead className="bg-slate-100 dark:bg-slate-800 text-xs uppercase text-slate-500"><tr><th className="text-left px-4 py-2">Item</th><th className="text-center px-2 py-2">Qty / Unit</th><th className="text-right px-3 py-2">Rate</th><th className="text-right px-4 py-2">Amount</th></tr></thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {cartDetailed.length === 0 ? <tr><td colSpan="4" className="p-6 text-center text-xs text-slate-400">Cart is empty.</td></tr> : cartDetailed.map((i) => (
                      <tr key={i.cartKey}>
                        <td className="px-4 py-2"><div className="font-extrabold text-sm">{i.nameHi || i.nameEn} {i.isNonInventory && <span className="px-1.5 py-0.5 rounded bg-sky-100 text-sky-700 text-[9px] font-extrabold">Open</span>}</div><div className="text-[11px] text-slate-500">{i.nameEn}</div></td>
                        <td className="px-2 py-2"><div className="flex items-center justify-center gap-1"><button type="button" onClick={() => updateQty(i.cartKey, i.qty - 1)} className="w-6 h-6 rounded bg-slate-100 dark:bg-slate-800 font-bold">-</button><input type="number" min="0.1" step="0.1" value={i.qty} onChange={(e) => updateQty(i.cartKey, e.target.value)} className="w-12 py-1 text-center rounded border bg-white dark:bg-slate-900 font-bold text-xs" /><span className="text-[10px] font-bold text-slate-500">{i.unit || 'pcs'}</span><button type="button" onClick={() => updateQty(i.cartKey, i.qty + 1)} className="w-6 h-6 rounded bg-slate-100 dark:bg-slate-800 font-bold">+</button></div></td>
                        <td className="text-right px-3 py-2">₹{i.price}</td>
                        <td className="text-right px-4 py-2 font-bold">₹{Math.round(i.price * i.qty)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div className="rounded-2xl bg-slate-50 dark:bg-slate-800/60 p-4 border space-y-2">
                <div className="flex flex-wrap items-center justify-between gap-3"><span className="text-sm font-bold">Total Bill Discount</span><div className="flex gap-2"><select value={discountType} onChange={(e) => setDiscountType(e.target.value)} className="px-3 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-sm font-semibold"><option value="flat">Flat ₹</option><option value="percent">Percent %</option></select><input type="number" min="0" value={discountValue} onChange={(e) => setDiscountValue(e.target.value)} className="w-24 px-3 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-sm font-bold text-right" /></div></div>
                <div className="flex justify-between text-sm"><span>Subtotal</span><span className="font-semibold">₹{Math.round(subtotal).toLocaleString()}</span></div>
                <div className="flex justify-between text-sm text-rose-600"><span>Bill Discount</span><span className="font-semibold">- ₹{Math.round(discountAmount).toLocaleString()}</span></div>
                <div className="flex justify-between text-lg font-extrabold pt-2 border-t"><span>Net Payable</span><span className="text-emerald-600">₹{Math.round(netTotal).toLocaleString()}</span></div>
              </div>

              <div className="space-y-3">
                <label className="block text-xs font-bold uppercase text-slate-500">Payment (Cash & UPI Only)</label>
                <div className="grid grid-cols-3 gap-2.5">{[{ id:'cash', label:'100% Cash' }, { id:'upi', label:'100% UPI' }, { id:'split', label:'Split (Cash + UPI)' }].map((m) => <button key={m.id} type="button" onClick={() => setPayMode(m.id)} style={payMode === m.id ? { backgroundColor: 'var(--accent-primary)' } : {}} className={`py-2.5 px-3 rounded-xl text-xs font-extrabold border ${payMode === m.id ? 'text-white border-transparent' : 'bg-slate-50 dark:bg-slate-800'}`}>{m.label}</button>)}</div>
                <div className="grid grid-cols-2 gap-4">
                  <div><label className="block text-xs font-bold mb-1">Cash (₹)</label><input type="number" min="0" max={netTotal} disabled={payMode === 'upi'} value={cashAmount} onChange={(e) => { const c = Math.min(netTotal, Math.max(0, Number(e.target.value)||0)); setCashAmount(c); setUpiAmount(netTotal - c); }} className="w-full px-4 py-2 rounded-xl border bg-white dark:bg-slate-800 font-bold disabled:opacity-50" /></div>
                  <div><label className="block text-xs font-bold mb-1">UPI (₹)</label><input type="number" min="0" max={netTotal} disabled={payMode === 'cash'} value={upiAmount} onChange={(e) => { const u = Math.min(netTotal, Math.max(0, Number(e.target.value)||0)); setUpiAmount(u); setCashAmount(netTotal - u); }} className="w-full px-4 py-2 rounded-xl border bg-white dark:bg-slate-800 font-bold disabled:opacity-50" /></div>
                </div>
              </div>
            </div>
            <div className="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t flex justify-end gap-3">
              <button onClick={onClose} className="px-5 py-2.5 rounded-xl border font-bold text-sm">Cancel</button>
              <button onClick={submitSale} disabled={!cartDetailed.length} style={{ backgroundColor: 'var(--accent-primary)' }} className="flex items-center gap-2 px-6 py-2.5 rounded-xl text-white font-extrabold text-sm shadow-lg disabled:opacity-50"><Icon name="whatsapp" className="w-4 h-4" /><span>Complete Sale (₹{Math.round(netTotal).toLocaleString()})</span></button>
            </div>
          </div>
        </div>
      );
    }

    function WhatsAppDispatchModal({ dispatchInfo, onClose }) {
      const [copied, setCopied] = useState(false);
      const [manualPhone, setManualPhone] = useState('');
      if (!dispatchInfo) return null;
      const cleanManual = manualPhone.replace(/\D/g, '');
      const targetUrl = dispatchInfo.url || (cleanManual.length >= 10 ? `https://wa.me/${cleanManual.length === 10 ? '91' + cleanManual : cleanManual}?text=${encodeURIComponent(dispatchInfo.text)}` : '');
      return (
        <div className="fixed inset-0 z-[95] flex items-center justify-center bg-slate-950/75 backdrop-blur-sm p-4">
          <div className="w-full max-w-lg rounded-3xl bg-white dark:bg-slate-900 border shadow-2xl overflow-hidden">
            <div style={{ backgroundColor: 'var(--accent-primary)' }} className="px-6 py-4 text-white flex items-center justify-between">
              <div><h3 className="text-lg font-extrabold">English Invoice + Hindi Plant Care</h3><p className="text-xs opacity-90">Ready for WhatsApp Dispatch</p></div>
              <button onClick={onClose} className="p-2 rounded-xl hover:bg-black/15"><Icon name="close" className="w-5 h-5" /></button>
            </div>
            <div className="p-6 space-y-4">
              <pre className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border text-xs whitespace-pre-wrap max-h-60 overflow-y-auto font-sans">{dispatchInfo.text}</pre>
              {!dispatchInfo.url && <input type="tel" value={manualPhone} onChange={(e) => setManualPhone(e.target.value)} placeholder="Optional: Enter customer WhatsApp number" className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />}
              <div className="flex flex-wrap gap-2.5 justify-end">
                <button onClick={() => { navigator.clipboard?.writeText(dispatchInfo.text); setCopied(true); setTimeout(() => setCopied(false), 2000); }} className="px-4 py-2.5 rounded-xl border text-xs font-extrabold">{copied ? '✓ Copied' : 'Copy'}</button>
                {targetUrl && <a href={targetUrl} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold shadow"><Icon name="whatsapp" className="w-4 h-4" /> Send on WhatsApp</a>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 9. UNIFIED INVENTORY & SALES (NO PAGINATION, VOICE BILLING, STOCK CHECK, OPEN ITEM UNITS)
    // =========================================================================
    const ProductGridCard = memo(({ item, qtyValue, onQtyChange, onAdd, onInfo }) => {
      const isLow = Number(item.stock) < Number(item.threshold);
      const isZero = Number(item.stock) <= 0;
      return (
        <div className={`rounded-xl border shadow-sm hover:shadow-md transition overflow-hidden flex flex-col ${isLow ? 'bg-rose-50/90 dark:bg-rose-950/40 border-rose-500 ring-2 ring-rose-500/35' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800'}`}>
          <div className="h-24 bg-slate-100 dark:bg-slate-800 overflow-hidden relative">
            {item.image ? <img src={item.image} alt={item.nameEn} className="w-full h-full object-cover" loading="lazy" /> : <div className="w-full h-full flex items-center justify-center text-slate-400"><Icon name="leaf" className="w-7 h-7" /></div>}
            {isZero ? (
              <span className="absolute top-1.5 left-1.5 px-2 py-0.5 rounded-md bg-rose-700 text-white text-[9px] font-extrabold shadow">Out of Stock</span>
            ) : isLow ? (
              <span className="absolute top-1.5 left-1.5 px-2 py-0.5 rounded-md bg-rose-600 text-white text-[9px] font-extrabold shadow">Low ({item.stock}/{item.threshold})</span>
            ) : null}
          </div>
          <div className="p-2.5 flex-1 flex flex-col justify-between space-y-2">
            <div>
              <h4 className="text-sm font-extrabold leading-tight line-clamp-2 text-slate-900 dark:text-white">{item.nameHi || item.nameEn}</h4>
              <p className="text-[11px] font-medium text-slate-500 truncate mt-0.5">{item.nameEn}</p>
              <div className="mt-1 flex items-center justify-between">
                <span style={{ color: 'var(--accent-primary)' }} className="text-sm font-extrabold">₹{item.price}</span>
                <span className={`text-[10px] font-bold ${isLow ? 'text-rose-600 dark:text-rose-400' : 'text-slate-400'}`}>Stock: {item.stock}</span>
              </div>
            </div>
            <div className="flex items-center gap-1 pt-1.5 border-t border-slate-200/70 dark:border-slate-800">
              <input type="number" min="1" placeholder="1" value={qtyValue} onChange={(e) => onQtyChange(item.id, e.target.value)} className="w-11 px-1 py-1.5 rounded-lg border bg-white dark:bg-slate-800 text-xs font-bold text-center outline-none" />
              <button onClick={() => onAdd(item)} style={{ backgroundColor: 'var(--accent-primary)' }} className="flex-1 py-1.5 px-1.5 rounded-lg text-white font-bold text-[11px] truncate hover:opacity-90">Add to Cart</button>
              <button type="button" onClick={() => onInfo(item)} title="देखभाल निर्देश (Hindi)" className="w-7 h-7 rounded-lg bg-sky-100 dark:bg-sky-900/50 text-sky-700 dark:text-sky-300 hover:bg-sky-600 hover:text-white flex items-center justify-center shrink-0">
                <Icon name="info" className="w-4 h-4" />
              </button>
            </div>
          </div>
        </div>
      );
    });

    function UnifiedInventoryAndSalesPage({ label, products, cart, setCart, nurseryProfile, onOpenCheckout, onOpenSaleSummary, onOpenCustomerPreview, onShowToast }) {
      const [search, setSearch] = useState('');
      const [cat, setCat] = useState('ALL');
      const [qtyMap, setQtyMap] = useState({});
      const [showOpen, setShowOpen] = useState(false);
      const [openItem, setOpenItem] = useState({ nameEn: '', price: '', qty: 1, unit: 'kg' });
      const [infoProduct, setInfoProduct] = useState(null);
      const [stockAlert, setStockAlert] = useState('');

      // Multilingual Free Voice Billing States
      const [listening, setListening] = useState(false);
      const [voiceText, setVoiceText] = useState('');
      const [voiceLog, setVoiceLog] = useState('');
      const recogRef = useRef(null);

      // Zero pagination: renders full unrestricted list across all categories!
      const filtered = useMemo(() => products.filter((p) => (cat === 'ALL' || p.category === cat) && smartMatch(p, search)), [products, search, cat]);
      const grouped = useMemo(() => {
        const m = {};
        filtered.forEach((p) => { if (!m[p.category]) m[p.category] = { category: p.category, categoryHi: p.categoryHi, items: [] }; m[p.category].items.push(p); });
        return Object.values(m);
      }, [filtered]);

      const handleQtyChange = useCallback((id, val) => setQtyMap((p) => ({ ...p, [id]: val })), []);

      // Real-time Add-to-Cart Inventory Validation
      const tryAddProductToCart = useCallback((p, requestedQtyOverride = null) => {
        const reqQty = requestedQtyOverride ?? Math.max(1, parseInt(qtyMap[p.id] || '1', 10) || 1);
        const alreadyInCart = cart.find((c) => !c.isNonInventory && c.productId === p.id)?.qty || 0;
        const available = Number(p.stock) || 0;

        if (available <= 0) {
          setStockAlert(`Out of Stock: "${p.nameHi || p.nameEn} (${p.nameEn})" has 0 units available. Cannot add to cart.`);
          return false;
        }
        if (alreadyInCart + reqQty > available) {
          setStockAlert(`Insufficient Stock: Only ${available} units of "${p.nameHi || p.nameEn}" available (${alreadyInCart} already in cart).`);
          return false;
        }

        setCart((prev) => {
          const ex = prev.find((c) => !c.isNonInventory && c.productId === p.id);
          return ex ? prev.map((c) => !c.isNonInventory && c.productId === p.id ? { ...c, qty: c.qty + reqQty } : c) : [...prev, { cartKey: p.id, productId: p.id, isNonInventory: false, qty: reqQty, unit: 'pcs' }];
        });
        setQtyMap((prev) => ({ ...prev, [p.id]: '' }));
        return true;
      }, [cart, qtyMap, setCart]);

      const executeVoiceCommand = (transcript) => {
        const parsed = parseVoiceBillingCommand(transcript, products);
        let addedSummary = [];
        parsed.matchedItems.forEach(({ product, qty }) => {
          const ok = tryAddProductToCart(product, qty);
          if (ok) addedSummary.push(`${qty} × ${product.nameHi || product.nameEn}`);
        });
        if (addedSummary.length > 0) {
          setVoiceLog(`✓ Added via voice: ${addedSummary.join(', ')}`);
          onShowToast(`Voice added: ${addedSummary.join(', ')}`);
        } else if (parsed.unmatchedClauses.length > 0) {
          setVoiceLog(`⚠ No verified inventory match for: "${parsed.unmatchedClauses.join(', ')}"`);
        }
        if (parsed.triggerCheckout && (cart.length > 0 || addedSummary.length > 0)) {
          onOpenCheckout();
        }
      };

      const toggleVoiceMic = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          setVoiceLog('Browser SpeechRecognition unavailable. Type voice command in the box and click Parse.');
          return;
        }
        if (listening && recogRef.current) {
          recogRef.current.stop();
          setListening(false);
          return;
        }
        const recog = new SR();
        recog.lang = 'hi-IN'; // Recognizes Hindi, English & Hinglish seamlessly
        recog.interimResults = false;
        recog.maxAlternatives = 1;
        recog.onresult = (ev) => {
          const txt = ev.results[0][0].transcript;
          setVoiceText(txt);
          executeVoiceCommand(txt);
        };
        recog.onerror = () => { setListening(false); setVoiceLog('Microphone error or permission denied.'); };
        recog.onend = () => setListening(false);
        recogRef.current = recog;
        setListening(true);
        recog.start();
      };

      const addOpen = (e) => {
        e.preventDefault();
        if (!openItem.nameEn.trim() || Number(openItem.price) <= 0) return;
        setCart((prev) => [...prev, { cartKey: 'open-' + Date.now() + '-' + Math.random().toString(36).slice(2,5), isNonInventory: true, nameEn: openItem.nameEn.trim(), nameHi: 'गैर-स्टॉक खुला आइटम', category: 'Open Item (Non-Inventory)', price: Math.max(0, Number(openItem.price)||0), qty: Math.max(0.1, parseFloat(openItem.qty)||1), unit: openItem.unit }]);
        setOpenItem({ nameEn: '', price: '', qty: 1, unit: 'kg' });
      };

      const cartCount = cart.reduce((s, c) => s + Number(c.qty), 0);
      const cartTotal = cart.reduce((s, c) => s + (c.isNonInventory ? c.price * c.qty : (products.find((x) => x.id === c.productId)?.price || 0) * c.qty), 0);

      return (
        <div className="space-y-5">
          {/* Header + Digital Price-Free QR + Sale Summary + Checkout */}
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-4">
            <div className="flex flex-col xl:flex-row xl:items-center justify-between gap-4">
              <div>
                <h2 className="text-2xl font-extrabold">{label} • बिक्री व कैटलॉग</h2>
                <p className="text-xs text-slate-500 mt-0.5">All {filtered.length} of {products.length} varieties shown (No Pagination) • Red = Below Threshold</p>
              </div>
              <div className="flex flex-wrap items-center gap-2.5">
                <DigitalCatalogQRWidget nurseryProfile={nurseryProfile} size={68} onPreview={onOpenCustomerPreview} />
                <button onClick={onOpenSaleSummary} className="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-900 dark:bg-slate-700 text-white font-extrabold text-xs shadow">
                  <Icon name="chart" className="w-4 h-4" /> Sale Summary
                </button>
                <button onClick={onOpenCheckout} style={{ backgroundColor: 'var(--accent-primary)' }} className="flex items-center gap-2 px-5 py-2.5 rounded-xl text-white font-extrabold text-sm shadow">
                  <Icon name="cart" className="w-4 h-4" /> Checkout ({Number(cartCount.toFixed(1))}) • ₹{Math.round(cartTotal).toLocaleString()}
                </button>
              </div>
            </div>

            {/* Search, Open Item Toggle & Free Voice-Enabled Billing Bar */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-2.5 pt-2 border-t">
              <div className="lg:col-span-5 relative">
                <Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" />
                <input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search Hindi, English, Hinglish (गुलाब, Gulab)..." className="w-full pl-10 pr-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm outline-none" />
              </div>

              <div className="lg:col-span-5 flex gap-1.5">
                <button type="button" onClick={toggleVoiceMic} className={`flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-extrabold border shrink-0 ${listening ? 'bg-rose-600 text-white animate-pulse border-rose-600' : 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border-emerald-300'}`}>
                  <Icon name="mic" className="w-4 h-4" />{listening ? 'Listening...' : 'Voice Bill'}
                </button>
                <input type="text" value={voiceText} onChange={(e) => setVoiceText(e.target.value)} placeholder='Say/type: "2 gulab aur 1 aam"' className="flex-1 px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-xs" />
                <button type="button" onClick={() => executeVoiceCommand(voiceText)} className="px-3 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold">Parse</button>
              </div>

              <button onClick={() => setShowOpen((v) => !v)} className="lg:col-span-2 px-3 py-2.5 rounded-xl bg-sky-50 dark:bg-sky-950/50 text-sky-700 dark:text-sky-300 border border-sky-200 font-bold text-xs">
                + Open Item
              </button>
            </div>
            {voiceLog && <p className="text-xs font-bold text-emerald-700 dark:text-emerald-400">{voiceLog}</p>}
          </div>

          {/* Real-Time Stock Validation Warning Pop-up Banner */}
          {stockAlert && (
            <div className="fixed inset-0 z-[125] flex items-center justify-center bg-slate-950/60 p-4">
              <div className="max-w-sm w-full rounded-2xl bg-white dark:bg-slate-900 border-2 border-rose-500 p-6 shadow-2xl text-center space-y-4">
                <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto font-extrabold text-xl">!</div>
                <h3 className="text-lg font-extrabold text-rose-600">Inventory Alert</h3>
                <p className="text-sm font-semibold">{stockAlert}</p>
                <button onClick={() => setStockAlert('')} className="px-6 py-2 rounded-xl bg-rose-600 text-white font-extrabold text-sm">OK</button>
              </div>
            </div>
          )}

          {/* Non-Inventory Open Item Sales with Mandatory Unit Selection (kg, pcs, L) */}
          {showOpen && (
            <form onSubmit={addOpen} className="rounded-2xl bg-sky-50/80 dark:bg-sky-950/30 border border-sky-200 p-4 space-y-3">
              <div className="flex flex-wrap justify-between gap-2">
                <div><h3 className="text-sm font-extrabold text-sky-900 dark:text-sky-200">Non-Inventory Open Item (Mandatory Unit: kg / pcs / L)</h3><p className="text-[11px] text-sky-700 dark:text-sky-400">Bill soil, loose compost, liquid tonics, or labour without affecting tracked stock.</p></div>
              </div>
              <div className="flex flex-wrap gap-2 items-center">
                <input required type="text" placeholder="Item Description (e.g. Loose Garden Soil)" value={openItem.nameEn} onChange={(e) => setOpenItem({ ...openItem, nameEn: e.target.value })} className="flex-1 min-w-[200px] px-3.5 py-2 rounded-xl border bg-white dark:bg-slate-900 text-sm" />
                <input required type="number" min="1" placeholder="Rate ₹" value={openItem.price} onChange={(e) => setOpenItem({ ...openItem, price: e.target.value })} className="w-24 px-3 py-2 rounded-xl border bg-white dark:bg-slate-900 text-sm font-bold" />
                <input required type="number" min="0.1" step="0.1" placeholder="Qty" value={openItem.qty} onChange={(e) => setOpenItem({ ...openItem, qty: e.target.value })} className="w-20 px-3 py-2 rounded-xl border bg-white dark:bg-slate-900 text-sm font-bold text-center" />
                <select required value={openItem.unit} onChange={(e) => setOpenItem({ ...openItem, unit: e.target.value })} className="px-3 py-2 rounded-xl border bg-white dark:bg-slate-900 text-sm font-bold">
                  <option value="kg">kilograms (kg)</option>
                  <option value="pcs">pieces (pcs)</option>
                  <option value="L">liters (L)</option>
                </select>
                <button type="submit" className="px-5 py-2 rounded-xl bg-sky-600 text-white font-extrabold text-sm">Add Open Item</button>
              </div>
            </form>
          )}

          {/* Category Filter */}
          <div className="flex flex-wrap gap-1.5">
            <button onClick={() => setCat('ALL')} style={cat === 'ALL' ? { backgroundColor: 'var(--accent-primary)' } : {}} className={`px-3 py-1.5 rounded-xl text-xs font-bold border ${cat === 'ALL' ? 'text-white border-transparent' : 'bg-white dark:bg-slate-900'}`}>All ({products.length})</button>
            {CATEGORIES.map((c) => <button key={c.en} onClick={() => setCat(c.en)} style={cat === c.en ? { backgroundColor: 'var(--accent-primary)' } : {}} className={`px-3 py-1.5 rounded-xl text-xs font-bold border ${cat === c.en ? 'text-white border-transparent' : 'bg-white dark:bg-slate-900'}`}>{c.hi} ({c.en})</button>)}
          </div>

          {cart.length > 0 && (
            <div className="rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 p-3.5 flex flex-wrap items-center justify-between gap-3">
              <div className="flex flex-wrap items-center gap-2">
                <span className="text-xs font-extrabold uppercase text-emerald-800 dark:text-emerald-300">Cart:</span>
                {cart.map((c) => {
                  const key = c.cartKey || c.productId;
                  const pObj = products.find((x) => x.id === c.productId);
                  const lbl = c.isNonInventory ? `${c.nameEn} [Open]` : (pObj?.nameHi || pObj?.nameEn || '');
                  return <span key={key} className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border bg-white dark:bg-slate-900 text-xs font-bold">{lbl} × {c.qty} {c.unit||'pcs'}<button onClick={() => setCart((p) => p.filter((x) => (x.cartKey || x.productId) !== key))} className="text-rose-500 ml-1">×</button></span>;
                })}
              </div>
              <div className="flex gap-2"><button onClick={() => setCart([])} className="text-xs font-bold text-rose-600">Clear</button><button onClick={onOpenCheckout} style={{ backgroundColor: 'var(--accent-primary)' }} className="px-3.5 py-1.5 rounded-lg text-white text-xs font-extrabold">Checkout →</button></div>
            </div>
          )}

          {/* Full Unrestricted Inventory Grid */}
          {grouped.map((g) => (
            <section key={g.category}>
              <h3 className="text-lg font-extrabold border-b-2 border-emerald-600/30 pb-1.5 mb-3 flex justify-between">
                <span>{g.categoryHi} <span className="text-sm font-bold text-slate-500 ml-2">({g.category})</span></span>
                <span className="text-xs text-slate-500">{g.items.length} varieties</span>
              </h3>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
                {g.items.map((it) => (
                  <ProductGridCard key={it.id} item={it} qtyValue={qtyMap[it.id] ?? ''} onQtyChange={handleQtyChange} onAdd={(p) => tryAddProductToCart(p)} onInfo={setInfoProduct} />
                ))}
              </div>
            </section>
          ))}

          <PlantCareInfoModal product={infoProduct} onClose={() => setInfoProduct(null)} />
        </div>
      );
    }

    // =========================================================================
    // 10. STOCK MANAGEMENT (PIN '1010' on Edit/Delete, 'Low Stock' View, Visible Stock Adjustment)
    // =========================================================================
    function StockAdjustmentSection({ products, adjustments, onAddAdjustment, onUpdateAdjustment, requestPin, onOpenExport, onBack }) {
      const [plantSearch, setPlantSearch] = useState('');
      const [ddOpen, setDdOpen] = useState(false);
      const [selId, setSelId] = useState(products[0]?.id || '');
      const [adjType, setAdjType] = useState('मुफ्त वितरण / Giveaway');
      const [qty, setQty] = useState(1);
      const [notes, setNotes] = useState('');
      const [date, setDate] = useState(todayDDMMYYYY());
      const [exportFilter, setExportFilter] = useState('BOTH'); // 'GIVEAWAY' | 'DAMAGE' | 'BOTH'

      const selProd = products.find((p) => p.id === selId);
      const filteredPlants = useMemo(() => products.filter((p) => smartMatch(p, plantSearch)), [products, plantSearch]);

      const submit = (e) => {
        e.preventDefault();
        if (!selProd || Number(qty) <= 0 || !notes.trim()) return;
        requestPin('Authorize Stock Adjustment', `Enter PIN 1010 to record ${adjType} (${qty} × ${selProd.nameHi}).`, () => {
          onAddAdjustment({
            id: 'ADJ-' + Date.now().toString().slice(-5),
            date: formatStrictDDMMYYYY(date),
            productId: selProd.id,
            productName: `${selProd.nameHi} / ${selProd.nameEn}`,
            type: adjType,
            qty: Number(qty),
            reason: notes.trim(),
            locked: true
          });
          setQty(1); setNotes('');
        });
      };

      const triggerFilteredExport = () => {
        const subset = adjustments.filter((a) => {
          if (exportFilter === 'GIVEAWAY') return a.type.includes('Giveaway') || a.type.includes('मुफ्त');
          if (exportFilter === 'DAMAGE') return a.type.includes('Damage') || a.type.includes('खराब');
          return true;
        });
        requestPin('Authorize Adjustment Export', 'Enter PIN 1010 to export filtered Stock Adjustments.', () => {
          onOpenExport({
            title: `Stock Adjustments (${exportFilter})`,
            subtitle: `Sach Nursery • Filter: ${exportFilter}`,
            fileBase: `Stock-Adjustments-${exportFilter}`,
            columns: [{ key:'date', label:'Date' }, { key:'type', label:'Category' }, { key:'productName', label:'Plant' }, { key:'qty', label:'Qty' }, { key:'reason', label:'Notes' }],
            rows: subset.map((a) => ({ date: formatStrictDDMMYYYY(a.date), type: a.type, productName: a.productName, qty: a.qty, reason: a.reason }))
          });
        });
      };

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div><h2 className="text-2xl font-extrabold">Stock Adjustment • स्टॉक समायोजन</h2><p className="text-xs text-slate-500">मुफ्त वितरण / Giveaway & खराब सामान / Damage Stock</p></div>
            <div className="flex flex-wrap items-center gap-2">
              <select value={exportFilter} onChange={(e) => setExportFilter(e.target.value)} className="px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-xs font-bold">
                <option value="BOTH">Both Combined</option>
                <option value="GIVEAWAY">Giveaway Only (मुफ्त वितरण)</option>
                <option value="DAMAGE">Damage Stock Only (खराब सामान)</option>
              </select>
              <button onClick={triggerFilteredExport} style={{ backgroundColor: 'var(--accent-primary)' }} className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-white text-xs font-extrabold"><Icon name="share" className="w-4 h-4" /> Export & Share</button>
              <button onClick={onBack} className="px-4 py-2 rounded-xl border text-xs font-extrabold">← Back to Stock</button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <form onSubmit={submit} className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-4 h-fit">
              <h3 className="font-extrabold text-lg">Non-Revenue Outflow Entry</h3>
              <div className="relative">
                <label className="block text-xs font-bold mb-1">Search & Select Product *</label>
                <div className="relative">
                  <Icon name="search" className="w-4 h-4 absolute left-3 top-3 text-slate-400" />
                  <input type="text" value={plantSearch} onFocus={() => setDdOpen(true)} onChange={(e) => { setPlantSearch(e.target.value); setDdOpen(true); }} placeholder={selProd ? `${selProd.nameHi} (${selProd.nameEn})` : 'Search plant...'} className="w-full pl-9 pr-3 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold" />
                </div>
                {ddOpen && (
                  <div className="absolute z-30 mt-1 w-full max-h-56 overflow-y-auto rounded-xl bg-white dark:bg-slate-900 border shadow-2xl divide-y">
                    {filteredPlants.map((p) => (
                      <button key={p.id} type="button" onClick={() => { setSelId(p.id); setPlantSearch(`${p.nameHi} (${p.nameEn})`); setDdOpen(false); }} className="w-full text-left px-3 py-2 hover:bg-emerald-50 dark:hover:bg-slate-800 text-xs flex justify-between">
                        <div><div className="font-extrabold">{p.nameHi}</div><div className="text-[10px] text-slate-500">{p.nameEn}</div></div>
                        <span className="font-bold text-emerald-600">Stock: {p.stock}</span>
                      </button>
                    ))}
                  </div>
                )}
              </div>

              <div>
                <label className="block text-xs font-bold mb-1">Category (Hindi First) *</label>
                <select value={adjType} onChange={(e) => setAdjType(e.target.value)} className="w-full px-3 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold">
                  <option value="मुफ्त वितरण / Giveaway">मुफ्त वितरण / Giveaway</option>
                  <option value="खराब सामान / Damage Stock">खराब सामान / Damage Stock</option>
                </select>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div><label className="block text-xs font-bold mb-1">Qty Removed *</label><input required type="number" min="1" value={qty} onChange={(e) => setQty(e.target.value)} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" /></div>
                <div><label className="block text-xs font-bold mb-1">Date (DD-MM-YYYY)</label><DateInputDDMMYYYY value={date} onChange={setDate} /></div>
              </div>

              <div>
                <label className="block text-xs font-bold mb-1">Mandatory Adjustment Notes *</label>
                <textarea required rows="2" value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Mandatory reason or recipient details..." className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              </div>

              <button type="submit" style={{ backgroundColor: 'var(--accent-primary)' }} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-white font-extrabold text-sm"><Icon name="lock" className="w-4 h-4" /> Authorize & Record</button>
            </form>

            <div className="lg:col-span-2 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm divide-y">
              {adjustments.map((a) => (
                <div key={a.id} className="p-4 flex flex-wrap items-center justify-between gap-4">
                  <div className="space-y-1 flex-1 min-w-[200px]">
                    <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full mr-2 ${a.type.includes('Damage') || a.type.includes('खराब') ? 'bg-rose-100 text-rose-700' : 'bg-sky-100 text-sky-700'}`}>{a.type}</span>
                    <span className="text-xs text-slate-400">{formatStrictDDMMYYYY(a.date)}</span>
                    <div className="font-extrabold text-sm">{a.productName}</div>
                    <p className="text-xs text-slate-500">Removed Qty: <strong>{a.qty}</strong> • {a.reason}</p>
                  </div>
                  <button onClick={() => requestPin('Unlock Adjustment', 'Enter PIN 1010 to toggle lock.', () => onUpdateAdjustment({ ...a, locked: !a.locked }))} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold border ${a.locked ? 'bg-amber-50 border-amber-300 text-amber-700' : 'bg-emerald-50 border-emerald-300 text-emerald-700'}`}>
                    <Icon name={a.locked ? 'lock' : 'unlock'} className="w-3.5 h-3.5" />{a.locked ? 'Locked' : 'Unlocked'}
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function StockManagementPage({ label, products, onAddProduct, onUpdateProduct, onDeleteProduct, adjustments, onAddAdjustment, onUpdateAdjustment, requestPin, onOpenExport }) {
      const [subView, setSubView] = useState('stock'); // 'stock' | 'low-stock' | 'add' | 'adjustments'
      const [search, setSearch] = useState('');
      const [editing, setEditing] = useState(null);

      if (subView === 'adjustments') {
        return <StockAdjustmentSection products={products} adjustments={adjustments} onAddAdjustment={onAddAdjustment} onUpdateAdjustment={onUpdateAdjustment} requestPin={requestPin} onOpenExport={onOpenExport} onBack={() => setSubView('stock')} />;
      }

      const empty = { nameEn:'', nameHi:'', image:'', category:CATEGORIES[0].en, price:60, stock:25, threshold:10, careId:'pc-rose', season:PLANT_CARE_HI['pc-rose'].season, care:PLANT_CARE_HI['pc-rose'].care, water:PLANT_CARE_HI['pc-rose'].water, sunlight:PLANT_CARE_HI['pc-rose'].sunlight, fertilizer:PLANT_CARE_HI['pc-rose'].fertilizer };
      const [newF, setNewF] = useState(empty);
      const handleImg = async (e, set) => { const f = e.target.files?.[0]; if (!f) return; const u = await compressImageFile(f); set((p) => ({ ...p, image: u })); };

      const lowStockList = useMemo(() => products.filter((p) => Number(p.stock) < Number(p.threshold)), [products]);
      const baseList = subView === 'low-stock' ? lowStockList : products;
      const filtered = useMemo(() => baseList.filter((p) => smartMatch(p, search)), [baseList, search]);

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div><h2 className="text-2xl font-extrabold">{label} • स्टॉक प्रबंधन</h2><p className="text-xs text-slate-500">Full CRUD (PIN 1010 Required on Edit/Delete) • Low Stock Filter • Stock Adjustment</p></div>
            <div className="flex flex-wrap gap-2">
              <button onClick={() => setSubView('stock')} style={subView === 'stock' ? { backgroundColor: 'var(--accent-primary)' } : {}} className={`px-4 py-2 rounded-xl text-xs font-extrabold ${subView === 'stock' ? 'text-white' : 'bg-slate-100 dark:bg-slate-800'}`}>All Stock ({products.length})</button>
              <button onClick={() => setSubView('low-stock')} className={`px-4 py-2 rounded-xl text-xs font-extrabold border ${subView === 'low-stock' ? 'bg-rose-600 text-white border-rose-600' : 'bg-rose-50 dark:bg-rose-950/40 text-rose-700 border-rose-300'}`}>Low Stock ({lowStockList.length})</button>
              <button onClick={() => setSubView('adjustments')} className="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-amber-50 text-amber-800 border border-amber-300 text-xs font-extrabold"><Icon name="lock" className="w-3.5 h-3.5" /> Stock Adjustment</button>
              <button onClick={() => setSubView('add')} className={`px-4 py-2 rounded-xl text-xs font-extrabold ${subView === 'add' ? 'bg-emerald-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}`}>+ Add Plant</button>
            </div>
          </div>

          {(subView === 'stock' || subView === 'low-stock') && (
            <div className="bg-white dark:bg-slate-900 rounded-2xl border shadow-sm overflow-hidden">
              <div className="p-4 border-b flex flex-wrap items-center justify-between gap-3">
                <div className="relative w-full max-w-md"><Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" /><input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Filter unrestricted list..." className="w-full pl-10 pr-4 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
                <span className="text-xs font-bold text-slate-500">{filtered.length} items</span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead className="bg-slate-50 dark:bg-slate-800/70 text-xs uppercase text-slate-500"><tr><th className="text-left px-4 py-3">Photo & Name</th><th className="text-left px-3 py-3">Category</th><th className="text-center px-3 py-3">Stock</th><th className="text-center px-3 py-3">Threshold</th><th className="text-right px-3 py-3">Price</th><th className="text-right px-4 py-3">PIN-Protected CRUD</th></tr></thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {filtered.map((p) => (
                      <tr key={p.id} className="hover:bg-slate-50/70 dark:hover:bg-slate-800/40">
                        <td className="px-4 py-2.5"><div className="flex items-center gap-3">{p.image ? <img src={p.image} alt={p.nameEn} className="w-11 h-11 rounded-lg object-cover border shrink-0" loading="lazy" /> : <div className="w-11 h-11 rounded-lg bg-slate-100 flex items-center justify-center"><Icon name="leaf" className="w-5 h-5 text-slate-400" /></div>}<div><div className="font-extrabold">{p.nameHi || p.nameEn}</div><div className="text-xs text-slate-500">{p.nameEn}</div></div></div></td>
                        <td className="px-3 py-2.5 text-xs font-semibold">{p.category}</td>
                        <td className="px-3 py-2.5 text-center"><span className={`px-2.5 py-0.5 rounded-full font-extrabold text-xs ${p.stock < p.threshold ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>{p.stock}</span></td>
                        <td className="px-3 py-2.5 text-center font-bold text-xs text-slate-500">{p.threshold}</td>
                        <td className="px-3 py-2.5 text-right font-extrabold">₹{p.price}</td>
                        <td className="px-4 py-2.5 text-right whitespace-nowrap space-x-1.5">
                          <button onClick={() => requestPin('PIN Required to Edit', `Enter PIN 1010 to edit "${p.nameHi || p.nameEn}".`, () => { const c = getHindiCare(p); setEditing({ ...p, season: c.season, care: c.care, water: c.water, sunlight: c.sunlight, fertilizer: c.fertilizer }); })} className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold"><Icon name="lock" className="w-3 h-3" /> Edit</button>
                          <button onClick={() => requestPin('PIN Required to Delete', `Enter PIN 1010 to delete "${p.nameHi || p.nameEn}".`, () => onDeleteProduct(p.id))} className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold"><Icon name="trash" className="w-3 h-3" /> Delete</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {subView === 'add' && (
            <form onSubmit={(e) => { e.preventDefault(); if (!newF.nameEn.trim()) return; const co = CATEGORIES.find((c) => c.en === newF.category); onAddProduct({ id:'p-'+Date.now(), nameEn:newF.nameEn.trim(), nameHi:newF.nameHi.trim(), botanicalName:'Cultivar', image:newF.image.trim(), category:newF.category, categoryHi:co?co.hi:'', price:Math.max(0,Number(newF.price)||0), stock:Math.max(0,Number(newF.stock)||0), threshold:Math.max(0,Number(newF.threshold)||0), careId:newF.careId, customCare:{ season:newF.season.trim(), care:newF.care.trim(), water:newF.water.trim(), sunlight:newF.sunlight.trim(), fertilizer:newF.fertilizer.trim() } }); setNewF(empty); setSubView('stock'); }} className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm max-w-3xl space-y-4">
              <h3 className="text-xl font-extrabold">Add New Plant Variety</h3>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <input required type="text" value={newF.nameEn} onChange={(e) => setNewF({ ...newF, nameEn: e.target.value })} placeholder="Name (English) *" className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
                <input type="text" value={newF.nameHi} onChange={(e) => setNewF({ ...newF, nameHi: e.target.value })} placeholder="Name (Hindi / हिंदी नाम)" className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
                <select value={newF.category} onChange={(e) => setNewF({ ...newF, category: e.target.value })} className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold">{CATEGORIES.map((c) => <option key={c.en} value={c.en}>{c.en}</option>)}</select>
                <input required type="number" min="0" value={newF.price} onChange={(e) => setNewF({ ...newF, price: e.target.value })} placeholder="Price ₹" className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
                <input required type="number" min="0" value={newF.stock} onChange={(e) => setNewF({ ...newF, stock: e.target.value })} placeholder="Stock" className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
                <input required type="number" min="0" value={newF.threshold} onChange={(e) => setNewF({ ...newF, threshold: e.target.value })} placeholder="Threshold" className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
              </div>
              <div className="flex flex-wrap gap-3 items-center"><input type="text" value={newF.image} onChange={(e) => setNewF({ ...newF, image: e.target.value })} placeholder="Image URL" className="flex-1 min-w-[220px] px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-xs font-mono" /><label className="cursor-pointer px-4 py-2.5 rounded-xl bg-slate-800 text-white text-xs font-bold">Upload<input type="file" accept="image/*" onChange={(e) => handleImg(e, setNewF)} className="hidden" /></label></div>
              <div className="p-4 rounded-2xl bg-emerald-50/70 dark:bg-emerald-950/30 border space-y-2.5">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5"><input type="text" value={newF.season} onChange={(e) => setNewF({ ...newF, season: e.target.value })} placeholder="मौसम" className="px-3 py-1.5 rounded-xl border bg-white dark:bg-slate-900 text-xs" /><input type="text" value={newF.water} onChange={(e) => setNewF({ ...newF, water: e.target.value })} placeholder="पानी" className="px-3 py-1.5 rounded-xl border bg-white dark:bg-slate-900 text-xs" /><input type="text" value={newF.sunlight} onChange={(e) => setNewF({ ...newF, sunlight: e.target.value })} placeholder="धूप" className="px-3 py-1.5 rounded-xl border bg-white dark:bg-slate-900 text-xs" /><input type="text" value={newF.fertilizer} onChange={(e) => setNewF({ ...newF, fertilizer: e.target.value })} placeholder="खाद" className="px-3 py-1.5 rounded-xl border bg-white dark:bg-slate-900 text-xs" /></div>
                <textarea rows="2" value={newF.care} onChange={(e) => setNewF({ ...newF, care: e.target.value })} placeholder="देखभाल निर्देश" className="w-full px-3 py-1.5 rounded-xl border bg-white dark:bg-slate-900 text-xs" />
              </div>
              <button type="submit" style={{ backgroundColor: 'var(--accent-primary)' }} className="px-6 py-3 rounded-xl text-white font-extrabold text-sm">Save Plant</button>
            </form>
          )}

          {editing && (
            <div className="fixed inset-0 z-[90] flex items-center justify-center bg-slate-950/75 backdrop-blur-sm p-4">
              <form onSubmit={(e) => { e.preventDefault(); const co = CATEGORIES.find((c) => c.en === editing.category); onUpdateProduct({ id:editing.id, nameEn:editing.nameEn.trim(), nameHi:editing.nameHi.trim(), botanicalName:editing.botanicalName, image:editing.image.trim(), category:editing.category, categoryHi:co?co.hi:'', price:Math.max(0,Number(editing.price)||0), stock:Math.max(0,Number(editing.stock)||0), threshold:Math.max(0,Number(editing.threshold)||0), careId:editing.careId, customCare:{ season:editing.season.trim(), care:editing.care.trim(), water:editing.water.trim(), sunlight:editing.sunlight.trim(), fertilizer:editing.fertilizer.trim() } }); setEditing(null); }} className="w-full max-w-2xl rounded-3xl bg-white dark:bg-slate-900 border shadow-2xl overflow-hidden flex flex-col max-h-[92vh]">
                <div style={{ backgroundColor: 'var(--accent-primary)' }} className="px-6 py-4 text-white flex items-center justify-between"><div><h3 className="text-lg font-extrabold">Edit Plant (Full CRUD)</h3></div><button type="button" onClick={() => setEditing(null)} className="p-2 rounded-xl hover:bg-black/15"><Icon name="close" className="w-5 h-5" /></button></div>
                <div className="p-6 overflow-y-auto space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                    <div><label className="block text-xs font-bold mb-1">Name (EN) *</label><input required type="text" value={editing.nameEn} onChange={(e) => setEditing({ ...editing, nameEn: e.target.value })} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold" /></div>
                    <div><label className="block text-xs font-bold mb-1">Name (HI)</label><input type="text" value={editing.nameHi} onChange={(e) => setEditing({ ...editing, nameHi: e.target.value })} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
                    <div><label className="block text-xs font-bold mb-1">Category *</label><select value={editing.category} onChange={(e) => setEditing({ ...editing, category: e.target.value })} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold">{CATEGORIES.map((c) => <option key={c.en} value={c.en}>{c.en}</option>)}</select></div>
