            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [loadingDb, setLoadingDb] = useState(true);
      const [sidebarExpanded, setSidebarExpanded] = useState(false);
      const [activePage, setActivePage] = useState('dashboard');
      const [theme, setTheme] = useState('light');
      const [customerMode, setCustomerMode] = useState(window.location.hash === '#customer-catalog');

      const [nurseryProfile, setNurseryProfile] = useState(DEFAULT_PROFILE);
      const [users, setUsers] = useState(DEFAULT_USERS);
      const [products, setProducts] = useState([]);
      const [sales, setSales] = useState([]);
      const [purchases, setPurchases] = useState([]);
      const [adjustments, setAdjustments] = useState([]);
      const [plantCareDb, setPlantCareDb] = useState([]);
      const [workers, setWorkers] = useState([]);
      const [attendance, setAttendance] = useState({});
      const [bills, setBills] = useState([]);
      const [cart, setCart] = useState([]);

      const [qrOpen, setQrOpen] = useState(false);
      const [customerQrOpen, setCustomerQrOpen] = useState(false);
      const [checkoutOpen, setCheckoutOpen] = useState(false);
      const [waDispatch, setWaDispatch] = useState(null);
      const [toast, setToast] = useState('');
      const [authModal, setAuthModal] = useState({ open: false, title: '', subtitle: '', onOk: null });

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3200); };
      const requestAuth = useCallback((title, subtitle, onOk) => setAuthModal({ open: true, title, subtitle, onOk }), []);

      useEffect(() => {
        const onHash = () => setCustomerMode(window.location.hash === '#customer-catalog');
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      useEffect(() => {
        (async () => {
          const init = await idb.get('init_prod_v1');
          if (!init) {
            await idb.set('nurseryProfile', DEFAULT_PROFILE);
            await idb.set('users', DEFAULT_USERS);
            await idb.set('products', SEED_PRODUCTS);
            await idb.set('sales', SEED_SALES);
            await idb.set('purchases', SEED_PURCHASES);
            await idb.set('adjustments', SEED_ADJUSTMENTS);
            await idb.set('plantCareDb', PREDEFINED_PLANT_CARE.slice(0, 12));
            await idb.set('workers', SEED_WORKERS);
            await idb.set('attendance', {});
            await idb.set('bills', []);
            await idb.set('theme', 'light');
            await idb.set('init_prod_v1', true);
          }
          setNurseryProfile((await idb.get('nurseryProfile')) || DEFAULT_PROFILE);
          setUsers((await idb.get('users')) || DEFAULT_USERS);
          setProducts((await idb.get('products')) || SEED_PRODUCTS);
          setSales((await idb.get('sales')) || SEED_SALES);
          setPurchases((await idb.get('purchases')) || SEED_PURCHASES);
          setAdjustments((await idb.get('adjustments')) || SEED_ADJUSTMENTS);
          setPlantCareDb((await idb.get('plantCareDb')) || PREDEFINED_PLANT_CARE.slice(0, 12));
          setWorkers((await idb.get('workers')) || SEED_WORKERS);
          setAttendance((await idb.get('attendance')) || {});
          setBills((await idb.get('bills')) || []);
          setTheme((await idb.get('theme')) || 'light');
          setLoadingDb(false);
        })();
      }, []);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', theme === 'dark');
        if (!loadingDb) idb.set('theme', theme);
      }, [theme, loadingDb]);

      const saveProfile = (n) => { setNurseryProfile(n); idb.set('nurseryProfile', n); showToast('Nursery profile saved.'); };
      const saveUsers = (n) => { setUsers(n); idb.set('users', n); showToast('Users updated.'); };
      const saveProducts = (n) => { setProducts(n); idb.set('products', n); };
      const saveSales = (n) => { setSales(n); idb.set('sales', n); };
      const savePurchases = (n) => { setPurchases(n); idb.set('purchases', n); };
      const saveAdjustments = (n) => { setAdjustments(n); idb.set('adjustments', n); };
      const savePlantCare = (n) => { setPlantCareDb(n); idb.set('plantCareDb', n); };
      const saveWorkers = (n) => { setWorkers(n); idb.set('workers', n); };
      const saveAttendance = (n) => { setAttendance(n); idb.set('attendance', n); };
      const saveBills = (n) => { setBills(n); idb.set('bills', n); };

      const handleConfirmSale = (salePayload) => {
        const newSale = { id: 'INV-' + (1000 + sales.length + 1), date: todayStr(), time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), ...salePayload };
        saveSales([newSale, ...sales]);
        saveProducts(products.map((p) => {
          const sold = salePayload.items.find((i) => !i.isNonInventory && i.productId === p.id);
          return sold ? { ...p, stock: Math.max(0, p.stock - sold.qty) } : p;
        }));
        setCart([]);
        setCheckoutOpen(false);
        const wa = buildWhatsAppBillPayload(newSale, nurseryProfile, products, plantCareDb);
        setWaDispatch(wa);
        try { window.open(wa.url, '_blank', 'noopener,noreferrer'); } catch {}
        showToast(`Sale ${newSale.id} saved & WhatsApp bill ready.`);
      };

      const handleRecordPurchase = (purPayload) => {
        const newPur = { id: 'PUR-' + (500 + purchases.length + 1), time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), ...purPayload };
        savePurchases([newPur, ...purchases]);
        saveProducts(products.map((p) => {
          const bought = purPayload.items.find((i) => i.productId === p.id);
          return bought ? { ...p, stock: p.stock + bought.qty } : p;
        }));
        showToast(`Purchase ${newPur.id} saved & stock increased.`);
      };

      const handleAddAdjustment = (adj) => {
        saveAdjustments([adj, ...adjustments]);
        saveProducts(products.map((p) => (p.id === adj.productId ? { ...p, stock: Math.max(0, p.stock - adj.qty) } : p)));
        showToast('Adjustment authorized, saved & locked.');
      };

      const handleImportProducts = (rows) => {
        let updated = 0, added = 0;
        const map = new Map(products.map((p) => [p.id, p]));
        rows.forEach((r) => {
          const nameEn = String(r.nameEn || r.Name || '').trim();
          if (!nameEn) return;
          const t = (r.id && map.get(String(r.id))) || [...map.values()].find((p) => p.nameEn.toLowerCase() === nameEn.toLowerCase());
          const catEn = String(r.category || t?.category || CATEGORIES[0].en);
          const co = CATEGORIES.find((c) => c.en === catEn);
          const obj = {
            id: t ? t.id : (r.id ? String(r.id) : 'p-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5)),
            nameEn, nameHi: String(r.nameHi ?? t?.nameHi ?? ''), category: catEn, categoryHi: String(r.categoryHi || co?.hi || t?.categoryHi || ''),
            price: Number(r.price ?? t?.price ?? 0) || 0, stock: Number(r.stock ?? t?.stock ?? 0) || 0, threshold: Number(r.threshold ?? t?.threshold ?? 10) || 0,
            image: String(r.image ?? t?.image ?? ''), careId: String(r.careId || t?.careId || PREDEFINED_PLANT_CARE[0].id),
            customCare: (r.season || r.care || r.water || r.sunlight || r.fertilizer) ? { season:String(r.season||''), care:String(r.care||''), water:String(r.water||''), sunlight:String(r.sunlight||''), fertilizer:String(r.fertilizer||'') } : t?.customCare
          };
          if (t) updated++; else added++;
          map.set(obj.id, obj);
        });
        saveProducts(Array.from(map.values()));
        showToast(`Excel import: ${updated} updated, ${added} added.`);
      };

      if (loadingDb) return <div className="min-h-screen flex items-center justify-center bg-slate-950 text-white font-bold">Loading ERP...</div>;
      if (customerMode) return <CustomerFacingCatalogView products={products} plantCareDb={plantCareDb} nurseryProfile={nurseryProfile} onExitPreview={currentUser ? () => { if (window.location.hash === '#customer-catalog') window.history.replaceState(null, '', window.location.pathname + window.location.search); setCustomerMode(false); } : null} />;
      if (!currentUser) return <LoginScreen nurseryProfile={nurseryProfile} users={users} onLogin={setCurrentUser} />;

      const navItems = [
        { id:'dashboard', label:'Dashboard', icon:'home' }, { id:'catalog', label:'Inventory & Catalog', icon:'grid' },
        { id:'pos', label:'Sales & POS Billing', icon:'cart' }, { id:'purchases', label:'Purchases', icon:'truck' },
        { id:'stock', label:'Stock Management', icon:'boxes' }, { id:'adjustments', label:'Stock Adjustments', icon:'adjust' },
        { id:'sale-summary', label:'Sale Summary', icon:'chart' }, { id:'purchase-summary', label:'Purchase Summary', icon:'chart' },
        { id:'workers', label:'Workers & Attendance', icon:'users' }, { id:'plant-care', label:'Plant Care DB', icon:'book' },
        { id:'bills', label:'Bill Gallery', icon:'image' }, { id:'settings', label:'Settings', icon:'settings' }
      ];

      return (
        <div className="min-h-screen flex bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
          <aside className={`fixed lg:sticky top-0 left-0 z-40 h-screen bg-white dark:bg-slate-900 border-r transition-all duration-200 flex flex-col no-print ${sidebarExpanded ? 'w-64 translate-x-0' : 'w-0 -translate-x-full lg:w-20 lg:translate-x-0 overflow-hidden'}`}>
            <div className="h-16 flex items-center px-4 border-b shrink-0 gap-3"><div className="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center shrink-0"><Icon name="leaf" className="w-6 h-6" /></div>{sidebarExpanded && <span className="font-extrabold text-base truncate">{nurseryProfile.nurseryName}</span>}</div>
            <nav className="flex-1 overflow-y-auto p-3 space-y-1">
              {navItems.map((it) => (
                <button key={it.id} onClick={() => { setActivePage(it.id); if (window.innerWidth < 1024) setSidebarExpanded(false); }} title={it.label} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm transition ${activePage === it.id ? 'bg-emerald-600 text-white shadow' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'} ${!sidebarExpanded ? 'lg:justify-center' : ''}`}>
                  <Icon name={it.icon} className="w-5 h-5 shrink-0" />{sidebarExpanded && <span className="truncate">{it.label}</span>}
                </button>
              ))}
            </nav>
          </aside>

          <div className="flex-1 flex flex-col min-w-0">
            <header className="sticky top-0 z-30 h-16 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b px-4 sm:px-6 flex items-center justify-between gap-3 no-print">
              <div className="flex items-center gap-3">
                <button onClick={() => setSidebarExpanded((p) => !p)} className="flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-emerald-600 hover:text-white font-bold text-xs transition"><Icon name="menu" className="w-5 h-5" /><span className="hidden sm:inline">{sidebarExpanded ? 'Collapse' : 'Menu'}</span></button>
                <span className="font-extrabold text-lg hidden sm:inline">{nurseryProfile.nurseryName} ERP</span>
              </div>
              <div className="flex items-center gap-2.5">
                <button onClick={() => setActivePage('workers')} className={`flex items-center gap-2 px-4 py-2 rounded-xl font-extrabold text-xs border transition ${activePage === 'workers' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-emerald-50 dark:bg-emerald-950/50 text-emerald-800 dark:text-emerald-300 border-emerald-200 hover:bg-emerald-600 hover:text-white'}`}><Icon name="users" className="w-4 h-4" /><span>Workers & Attendance</span></button>
                <button onClick={() => setQrOpen(true)} className="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-slate-900 dark:bg-slate-700 text-white font-bold text-xs hover:bg-emerald-700 transition"><Icon name="qr" className="w-4 h-4" /><span className="hidden md:inline">QR Scanner</span></button>
              </div>
            </header>

            <main className="flex-1 p-4 sm:p-6 lg:p-8 max-w-[1520px] w-full mx-auto">
              {activePage === 'dashboard' && <DashboardPage nurseryProfile={nurseryProfile} currentUser={currentUser} products={products} sales={sales} purchases={purchases} onNavigate={setActivePage} onOpenQR={() => setQrOpen(true)} onOpenCustomerQR={() => setCustomerQrOpen(true)} />}
              {(activePage === 'catalog' || activePage === 'pos') && <CatalogAndPOSPage mode={activePage} products={products} cart={cart} setCart={setCart} onOpenCheckout={() => setCheckoutOpen(true)} onOpenCustomerQR={() => setCustomerQrOpen(true)} />}
              {activePage === 'purchases' && <PurchasesPage products={products} onRecordPurchase={handleRecordPurchase} />}
              {activePage === 'stock' && <StockManagementPage products={products} plantCareDb={plantCareDb} onAddProduct={(p) => { saveProducts([p, ...products]); showToast(`Added "${p.nameEn}".`); }} onUpdateProduct={(u) => { saveProducts(products.map((x) => x.id === u.id ? u : x)); showToast(`Updated "${u.nameEn}".`); }} onDeleteProduct={(id) => { saveProducts(products.filter((x) => x.id !== id)); showToast('Plant deleted.'); }} onNavigateAdjustments={() => setActivePage('adjustments')} onOpenCustomerQR={() => setCustomerQrOpen(true)} />}
              {activePage === 'adjustments' && <StockAdjustmentModule products={products} adjustments={adjustments} onAddAdjustment={handleAddAdjustment} onUpdateAdjustment={(u) => saveAdjustments(adjustments.map((a) => a.id === u.id ? u : a))} requestAuth={requestAuth} />}
              {activePage === 'sale-summary' && <SummaryReportPage type="sale" records={sales} />}
              {activePage === 'purchase-summary' && <SummaryReportPage type="purchase" records={purchases} />}
              {activePage === 'workers' && <WorkersAttendancePage workers={workers} onAddWorker={(w) => { saveWorkers([...workers, w]); showToast(`Added ${w.name}.`); }} attendance={attendance} onSetAttendance={(d, w, s) => saveAttendance({ ...attendance, [d]: { ...(attendance[d]||{}), [w]: s } })} />}
              {activePage === 'plant-care' && <PlantCareDatabasePage plantCareDb={plantCareDb} onAddEntry={(e) => { savePlantCare([e, ...plantCareDb]); showToast(`Added "${e.commonEn}".`); }} onUpdateEntry={(u) => { savePlantCare(plantCareDb.map((c) => c.id === u.id ? u : c)); showToast('Updated entry.'); }} requestAuth={requestAuth} />}
              {activePage === 'bills' && <BillGalleryPage bills={bills} onAddBill={(b) => { saveBills([b, ...bills]); showToast('Bill uploaded.'); }} onDeleteBill={(id) => { saveBills(bills.filter((b) => b.id !== id)); showToast('Bill deleted.'); }} requestAuth={requestAuth} />}
              {activePage === 'settings' && <SettingsPage theme={theme} setTheme={setTheme} nurseryProfile={nurseryProfile} onSaveProfile={saveProfile} users={users} onSaveUsers={saveUsers} currentUser={currentUser} products={products} plantCareDb={plantCareDb} onImportProducts={handleImportProducts} requestAuth={requestAuth} onLogout={() => setCurrentUser(null)} />}
            </main>
          </div>

          <FullScreenQRScanner isOpen={qrOpen} onClose={() => setQrOpen(false)} products={products} plantCareDb={plantCareDb} />
          <CustomerCatalogQRModal isOpen={customerQrOpen} onClose={() => setCustomerQrOpen(false)} productCount={products.length} nurseryProfile={nurseryProfile} onOpenCustomerPreview={() => setCustomerMode(true)} />
          <CentralCheckoutModal isOpen={checkoutOpen} cart={cart} setCart={setCart} products={products} onClose={() => setCheckoutOpen(false)} onConfirmSale={handleConfirmSale} />
          <WhatsAppDispatchModal dispatchInfo={waDispatch} onClose={() => setWaDispatch(null)} />
          <PasswordAuthModal isOpen={authModal.open} title={authModal.title} subtitle={authModal.subtitle} users={users} onCancel={() => setAuthModal({ open: false, title: '', subtitle: '', onOk: null })} onSuccess={() => { const fn = authModal.onOk; setAuthModal({ open: false, title: '', subtitle: '', onOk: null }); if (fn) fn(); }} />
          {toast && <div className="fixed bottom-5 right-5 z-[110] px-5 py-3 rounded-2xl bg-slate-900 dark:bg-emerald-600 text-white font-bold text-sm shadow-2xl">{toast}</div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
