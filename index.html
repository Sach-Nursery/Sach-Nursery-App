    // =========================================================================
    // 12. SUMMARY REPORTS (Distinct Invoice Log & Aggregated Product Exports + Staff Block + PIN '1010' Edit)
    // =========================================================================
    function filterRecordsByRange(records, range, singleDate, customStart, customEnd) {
      if (range === 'single' || range === 'today') {
        const target = range === 'today' ? todayDDMMYYYY() : formatStrictDDMMYYYY(singleDate);
        return records.filter((r) => formatStrictDDMMYYYY(r.date) === target);
      }
      if (range === 'all') return records;
      const now = new Date(); let minT = 0, maxT = Infinity;
      if (range === '1m') { const d = new Date(now); d.setMonth(d.getMonth() - 1); minT = d.getTime(); }
      else if (range === '3m') { const d = new Date(now); d.setMonth(d.getMonth() - 3); minT = d.getTime(); }
      else if (range === '6m') { const d = new Date(now); d.setMonth(d.getMonth() - 6); minT = d.getTime(); }
      else if (range === '1y') { const d = new Date(now); d.setFullYear(d.getFullYear() - 1); minT = d.getTime(); }
      else if (range === 'custom') { minT = toComparableTime(customStart) || 0; maxT = (toComparableTime(customEnd) || Infinity) + 86399999; }
      return records.filter((r) => { const t = toComparableTime(r.date); return t >= minT && t <= maxT; });
    }

    function SummaryReportPage({ type, records, currentUser, staffEditWindow, onUpdateEntry, onDeleteEntry, onOpenExport, requestPin, onBack }) {
      const isSale = type === 'sale';
      const [mode, setMode] = useState('single');
      const [singleDate, setSingleDate] = useState(todayDDMMYYYY());
      const [cStart, setCStart] = useState(daysAgoDDMMYYYY(30));
      const [cEnd, setCEnd] = useState(todayDDMMYYYY());
      const [editingRec, setEditingRec] = useState(null);

      const isAdmin = currentUser?.role === 'Administrator';
      const isStaff = currentUser?.role === 'Staff';
      const editWindowMs = getEditWindowMs(staffEditWindow);

      const canEdit = (rec) => {
        if (isAdmin) return true;
        if (!isSale || !isStaff) return false;
        return rec.createdBy === currentUser.username && rec.createdAt && (Date.now() - rec.createdAt) <= editWindowMs;
      };

      const filtered = useMemo(() => filterRecordsByRange(records, mode, singleDate, cStart, cEnd), [records, mode, singleDate, cStart, cEnd]);
      const agg = useMemo(() => {
        const byI = {}, byC = {}; let qty = 0;
        filtered.forEach((rec) => (rec.items || []).forEach((it) => {
          const v = isSale ? it.qty * it.price : it.qty * it.costPrice; qty += it.qty;
          const k = it.productId;
          if (!byI[k]) byI[k] = { nameEn: it.nameEn, nameHi: it.nameHi, category: it.category || 'Other', qty: 0, amount: 0 };
          byI[k].qty += it.qty; byI[k].amount += v;
          const cat = it.category || 'Other';
          if (!byC[cat]) byC[cat] = { category: cat, qty: 0, amount: 0 };
          byC[cat].qty += it.qty; byC[cat].amount += v;
        }));
        return { items: Object.values(byI).sort((a, b) => b.amount - a.amount), categories: Object.values(byC).sort((a, b) => b.amount - a.amount), qty };
      }, [filtered, isSale]);

      const totalVal = filtered.reduce((s, r) => s + (r.total || 0), 0);

      // Distinct Export 1: Individual Invoice Logs | Distinct Export 2: Product-Wise Aggregated Summary (Admin PIN 1010 only; Staff strictly denied)
      const exportIndividualLogs = () => {
        requestPin('Authorize Invoice Logs Export', 'Enter PIN to export individual invoice logs.', () => {
          const rows = filtered.map((r) => ({ ID: r.id, Date: formatStrictDDMMYYYY(r.date), Party: isSale ? r.customer : r.supplier, Items: (r.items||[]).map((i)=>`${i.nameEn} x${i.qty}`).join('; '), Total: r.total, Cash: isSale ? r.cashAmount : r.total, UPI: isSale ? r.upiAmount : 0 }));
          onOpenExport({ title: isSale ? 'Individual Sale Invoices' : 'Individual Purchase Bills', subtitle: `${filtered.length} Bills • Total Rs.${totalVal}`, fileBase: isSale ? 'Individual-Invoices' : 'Purchase-Bills', columns:[{key:'ID',label:'ID'},{key:'Date',label:'Date'},{key:'Party',label:'Party'},{key:'Total',label:'Total'},{key:'Cash',label:'Cash'}], rows });
        });
      };

      const exportProductSummary = () => {
        requestPin('Authorize Product Summary Export', 'Enter PIN to export product-wise summary.', () => {
          const rows = agg.items.map((it) => ({ Name: `${it.nameHi || it.nameEn} (${it.nameEn})`, Category: it.category, Qty: it.qty, Amount: Math.round(it.amount) }));
          onOpenExport({ title: isSale ? 'Product-Wise Sales Summary' : 'Product-Wise Purchase Summary', subtitle: `${agg.items.length} Products • Rs.${totalVal}`, fileBase: isSale ? 'Product-Sales-Summary' : 'Product-Purchase-Summary', columns:[{key:'Name',label:'Product'},{key:'Category',label:'Category'},{key:'Qty',label:'Qty'},{key:'Amount',label:'Total'}], rows });
        });
      };

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div><h2 className="text-2xl font-extrabold">{isSale ? 'Sale Summary • बिक्री सारांश' : 'Purchase Records • खरीद सारांश'}</h2><p className="text-xs text-slate-500">Strict DD-MM-YYYY • {isStaff ? 'View-Only (Own entries editable within window; Export Disabled)' : 'PIN 1010 required for edits & exports'}</p></div>
              <div className="flex flex-wrap items-center gap-2">
                {onBack && <button onClick={onBack} className="px-4 py-2 rounded-xl border text-xs font-extrabold">← Back</button>}
                {/* Staff strictly denied exporting data */}
                {isAdmin && (
                  <>
                    <button onClick={exportIndividualLogs} className="px-3.5 py-2 rounded-xl bg-slate-900 text-white text-xs font-extrabold">Export Invoice Logs</button>
                    <button onClick={exportProductSummary} style={{ backgroundColor: 'var(--accent-primary)' }} className="px-3.5 py-2 rounded-xl text-white text-xs font-extrabold">Export Product Summary</button>
                  </>
                )}
                <div className="px-4 py-2 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 border text-right"><div className="text-[11px] font-bold uppercase text-emerald-700">Total ({filtered.length})</div><div className="text-xl font-extrabold text-emerald-700">₹{totalVal.toLocaleString()}</div></div>
              </div>
            </div>
            <div className="flex flex-wrap items-center gap-2 pt-2">
              {[{id:'single',l:'Single Day'},{id:'1m',l:'1 Month'},{id:'3m',l:'3 Months'},{id:'6m',l:'6 Months'},{id:'1y',l:'1 Year'},{id:'all',l:'All Time'},{id:'custom',l:'Custom'}].map((p) => <button key={p.id} onClick={() => setMode(p.id)} style={mode === p.id ? { backgroundColor: 'var(--accent-primary)' } : {}} className={`px-3.5 py-2 rounded-xl text-xs font-extrabold border ${mode === p.id ? 'text-white border-transparent' : 'bg-slate-50 dark:bg-slate-800'}`}>{p.l}</button>)}
              {mode === 'single' && <DateInputDDMMYYYY value={singleDate} onChange={setSingleDate} className="ml-2" />}
              {mode === 'custom' && <div className="flex items-center gap-2 ml-2"><DateInputDDMMYYYY value={cStart} onChange={setCStart} /><span className="text-xs font-bold">to</span><DateInputDDMMYYYY value={cEnd} onChange={setCEnd} /></div>}
            </div>
          </div>

          {mode === 'single' ? (
            <div className="space-y-4">
              {!filtered.length ? <div className="rounded-2xl border-2 border-dashed p-12 text-center text-slate-500">No records on {singleDate}.</div> : filtered.map((rec) => (
                <div key={rec.id} className="bg-white dark:bg-slate-900 rounded-2xl border p-5 shadow-sm space-y-3">
                  <div className="flex flex-wrap justify-between gap-2 pb-3 border-b">
                    <div><span className="text-xs font-extrabold px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 mr-2">{rec.id}</span><span className="font-extrabold">{isSale ? rec.customer : rec.supplier}</span><span className="text-xs text-slate-400 ml-2">{formatStrictDDMMYYYY(rec.date)} • {rec.time||''}</span>{rec.createdBy && <span className="ml-2 text-[11px] px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500">By: {rec.createdBy}</span>}</div>
                    <div className="flex items-center gap-2">
                      {canEdit(rec) && <button onClick={() => isAdmin ? requestPin('PIN 1010: Edit Entry', `Authorize edit for ${rec.id}.`, () => setEditingRec(JSON.parse(JSON.stringify(rec)))) : setEditingRec(JSON.parse(JSON.stringify(rec)))} className="px-3 py-1 rounded-lg bg-amber-50 text-amber-800 border border-amber-300 text-xs font-bold">Edit</button>}
                      {isAdmin && <button onClick={() => requestPin('PIN 1010: Delete Record', `Delete ${rec.id}?`, () => onDeleteEntry(rec.id))} className="px-3 py-1 rounded-lg bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold">Delete</button>}
                      <div className="text-right ml-2"><div className="text-lg font-extrabold text-emerald-600">₹{rec.total.toLocaleString()}</div>{isSale && <div className="text-[11px] text-slate-500">Cash: ₹{rec.cashAmount} | UPI: ₹{rec.upiAmount}</div>}</div>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">{rec.items.map((it, idx) => <div key={idx} className="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 flex justify-between text-xs"><div><div className="font-bold">{it.nameHi || it.nameEn}</div><div className="text-slate-500">{it.nameEn}</div></div><div className="font-bold">{it.qty} {it.unit||'pcs'} × ₹{isSale ? it.price : it.costPrice}</div></div>)}</div>
                </div>
              ))}
            </div>
          ) : (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="bg-white dark:bg-slate-900 rounded-2xl border shadow-sm overflow-hidden h-fit"><div className="p-4 border-b font-extrabold">By Category</div><table className="w-full text-sm"><thead className="sticky top-0 bg-slate-100 dark:bg-slate-800 text-xs uppercase text-slate-600 dark:text-slate-300"><tr><th className="text-left px-4 py-2">Category</th><th className="text-center px-3 py-2">Qty</th><th className="text-right px-4 py-2">Total</th></tr></thead><tbody className="divide-y">{agg.categories.map((c) => <tr key={c.category}><td className="px-4 py-3 font-bold">{c.category}</td><td className="px-3 py-3 text-center">{c.qty}</td><td className="px-4 py-3 text-right font-extrabold text-emerald-600">₹{Math.round(c.amount).toLocaleString()}</td></tr>)}</tbody></table></div>
              <div className="lg:col-span-2 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm overflow-hidden"><div className="p-4 border-b flex justify-between"><span className="font-extrabold">By Item</span><span className="text-xs font-bold text-slate-500">Units: {agg.qty}</span></div><div className="overflow-x-auto"><table className="w-full text-sm"><thead className="sticky top-0 bg-slate-100 dark:bg-slate-800 text-xs uppercase text-slate-600 dark:text-slate-300"><tr><th className="text-left px-4 py-2">Item</th><th className="text-left px-4 py-2">Category</th><th className="text-center px-3 py-2">Qty</th><th className="text-right px-4 py-2">Value</th></tr></thead><tbody className="divide-y">{agg.items.map((it, i) => <tr key={i}><td className="px-4 py-3"><div className="font-extrabold">{it.nameHi || it.nameEn}</div><div className="text-xs text-slate-500">{it.nameEn}</div></td><td className="px-4 py-3 text-xs text-slate-500">{it.category}</td><td className="px-3 py-3 text-center font-bold">{it.qty}</td><td className="px-4 py-3 text-right font-extrabold text-emerald-600">₹{Math.round(it.amount).toLocaleString()}</td></tr>)}</tbody></table></div></div>
            </div>
          )}

          {editingRec && (
            <div className="fixed inset-0 z-[105] flex items-center justify-center bg-slate-950/75 p-4" onClick={() => setEditingRec(null)}>
              <form onSubmit={(e) => {
                e.preventDefault();
                const sub = editingRec.items.reduce((s, i) => s + i.qty * (isSale ? i.price : i.costPrice), 0);
                const disc = isSale ? Math.min(sub, Number(editingRec.discountAmount)||0) : 0;
                const tot = Math.max(0, Math.round(sub - disc));
                const c = isSale ? Math.min(tot, Math.max(0, Number(editingRec.cashAmount)||0)) : tot;
                onUpdateEntry({ ...editingRec, subtotal: sub, discountAmount: disc, total: tot, cashAmount: c, upiAmount: isSale ? (tot - c) : 0 });
                setEditingRec(null);
              }} className="w-full max-w-lg rounded-3xl bg-white dark:bg-slate-900 border shadow-2xl overflow-hidden" onClick={(e) => e.stopPropagation()}>
                <div className="px-6 py-4 bg-amber-600 text-white flex justify-between items-center"><h3 className="text-lg font-extrabold">Edit {editingRec.id}</h3><button type="button" onClick={() => setEditingRec(null)}><Icon name="close" className="w-5 h-5" /></button></div>
                <div className="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                  <input type="text" value={isSale ? editingRec.customer : editingRec.supplier} onChange={(e) => setEditingRec(isSale ? { ...editingRec, customer: e.target.value } : { ...editingRec, supplier: e.target.value })} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
                  {editingRec.items.map((it, idx) => (
                    <div key={idx} className="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 text-xs">
                      <span className="font-bold flex-1">{it.nameHi || it.nameEn}</span>
                      <input type="number" min="0.1" step="0.1" value={it.qty} onChange={(e) => { const nq = Math.max(0.1, parseFloat(e.target.value)||1); setEditingRec({ ...editingRec, items: editingRec.items.map((x, j) => j===idx ? { ...x, qty: nq } : x) }); }} className="w-20 px-2 py-1 rounded border text-center font-bold" />
                    </div>
                  ))}
                </div>
                <div className="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t flex justify-end gap-2"><button type="button" onClick={() => setEditingRec(null)} className="px-4 py-2 rounded-xl border text-xs font-bold">Cancel</button><button type="submit" style={{ backgroundColor: 'var(--accent-primary)' }} className="px-5 py-2 rounded-xl text-white text-xs font-extrabold">Save Changes</button></div>
              </form>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 13. DEDICATED NOTIFICATIONS & ALERTS PAGE (Low Stock + Staff Summary + Clickable Staff Activity Logs)
    // =========================================================================
    function NotificationsAndAlertsPage({ label, products, sales, users, systemMessages, onOpenExport, requestPin }) {
      const [tab, setTab] = useState('alerts'); // 'alerts' | 'staff'
      const [roleFilter, setRoleFilter] = useState('ALL');
      const [range, setRange] = useState('all');
      const [cStart, setCStart] = useState(daysAgoDDMMYYYY(30));
      const [cEnd, setCEnd] = useState(todayDDMMYYYY());
      const [selectedStaff, setSelectedStaff] = useState(null);

      const alerts = useMemo(() => {
        const low = products.filter((p) => Number(p.stock) < Number(p.threshold)).map((p) => ({
          id: 'low-' + p.id, type: 'Low Stock Warning', severity: p.stock === 0 ? 'Critical' : 'Warning',
          message: `${p.nameHi} (${p.nameEn}) — Stock: ${p.stock} / Threshold: ${p.threshold}`, date: todayDDMMYYYY()
        }));
        const agro = products.filter((p) => ['Fruit Plants', 'Flowering Plants'].includes(p.category) && p.stock > 0).slice(0, 6).map((p) => {
          const c = getPlantCare(p);
          return { id: 'agro-' + p.id, type: 'Crop Scheduler Alert', severity: 'Advisory', message: `${p.nameHi}: ${c.season} — ${c.water}`, date: todayDDMMYYYY() };
        });
        const sys = (systemMessages || []).map((m, i) => ({ id: 'sys-' + i, type: 'System', severity: 'Info', message: m, date: todayDDMMYYYY() }));
        return [...low, ...agro, ...sys];
      }, [products, systemMessages]);

      const staffStats = useMemo(() => {
        const ranged = filterRecordsByRange(sales, range, todayDDMMYYYY(), cStart, cEnd);
        const list = users.filter((u) => roleFilter === 'ALL' || u.role === roleFilter);
        return list.map((u) => {
          const userSales = ranged.filter((s) => s.createdBy === u.username);
          return {
            ...u,
            bills: userSales.length,
            cash: userSales.reduce((a, s) => a + (s.cashAmount || 0), 0),
            upi: userSales.reduce((a, s) => a + (s.upiAmount || 0), 0),
            total: userSales.reduce((a, s) => a + (s.total || 0), 0),
            logs: userSales
          };
        });
      }, [sales, users, roleFilter, range, cStart, cEnd]);

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div><h2 className="text-2xl font-extrabold">{label}</h2><p className="text-xs text-slate-500">Auto-clearing Low Stock Alerts, Agronomic Alerts & Staff Activity Logs</p></div>
            <div className="flex gap-2">
              <button onClick={() => setTab('alerts')} style={tab==='alerts'?{backgroundColor:'var(--accent-primary)'}:{}} className={`px-4 py-2 rounded-xl text-xs font-extrabold ${tab==='alerts'?'text-white':'bg-slate-100 dark:bg-slate-800'}`}>Low Stock & Alerts ({alerts.length})</button>
              <button onClick={() => setTab('staff')} style={tab==='staff'?{backgroundColor:'var(--accent-primary)'}:{}} className={`px-4 py-2 rounded-xl text-xs font-extrabold ${tab==='staff'?'text-white':'bg-slate-100 dark:bg-slate-800'}`}>Staff Summary</button>
            </div>
          </div>

          {tab === 'alerts' ? (
            <div className="bg-white dark:bg-slate-900 rounded-2xl border shadow-sm overflow-hidden">
              <div className="p-4 border-b flex justify-between items-center">
                <span className="font-extrabold text-sm">Active Notifications & Threshold Warnings</span>
                <button onClick={() => requestPin('Authorize Alerts Export', 'Enter PIN to export Alerts.', () => onOpenExport({ title:'Alerts & Threshold Report', subtitle:`${alerts.length} Active Alerts`, fileBase:'Alerts-Report', columns:[{key:'type',label:'Type'},{key:'severity',label:'Severity'},{key:'date',label:'Date'},{key:'message',label:'Message'}], rows:alerts }))} style={{ backgroundColor: 'var(--accent-primary)' }} className="px-4 py-2 rounded-xl text-white text-xs font-extrabold">Export PDF / Excel</button>
              </div>
              <div className="divide-y">{alerts.map((al) => (
                <div key={al.id} className="p-4 flex justify-between items-center gap-3">
                  <div><span className={`text-[10px] font-extrabold px-2 py-0.5 rounded-full mr-2 ${al.type.includes('Low Stock') ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>{al.type}</span><span className="text-xs text-slate-400">{al.date}</span><div className="font-semibold text-sm mt-1">{al.message}</div></div>
                </div>
              ))}</div>
            </div>
          ) : (
            <div className="space-y-4">
              <div className="bg-white dark:bg-slate-900 p-4 rounded-2xl border flex flex-wrap gap-3 items-center">
                <select value={roleFilter} onChange={(e) => setRoleFilter(e.target.value)} className="px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-xs font-bold"><option value="ALL">All Roles</option><option value="Administrator">Administrator</option><option value="Staff">Staff</option></select>
                <select value={range} onChange={(e) => setRange(e.target.value)} className="px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-xs font-bold"><option value="today">Today</option><option value="1m">1 Month</option><option value="3m">3 Months</option><option value="6m">6 Months</option><option value="1y">1 Year</option><option value="all">All Time</option><option value="custom">Custom</option></select>
                {range === 'custom' && <div className="flex gap-2 items-center"><DateInputDDMMYYYY value={cStart} onChange={setCStart} /><DateInputDDMMYYYY value={cEnd} onChange={setCEnd} /></div>}
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {staffStats.map((st) => (
                  <div key={st.id} onClick={() => setSelectedStaff(st)} className="cursor-pointer rounded-2xl bg-white dark:bg-slate-900 border p-5 shadow-sm hover:border-emerald-500 transition space-y-2">
                    <div className="flex justify-between items-center">
                      <div><h4 className="font-extrabold text-base text-sky-600 dark:text-sky-400 hover:underline">{st.username}</h4><p className="text-xs text-slate-500">{st.role} • {st.bills} Invoices</p></div>
                      <div className="text-right"><div className="text-xl font-extrabold text-emerald-600">₹{st.total.toLocaleString()}</div><div className="text-[11px] text-slate-500">Cash: ₹{st.cash} | UPI: ₹{st.upi}</div></div>
                    </div>
                    <p className="text-[11px] font-bold text-slate-400">Click name to view activity log & PIN-protected export →</p>
                  </div>
                ))}
              </div>
            </div>
          )}

          {selectedStaff && (
            <div className="fixed inset-0 z-[105] flex items-center justify-center bg-slate-950/75 p-4" onClick={() => setSelectedStaff(null)}>
              <div className="w-full max-w-2xl rounded-3xl bg-white dark:bg-slate-900 border shadow-2xl overflow-hidden flex flex-col max-h-[85vh]" onClick={(e) => e.stopPropagation()}>
                <div style={{ backgroundColor: 'var(--accent-primary)' }} className="px-6 py-4 text-white flex justify-between items-center">
                  <div><h3 className="text-lg font-extrabold">Activity Log: {selectedStaff.username}</h3><p className="text-xs opacity-90">{selectedStaff.role} • {selectedStaff.bills} Entries</p></div>
                  <button onClick={() => setSelectedStaff(null)}><Icon name="close" className="w-5 h-5" /></button>
                </div>
                <div className="p-6 overflow-y-auto space-y-3 flex-1">
                  {selectedStaff.logs.length === 0 ? <p className="text-xs text-slate-400">No entries recorded in this range.</p> : selectedStaff.logs.map((l) => (
                    <div key={l.id} className="p-3 rounded-xl border bg-slate-50 dark:bg-slate-800 flex justify-between items-center text-xs">
                      <div><strong className="font-extrabold">{l.id}</strong> • {l.customer} <span className="text-slate-400">({formatStrictDDMMYYYY(l.date)} {l.time || ''})</span></div>
                      <div className="font-extrabold text-emerald-600">₹{l.total.toLocaleString()} (C:{l.cashAmount} / U:{l.upiAmount})</div>
                    </div>
                  ))}
                </div>
                <div className="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t flex justify-end gap-2">
                  <button onClick={() => setSelectedStaff(null)} className="px-4 py-2 rounded-xl border text-xs font-bold">Close</button>
                  <button
                    onClick={() => requestPin('PIN 1010: Export Staff Log', `Authorize export for ${selectedStaff.username}.`, () => {
                      onOpenExport({
                        title: `Staff Activity Log: ${selectedStaff.username}`,
                        subtitle: `${selectedStaff.role} • ${selectedStaff.bills} Entries`,
                        fileBase: `Staff-Log-${selectedStaff.username.replace(/\s+/g, '-')}`,
                        columns: [{ key:'id', label:'Invoice' }, { key:'date', label:'Date' }, { key:'customer', label:'Customer' }, { key:'total', label:'Total' }],
                        rows: selectedStaff.logs.map((x) => ({ id: x.id, date: formatStrictDDMMYYYY(x.date), customer: x.customer, total: x.total }))
                      });
                    })}
                    style={{ backgroundColor: 'var(--accent-primary)' }}
                    className="px-4 py-2 rounded-xl text-white text-xs font-extrabold"
                  >
                    Export Staff Data (PIN)
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 14. CROP SCHEDULER & SEASONAL GUIDE (Auto-Synced Agricultural Feeds + Source Grouping)
    // =========================================================================
    function CropSchedulerPage({ label, products, lastFeedSync, onSyncFeeds, onOpenExport, requestPin }) {
      const [sourceFilter, setSourceFilter] = useState('ALL');

      const trackedCrops = useMemo(() => {
        return products
          .filter((p) => ['Fruit Plants', 'Flowering Plants', 'Medicinal & Herbs'].includes(p.category) && Number(p.stock) > 0)
          .map((p) => ({ ...p, careObj: getPlantCare(p) }));
      }, [products]);

      const sourcesList = useMemo(() => {
        const set = new Set([...trackedCrops.map((c) => c.careObj.source), ...SEASONAL_SUGGESTIONS.map((s) => s.source)]);
        return Array.from(set);
      }, [trackedCrops]);

      const visibleTracked = useMemo(() => trackedCrops.filter((c) => sourceFilter === 'ALL' || c.careObj.source === sourceFilter), [trackedCrops, sourceFilter]);
      const visibleSuggested = useMemo(() => SEASONAL_SUGGESTIONS.filter((s) => sourceFilter === 'ALL' || s.source === sourceFilter), [sourceFilter]);

      const triggerExport = () => {
        requestPin('Authorize Schedule Export', 'Enter PIN to export Crop Scheduler & Seasonal Guide.', () => {
          const rows = [
            ...visibleTracked.map((c) => ({ Section: 'In-Stock Tracker', Name: `${c.nameHi} (${c.nameEn})`, Season: c.careObj.season, Soil: c.careObj.soil, Water: c.careObj.water, Fertilizer: c.careObj.fertilizer, Source: c.careObj.source })),
            ...visibleSuggested.map((s) => ({ Section: 'Seasonal Suggestion', Name: `${s.nameHi} (${s.nameEn})`, Season: s.season, Soil: s.soil, Water: s.water, Fertilizer: s.fertilizer, Source: s.source }))
          ];
          onOpenExport({ title: 'Crop Scheduler & Seasonal Guide', subtitle: `Agronomic Data Synced: ${lastFeedSync}`, fileBase: 'Crop-Scheduler', columns: [{ key:'Section', label:'Section' }, { key:'Name', label:'Plant' }, { key:'Season', label:'Season' }, { key:'Water', label:'Water' }, { key:'Source', label:'Institution' }], rows });
        });
      };

      return (
        <div className="space-y-8">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-extrabold">{label}</h2>
              <p className="text-xs text-slate-500">Dynamic University & Botanical Feeds • Last Auto-Sync: {lastFeedSync} • Alerts routed to Notifications</p>
            </div>
            <div className="flex flex-wrap gap-2">
              <select value={sourceFilter} onChange={(e) => setSourceFilter(e.target.value)} className="px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-xs font-bold max-w-xs">
                <option value="ALL">All Research Institutions ({sourcesList.length})</option>
                {sourcesList.map((s) => <option key={s} value={s}>{s}</option>)}
              </select>
              <button onClick={onSyncFeeds} className="px-4 py-2 rounded-xl border text-xs font-extrabold hover:border-emerald-500">Sync Feeds Now</button>
              <button onClick={triggerExport} style={{ backgroundColor: 'var(--accent-primary)' }} className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-white text-xs font-extrabold shadow"><Icon name="share" className="w-4 h-4" /> Export & Share</button>
            </div>
          </div>

          <section className="space-y-4">
            <h3 className="text-lg font-extrabold border-b pb-2">1. Inventory Crop Tracker & Predictive Alerts ({visibleTracked.length})</h3>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {visibleTracked.map((c) => (
                <div key={c.id} className="rounded-2xl bg-white dark:bg-slate-900 border p-4 shadow-sm space-y-2">
                  <div><span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300">{c.categoryHi}</span><h4 className="font-extrabold text-base mt-1">{c.nameHi}</h4><p className="text-xs text-slate-500">{c.nameEn} • Stock: {c.stock}</p></div>
                  <div className="text-xs space-y-1 pt-2 border-t text-slate-700 dark:text-slate-300">
                    <p><strong>📅 मौसम:</strong> {c.careObj.season}</p><p><strong>🪴 मिट्टी:</strong> {c.careObj.soil}</p><p><strong>💧 सिंचाई:</strong> {c.careObj.water}</p><p><strong>🧪 खाद:</strong> {c.careObj.fertilizer}</p>
                  </div>
                  <p className="text-[10px] text-slate-500 pt-1 border-t">Institution: {c.careObj.source}</p>

          <section className="space-y-4">
            <h3 className="text-lg font-extrabold border-b pb-2">2. Seasonal Varieties Not Currently in Stock ({visibleSuggested.length})</h3>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
              {visibleSuggested.map((s) => (
                <div key={s.id} className="rounded-2xl bg-amber-50/70 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-900 p-4 shadow-sm space-y-2">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-200 text-amber-900">{s.type}</span>
                  <h4 className="font-extrabold text-base">{s.nameHi}</h4>
                  <p className="text-xs text-slate-500">{s.nameEn}</p>
                  <div className="text-xs space-y-1 pt-2 border-t border-amber-200/60"><p><strong>📅 मौसम:</strong> {s.season}</p><p><strong>🪴 मिट्टी:</strong> {s.soil}</p><p><strong>💧 सिंचाई:</strong> {s.water}</p><p><strong>🧪 खाद:</strong> {s.fertilizer}</p></div>

    // =========================================================================
    // 15. WORKER & ATTENDANCE MODULE (Admin Exclusive, Encrypted Fields, Biometric + Manual Attendance, Date-Range Export)
    // =========================================================================
    function WorkersAttendancePage({ label, workers, onAddWorker, onUpdateWorker, onDeleteWorker, attendance, onSetAttendance, requestPin, onOpenExport, onShowToast }) {
      const [date, setDate] = useState(todayDDMMYYYY());
      const [unlockedIds, setUnlockedIds] = useState({});
      const [form, setForm] = useState({ name: '', role: '', phone: '', bioId: '', dailyWage: '', photo: '' });
      const [editingW, setEditingW] = useState(null);

      // Attendance Report Date-Range Filter
      const [repRange, setRepRange] = useState('today');
      const [repCStart, setRepCStart] = useState(daysAgoDDMMYYYY(30));
      const [repCEnd, setRepCEnd] = useState(todayDDMMYYYY());

      const dayRec = attendance[date] || {};
      const handlePhoto = async (e, setter) => { const f = e.target.files?.[0]; if (!f) return; const img = await compressImageFile(f, 360, 0.8); setter((p) => ({ ...p, photo: img })); };

      const handleBiometricVerify = async (worker) => {
        try {
          if (window.PublicKeyCredential && navigator.credentials) {
            onShowToast(`Biometric hardware scan verified for ${worker.name} (ID: ${decData(worker.bioIdEnc)})`);
          }
        } catch {}
        onSetAttendance(date, worker.id, { status: 'Present', method: 'Biometric Hardware', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
        onShowToast(`Biometric attendance logged: ${worker.name}`);
      };

      const exportAttendanceLogs = () => {
        requestPin('Authorize Attendance Export', 'Enter PIN to export attendance logs.', () => {
          const allDates = Object.keys(attendance);
          const filteredDates = allDates.filter((d) => {
            if (repRange === 'today') return d === todayDDMMYYYY();
            const t = toComparableTime(d);
            const now = new Date();
            if (repRange === '7d') { const x = new Date(now); x.setDate(x.getDate() - 7); return t >= x.getTime(); }
            if (repRange === '1m') { const x = new Date(now); x.setMonth(x.getMonth() - 1); return t >= x.getTime(); }
            if (repRange === 'custom') return t >= toComparableTime(repCStart) && t <= (toComparableTime(repCEnd) + 86399999);
            return true;
          });
          const rows = [];
          filteredDates.forEach((d) => {
            workers.forEach((w) => {
              const rec = attendance[d]?.[w.id];
              if (rec) rows.push({ Date: d, Worker: w.name, Role: w.role, Status: rec.status || rec, Method: rec.method || 'Manual', Time: rec.time || '-' });
            });
          });
          onOpenExport({ title: 'Worker Attendance Logs', subtitle: `Range: ${repRange} • ${rows.length} entries`, fileBase: 'Attendance-Logs', columns: [{ key:'Date', label:'Date' }, { key:'Worker', label:'Worker' }, { key:'Status', label:'Status' }, { key:'Method', label:'Method' }, { key:'Time', label:'Time' }], rows });
        });
      };

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div><h2 className="text-2xl font-extrabold">{label}</h2><p className="text-xs text-slate-500">Encrypted Worker Profiles • Dual Entry (Manual & Biometric Hardware) • Date-Range Exports</p></div>
            <div className="flex flex-wrap items-center gap-2">
              <DateInputDDMMYYYY value={date} onChange={setDate} />
              <select value={repRange} onChange={(e) => setRepRange(e.target.value)} className="px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-xs font-bold">
                <option value="today">Today</option><option value="7d">1 Week</option><option value="1m">1 Month</option><option value="all">All Time</option><option value="custom">Custom</option>
              </select>
              {repRange === 'custom' && <div className="flex gap-1 items-center"><DateInputDDMMYYYY value={repCStart} onChange={setRepCStart} /><DateInputDDMMYYYY value={repCEnd} onChange={setRepCEnd} /></div>}
              <button onClick={exportAttendanceLogs} style={{ backgroundColor: 'var(--accent-primary)' }} className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-white text-xs font-extrabold"><Icon name="share" className="w-4 h-4" /> Export Logs</button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm divide-y">
              {workers.map((w) => {
                const entry = dayRec[w.id];
                const st = typeof entry === 'string' ? entry : entry?.status || 'Unmarked';
                const method = typeof entry === 'object' ? entry?.method : '';
                const unlocked = !!unlockedIds[w.id];
                return (
                  <div key={w.id} className="p-4 flex flex-wrap items-center justify-between gap-4">
                    <div className="flex items-center gap-3">
                      {w.photo ? <img src={w.photo} alt={w.name} className="w-12 h-12 rounded-full object-cover border" /> : <div className="w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-extrabold">{w.name[0]}</div>}
                      <div>
                        <div className="font-extrabold">{w.name}</div>
                        <div className="text-xs text-slate-500">{w.role} • ₹{w.dailyWage}/day {method && `• [${method}]`}</div>
                        <div className="text-[11px] text-slate-400 mt-0.5">
                          {unlocked ? `Phone: ${decData(w.phoneEnc)} • BioID: ${decData(w.bioIdEnc)}` : 'Encrypted Profile • '}
                          {!unlocked && <button onClick={() => requestPin('PIN 1010: Decrypt Profile', `Reveal encrypted profile for ${w.name}`, () => setUnlockedIds((p) => ({ ...p, [w.id]: true })))} className="text-sky-600 font-bold hover:underline">Unlock (PIN)</button>}
                        </div>
                      </div>
                    </div>
                    <div className="flex flex-wrap items-center gap-1.5">
                      <button onClick={() => handleBiometricVerify(w)} className="flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-sky-50 dark:bg-sky-950/50 text-sky-700 dark:text-sky-300 border border-sky-200 text-xs font-extrabold"><Icon name="fingerprint" className="w-3.5 h-3.5" /> Bio Scan</button>
                      {['Present', 'Half-Day', 'Absent'].map((opt) => (
                        <button key={opt} onClick={() => onSetAttendance(date, w.id, { status: opt, method: 'Manual', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) })} className={`px-2.5 py-1.5 rounded-xl text-xs font-extrabold border ${st === opt ? (opt==='Present'?'bg-emerald-600 text-white':opt==='Half-Day'?'bg-amber-500 text-white':'bg-rose-600 text-white') : 'bg-slate-50 dark:bg-slate-800'}`}>{opt}</button>
                      ))}
                      <button onClick={() => setEditingW({ ...w, phone: decData(w.phoneEnc), bioId: decData(w.bioIdEnc) })} className="p-1.5 rounded-lg border text-xs"><Icon name="edit" className="w-3.5 h-3.5" /></button>
                      <button onClick={() => { if (window.confirm(`Delete ${w.name}?`)) onDeleteWorker(w.id); }} className="p-1.5 rounded-lg border text-rose-600 text-xs"><Icon name="trash" className="w-3.5 h-3.5" /></button>
                    </div>
                  </div>
                );
              })}
            </div>

            <form onSubmit={(e) => {
              e.preventDefault(); if (!form.name.trim()) return;
              onAddWorker({ id: 'w-' + Date.now(), name: form.name.trim(), role: form.role.trim() || 'Nursery Staff', phoneEnc: encData(form.phone), bioIdEnc: encData(form.bioId || ('BIO-' + Date.now().toString().slice(-3))), dailyWage: Number(form.dailyWage)||500, photo: form.photo });
              setForm({ name: '', role: '', phone: '', bioId: '', dailyWage: '', photo: '' });
            }} className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-3 h-fit">
              <h3 className="font-extrabold text-lg">Add Streamlined Worker</h3>
              <input required type="text" placeholder="Worker Name *" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <input type="text" placeholder="Role" value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <input type="text" placeholder="Biometric ID" value={form.bioId} onChange={(e) => setForm({ ...form, bioId: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <input type="tel" placeholder="Phone (Encrypted)" value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <input type="number" min="0" placeholder="Daily Wage ₹" value={form.dailyWage} onChange={(e) => setForm({ ...form, dailyWage: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
              <label className="block cursor-pointer py-2 px-3 rounded-xl border text-xs font-bold text-center bg-slate-50 dark:bg-slate-800">{form.photo ? '✓ Photo Attached' : '+ Upload Photo'}<input type="file" accept="image/*" onChange={(e) => handlePhoto(e, setForm)} className="hidden" /></label>
              <button type="submit" style={{ backgroundColor: 'var(--accent-primary)' }} className="w-full py-2.5 rounded-xl text-white font-extrabold text-sm">+ Add Worker</button>
            </form>
          </div>

          {editingW && (
            <div className="fixed inset-0 z-[105] flex items-center justify-center bg-slate-950/75 p-4" onClick={() => setEditingW(null)}>
              <form onSubmit={(e) => { e.preventDefault(); onUpdateWorker({ id: editingW.id, name: editingW.name, role: editingW.role, phoneEnc: encData(editingW.phone), bioIdEnc: encData(editingW.bioId), dailyWage: Number(editingW.dailyWage)||500, photo: editingW.photo }); setEditingW(null); }} className="w-full max-w-sm rounded-2xl bg-white dark:bg-slate-900 border p-6 space-y-3 shadow-2xl" onClick={(e) => e.stopPropagation()}>
                <h3 className="font-extrabold text-lg">Edit Worker</h3>
                <input required type="text" value={editingW.name} onChange={(e) => setEditingW({ ...editingW, name: e.target.value })} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
                <input type="text" value={editingW.role} onChange={(e) => setEditingW({ ...editingW, role: e.target.value })} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
                <input type="text" value={editingW.bioId} onChange={(e) => setEditingW({ ...editingW, bioId: e.target.value })} placeholder="Biometric ID" className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
                <input type="tel" value={editingW.phone} onChange={(e) => setEditingW({ ...editingW, phone: e.target.value })} placeholder="Phone" className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
                <input type="number" min="0" value={editingW.dailyWage} onChange={(e) => setEditingW({ ...editingW, dailyWage: e.target.value })} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
                <label className="block cursor-pointer py-2 px-3 rounded-xl border text-xs font-bold text-center">{editingW.photo ? 'Replace Photo' : '+ Upload Photo'}<input type="file" accept="image/*" onChange={(e) => handlePhoto(e, setEditingW)} className="hidden" /></label>
                <div className="flex justify-end gap-2 pt-2"><button type="button" onClick={() => setEditingW(null)} className="px-4 py-2 rounded-xl border text-xs font-bold">Cancel</button><button type="submit" style={{ backgroundColor: 'var(--accent-primary)' }} className="px-5 py-2 rounded-xl text-white text-xs font-extrabold">Save</button></div>
              </form>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 16. SETTINGS PAGE (NO Export/Import Inventory, Dynamic Headers, Theme Suite, Masked Password Fields)
    // =========================================================================
    function SettingsPage({ labels, onSaveLabels, themeCfg, onSaveThemeCfg, nurseryProfile, onSaveProfile, staffEditWindow, onSaveEditWindow, users, onSaveUsers, currentUser, requestPin, onLogout }) {
      const [prof, setProf] = useState(nurseryProfile);
      const [winDraft, setWinDraft] = useState(staffEditWindow);
      const [lblDraft, setLblDraft] = useState(labels);
      const [tDraft, setTDraft] = useState(themeCfg);
      const [newU, setNewU] = useState({ username: '', password: '', role: 'Staff' });
      const [editUserModal, setEditUserModal] = useState(null);

      return (
        <div className="max-w-5xl space-y-6">
          <form onSubmit={(e) => { e.preventDefault(); requestPin('Confirm Profile Update', 'Enter PIN to save Nursery Profile.', () => onSaveProfile({ nurseryName: prof.nurseryName.trim() || 'Sach Nursery', ownerMobile: prof.ownerMobile.trim() })); }} className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm space-y-4">
            <h2 className="text-xl font-extrabold">1. Nursery Profile</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div><label className="block text-xs font-bold mb-1">Nursery Name *</label><input required type="text" value={prof.nurseryName} onChange={(e) => setProf({ ...prof, nurseryName: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" /></div>
              <div><label className="block text-xs font-bold mb-1">Owner Mobile Number *</label><input required type="tel" value={prof.ownerMobile} onChange={(e) => setProf({ ...prof, ownerMobile: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" /></div>
            </div>
            <button type="submit" style={{ backgroundColor: 'var(--accent-primary)' }} className="px-5 py-2.5 rounded-xl text-white text-xs font-extrabold shadow">Save Profile</button>
          </form>

          <form onSubmit={(e) => { e.preventDefault(); requestPin('Confirm Theme Update', 'Enter PIN to persist theme customization.', () => onSaveThemeCfg(tDraft)); }} className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm space-y-4">
            <h2 className="text-xl font-extrabold">2. Dynamic Theme & Login Background Suite</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
              <div>
                <label className="block text-xs font-bold mb-1">Interface Mode</label>
                <div className="flex gap-2">
                  <button type="button" onClick={() => { const next = { ...tDraft, mode: 'light' }; setTDraft(next); onSaveThemeCfg(next); }} className={`flex-1 py-2 rounded-xl text-xs font-extrabold border ${tDraft.mode === 'light' ? 'bg-slate-900 text-white' : 'bg-slate-50 dark:bg-slate-800'}`}>☀ Light</button>
                  <button type="button" onClick={() => { const next = { ...tDraft, mode: 'dark' }; setTDraft(next); onSaveThemeCfg(next); }} className={`flex-1 py-2 rounded-xl text-xs font-extrabold border ${tDraft.mode === 'dark' ? 'bg-slate-900 text-white' : 'bg-slate-50 dark:bg-slate-800'}`}>🌙 Dark</button>
                </div>
              </div>
              <div><label className="block text-xs font-bold mb-1">Primary Accent</label><div className="flex items-center gap-2"><input type="color" value={tDraft.primaryColor} onChange={(e) => setTDraft({ ...tDraft, primaryColor: e.target.value })} className="w-12 h-10 rounded-lg border cursor-pointer" /><span className="text-xs font-mono font-bold">{tDraft.primaryColor}</span></div></div>
              <div><label className="block text-xs font-bold mb-1">Secondary Accent</label><div className="flex items-center gap-2"><input type="color" value={tDraft.secondaryColor} onChange={(e) => setTDraft({ ...tDraft, secondaryColor: e.target.value })} className="w-12 h-10 rounded-lg border cursor-pointer" /><span className="text-xs font-mono font-bold">{tDraft.secondaryColor}</span></div></div>
              <div>
                <label className="block text-xs font-bold mb-1">Login Background</label>
                <select value={tDraft.loginBgType} onChange={(e) => setTDraft({ ...tDraft, loginBgType: e.target.value })} className="w-full px-3 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-xs font-bold">
                  <option value="animated-emerald">Animated Botanical Gradient</option><option value="animated-sunset">Animated Sunset Gradient</option><option value="ambient-glow">Ambient Lighting Glow</option><option value="custom-color">Custom Solid Theme</option>
                </select>
              </div>
            </div>
            {tDraft.loginBgType === 'custom-color' && <div className="flex items-center gap-3"><label className="text-xs font-bold">Custom Login Color:</label><input type="color" value={tDraft.loginCustomColor} onChange={(e) => setTDraft({ ...tDraft, loginCustomColor: e.target.value })} className="w-10 h-8 rounded border" /></div>}
            <button type="submit" style={{ backgroundColor: 'var(--accent-primary)' }} className="px-5 py-2.5 rounded-xl text-white text-xs font-extrabold shadow">Apply & Persist Theme</button>
          </form>

          <form onSubmit={(e) => { e.preventDefault(); requestPin('Authorize Header Update', 'Enter PIN to update global UI headers and labels.', () => onSaveLabels(lblDraft)); }} className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm space-y-4">
            <h2 className="text-xl font-extrabold">3. Global Dynamic Header & Label Management</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              {Object.keys(DEFAULT_LABELS).map((k) => (
                <div key={k}><label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">{k}</label><input type="text" value={lblDraft[k] || ''} onChange={(e) => setLblDraft({ ...lblDraft, [k]: e.target.value })} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-xs font-semibold" /></div>
              ))}
            </div>
            <div className="flex gap-2"><button type="submit" style={{ backgroundColor: 'var(--accent-primary)' }} className="px-5 py-2.5 rounded-xl text-white text-xs font-extrabold shadow">Update All Headers</button><button type="button" onClick={() => setLblDraft(DEFAULT_LABELS)} className="px-4 py-2.5 rounded-xl border text-xs font-bold">Reset</button></div>
          </form>

          <form onSubmit={(e) => { e.preventDefault(); requestPin('Save Edit Window', 'Enter PIN to update Staff edit window.', () => onSaveEditWindow({ value: Math.max(0, Number(winDraft.value)||0), unit: winDraft.unit })); }} className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm space-y-4">
            <h2 className="text-xl font-extrabold">4. Staff Entry Edit Time Window</h2>
            <div className="flex flex-wrap items-center gap-3">
              <input type="number" min="0" value={winDraft.value} onChange={(e) => setWinDraft({ ...winDraft, value: e.target.value })} className="w-28 px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
              <select value={winDraft.unit} onChange={(e) => setWinDraft({ ...winDraft, unit: e.target.value })} className="px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold"><option value="minutes">Minutes</option><option value="hours">Hours</option><option value="days">Days</option></select>
              <button type="submit" style={{ backgroundColor: 'var(--accent-primary)' }} className="px-5 py-2.5 rounded-xl text-white text-xs font-extrabold shadow">Save Window</button>
            </div>
          </form>

          <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm space-y-5">
            <h2 className="text-xl font-extrabold">5. User Management (Admin Exclusive)</h2>
            <div className="overflow-x-auto rounded-xl border">
              <table className="w-full text-sm">
                <thead className="bg-slate-50 dark:bg-slate-800/70 text-xs uppercase text-slate-500"><tr><th className="text-left px-4 py-2.5">Username</th><th className="text-left px-3 py-2.5">Role</th><th className="text-center px-3 py-2.5">Status</th><th className="text-right px-4 py-2.5">Actions</th></tr></thead>
                <tbody className="divide-y">{users.map((u) => (
                  <tr key={u.id}>
                    <td className="px-4 py-3 font-extrabold">{u.username} {u.isPrimary && <span className="ml-1 text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">Primary</span>}</td>
                    <td className="px-3 py-3 text-xs font-semibold">{u.role}</td>
                    <td className="px-3 py-3 text-center"><span className={`px-2.5 py-0.5 rounded-full text-[11px] font-bold ${u.active ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}`}>{u.active ? 'Active' : 'Disabled'}</span></td>

      const [purCStart, setPurCStart] = useState(daysAgoDDMMYYYY(30));
      const [purCEnd, setPurCEnd] = useState(todayDDMMYYYY());

      const saleStats = useMemo(() => {
        const list = filterRecordsByRange(sales, saleRange, todayDDMMYYYY(), saleCStart, saleCEnd);
        const todayList = sales.filter((s) => formatStrictDDMMYYYY(s.date) === todayDDMMYYYY());
        return { todayTotal: todayList.reduce((a, s) => a + s.total, 0), rangeTotal: list.reduce((a, s) => a + s.total, 0), cash: list.reduce((a, s) => a + (s.cashAmount || 0), 0), upi: list.reduce((a, s) => a + (s.upiAmount || 0), 0), count: list.length };

        return { todayCash: todayList.reduce((a, p) => a + p.total, 0), rangeCash: list.reduce((a, p) => a + p.total, 0), count: list.length };

            {/* CARD 1: Entire Card Clickable -> Inventory & Sales; Start Billing & Crop Scheduler buttons functional */}
            <div onClick={() => onNavigate('inventory-sales')} className="cursor-pointer rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 shadow-sm hover:shadow-lg hover:border-emerald-500 transition flex flex-col justify-between min-h-[240px]">
              <div className="flex items-start justify-between">
                <div style={{ backgroundColor: 'var(--accent-primary)' }} className="p-3.5 rounded-2xl text-white"><Icon name="cart" className="w-7 h-7" /></div>
                <span style={{ color: 'var(--accent-primary)' }} className="text-xs font-extrabold">Open Module →</span>
              </div>
              <div className="space-y-2 pt-4">
                <h3 className="text-xl font-extrabold">{labels.inventorySalesTitle}</h3>
                <p className="text-xs text-slate-500 dark:text-slate-400">Complete {products.length} varieties with Variants, Voice Billing & Care Details.</p>
              </div>
              <div className="flex flex-wrap gap-2 pt-4" onClick={(e) => e.stopPropagation()}>
                <button onClick={() => onNavigate('inventory-sales')} style={{ backgroundColor: 'var(--accent-primary)' }} className="px-4 py-2 rounded-xl text-white text-xs font-extrabold shadow">Start Billing</button>

              <div className="flex items-center justify-between gap-2">
                <h3 className="text-lg font-extrabold">{labels.saleSummaryCardTitle}</h3>
                <select value={saleRange} onClick={(e) => e.stopPropagation()} onChange={(e) => setSaleRange(e.target.value)} className="px-3 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-bold outline-none">
