    // Strict DD-MM-YYYY Date Engine
    const todayDDMMYYYY = () => {
      const d = new Date();
      return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
    };
    const daysAgoDDMMYYYY = (n) => {
      const d = new Date(); d.setDate(d.getDate() - n);
      return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
    };
    const parseDDMMYYYY = (str) => {
      if (!str) return null;
      const m = String(str).trim().match(/^(\d{2})-(\d{2})-(\d{4})$/);
      if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
      const iso = String(str).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
      return iso ? new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3])) : null;
    };
    const toComparableTime = (str) => { const d = parseDDMMYYYY(str); return d ? d.getTime() : 0; };
    const formatStrictDDMMYYYY = (val) => {
      if (!val) return todayDDMMYYYY();
      if (/^\d{2}-\d{2}-\d{4}$/.test(val)) return val;
      const d = parseDDMMYYYY(val) || new Date(val);
      return (!d || isNaN(d.getTime())) ? todayDDMMYYYY() : `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;

    function registerHybridSW() {
      if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;

        const C='sach-hybrid-v7';
        self.addEventListener('install',()=>self.skipWaiting());
        self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request).then(r=>{const cp=r.clone();caches.open(C).then(c=>c.put(e.request,cp)).catch(()=>{});return r;}).catch(()=>caches.match(e.request)));});

      `;
      try { navigator.serviceWorker.register(URL.createObjectURL(new Blob([code], { type: 'application/javascript' }))).catch(() => {}); } catch {}
    }

    function compressImageFile(file, maxDim = 720, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
              else { width = Math.round((width * maxDim) / height); height = maxDim; }
            }
            const c = document.createElement('canvas'); c.width = width; c.height = height;
            c.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(c.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(ev.target.result);
          img.src = ev.target.result;
        };
        r.onerror = reject; r.readAsDataURL(file);
      });
    }

    const DEV_MAP = { 'अ':'a','आ':'aa','इ':'i','ई':'ee','उ':'u','ऊ':'oo','ऋ':'ri','ए':'e','ऐ':'ai','ओ':'o','औ':'au','क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'n','च':'ch','छ':'chh','ज':'j','झ':'jh','ञ':'n','ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n','त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'ph','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','व':'v','श':'sh','ष':'sh','स':'s','ह':'h','क्ष':'ksh','त्र':'tr','ज्ञ':'gy','ड़':'d','ढ़':'dh','ज़':'z','फ़':'f','ा':'a','ि':'i','ी':'ee','ु':'u','ू':'oo','ृ':'ri','े':'e','ै':'ai','ो':'o','ौ':'au','ं':'n','ँ':'n','ः':'h','्':'' };
    const toLatin = (t = '') => [...t].map((c) => DEV_MAP[c] !== undefined ? DEV_MAP[c] : c).join('').toLowerCase();
    const normPh = (s = '') => s.toLowerCase().replace(/aa/g,'a').replace(/ee/g,'i').replace(/oo/g,'u').replace(/ph/g,'f').replace(/w/g,'v').replace(/\s+/g,' ').trim();

    function smartMatch(item, rawQ) {
      const q = (rawQ || '').trim().toLowerCase();
      if (!q) return true;
      const hay = [item.nameEn||'', item.nameHi||'', item.botanicalName||'', item.category||'', item.categoryHi||'', toLatin(item.nameHi||''), toLatin(item.categoryHi||'')].join(' ').toLowerCase();
      if (hay.includes(q)) return true;
      const nq = normPh(q), nh = normPh(hay);
      if (nh.includes(nq)) return true;
      return q.split(/\s+/).every((t) => {
        if (hay.includes(t) || nh.includes(normPh(t))) return true;
        const syns = PHONETIC_SYNONYMS[t] || PHONETIC_SYNONYMS[normPh(t)];
        return syns ? syns.some((s) => hay.includes(s.toLowerCase()) || nh.includes(normPh(s))) : false;
      });
    }

    const VOICE_STOP = new Set(['add','bill','make','invoice','karo','jodo','daalo','aur','and','plus','pieces','pcs','plant','plants','please','जोड़ो','और','दे','दो','चाहिए','का','के','की','बिल','बनाओ']);

    function parseVoiceBillingCommand(transcript, products) {
      const lower = (transcript || '').trim().toLowerCase();
      const triggerCheckout = /\b(checkout|invoice|generate bill|bill banao|बिल बनाओ|पेमेंट|payment)\b/i.test(lower);
      const clauses = lower.split(/\s*(?:,|and|aur|और|\+)\s*/i).filter(Boolean);
      const matchedItems = [], unmatched = [];
      clauses.forEach((cl) => {
        const tokens = cl.replace(/[।.!?]/g, ' ').split(/\s+/).filter(Boolean);
        let qty = 1; const qTokens = [];
        tokens.forEach((tk) => {
          if (/^\d+$/.test(tk)) qty = Math.max(1, parseInt(tk, 10));
          else if (WORD_NUMS[tk] !== undefined) qty = WORD_NUMS[tk];
          else if (!VOICE_STOP.has(tk)) qTokens.push(tk);
        });
        const cq = qTokens.join(' ').trim();
        if (!cq) return;
        let best = products.find((p) => (p.nameHi && p.nameHi.toLowerCase() === cq) || p.nameEn.toLowerCase() === cq) || products.find((p) => smartMatch(p, cq));
        if (!best && qTokens.length > 1) { for (const tk of qTokens) { best = products.find((p) => smartMatch(p, tk)); if (best) break; } }
        if (best) matchedItems.push({ product: best, qty });
        else unmatched.push(cl);
      });
      return { matchedItems, unmatched, triggerCheckout };
    }

          if (Math.abs(y - lastY) > 6) {

          }

        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return scrollDir;

    function getPlantCare(prod) {
      const p = prod || {};
      const base = PLANT_CARE_PROFILES[p.careId] || PLANT_CARE_PROFILES['pc-rose'];
      if (p.customCare && (p.customCare.care || p.customCare.season || p.customCare.water)) {
        return {
          botanical: p.botanicalName || base.botanical,
          season: p.customCare.season || base.season, soil: p.customCare.soil || base.soil,
          water: p.customCare.water || base.water, sunlight: p.customCare.sunlight || base.sunlight,
          fertilizer: p.customCare.fertilizer || base.fertilizer, care: p.customCare.care || base.care,
          source: p.customCare.source || base.source
        };
      }
      return base;
    }

    async function compileAndSharePDF({ title, subtitle, rows, columns, fileName }) {
      const W = 1240, H = 1754, padX = 50, perPage = 28;
      const pages = [];
      const totalPages = Math.max(1, Math.ceil((rows.length || 1) / perPage));
      for (let pg = 0; pg < totalPages; pg++) {
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#047857'; ctx.fillRect(0, 0, W, 130);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 34px "Plus Jakarta Sans","Noto Sans Devanagari",sans-serif';
        ctx.fillText(title, padX, 58);
        ctx.fillStyle = '#d1fae5'; ctx.font = '600 18px "Plus Jakarta Sans","Noto Sans Devanagari",sans-serif';
        ctx.fillText(`${subtitle}  •  Date: ${todayDDMMYYYY()}  •  Page ${pg + 1}/${totalPages}`, padX, 98);

        let y = 165;
        ctx.fillStyle = '#ecfdf5'; ctx.fillRect(padX, y, W - padX * 2, 44);
        ctx.fillStyle = '#065f46'; ctx.font = 'bold 16px "Plus Jakarta Sans","Noto Sans Devanagari",sans-serif';
        const colW = (W - padX * 2) / Math.max(1, columns.length);
        columns.forEach((col, ci) => ctx.fillText(String(col.label).slice(0, 26), padX + 10 + ci * colW, y + 28));
        y += 52;
        rows.slice(pg * perPage, (pg + 1) * perPage).forEach((row, ri) => {
          ctx.fillStyle = ri % 2 === 0 ? '#ffffff' : '#f8fafc';
          ctx.fillRect(padX, y - 8, W - padX * 2, 46);
          ctx.fillStyle = '#0f172a'; ctx.font = '500 14px "Plus Jakarta Sans","Noto Sans Devanagari",sans-serif';
          columns.forEach((col, ci) => ctx.fillText(String(row[col.key] ?? '').slice(0, 32), padX + 10 + ci * colW, y + 20));
          y += 48;
        });
        pages.push(c.toDataURL('image/jpeg', 0.9));
      }

      if (window.jspdf?.jsPDF) {
        const doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
        const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
        pages.forEach((im, idx) => { if (idx > 0) doc.addPage(); doc.addImage(im, 'JPEG', 0, 0, pw, ph); });
        const blob = doc.output('blob');
        doc.save(fileName);
        const file = new File([blob], fileName, { type: 'application/pdf' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ title, text: subtitle, files: [file] }); } catch {}
        }
        return { fileName, summaryText: `${title}\n${subtitle}\nDate: ${todayDDMMYYYY()}\nFile: ${fileName}` };
      }
      window.print();
      return { fileName, summaryText: `${title}\n${subtitle}` };
    }

    function exportExcelFile(rows, fileBase) {
      if (!rows.length) { alert('No records to export.'); return null; }
      const fn = `${fileBase}.xlsx`;
      if (window.XLSX) {
        const ws = window.XLSX.utils.json_to_sheet(rows), wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, 'Data');
        window.XLSX.writeFile(wb, fn);
      } else {
        const hdr = Object.keys(rows[0]);
        const csv = [hdr.join(','), ...rows.map((r) => hdr.map((h) => `"${String(r[h] ?? '').replace(/"/g, '""')}"`).join(','))].join('\n');
        const l = document.createElement('a');
        l.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        l.download = `${fileBase}.csv`; l.click();
      }
      return { fileName: fn, summaryText: `${fileBase} exported (${todayDDMMYYYY()} • ${rows.length} rows).` };
    }

    async function parseExcelFile(file) {
      const buf = await file.arrayBuffer();
      if (window.XLSX) {
        const wb = window.XLSX.read(buf, { type: 'array' });
        return window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
      }
      const lines = new TextDecoder().decode(buf).split(/\r?\n/).filter(Boolean);
      if (lines.length < 2) return [];
      const hdr = lines[0].split(',').map((h) => h.replace(/^"|"$/g, '').trim());
      return lines.slice(1).map((line) => {
        const vals = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];
        const obj = {}; hdr.forEach((h, i) => { obj[h] = (vals[i] || '').replace(/^"|"$/g, '').replace(/""/g, '"'); });
        return obj;
      });
    }

    function buildWhatsAppBillPayload(sale, nurseryProfile, products) {
      const nName = nurseryProfile?.nurseryName || 'Sach Nursery';
      const oMobile = nurseryProfile?.ownerMobile || '';
      const lines = [
        `*${nName}* — Official Invoice`,
        oMobile ? `Helpline: ${oMobile}` : '',
        `Invoice: *${sale.id}* | Date: ${formatStrictDDMMYYYY(sale.date)} ${sale.time || ''}`,
        `Customer: ${sale.customer || 'Walk-in Customer'}${sale.customerMobile ? ` (${sale.customerMobile})` : ''}`,
        `--------------------------------`,
        `*Purchased Items:*`
      ].filter(Boolean);
      sale.items.forEach((it, idx) => {
        const vLbl = it.variantLabel ? ` [${it.variantLabel}]` : '';
        lines.push(`${idx + 1}. ${it.nameEn}${vLbl} x ${it.qty} ${it.unit||'pcs'} = Rs.${Math.round(it.qty * it.price)}`);
      });
      lines.push(`--------------------------------`, `Subtotal: Rs.${sale.subtotal}`);
      if (sale.discountAmount > 0) lines.push(`Discount: -Rs.${sale.discountAmount}`);
      lines.push(`*Net Paid: Rs.${sale.total}* (Cash: Rs.${sale.cashAmount} | UPI: Rs.${sale.upiAmount})`);
      const tracked = sale.items.filter((i) => !i.isNonInventory);
      if (tracked.length > 0) {
        lines.push('', `🌱 *पौधों की देखभाल और रखरखाव के निर्देश:*`);
        tracked.forEach((it) => {
          const prod = products.find((p) => p.id === it.productId);
          const care = getPlantCare(prod);
          lines.push(`\n*• ${it.nameHi || it.nameEn}* (${care.botanical})`);
          lines.push(`  📅 मौसम: ${care.season}`);
          lines.push(`  🪴 मिट्टी: ${care.soil}`);
          lines.push(`  💧 पानी: ${care.water}`);
          lines.push(`  ☀️ धूप: ${care.sunlight}`);
          lines.push(`  🧪 खाद: ${care.fertilizer}`);
          lines.push(`  🌿 देखभाल: ${care.care}`);
          lines.push(`  📚 Source: ${care.source}`);
        });
      }
      lines.push(`\nThank you for shopping with *${nName}*!`);
      const text = lines.join('\n');
      const d = (sale.customerMobile || '').replace(/\D/g, '');
      return { text, url: d.length >= 10 ? `https://wa.me/${d.length === 10 ? '91' + d : d}?text=${encodeURIComponent(text)}` : '' };
    }

    // =========================================================================
    // 6. LOGIN SCREEN (ONLY place with Password Visibility Eye Toggle, Blank Inputs by Default)
    // =========================================================================
    function LoginScreen({ nurseryProfile, themeCfg, users, onLogin }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPwd, setShowPwd] = useState(false); // Exclusively on Login Screen
      const [error, setError] = useState('');

      const bgStyle = useMemo(() => {
        if (themeCfg.loginBgType === 'animated-sunset') return { backgroundImage: 'linear-gradient(-45deg, #4c1d95, #be185d, #b45309, #065f46)' };
        if (themeCfg.loginBgType === 'ambient-glow') return { background: `radial-gradient(circle at 25% 20%, ${themeCfg.primaryColor}55, transparent 45%), radial-gradient(circle at 80% 80%, ${themeCfg.secondaryColor}66, #020617 70%)` };
        if (themeCfg.loginBgType === 'custom-color') return { backgroundColor: themeCfg.loginCustomColor || '#064e3b' };
        return { backgroundImage: `linear-gradient(-45deg, #022c22, ${themeCfg.primaryColor}, ${themeCfg.secondaryColor}, #0f172a)` };
      }, [themeCfg]);

      const submit = (e) => {
        e.preventDefault();
        const found = (users || DEFAULT_USERS).find((u) => u.active && u.username.trim() === username.trim() && u.password === password);
        if (found) onLogin(found);
        else setError('Invalid credentials or inactive account.');
      };

      return (
        <div style={bgStyle} className="min-h-screen flex items-center justify-center p-4 bg-aurora transition-all duration-500">
          <div className="w-full max-w-md rounded-3xl bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl shadow-2xl p-8 border border-white/20 text-slate-900 dark:text-slate-100">
            <div className="flex flex-col items-center text-center mb-6">
              <SachLogo className="w-20 h-24 mb-2 drop-shadow-md" />
              <h1 className="text-2xl font-extrabold">{nurseryProfile.nurseryName} ERP</h1>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">नर्सरी प्रबंधन प्रणाली • Offline-First Hybrid Suite</p>
            </div>
            <form onSubmit={submit} className="space-y-4">
              <div>
                <label className="block text-sm font-bold mb-1">Username</label>
                <input type="text" required value={username} onChange={(e) => { setUsername(e.target.value); setError(''); }} className="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 outline-none" />
              </div>
              <div>
                <label className="block text-sm font-bold mb-1">Password</label>
                <div className="relative">
                  <input type={showPwd ? 'text' : 'password'} required value={password} onChange={(e) => { setPassword(e.target.value); setError(''); }} className="w-full px-4 pr-11 py-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 outline-none" />
                  <button type="button" onClick={() => setShowPwd((v) => !v)} className="absolute right-3 top-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" aria-label="Toggle password visibility">
                    <Icon name={showPwd ? 'eyeOff' : 'eye'} className="w-5 h-5" />
                  </button>
                </div>
              </div>
              {error && <div className="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 text-xs font-bold">{error}</div>}
              <button type="submit" style={{ backgroundColor: themeCfg.primaryColor }} className="w-full py-3.5 rounded-xl text-white font-extrabold shadow-lg hover:opacity-95">Sign In</button>
            </form>
          </div>
        </div>
      );
    }

              <div><h3 className="text-lg font-extrabold">{product.nameHi || product.nameEn}</h3><p className="text-xs opacity-90">{product.nameEn} • {care.botanical}</p></div>
              <button onClick={onClose} className="p-2 rounded-xl hover:bg-black/15"><Icon name="close" className="w-5 h-5" /></button>
            </div>
            <div className="p-6 flex flex-col sm:flex-row gap-6 max-h-[80vh] overflow-y-auto">
              {/* Side-by-side Full Image using object-fit: contain */}
              <div className="sm:w-5/12 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-3 flex items-center justify-center min-h-[220px]">
                {product.image ? (
                  <img src={product.image} alt={product.nameEn} className="w-full h-60 object-contain rounded-xl" />

                  <Icon name="leaf" className="w-16 h-16 text-slate-400" />

              <div className="sm:w-7/12 space-y-2.5 text-xs">
                <div className="flex flex-wrap gap-2 pb-1">
                  <span className="px-2.5 py-1 rounded-lg bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 font-bold">{product.categoryHi} ({product.category})</span>
                </div>
                <div className="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900"><strong>📅 रोपण का मौसम:</strong> <span className="block mt-0.5">{care.season}</span></div>
                <div className="p-2.5 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900"><strong>🪴 मिट्टी:</strong> <span className="block mt-0.5">{care.soil}</span></div>
                <div className="p-2.5 rounded-xl bg-sky-50 dark:bg-sky-950/40 border border-sky-200 dark:border-sky-900"><strong>💧 पानी:</strong> <span className="block mt-0.5">{care.water}</span></div>
                <div className="p-2.5 rounded-xl bg-yellow-50 dark:bg-yellow-950/40 border border-yellow-200 dark:border-yellow-900"><strong>☀️ धूप:</strong> <span className="block mt-0.5">{care.sunlight}</span></div>
                <div className="p-2.5 rounded-xl bg-purple-50 dark:bg-purple-950/40 border border-purple-200 dark:border-purple-900"><strong>🧪 खाद:</strong> <span className="block mt-0.5">{care.fertilizer}</span></div>
                <div className="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"><strong>🌿 देखभाल:</strong> <span className="block mt-0.5">{care.care}</span></div>
                <p className="text-[10px] text-slate-500 dark:text-slate-400 pt-1">Official Source: {care.source}</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function DynamicPriceFreeCatalogView({ products, nurseryProfile, onExit }) {
      const [search, setSearch] = useState('');
      const [catFilter, setCatFilter] = useState('ALL');
      const [detailProd, setDetailProd] = useState(null);
      const scrollDir = useScrollDirection();

      const inStock = useMemo(() => {
        return products.filter((p) => {
          const totalStk = (p.variants || []).reduce((s, v) => s + Number(v.stock || 0), 0) || Number(p.stock || 0);
          return totalStk > 0 && (catFilter === 'ALL' || p.category === catFilter) && smartMatch(p, search);
        });
      }, [products, search, catFilter]);

      return (
        <div className="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
          <header style={{ backgroundColor: 'var(--accent-primary)' }} className="sticky top-0 z-30 text-white px-4 sm:px-8 py-4 shadow flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-3"><SachLogo className="w-10 h-12" /><div><h1 className="text-xl font-extrabold">{nurseryProfile.nurseryName} • उपलब्ध पौधे (Price-Free Live Catalog)</h1><p className="text-xs opacity-90">Available Varieties: {inStock.length} • Date: {todayDDMMYYYY()}</p></div></div>
            {onExit && <button onClick={onExit} className="px-4 py-2 rounded-xl bg-white text-slate-900 font-extrabold text-xs">← Back</button>}
          </header>
          <div className="max-w-7xl mx-auto p-4 sm:p-6 space-y-5">
            <div className={`${scrollDir === 'up' ? 'sticky top-20 z-20' : 'relative'} flex flex-wrap gap-3 bg-white dark:bg-slate-900 p-4 rounded-2xl border shadow-sm`}>
              <div className="relative flex-1 min-w-[220px]"><Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" /><input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search plants, varieties, or categories..." className="w-full pl-10 pr-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm outline-none" /></div>
              <select value={catFilter} onChange={(e) => setCatFilter(e.target.value)} className="px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold"><option value="ALL">All Available</option>{CATEGORIES.map((c) => <option key={c.en} value={c.en}>{c.hi}</option>)}</select>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3.5">
              {inStock.map((p) => {
                const care = getPlantCare(p);
                return (
                  <div key={p.id} onClick={() => setDetailProd(p)} className="cursor-pointer rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
                    <div className="h-28 bg-slate-100 dark:bg-slate-800 overflow-hidden">{p.image && <img src={p.image} alt={p.nameEn} className="w-full h-full object-cover" loading="lazy" />}</div>
                    <div className="p-3 flex-1 flex flex-col justify-between space-y-1.5">
                      <div><span className="text-[10px] font-bold text-emerald-700 dark:text-emerald-400 block truncate">{p.categoryHi}</span><h4 className="font-extrabold text-sm leading-snug">{p.nameHi || p.nameEn}</h4><p className="text-[11px] italic text-slate-500 dark:text-slate-400 truncate">{care.botanical}</p></div>
