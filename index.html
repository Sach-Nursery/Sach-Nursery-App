    const idb = {
      open() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      },
      async get(key) {
        try {
          const db = await this.open();
          return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
          });
        } catch {
          const raw = localStorage.getItem('sach4_' + key);
          return raw ? JSON.parse(raw) : null;
        }
      },
      async set(key, value) {
        try {
          const db = await this.open();
          return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(value, key);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          });
        } catch {
          try { localStorage.setItem('sach4_' + key, JSON.stringify(value)); } catch {}
          return false;
        }
      }
    };

    function compressImageFile(file, maxDim = 720, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
              else { width = Math.round((width * maxDim) / height); height = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(ev.target.result);
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

      'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'n','च':'ch','छ':'chh','ज':'j','झ':'jh','ञ':'n',

    function transliterateHindiToHinglish(text = '') {
      let out = '';
      for (let i = 0; i < text.length; i++) out += DEVANAGARI_MAP[text[i]] !== undefined ? DEVANAGARI_MAP[text[i]] : text[i];
      return out.toLowerCase();
    }

    function normalizePhonetic(str = '') {
      return str.toLowerCase().replace(/aa/g, 'a').replace(/ee/g, 'i').replace(/oo/g, 'u').replace(/ph/g, 'f').replace(/w/g, 'v').replace(/\s+/g, ' ').trim();
    }

    function smartMatch(item, rawQuery) {
      const q = (rawQuery || '').trim().toLowerCase();
      if (!q) return true;
      const haystack = [
        item.nameEn || '', item.nameHi || '', item.category || '', item.categoryHi || '',
        transliterateHindiToHinglish(item.nameHi || ''), transliterateHindiToHinglish(item.categoryHi || '')
      ].join(' ').toLowerCase();
      if (haystack.includes(q)) return true;
      const normQ = normalizePhonetic(q), normHay = normalizePhonetic(haystack);
      if (normHay.includes(normQ)) return true;
      return q.split(/\s+/).every((tok) => {
        if (haystack.includes(tok) || normHay.includes(normalizePhonetic(tok))) return true;
        const syns = HINGLISH_SYNONYMS[tok] || HINGLISH_SYNONYMS[normalizePhonetic(tok)];
        return syns ? syns.some((s) => haystack.includes(s.toLowerCase()) || normHay.includes(normalizePhonetic(s))) : false;
      });
    }

    function buildWhatsAppBillPayload(sale, nurseryProfile, products, plantCareDb) {
      const nName = nurseryProfile?.nurseryName || 'Sach Nursery';
      const oMobile = nurseryProfile?.ownerMobile || '';

      const lines = [
        `🌿 *${nName}* — Digital Bill`,
        oMobile ? `📞 Nursery Helpline: ${oMobile}` : '',
        `🧾 Invoice: *${sale.id}* | Date: ${sale.date} ${sale.time || ''}`,
        `👤 Customer: ${sale.customer} (${sale.customerMobile})`,
        `────────────────────`,
        `*Billed Items:*`
      ].filter(Boolean);

      sale.items.forEach((it, idx) => {
        const tag = it.isNonInventory ? ' [Loose/Open Item]' : '';
        lines.push(`${idx + 1}. ${it.nameEn}${it.nameHi && !it.isNonInventory ? ` (${it.nameHi})` : ''}${tag} × ${it.qty} = ₹${it.qty * it.price}`);
      });

      lines.push(`────────────────────`);
      lines.push(`Subtotal: ₹${sale.subtotal}`);
      if (sale.discountAmount > 0) lines.push(`Discount: -₹${sale.discountAmount}`);
      lines.push(`*Net Paid: ₹${sale.total}* (Cash: ₹${sale.cashAmount} | UPI: ₹${sale.upiAmount})`);

      const trackedItems = sale.items.filter((i) => !i.isNonInventory);
      if (trackedItems.length > 0) {
        lines.push(``);
        lines.push(`🌱 *Tailored Care & Maintenance Guide:*`);
        trackedItems.forEach((it) => {
          const prod = products.find((p) => p.id === it.productId);
          const care = (prod?.customCare && (prod.customCare.care || prod.customCare.water))
            ? prod.customCare
            : plantCareDb.find((c) => c.id === prod?.careId) || PREDEFINED_PLANT_CARE.find((c) => c.id === prod?.careId);
          if (care) {
            lines.push(`\n*• ${it.nameEn}*`);
            if (care.season) lines.push(`  📅 Season: ${care.season}`);
            if (care.water) lines.push(`  💧 Water: ${care.water}`);
            if (care.sunlight) lines.push(`  ☀️ Sun: ${care.sunlight}`);
            if (care.fertilizer) lines.push(`  🧪 Fertilizer: ${care.fertilizer}`);
            if (care.care) lines.push(`  🪴 Care: ${care.care}`);
          }
        });
      }

      lines.push(`\nThank you for choosing *${nName}*! 🙏`);
      const text = lines.join('\n');
      const digits = (sale.customerMobile || '').replace(/\D/g, '');
      const waNumber = digits.length === 10 ? '91' + digits : digits;
      return { text, url: `https://wa.me/${waNumber}?text=${encodeURIComponent(text)}` };
    }

    function exportInventoryToExcel(products, plantCareDb, nurseryName) {
      const rows = products.map((p) => {
        const care = p.customCare || plantCareDb.find((c) => c.id === p.careId) || PREDEFINED_PLANT_CARE.find((c) => c.id === p.careId) || {};
        return {
          id: p.id,
          nameEn: p.nameEn,
          nameHi: p.nameHi || '',
          category: p.category,
          categoryHi: p.categoryHi || '',
          price: p.price,
          stock: p.stock,
          threshold: p.threshold,
          image: p.image || '',
          careId: p.careId || '',
          season: care.season || '',
          care: care.care || '',
          water: care.water || '',
          sunlight: care.sunlight || '',
          fertilizer: care.fertilizer || ''
        };
      });

      const fileBase = `${(nurseryName || 'Sach-Nursery').replace(/\s+/g, '-')}-Inventory-${todayStr()}`;
      if (window.XLSX) {
        const ws = window.XLSX.utils.json_to_sheet(rows);
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, 'Inventory');
        window.XLSX.writeFile(wb, `${fileBase}.xlsx`);
      } else {
        const headers = Object.keys(rows[0] || {});
        const csv = [headers.join(','), ...rows.map((r) => headers.map((h) => `"${String(r[h] ?? '').replace(/"/g, '""')}"`).join(','))].join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${fileBase}.csv`;
        link.click();
      }
    }

    async function parseInventoryExcelFile(file) {
      const buf = await file.arrayBuffer();
      if (window.XLSX) {
        const wb = window.XLSX.read(buf, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        return window.XLSX.utils.sheet_to_json(ws, { defval: '' });
      }
      // Fallback simple CSV parse if XLSX offline
      const text = new TextDecoder().decode(buf);
      const lines = text.split(/\r?\n/).filter(Boolean);
      if (lines.length < 2) return [];
      const headers = lines[0].split(',').map((h) => h.replace(/^"|"$/g, '').trim());
      return lines.slice(1).map((line) => {
        const vals = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];
        const obj = {};
        headers.forEach((h, i) => { obj[h] = (vals[i] || '').replace(/^"|"$/g, '').replace(/""/g, '"'); });
        return obj;
      });
    }

                <input type="password" required value={password} onChange={(e) => { setPassword(e.target.value); setError(''); }} placeholder="••••••••" className="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 outline-none font-medium" />
              </div>
              {error && <div className="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 text-rose-700 dark:text-rose-300 text-sm font-semibold">{error}</div>}
              <button type="submit" className="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-base shadow-lg">Sign In</button>
            </form>
          </div>
        </div>
      );
    }

    // 7. CUSTOMER CATALOG QR MODAL, CUSTOMER VIEW & FULL-SCREEN QR SCANNER
    // =========================================================================
    function CustomerCatalogQRModal({ isOpen, onClose, productCount, nurseryProfile, onOpenCustomerPreview }) {
      const canvasRef = useRef(null);
      const [customUrl, setCustomUrl] = useState('');
      const catalogUrl = useMemo(() => customUrl.trim() || `${window.location.href.split('#')[0]}#customer-catalog`, [customUrl]);

      useEffect(() => {
        if (isOpen && canvasRef.current && window.QRCode) window.QRCode.toCanvas(canvasRef.current, catalogUrl, { width: 240, margin: 2 }, () => {});
      }, [isOpen, catalogUrl]);

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-[80] flex items-center justify-center bg-slate-950/75 backdrop-blur-sm p-4">
          <div className="w-full max-w-lg rounded-3xl bg-white dark:bg-slate-900 border shadow-2xl overflow-hidden">
            <div className="px-6 py-4 bg-emerald-600 text-white flex items-center justify-between">
              <div><h3 className="text-lg font-extrabold">{nurseryProfile?.nurseryName} — Customer Catalog QR</h3><p className="text-xs text-emerald-100">Scan to view {productCount} plant varieties & care</p></div>
              <button onClick={onClose} className="p-2 rounded-xl hover:bg-emerald-700"><Icon name="close" className="w-5 h-5" /></button>
            </div>
            <div className="p-6 text-center space-y-5">
              <div className="inline-block p-4 rounded-2xl bg-white border-2 border-emerald-200 shadow-inner"><canvas ref={canvasRef} /></div>
              <input type="text" value={customUrl} onChange={(e) => setCustomUrl(e.target.value)} placeholder={catalogUrl} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-xs font-mono" />
              <div className="flex flex-wrap justify-center gap-2.5">
                <button onClick={() => { if (!canvasRef.current) return; const l = document.createElement('a'); l.download = 'Catalog-QR.png'; l.href = canvasRef.current.toDataURL('image/png'); l.click(); }} className="px-4 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">Download QR PNG</button>
                <button onClick={() => window.print()} className="px-4 py-2.5 rounded-xl bg-slate-900 dark:bg-slate-700 text-white text-xs font-extrabold">Print Poster</button>
                <button onClick={() => { onClose(); onOpenCustomerPreview(); }} className="flex items-center gap-1.5 px-4 py-2.5 rounded-xl border border-emerald-600 text-emerald-700 dark:text-emerald-400 text-xs font-extrabold"><Icon name="external" className="w-3.5 h-3.5" /> Preview Customer Catalog</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function CustomerFacingCatalogView({ products, plantCareDb, nurseryProfile, onExitPreview }) {

      const [expandedCareId, setExpandedCareId] = useState(null);

      const filtered = useMemo(() => products.filter((p) => (catFilter === 'ALL' || p.category === catFilter) && smartMatch(p, search)), [products, search, catFilter]);
      const getCare = (p) => p.customCare || plantCareDb.find((c) => c.id === p.careId) || PREDEFINED_PLANT_CARE.find((c) => c.id === p.careId) || null;

        <div className="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
          <header className="sticky top-0 z-30 bg-emerald-700 text-white px-4 sm:px-8 py-4 shadow-md flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <div className="p-2 rounded-xl bg-white/15"><Icon name="leaf" className="w-6 h-6" /></div>
              <div><h1 className="text-xl font-extrabold">{nurseryProfile?.nurseryName} • Customer Catalog</h1><p className="text-xs text-emerald-100">{products.length} Varieties {nurseryProfile?.ownerMobile ? `• 📞 ${nurseryProfile.ownerMobile}` : ''}</p></div>
