    const idb = {
      open: () => new Promise((res, rej) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => { if (!e.target.result.objectStoreNames.contains(STORE_NAME)) e.target.result.createObjectStore(STORE_NAME); };
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      }),
      async get(k) {
        try {
          const db = await this.open();
          return new Promise((res) => {
            const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get(k);
            req.onsuccess = () => res(req.result);
            req.onerror = () => res(null);
          });
        } catch {
          const raw = localStorage.getItem('sach_' + k);
          return raw ? JSON.parse(raw) : null;
        }
      },
      async set(k, v) {
        try {
          const db = await this.open();
          return new Promise((res) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(v, k);
            tx.oncomplete = () => res(true);
            tx.onerror = () => res(false);
          });
        } catch {
          try { localStorage.setItem('sach_' + k, JSON.stringify(v)); } catch {}
          return false;
        }
      }
    };

    function compressImageFile(file, maxDim = 720, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
              else { width = Math.round((width * maxDim) / height); height = maxDim; }
            }
            const c = document.createElement('canvas');
            c.width = width; c.height = height;
            c.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(c.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(ev.target.result);
          img.src = ev.target.result;
        };
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    const toHinglish = (t = '') => [...t].map((c) => DEV_MAP[c] !== undefined ? DEV_MAP[c] : c).join('').toLowerCase();
    const normPh = (s = '') => s.toLowerCase().replace(/aa/g,'a').replace(/ee/g,'i').replace(/oo/g,'u').replace(/ph/g,'f').replace(/w/g,'v').replace(/\s+/g,' ').trim();

    function smartMatch(item, rawQ) {
      const q = (rawQ || '').trim().toLowerCase();
      if (!q) return true;
      const hay = [item.nameEn||'', item.nameHi||'', item.category||'', item.categoryHi||'', toHinglish(item.nameHi||''), toHinglish(item.categoryHi||'')].join(' ').toLowerCase();
      if (hay.includes(q)) return true;
      const nq = normPh(q), nh = normPh(hay);
      if (nh.includes(nq)) return true;
      return q.split(/\s+/).every((t) => {
        if (hay.includes(t) || nh.includes(normPh(t))) return true;
        const syns = HINGLISH_SYNONYMS[t] || HINGLISH_SYNONYMS[normPh(t)];
        return syns ? syns.some((s) => hay.includes(s.toLowerCase()) || nh.includes(normPh(s))) : false;
      });
    }

    // 4. WHATSAPP BILL & EXCEL HELPERS
    function buildWhatsAppBillPayload(sale, nurseryProfile, products, plantCareDb) {
      const nName = nurseryProfile?.nurseryName || 'Sach Nursery';
      const oMobile = nurseryProfile?.ownerMobile || '';
      const lines = [
        `🌿 *${nName}* — Digital Bill`,
        oMobile ? `📞 Helpline: ${oMobile}` : '',
        `🧾 Invoice: *${sale.id}* | Date: ${sale.date} ${sale.time || ''}`,
        `👤 Customer: ${sale.customer} (${sale.customerMobile})`,
        `────────────────────`,
        `*Billed Items:*`
      ].filter(Boolean);
      sale.items.forEach((it, idx) => {
        lines.push(`${idx + 1}. ${it.nameEn}${it.isNonInventory ? ' [Open Item]' : (it.nameHi ? ` (${it.nameHi})` : '')} × ${it.qty} = ₹${it.qty * it.price}`);
      });
      lines.push(`────────────────────`, `Subtotal: ₹${sale.subtotal}`);
      if (sale.discountAmount > 0) lines.push(`Discount: -₹${sale.discountAmount}`);
      lines.push(`*Net Paid: ₹${sale.total}* (Cash: ₹${sale.cashAmount} | UPI: ₹${sale.upiAmount})`);
      const tracked = sale.items.filter((i) => !i.isNonInventory);
      if (tracked.length > 0) {
        lines.push('', `🌱 *Tailored Plant Care & Maintenance:*`);
        tracked.forEach((it) => {
          const prod = products.find((p) => p.id === it.productId);
          const care = (prod?.customCare && (prod.customCare.care || prod.customCare.water)) ? prod.customCare : plantCareDb.find((c) => c.id === prod?.careId) || PREDEFINED_PLANT_CARE.find((c) => c.id === prod?.careId);
          if (care) {
            lines.push(`\n*• ${it.nameEn}*`);
            if (care.season) lines.push(`  📅 Season: ${care.season}`);
            if (care.water) lines.push(`  💧 Water: ${care.water}`);
            if (care.sunlight) lines.push(`  ☀️ Sun: ${care.sunlight}`);
            if (care.fertilizer) lines.push(`  🧪 Fertilizer: ${care.fertilizer}`);
            if (care.care) lines.push(`  🪴 Care: ${care.care}`);
          }
        });
      }
      lines.push(`\nThank you for choosing *${nName}*! 🙏`);
      const text = lines.join('\n');
      const d = (sale.customerMobile || '').replace(/\D/g, '');
      return { text, url: `https://wa.me/${d.length === 10 ? '91' + d : d}?text=${encodeURIComponent(text)}` };
    }

    function exportInventoryToExcel(products, plantCareDb, nurseryName) {
      const rows = products.map((p) => {
        const c = p.customCare || plantCareDb.find((x) => x.id === p.careId) || PREDEFINED_PLANT_CARE.find((x) => x.id === p.careId) || {};
        return { id: p.id, nameEn: p.nameEn, nameHi: p.nameHi||'', category: p.category, categoryHi: p.categoryHi||'', price: p.price, stock: p.stock, threshold: p.threshold, image: p.image||'', careId: p.careId||'', season: c.season||'', care: c.care||'', water: c.water||'', sunlight: c.sunlight||'', fertilizer: c.fertilizer||'' };
      });
      const base = `${(nurseryName || 'Sach-Nursery').replace(/\s+/g, '-')}-Inventory-${todayStr()}`;
      if (window.XLSX) {
        const ws = window.XLSX.utils.json_to_sheet(rows), wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, 'Inventory');
        window.XLSX.writeFile(wb, `${base}.xlsx`);
      } else {
        const hdr = Object.keys(rows[0] || {});
        const csv = [hdr.join(','), ...rows.map((r) => hdr.map((h) => `"${String(r[h] ?? '').replace(/"/g, '""')}"`).join(','))].join('\n');
        const l = document.createElement('a');
        l.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        l.download = `${base}.csv`;
        l.click();
      }
    }

    async function parseInventoryExcelFile(file) {
      const buf = await file.arrayBuffer();
      if (window.XLSX) {
        const wb = window.XLSX.read(buf, { type: 'array' });
        return window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
      }
      const lines = new TextDecoder().decode(buf).split(/\r?\n/).filter(Boolean);
      if (lines.length < 2) return [];
      const hdr = lines[0].split(',').map((h) => h.replace(/^"|"$/g, '').trim());
      return lines.slice(1).map((line) => {
        const vals = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];
        const obj = {};
        hdr.forEach((h, i) => { obj[h] = (vals[i] || '').replace(/^"|"$/g, '').replace(/""/g, '"'); });
        return obj;
      });
    }

        setCamOn(false);
      };
      useEffect(() => { if (!isOpen) stopCam(); return () => stopCam(); }, [isOpen]);

      const startCam = async () => {
        setCamErr('');
        if (!window.Html5Qrcode) { setCamErr('QR camera library unavailable offline.'); return; }
        try {
          const qr = new window.Html5Qrcode('qr-reader-region');
          qrRef.current = qr;
          await qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 240, height: 240 } }, (txt) => handlePayload(txt), () => {});
          setCamOn(true);
        } catch { setCamErr('Camera unavailable or denied. Use Quick Lookup.'); setCamOn(false); }
      };

      const handlePayload = (txt) => {
        const clean = txt.replace('SACH-PLANT:', '').trim();
        const f = products.find((p) => p.id === clean || p.nameEn.toLowerCase() === clean.toLowerCase());
        if (f) setScannedIds((prev) => prev.includes(f.id) ? prev : [f.id, ...prev]);
      };

      const getCare = (p) => (p.customCare && (p.customCare.care || p.customCare.season)) ? p.customCare : plantCareDb.find((c) => c.id === p.careId) || PREDEFINED_PLANT_CARE.find((c) => c.id === p.careId) || null;
      if (!isOpen) return null;

      const scanned = scannedIds.map((id) => products.find((p) => p.id === id)).filter(Boolean).filter((p) => smartMatch(p, filter));
      const quick = products.filter((p) => smartMatch(p, filter)).slice(0, 60);

      return (
        <div className="fixed inset-0 z-50 bg-slate-50 dark:bg-slate-950 flex flex-col overflow-hidden">
          <div className="flex flex-wrap items-center justify-between gap-3 px-6 py-4 bg-white dark:bg-slate-900 border-b shadow-sm">
            <div className="flex items-center gap-3">
              <div className="p-2.5 rounded-xl bg-emerald-600 text-white"><Icon name="qr" className="w-6 h-6" /></div>
              <div><h2 className="text-xl font-extrabold">QR Plant Scanner • क्यूआर स्कैनर</h2><p className="text-xs text-slate-500">ONLY Photo, Name & Category • Check card for Plant Care</p></div>
            </div>
            <div className="flex items-center gap-2">
              {!camOn ? <button onClick={startCam} className="px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold text-sm">Start Camera</button>
                : <button onClick={stopCam} className="px-4 py-2 rounded-xl bg-amber-600 text-white font-bold text-sm">Stop Camera</button>}
              <button onClick={() => setScannedIds(products.map((p) => p.id))} className="px-4 py-2 rounded-xl bg-slate-800 text-white font-bold text-sm">Load All ({products.length})</button>
              <button onClick={onClose} className="p-2.5 rounded-xl border"><Icon name="close" className="w-5 h-5" /></button>
            </div>
          </div>
          <div className="flex-1 overflow-y-auto p-6 space-y-6">
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="rounded-2xl bg-white dark:bg-slate-900 border p-4 flex flex-col items-center justify-center min-h-[190px]">
                <div id="qr-reader-region" className="w-full max-w-[260px] rounded-xl overflow-hidden" />
                {!camOn && <div className="text-center space-y-2 py-4"><Icon name="qr" className="w-10 h-10 mx-auto text-emerald-600 opacity-80" /><p className="text-xs text-slate-500">Start camera or select items</p>{camErr && <p className="text-xs text-amber-600">{camErr}</p>}</div>}
              </div>
              <div className="lg:col-span-2 rounded-2xl bg-white dark:bg-slate-900 border p-5 space-y-3">
                <div className="relative"><Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" /><input type="text" value={filter} onChange={(e) => setFilter(e.target.value)} placeholder="Search English / Hindi / Hinglish..." className="w-full pl-10 pr-4 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
                <div className="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto">{quick.map((p) => <button key={p.id} onClick={() => handlePayload(p.id)} className={`px-2.5 py-1 rounded-lg text-[11px] font-semibold border ${scannedIds.includes(p.id) ? 'bg-emerald-600 text-white' : 'bg-slate-50 dark:bg-slate-800'}`}>{p.nameEn} • {p.nameHi}</button>)}</div>
              </div>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
              {scanned.map((item) => {
                const checked = !!checkedMap[item.id], care = getCare(item);
                return (
                  <div key={item.id} className="rounded-xl bg-white dark:bg-slate-900 border shadow-sm overflow-hidden flex flex-col">
                    {item.image && <div className="h-32 bg-slate-100 dark:bg-slate-800 overflow-hidden"><img src={item.image} alt={item.nameEn} className="w-full h-full object-cover" /></div>}
                    <div className="p-3 flex-1 flex flex-col justify-between space-y-2.5">
                      <div><span className="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 mb-1">{item.category}</span><h4 className="text-xs font-extrabold">{item.nameEn}</h4>{item.nameHi && <p className="text-[11px] text-slate-500">{item.nameHi}</p>}</div>
                      <label className="flex items-center gap-2 pt-2 border-t cursor-pointer"><input type="checkbox" checked={checked} onChange={() => setCheckedMap((prev) => ({ ...prev, [item.id]: !prev[item.id] }))} className="w-3.5 h-3.5 accent-emerald-600" /><span className="text-[11px] font-bold text-emerald-700 dark:text-emerald-400">Show Plant Care</span></label>
                      {checked && (care ? <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/40 text-[10px] space-y-1"><p><strong>Season:</strong> {care.season}</p><p><strong>Care:</strong> {care.care}</p><p><strong>Water:</strong> {care.water}</p><p><strong>Sun:</strong> {care.sunlight}</p><p><strong>Fertilizer:</strong> {care.fertilizer}</p></div> : <div className="p-2 rounded-lg bg-rose-50 text-[10px] text-rose-700">No care profile.</div>)}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // 8. CENTRAL CHECKOUT & WHATSAPP DISPATCH
    function CentralCheckoutModal({ isOpen, cart, setCart, products, onClose, onConfirmSale }) {
      const [customer, setCustomer] = useState('Walk-in Customer');
      const [customerMobile, setCustomerMobile] = useState('');
      const [mobileError, setMobileError] = useState('');
      const [discountType, setDiscountType] = useState('flat');
      const [discountValue, setDiscountValue] = useState(0);
      const [payMode, setPayMode] = useState('split');
      const [cashAmount, setCashAmount] = useState(0);
      const [upiAmount, setUpiAmount] = useState(0);
      const [openForm, setOpenForm] = useState({ nameEn: '', price: '', qty: 1 });

      const cartDetailed = useMemo(() => cart.map((c) => {
        if (c.isNonInventory) return { ...c, id: c.cartKey };
        const p = products.find((x) => x.id === c.productId);
        return p ? { ...p, cartKey: c.cartKey || p.id, isNonInventory: false, qty: c.qty } : null;
      }).filter(Boolean), [cart, products]);

      const subtotal = useMemo(() => cartDetailed.reduce((s, i) => s + i.price * i.qty, 0), [cartDetailed]);
      const discountAmount = useMemo(() => {
        const v = Math.max(0, Number(discountValue) || 0);
        return discountType === 'percent' ? Math.min(subtotal, Math.round((subtotal * Math.min(100, v)) / 100)) : Math.min(subtotal, v);
      }, [subtotal, discountType, discountValue]);
      const netTotal = Math.max(0, subtotal - discountAmount);

      useEffect(() => {
        if (!isOpen) return;
        setMobileError('');
        if (payMode === 'cash') { setCashAmount(netTotal); setUpiAmount(0); }
        else if (payMode === 'upi') { setCashAmount(0); setUpiAmount(netTotal); }
        else { setCashAmount((prev) => { const c = Math.min(netTotal, Math.max(0, Number(prev) || 0)); setUpiAmount(netTotal - c); return c; }); }
      }, [netTotal, payMode, isOpen]);

      if (!isOpen) return null;

      const updateQty = (key, q) => {
        const n = parseInt(q, 10);
        if (isNaN(n) || n <= 0) setCart((prev) => prev.filter((c) => (c.cartKey || c.productId) !== key));
        else setCart((prev) => prev.map((c) => ((c.cartKey || c.productId) === key ? { ...c, qty: n } : c)));
      };

      const addOpenInside = () => {
        if (!openForm.nameEn.trim() || Number(openForm.price) <= 0) return;
        setCart((prev) => [...prev, { cartKey: 'open-' + Date.now() + '-' + Math.random().toString(36).slice(2,5), isNonInventory: true, nameEn: openForm.nameEn.trim(), nameHi: 'गैर-स्टॉक खुला आइटम', category: 'Open Item (Non-Inventory)', price: Math.max(0, Number(openForm.price)||0), qty: Math.max(1, parseInt(openForm.qty,10)||1) }]);
        setOpenForm({ nameEn: '', price: '', qty: 1 });
      };

      const submitSale = () => {
        if (!cartDetailed.length) return;
        const d = customerMobile.replace(/\D/g, '');
        if (d.length < 10) { setMobileError('Mandatory: Enter a valid 10-digit customer mobile number for WhatsApp billing.'); return; }
        onConfirmSale({ customer: customer.trim() || 'Walk-in Customer', customerMobile: d, items: cartDetailed.map((i) => ({ productId: i.isNonInventory ? i.cartKey : i.id, isNonInventory: !!i.isNonInventory, nameEn: i.nameEn, nameHi: i.nameHi, category: i.category, qty: i.qty, price: i.price })), subtotal, discountType, discountValue: Number(discountValue)||0, discountAmount, total: netTotal, cashAmount, upiAmount });
        setCustomerMobile('');
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 backdrop-blur-sm p-4">
          <div className="w-full max-w-2xl rounded-3xl bg-white dark:bg-slate-900 border shadow-2xl overflow-hidden flex flex-col max-h-[92vh]">
            <div className="flex items-center justify-between px-6 py-4 bg-emerald-600 text-white">
              <div><h3 className="text-lg font-extrabold">POS Checkout & WhatsApp Dispatch</h3><p className="text-xs text-emerald-100">Dynamic Qty • Non-Inventory Open Items • Mandatory Mobile • Cash & UPI Split</p></div>
              <button onClick={onClose} className="p-2 rounded-xl hover:bg-emerald-700"><Icon name="close" className="w-5 h-5" /></button>
            </div>
            <div className="p-6 overflow-y-auto space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label className="block text-xs font-bold uppercase text-slate-500 mb-1">Customer Name</label><input type="text" value={customer} onChange={(e) => setCustomer(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold" /></div>
                <div><label className="block text-xs font-bold uppercase text-slate-500 mb-1">Customer Mobile (WhatsApp) *</label><input type="tel" required value={customerMobile} onChange={(e) => { setCustomerMobile(e.target.value); setMobileError(''); }} placeholder="10-digit mobile number" className={`w-full px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold outline-none ${mobileError ? 'border-rose-500 ring-2 ring-rose-500/20' : ''}`} /></div>
              </div>
              {mobileError && <p className="text-xs font-bold text-rose-600 -mt-2">{mobileError}</p>}

              <div className="p-3 rounded-2xl bg-sky-50 dark:bg-sky-950/30 border border-sky-200 dark:border-sky-900 flex flex-wrap items-center gap-2">
                <span className="text-[11px] font-extrabold text-sky-800 dark:text-sky-300 w-full">Quick Add Non-Inventory Open Item (Soil / Loose Materials — No Stock Impact):</span>
                <input type="text" placeholder="Item (e.g. Loose Soil)" value={openForm.nameEn} onChange={(e) => setOpenForm({ ...openForm, nameEn: e.target.value })} className="flex-1 min-w-[150px] px-3 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs" />
                <input type="number" min="1" placeholder="Rate ₹" value={openForm.price} onChange={(e) => setOpenForm({ ...openForm, price: e.target.value })} className="w-20 px-2.5 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs font-bold" />
                <input type="number" min="1" placeholder="Qty" value={openForm.qty} onChange={(e) => setOpenForm({ ...openForm, qty: e.target.value })} className="w-16 px-2 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs font-bold text-center" />
                <button type="button" onClick={addOpenInside} className="px-3 py-1.5 rounded-lg bg-sky-600 text-white text-xs font-extrabold">+ Add Open</button>
              </div>

              <div className="rounded-2xl border overflow-hidden max-h-48 overflow-y-auto">
                <table className="w-full text-sm">
                  <thead className="bg-slate-100 dark:bg-slate-800 text-xs uppercase text-slate-500"><tr><th className="text-left px-4 py-2">Item</th><th className="text-center px-2 py-2">Qty</th><th className="text-right px-3 py-2">Rate</th><th className="text-right px-4 py-2">Amount</th></tr></thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {cartDetailed.length === 0 ? <tr><td colSpan="4" className="p-6 text-center text-xs text-slate-400">Cart is empty.</td></tr> : cartDetailed.map((i) => (
                      <tr key={i.cartKey}>
                        <td className="px-4 py-2 font-semibold"><div>{i.nameEn} {i.isNonInventory && <span className="px-1.5 py-0.5 rounded bg-sky-100 text-sky-700 text-[9px] font-extrabold">Open</span>}</div>{i.nameHi && <div className="text-[11px] text-slate-500">{i.nameHi}</div>}</td>
                        <td className="px-2 py-2"><div className="flex items-center justify-center gap-1"><button type="button" onClick={() => updateQty(i.cartKey, i.qty - 1)} className="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 font-extrabold">-</button><input type="number" min="1" value={i.qty} onChange={(e) => updateQty(i.cartKey, e.target.value)} className="w-12 py-1 text-center rounded-lg border bg-white dark:bg-slate-900 font-bold text-xs" /><button type="button" onClick={() => updateQty(i.cartKey, i.qty + 1)} className="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 font-extrabold">+</button></div></td>
                        <td className="text-right px-3 py-2">₹{i.price}</td>
                        <td className="text-right px-4 py-2 font-bold">₹{i.price * i.qty}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div className="rounded-2xl bg-slate-50 dark:bg-slate-800/60 p-4 border space-y-2">
                <div className="flex flex-wrap items-center justify-between gap-3"><span className="text-sm font-bold">Total Bill Discount</span><div className="flex gap-2"><select value={discountType} onChange={(e) => setDiscountType(e.target.value)} className="px-3 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-sm font-semibold"><option value="flat">Flat ₹</option><option value="percent">Percent %</option></select><input type="number" min="0" value={discountValue} onChange={(e) => setDiscountValue(e.target.value)} className="w-24 px-3 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-sm font-bold text-right" /></div></div>
                <div className="flex justify-between text-sm"><span>Subtotal</span><span className="font-semibold">₹{subtotal.toLocaleString()}</span></div>
                <div className="flex justify-between text-sm text-rose-600"><span>Bill Discount</span><span className="font-semibold">- ₹{discountAmount.toLocaleString()}</span></div>
                <div className="flex justify-between text-lg font-extrabold pt-2 border-t"><span>Net Payable</span><span className="text-emerald-600">₹{netTotal.toLocaleString()}</span></div>
              </div>

              <div className="space-y-3">
                <label className="block text-xs font-bold uppercase text-slate-500">Payment (Cash & UPI Only)</label>
                <div className="grid grid-cols-3 gap-2.5">{[{ id:'cash', label:'100% Cash' }, { id:'upi', label:'100% UPI' }, { id:'split', label:'Split (Cash + UPI)' }].map((m) => <button key={m.id} type="button" onClick={() => setPayMode(m.id)} className={`py-2.5 px-3 rounded-xl text-xs font-extrabold border ${payMode === m.id ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 dark:bg-slate-800'}`}>{m.label}</button>)}</div>
                <div className="grid grid-cols-2 gap-4">
                  <div><label className="block text-xs font-bold mb-1">Cash (₹)</label><input type="number" min="0" max={netTotal} disabled={payMode === 'upi'} value={cashAmount} onChange={(e) => { const c = Math.min(netTotal, Math.max(0, Number(e.target.value)||0)); setCashAmount(c); setUpiAmount(netTotal - c); }} className="w-full px-4 py-2 rounded-xl border bg-white dark:bg-slate-800 font-bold disabled:opacity-50" /></div>
                  <div><label className="block text-xs font-bold mb-1">UPI (₹)</label><input type="number" min="0" max={netTotal} disabled={payMode === 'cash'} value={upiAmount} onChange={(e) => { const u = Math.min(netTotal, Math.max(0, Number(e.target.value)||0)); setUpiAmount(u); setCashAmount(netTotal - u); }} className="w-full px-4 py-2 rounded-xl border bg-white dark:bg-slate-800 font-bold disabled:opacity-50" /></div>
                </div>
              </div>
            </div>
            <div className="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t flex justify-end gap-3">
              <button onClick={onClose} className="px-5 py-2.5 rounded-xl border font-bold text-sm">Cancel</button>
              <button onClick={submitSale} disabled={!cartDetailed.length} className="flex items-center gap-2 px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm shadow-lg disabled:opacity-50"><Icon name="whatsapp" className="w-4 h-4" /><span>Complete Sale & Send WhatsApp Bill (₹{netTotal.toLocaleString()})</span></button>
            </div>
          </div>
        </div>
      );
    }

    function WhatsAppDispatchModal({ dispatchInfo, onClose }) {
      const [copied, setCopied] = useState(false);
      if (!dispatchInfo) return null;
      return (
        <div className="fixed inset-0 z-[95] flex items-center justify-center bg-slate-950/75 backdrop-blur-sm p-4">
          <div className="w-full max-w-lg rounded-3xl bg-white dark:bg-slate-900 border shadow-2xl overflow-hidden">
            <div className="px-6 py-4 bg-emerald-600 text-white flex items-center justify-between">
              <div><h3 className="text-lg font-extrabold">Bill Saved & WhatsApp Message Ready</h3><p className="text-xs text-emerald-100">Tailored care instructions attached</p></div>
              <button onClick={onClose} className="p-2 rounded-xl hover:bg-emerald-700"><Icon name="close" className="w-5 h-5" /></button>
            </div>
            <div className="p-6 space-y-4">
              <pre className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border text-xs whitespace-pre-wrap max-h-64 overflow-y-auto font-sans">{dispatchInfo.text}</pre>
              <div className="flex flex-wrap gap-2.5 justify-end">
                <button onClick={() => { navigator.clipboard?.writeText(dispatchInfo.text); setCopied(true); setTimeout(() => setCopied(false), 2000); }} className="px-4 py-2.5 rounded-xl border text-xs font-extrabold">{copied ? '✓ Copied' : 'Copy Message'}</button>
                <a href={dispatchInfo.url} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold shadow"><Icon name="whatsapp" className="w-4 h-4" /> Open WhatsApp & Send</a>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 9. CATALOG & POS BILLING
    function CatalogAndPOSPage({ mode, products, cart, setCart, onOpenCheckout, onOpenCustomerQR }) {
      const [search, setSearch] = useState('');
      const [cat, setCat] = useState('ALL');
      const [visible, setVisible] = useState(24);
      const [qtyMap, setQtyMap] = useState({});
      const [showOpen, setShowOpen] = useState(mode === 'pos');
      const [openItem, setOpenItem] = useState({ nameEn: '', price: '', qty: 1 });
      const sentinelRef = useRef(null);

      const filtered = useMemo(() => products.filter((p) => (cat === 'ALL' || p.category === cat) && smartMatch(p, search)), [products, search, cat]);
      useEffect(() => { setVisible(24); }, [search, cat, mode]);
      useEffect(() => {
        const el = sentinelRef.current; if (!el) return;
        const obs = new IntersectionObserver((e) => { if (e[0].isIntersecting && visible < filtered.length) setVisible((v) => Math.min(filtered.length, v + 24)); }, { rootMargin: '220px' });
        obs.observe(el); return () => obs.disconnect();
      }, [visible, filtered.length]);

      const vis = filtered.slice(0, visible);
      const grouped = useMemo(() => {
        const m = {};
        vis.forEach((p) => { if (!m[p.category]) m[p.category] = { category: p.category, categoryHi: p.categoryHi, items: [] }; m[p.category].items.push(p); });
        return Object.values(m);
      }, [vis]);

      const addToCart = (p) => {
        const q = Math.max(1, parseInt(qtyMap[p.id] || '1', 10) || 1);
        setCart((prev) => {
          const ex = prev.find((c) => !c.isNonInventory && c.productId === p.id);
          return ex ? prev.map((c) => !c.isNonInventory && c.productId === p.id ? { ...c, qty: c.qty + q } : c) : [...prev, { cartKey: p.id, productId: p.id, isNonInventory: false, qty: q }];
        });
        setQtyMap((prev) => ({ ...prev, [p.id]: '' }));
      };

      const addOpen = (e) => {
        e.preventDefault();
        if (!openItem.nameEn.trim() || Number(openItem.price) <= 0) return;
        setCart((prev) => [...prev, { cartKey: 'open-' + Date.now() + '-' + Math.random().toString(36).slice(2,5), isNonInventory: true, nameEn: openItem.nameEn.trim(), nameHi: 'गैर-स्टॉक खुला आइटम', category: 'Open Item (Non-Inventory)', price: Math.max(0, Number(openItem.price)||0), qty: Math.max(1, parseInt(openItem.qty,10)||1) }]);
        setOpenItem({ nameEn: '', price: '', qty: 1 });
      };

      const cartCount = cart.reduce((s, c) => s + c.qty, 0);
      const cartTotal = cart.reduce((s, c) => s + (c.isNonInventory ? c.price * c.qty : (products.find((x) => x.id === c.productId)?.price || 0) * c.qty), 0);

      return (
        <div className="space-y-5">
          <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm">
            <div><h2 className="text-2xl font-extrabold">{mode === 'pos' ? 'Sales & POS Billing • बिक्री व बिलिंग' : 'Inventory & Catalog • नर्सरी कैटलॉग'}</h2><p className="text-xs text-slate-500">Showing {vis.length} of {filtered.length} ({products.length} total) • EN / HI / Hinglish</p></div>
            <div className="flex flex-wrap items-center gap-2.5">
              <div className="relative flex-1 min-w-[220px]"><Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" /><input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search: Gulab, गुलाब, Mango..." className="w-full pl-10 pr-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm outline-none" /></div>
              <button onClick={() => setShowOpen((v) => !v)} className="px-4 py-2.5 rounded-xl bg-sky-50 dark:bg-sky-950/50 text-sky-700 dark:text-sky-300 border border-sky-200 font-bold text-xs">+ Non-Inventory Open Item</button>

    // 10. PASSWORD-PROTECTED STOCK ADJUSTMENT MODULE
    function StockAdjustmentModule({ products, adjustments, onAddAdjustment, onUpdateAdjustment, requestAuth }) {
      const [form, setForm] = useState({ productId: products[0]?.id || '', type: 'Free Sample', qty: 1, reason: '', date: todayStr() });
      const [editId, setEditId] = useState(null);
      const [draft, setDraft] = useState({ qty: 1, reason: '' });

      const submit = (e) => {
        e.preventDefault();
        const prod = products.find((p) => p.id === form.productId);
        if (!prod || Number(form.qty) <= 0) return;
        requestAuth('Authorize Stock Adjustment', `Enter password to record "${form.type}" (${form.qty} × ${prod.nameEn}).`, () => {
          onAddAdjustment({ id: 'ADJ-' + Date.now().toString().slice(-5), date: form.date, productId: prod.id, productName: `${prod.nameEn} / ${prod.nameHi}`, type: form.type, qty: Number(form.qty), reason: form.reason.trim() || form.type, locked: true });
          setForm((p) => ({ ...p, qty: 1, reason: '' }));
        });
      };

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div><h2 className="text-2xl font-extrabold">Stock Adjustments • स्टॉक समायोजन</h2><p className="text-xs text-slate-500">Password-protected recording & locked ledger for Free Samples and Stock Loss</p></div>
            <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-amber-50 dark:bg-amber-950/50 text-amber-700 border border-amber-200 text-xs font-extrabold"><Icon name="shield" className="w-4 h-4" /> Password Protected</span>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <form onSubmit={submit} className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-4 h-fit">
              <h3 className="font-extrabold text-lg">Record Free Sample / Stock Loss</h3>
              <select value={form.productId} onChange={(e) => setForm({ ...form, productId: e.target.value })} className="w-full px-3 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold">{products.map((p) => <option key={p.id} value={p.id}>{p.nameEn} ({p.nameHi}) — Stock: {p.stock}</option>)}</select>
              <select value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })} className="w-full px-3 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold"><option>Free Sample</option><option>Free Sales / Donation</option><option>Stock Loss / Damage</option></select>
              <div className="grid grid-cols-2 gap-3"><input type="number" min="1" value={form.qty} onChange={(e) => setForm({ ...form, qty: e.target.value })} className="px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" /><input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className="px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold" /></div>
              <input type="text" value={form.reason} onChange={(e) => setForm({ ...form, reason: e.target.value })} placeholder="Reason / Notes" className="w-full px-3 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <button type="submit" className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold text-sm"><Icon name="lock" className="w-4 h-4" /> Authorize & Save</button>
            </form>
            <div className="lg:col-span-2 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm divide-y divide-slate-100 dark:divide-slate-800">
              {adjustments.map((a) => {
                const isEd = editId === a.id && !a.locked;
                return (
                  <div key={a.id} className="p-4 flex flex-wrap items-center justify-between gap-4">
                    <div className="space-y-1 flex-1 min-w-[200px]">
                      <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full mr-2 ${a.type.includes('Loss') ? 'bg-rose-100 text-rose-700' : 'bg-sky-100 text-sky-700'}`}>{a.type}</span>
                      <span className="text-xs text-slate-400">{a.date}</span>
                      <div className="font-extrabold text-sm">{a.productName}</div>
                      {isEd ? (
                        <div className="flex flex-wrap gap-2 pt-2">
                          <input type="number" min="1" value={draft.qty} onChange={(e) => setDraft({ ...draft, qty: Number(e.target.value) })} className="w-20 px-2 py-1 rounded-lg border bg-slate-50 dark:bg-slate-800 text-xs font-bold" />
                          <input type="text" value={draft.reason} onChange={(e) => setDraft({ ...draft, reason: e.target.value })} className="flex-1 px-2 py-1 rounded-lg border bg-slate-50 dark:bg-slate-800 text-xs" />
                          <button onClick={() => { onUpdateAdjustment({ ...a, qty: draft.qty, reason: draft.reason, locked: true }); setEditId(null); }} className="px-3 py-1 rounded-lg bg-emerald-600 text-white text-xs font-bold">Save & Lock</button>
                        </div>
                      ) : <p className="text-xs text-slate-500">Qty: <strong>{a.qty}</strong> • {a.reason}</p>}
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => a.locked ? requestAuth('Unlock Adjustment', 'Enter password to unlock entry.', () => onUpdateAdjustment({ ...a, locked: false })) : (onUpdateAdjustment({ ...a, locked: true }), setEditId(null))} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold border ${a.locked ? 'bg-amber-50 border-amber-300 text-amber-700' : 'bg-emerald-50 border-emerald-300 text-emerald-700'}`}><Icon name={a.locked ? 'lock' : 'unlock'} className="w-3.5 h-3.5" />{a.locked ? 'Locked' : 'Unlocked'}</button>
                      {!a.locked && !isEd && <button onClick={() => { setEditId(a.id); setDraft({ qty: a.qty, reason: a.reason }); }} className="px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold">Edit</button>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // 11. PURCHASES & FULL CRUD STOCK MANAGEMENT
    function PurchasesPage({ products, onRecordPurchase }) {
      const [search, setSearch] = useState('');
      const [supplier, setSupplier] = useState('Local Wholesale Nursery');
      const [billNo, setBillNo] = useState('');
      const [date, setDate] = useState(todayStr());

      const sel = useMemo(() => Object.entries(draft).filter(([, v]) => Number(v.qty) > 0).map(([id, v]) => {
        const p = products.find((x) => x.id === id);
        return p ? { productId: id, nameEn: p.nameEn, nameHi: p.nameHi, category: p.category, qty: Number(v.qty), costPrice: Number(v.costPrice) || Math.round(p.price * 0.55) } : null;
      }).filter(Boolean), [draft, products]);
      const total = sel.reduce((s, i) => s + i.qty * i.costPrice, 0);

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-4">

              <button onClick={() => { if (!sel.length) return; onRecordPurchase({ date, supplier: supplier.trim() || 'Wholesale Nursery', billNo: billNo.trim() || `BILL-${Date.now().toString().slice(-4)}`, items: sel, total }); setDraft({}); setBillNo(''); }} disabled={!sel.length} className="px-6 py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold text-sm shadow disabled:opacity-40">Save Purchase ({sel.length} items • ₹{total.toLocaleString()})</button>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
              <input type="text" value={supplier} onChange={(e) => setSupplier(e.target.value)} placeholder="Supplier Name" className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold" />
              <input type="text" value={billNo} onChange={(e) => setBillNo(e.target.value)} placeholder="Bill No." className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold" />
              <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold" />
              <div className="relative"><Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" /><input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Filter plants..." className="w-full pl-10 pr-3 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
            </div>
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3.5">
            {filtered.map((it) => {
              const e = draft[it.id] || { qty: '', costPrice: Math.round(it.price * 0.55) };
              return (
                <div key={it.id} className={`rounded-xl bg-white dark:bg-slate-900 border overflow-hidden flex flex-col ${Number(e.qty) > 0 ? 'border-emerald-500 ring-2 ring-emerald-500/20' : ''}`}>
                  <div className="h-24 bg-slate-100 dark:bg-slate-800 overflow-hidden">{it.image && <img src={it.image} alt={it.nameEn} className="w-full h-full object-cover" loading="lazy" />}</div>
                  <div className="p-3 space-y-2 flex-1 flex flex-col justify-between">

                    <div className="grid grid-cols-2 gap-1.5 pt-1.5 border-t"><input type="number" min="0" placeholder="Qty" value={e.qty} onChange={(ev) => setDraft((p) => ({ ...p, [it.id]: { ...e, qty: ev.target.value } }))} className="w-full px-2 py-1 rounded-lg border bg-slate-50 dark:bg-slate-800 text-xs font-bold" /><input type="number" min="0" value={e.costPrice} onChange={(ev) => setDraft((p) => ({ ...p, [it.id]: { ...e, costPrice: ev.target.value } }))} className="w-full px-2 py-1 rounded-lg border bg-slate-50 dark:bg-slate-800 text-xs font-bold" /></div>
                  </div>
                </div>

            })}

                    <div><label className="block text-xs font-bold mb-1">Name (EN) *</label><input required type="text" value={editing.nameEn} onChange={(e) => setEditing({ ...editing, nameEn: e.target.value })} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold" /></div>

    // 12. SUMMARY REPORTS, WORKERS, STRICT PLANT CARE DB & BILL GALLERY
    function SummaryReportPage({ type, records }) {
      const isSale = type === 'sale';
      const [mode, setMode] = useState('single');
      const [singleDate, setSingleDate] = useState(todayStr());
      const [cStart, setCStart] = useState(daysAgoStr(30));
      const [cEnd, setCEnd] = useState(todayStr());

      const { filtered, isSingle } = useMemo(() => {
        if (mode === 'single') return { isSingle: true, filtered: records.filter((r) => r.date === singleDate) };
        const now = new Date();
        let s = '1970-01-01', e = '2999-12-31';
        if (mode === '1m') { const d = new Date(now); d.setMonth(d.getMonth() - 1); s = d.toISOString().slice(0, 10); }
        else if (mode === '3m') { const d = new Date(now); d.setMonth(d.getMonth() - 3); s = d.toISOString().slice(0, 10); }
        else if (mode === '6m') { const d = new Date(now); d.setMonth(d.getMonth() - 6); s = d.toISOString().slice(0, 10); }
        else if (mode === '1y') { const d = new Date(now); d.setFullYear(d.getFullYear() - 1); s = d.toISOString().slice(0, 10); }
        else if (mode === 'custom') { s = cStart; e = cEnd; }
        return { isSingle: false, filtered: records.filter((r) => r.date >= s && r.date <= e) };
      }, [records, mode, singleDate, cStart, cEnd]);

      const agg = useMemo(() => {
        const byI = {}, byC = {}; let qty = 0;
        filtered.forEach((rec) => (rec.items || []).forEach((it) => {
          const v = isSale ? it.qty * it.price : it.qty * it.costPrice; qty += it.qty;
          if (!byI[it.productId]) byI[it.productId] = { nameEn: it.nameEn, nameHi: it.nameHi, category: it.category || 'Other', qty: 0, amount: 0 };
          byI[it.productId].qty += it.qty; byI[it.productId].amount += v;
          const cat = it.category || 'Other';
          if (!byC[cat]) byC[cat] = { category: cat, qty: 0, amount: 0 };
          byC[cat].qty += it.qty; byC[cat].amount += v;
        }));
        return { items: Object.values(byI).sort((a, b) => b.amount - a.amount), categories: Object.values(byC).sort((a, b) => b.amount - a.amount), qty };
      }, [filtered, isSale]);

      const totalVal = filtered.reduce((s, r) => s + (r.total || 0), 0);

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div><h2 className="text-2xl font-extrabold">{isSale ? 'Sale Summary • बिक्री सारांश' : 'Purchase Summary • खरीद सारांश'}</h2><p className="text-xs text-slate-500">{isSingle ? 'Single Day: Detailed transactions' : 'Multi-Day: Aggregated by item & category'}</p></div>
              <div className="px-4 py-2 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 border text-right"><div className="text-[11px] font-bold uppercase text-emerald-700">Total ({filtered.length})</div><div className="text-xl font-extrabold text-emerald-700">₹{totalVal.toLocaleString()}</div></div>
            </div>
            <div className="flex flex-wrap items-center gap-2 pt-2">
              {[{id:'single',l:'Single Day'},{id:'1m',l:'1 Month'},{id:'3m',l:'3 Months'},{id:'6m',l:'6 Months'},{id:'1y',l:'1 Year'},{id:'all',l:'All Time'},{id:'custom',l:'Custom'}].map((p) => <button key={p.id} onClick={() => setMode(p.id)} className={`px-3.5 py-2 rounded-xl text-xs font-extrabold border ${mode === p.id ? 'bg-emerald-600 text-white' : 'bg-slate-50 dark:bg-slate-800'}`}>{p.l}</button>)}
              {mode === 'single' && <input type="date" value={singleDate} onChange={(e) => setSingleDate(e.target.value)} className="ml-2 px-3 py-1.5 rounded-xl border bg-white dark:bg-slate-800 text-xs font-bold" />}
              {mode === 'custom' && <div className="flex items-center gap-2 ml-2"><input type="date" value={cStart} onChange={(e) => setCStart(e.target.value)} className="px-3 py-1.5 rounded-xl border bg-white dark:bg-slate-800 text-xs font-bold" /><span className="text-xs">to</span><input type="date" value={cEnd} onChange={(e) => setCEnd(e.target.value)} className="px-3 py-1.5 rounded-xl border bg-white dark:bg-slate-800 text-xs font-bold" /></div>}
            </div>
          </div>

          {isSingle ? (
            <div className="space-y-4">
              {!filtered.length ? <div className="rounded-2xl border-2 border-dashed p-12 text-center text-slate-500">No records on {singleDate}.</div> : filtered.map((rec) => (
                <div key={rec.id} className="bg-white dark:bg-slate-900 rounded-2xl border p-5 shadow-sm space-y-3">
                  <div className="flex flex-wrap justify-between gap-2 pb-3 border-b">
                    <div><span className="text-xs font-extrabold px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 mr-2">{rec.id}</span><span className="font-extrabold">{isSale ? rec.customer : rec.supplier}</span><span className="text-xs text-slate-400 ml-2">{rec.date} • {rec.time||''}</span></div>
                    <div className="text-right"><div className="text-lg font-extrabold text-emerald-600">₹{rec.total.toLocaleString()}</div>{isSale && <div className="text-[11px] text-slate-500">Cash: ₹{rec.cashAmount} | UPI: ₹{rec.upiAmount}</div>}</div>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">{rec.items.map((it, idx) => <div key={idx} className="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 flex justify-between text-xs"><div><div className="font-bold">{it.nameEn}</div><div className="text-slate-500">{it.nameHi}</div></div><div className="font-bold">{it.qty} × ₹{isSale ? it.price : it.costPrice}</div></div>)}</div>
                </div>
              ))}
            </div>
          ) : (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="bg-white dark:bg-slate-900 rounded-2xl border shadow-sm overflow-hidden h-fit"><div className="p-4 border-b font-extrabold">By Category</div><table className="w-full text-sm"><thead className="bg-slate-50 dark:bg-slate-800/60 text-xs uppercase text-slate-500"><tr><th className="text-left px-4 py-2">Category</th><th className="text-center px-3 py-2">Qty</th><th className="text-right px-4 py-2">Total</th></tr></thead><tbody className="divide-y">{agg.categories.map((c) => <tr key={c.category}><td className="px-4 py-3 font-bold">{c.category}</td><td className="px-3 py-3 text-center">{c.qty}</td><td className="px-4 py-3 text-right font-extrabold text-emerald-600">₹{c.amount.toLocaleString()}</td></tr>)}</tbody></table></div>
              <div className="lg:col-span-2 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm overflow-hidden"><div className="p-4 border-b flex justify-between"><span className="font-extrabold">By Item</span><span className="text-xs font-bold text-slate-500">Units: {agg.qty}</span></div><div className="overflow-x-auto"><table className="w-full text-sm"><thead className="bg-slate-50 dark:bg-slate-800/60 text-xs uppercase text-slate-500"><tr><th className="text-left px-4 py-2">Item</th><th className="text-left px-4 py-2">Category</th><th className="text-center px-3 py-2">Qty</th><th className="text-right px-4 py-2">Value</th></tr></thead><tbody className="divide-y">{agg.items.map((it, i) => <tr key={i}><td className="px-4 py-3"><div className="font-extrabold">{it.nameEn}</div><div className="text-xs text-slate-500">{it.nameHi}</div></td><td className="px-4 py-3 text-xs text-slate-500">{it.category}</td><td className="px-3 py-3 text-center font-bold">{it.qty}</td><td className="px-4 py-3 text-right font-extrabold text-emerald-600">₹{it.amount.toLocaleString()}</td></tr>)}</tbody></table></div></div>
            </div>
          )}
        </div>
      );
    }

    function WorkersAttendancePage({ workers, onAddWorker, attendance, onSetAttendance }) {
      const [date, setDate] = useState(todayStr());
      const [newW, setNewW] = useState({ name: '', nameHi: '', role: 'Gardener / माली', phone: '', dailyWage: 500 });
      const dayRec = attendance[date] || {}, month = date.slice(0, 7);
      const getM = (id, wage) => {
        let p = 0, h = 0;
        Object.entries(attendance).forEach(([d, m]) => { if (d.startsWith(month)) { if (m[id] === 'Present') p++; else if (m[id] === 'Half-Day') h++; } });
        return { p, h, pay: (p + h * 0.5) * wage };
      };
      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm flex flex-wrap items-center justify-between gap-4"><div><h2 className="text-2xl font-extrabold">Workers & Attendance • कर्मचारी व उपस्थिति</h2><p className="text-xs text-slate-500">Daily roll call & monthly wages</p></div><input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" /></div>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm divide-y">
              {workers.map((w) => {
                const st = dayRec[w.id] || 'Unmarked', m = getM(w.id, w.dailyWage);
                return (
                  <div key={w.id} className="p-4 flex flex-wrap items-center justify-between gap-4">
                    <div><div className="font-extrabold">{w.name} {w.nameHi && <span className="text-sm text-slate-500">({w.nameHi})</span>}</div><div className="text-xs text-slate-500">{w.role} • ₹{w.dailyWage}/day • {month}: <strong>{m.p}P/{m.h}H</strong> (₹{m.pay})</div></div>
                    <div className="flex gap-1.5">{['Present','Half-Day','Absent'].map((opt) => <button key={opt} onClick={() => onSetAttendance(date, w.id, opt)} className={`px-3 py-1.5 rounded-xl text-xs font-extrabold border ${st === opt ? (opt==='Present'?'bg-emerald-600 text-white':opt==='Half-Day'?'bg-amber-500 text-white':'bg-rose-600 text-white') : 'bg-slate-50 dark:bg-slate-800'}`}>{opt}</button>)}</div>
                  </div>
                );
              })}
            </div>
            <form onSubmit={(e) => { e.preventDefault(); if (!newW.name.trim()) return; onAddWorker({ ...newW, id:'w-'+Date.now(), dailyWage:Number(newW.dailyWage)||500 }); setNewW({ name:'', nameHi:'', role:'Gardener / माली', phone:'', dailyWage:500 }); }} className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-3 h-fit">
              <h3 className="font-extrabold text-lg">Add Worker</h3>
              <input required type="text" placeholder="Name (EN) *" value={newW.name} onChange={(e) => setNewW({ ...newW, name: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <input type="text" placeholder="Name (HI)" value={newW.nameHi} onChange={(e) => setNewW({ ...newW, nameHi: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <input type="text" placeholder="Role" value={newW.role} onChange={(e) => setNewW({ ...newW, role: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <input type="number" min="0" value={newW.dailyWage} onChange={(e) => setNewW({ ...newW, dailyWage: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
              <button type="submit" className="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold text-sm">+ Add Worker</button>
            </form>
          </div>
        </div>
      );
    }

    function PlantCareDatabasePage({ plantCareDb, onAddEntry, onUpdateEntry, requestAuth }) {
      const [search, setSearch] = useState('');
      const [err, setErr] = useState('');
      const [selId, setSelId] = useState('');
      const [editId, setEditId] = useState(null);
      const [draft, setDraft] = useState(null);

      const avail = useMemo(() => { const ids = new Set(plantCareDb.map((c) => c.id)); return PREDEFINED_PLANT_CARE.filter((c) => !ids.has(c.id)); }, [plantCareDb]);
      const filtered = useMemo(() => {
        const q = search.trim().toLowerCase();
        return !q ? plantCareDb : plantCareDb.filter((c) => c.commonEn.toLowerCase().includes(q) || c.commonHi.toLowerCase().includes(q) || c.botanicalName.toLowerCase().includes(q));
      }, [plantCareDb, search]);

      useEffect(() => {
        const q = search.trim();
        if (q && !filtered.length) setErr(`Error: Unknown plant "${q}" is not in the verified Plant Care Database. Automatic fallback generation is disabled — please select strictly from the pre-defined dropdown.`);
        else setErr('');
      }, [search, filtered.length]);

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-4">
            <div className="flex flex-wrap justify-between gap-4"><div><h2 className="text-2xl font-extrabold">Plant Care Database • वैज्ञानिक पादप डेटाबेस</h2><p className="text-xs text-slate-500">Strict Pre-defined Dropdown Only • Unknown search shows error • Password-protected edits</p></div><span className="px-3 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 text-xs font-extrabold border">{plantCareDb.length} / {PREDEFINED_PLANT_CARE.length} Active</span></div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 pt-2 border-t">
              <form onSubmit={(e) => { e.preventDefault(); if (search.trim() && !filtered.length) setErr(`Error: Plant "${search.trim()}" not found in pre-defined database.`); }} className="flex gap-2">
                <div className="relative flex-1"><Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" /><input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search pre-defined entries..." className="w-full pl-10 pr-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm outline-none" /></div>
                <button type="submit" className="px-4 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-extrabold">Search</button>
              </form>
              <form onSubmit={(e) => { e.preventDefault(); const f = PREDEFINED_PLANT_CARE.find((c) => c.id === selId); if (f) { onAddEntry({ ...f, verified: true }); setSelId(''); } }} className="flex gap-2">
                <select required value={selId} onChange={(e) => setSelId(e.target.value)} className="flex-1 px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold"><option value="">{!avail.length ? 'All pre-defined entries loaded' : '-- Select Pre-defined Entry --'}</option>{avail.map((e) => <option key={e.id} value={e.id}>{e.commonEn} ({e.commonHi})</option>)}</select>
                <button type="submit" disabled={!selId} className="px-4 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold disabled:opacity-40">+ Add</button>
              </form>
            </div>
            {err && <div className="p-4 rounded-xl bg-rose-50 dark:bg-rose-950/60 border border-rose-300 text-rose-700 dark:text-rose-300 flex items-start gap-3"><Icon name="alert" className="w-5 h-5 shrink-0" /><span className="text-xs font-bold">{err}</span></div>}
          </div>
          {!err && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              {filtered.map((item) => {
                const isEd = editId === item.id && draft;
                return (
                  <div key={item.id} className="bg-white dark:bg-slate-900 rounded-2xl border p-5 shadow-sm space-y-3">
                    <div className="flex justify-between gap-3">
                      <div><span className="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800 mb-1">✓ Pre-defined Verified</span><h3 className="text-lg font-extrabold">{item.commonEn} • {item.commonHi}</h3><p className="text-xs italic text-slate-500">{item.botanicalName} ({item.family})</p></div>
                      {!isEd && <button onClick={() => requestAuth('Authorize DB Edit', `Edit "${item.commonEn}"`, () => { setEditId(item.id); setDraft({ ...item }); })} className="flex items-center gap-1 px-3 py-1.5 rounded-xl border text-xs font-bold h-fit"><Icon name="lock" className="w-3.5 h-3.5" /> Edit</button>}
                    </div>
                    {isEd ? (
                      <div className="space-y-2 text-xs pt-2">{['season','care','water','sunlight','fertilizer'].map((f) => <div key={f}><label className="block font-bold uppercase text-[10px] text-slate-400">{f}</label><input type="text" value={draft[f]} onChange={(e) => setDraft({ ...draft, [f]: e.target.value })} className="w-full px-3 py-1.5 rounded-lg border bg-slate-50 dark:bg-slate-800" /></div>)}<div className="flex justify-end gap-2 pt-2"><button onClick={() => setEditId(null)} className="px-3 py-1.5 rounded-lg border font-bold">Cancel</button><button onClick={() => { onUpdateEntry(draft); setEditId(null); }} className="px-4 py-1.5 rounded-lg bg-emerald-600 text-white font-bold">Save</button></div></div>
                    ) : <div className="space-y-1 text-xs text-slate-700 dark:text-slate-300"><p><strong>Season:</strong> {item.season}</p><p><strong>Care:</strong> {item.care}</p><p><strong>Water:</strong> {item.water}</p><p><strong>Sunlight:</strong> {item.sunlight}</p><p><strong>Fertilizer:</strong> {item.fertilizer}</p><p className="text-[11px] text-slate-400 pt-1 border-t">Source: {item.source}</p></div>}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function BillGalleryPage({ bills, onAddBill, onDeleteBill, requestAuth }) {
      const [caption, setCaption] = useState('');
      const [date, setDate] = useState(todayStr());
      const [type, setType] = useState('Purchase Bill');
      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-4">
            <div><h2 className="text-2xl font-extrabold">Bill Gallery • बिल गैलरी</h2><p className="text-xs text-slate-500">Password-protected deletion on all uploaded bills</p></div>
            <div className="grid grid-cols-1 sm:grid-cols-4 gap-3 items-end">
              <input type="text" placeholder="Caption" value={caption} onChange={(e) => setCaption(e.target.value)} className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <select value={type} onChange={(e) => setType(e.target.value)} className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold"><option>Purchase Bill</option><option>Sale Receipt</option><option>Expense / Transport</option></select>
              <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold" />
              <label className="cursor-pointer py-2.5 px-4 rounded-xl bg-emerald-600 text-white text-center text-sm font-extrabold">+ Upload Bill<input type="file" accept="image/*" onChange={async (e) => { const f = e.target.files?.[0]; if (!f) return; const img = await compressImageFile(f, 960, 0.82); onAddBill({ id:'BILL-'+Date.now(), caption: caption.trim()||f.name, date, type, image: img }); setCaption(''); e.target.value=''; }} className="hidden" /></label>
            </div>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            {bills.map((b) => (
              <div key={b.id} className="bg-white dark:bg-slate-900 rounded-2xl border overflow-hidden shadow-sm">
                <div className="h-52 bg-slate-100 dark:bg-slate-800 overflow-hidden"><img src={b.image} alt={b.caption} className="w-full h-full object-cover" /></div>
                <div className="p-4 flex items-center justify-between gap-3"><div><span className="text-[11px] font-bold text-emerald-600">{b.type} • {b.date}</span><h4 className="font-extrabold text-sm">{b.caption}</h4></div><button onClick={() => requestAuth('Delete Protected Bill', `Delete "${b.caption}"?`, () => onDeleteBill(b.id))} className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold"><Icon name="lock" className="w-3.5 h-3.5" /> Delete</button></div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // 13. SETTINGS (Nursery Profile, Password-Authorized Excel Import/Export, User Management, Theme Toggle)
    function SettingsPage({ theme, setTheme, nurseryProfile, onSaveProfile, users, onSaveUsers, currentUser, products, plantCareDb, onImportProducts, requestAuth, onLogout }) {
      const [prof, setProf] = useState(nurseryProfile);
      const [newU, setNewU] = useState({ username: '', password: '', role: 'Staff' });
      const fileRef = useRef(null);
      useEffect(() => { setProf(nurseryProfile); }, [nurseryProfile]);

      const handleImport = (e) => {
        const f = e.target.files?.[0]; if (!f) return; e.target.value = '';
        requestAuth('Authorize Excel Import', `Verify password to import "${f.name}".`, async () => {
          const rows = await parseInventoryExcelFile(f);
          if (!rows.length) { alert('No valid rows found.'); return; }
          onImportProducts(rows);
        });
      };

      return (
        <div className="max-w-4xl space-y-6">
          <form onSubmit={(e) => { e.preventDefault(); onSaveProfile({ nurseryName: prof.nurseryName.trim() || 'Sach Nursery', ownerMobile: prof.ownerMobile.trim() }); }} className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm space-y-4">
            <div><h2 className="text-xl font-extrabold">Nursery Profile • नर्सरी विवरण</h2><p className="text-xs text-slate-500">Used on ERP headers, customer catalog & WhatsApp bills</p></div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div><label className="block text-xs font-bold mb-1">Nursery Name *</label><input required type="text" value={prof.nurseryName} onChange={(e) => setProf({ ...prof, nurseryName: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" /></div>
              <div><label className="block text-xs font-bold mb-1">Owner Mobile Number *</label><input required type="tel" value={prof.ownerMobile} onChange={(e) => setProf({ ...prof, ownerMobile: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" /></div>
            </div>
            <button type="submit" className="px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold shadow">Save Nursery Profile</button>
          </form>

          <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm space-y-4">
            <div className="flex flex-wrap justify-between gap-3">
              <div><h2 className="text-xl font-extrabold">Inventory Excel Import & Export • एक्सेल डेटा</h2><p className="text-xs text-slate-500">Password-authorized Excel export (.xlsx) and bulk import/update (.xlsx / .xls / .csv)</p></div>
              <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-amber-50 text-amber-700 text-[11px] font-bold border border-amber-200 h-fit"><Icon name="lock" className="w-3.5 h-3.5" /> Password Required</span>
            </div>
            <div className="flex flex-wrap gap-3">
              <button type="button" onClick={() => requestAuth('Authorize Excel Export', 'Enter password to export inventory.', () => exportInventoryToExcel(products, plantCareDb, nurseryProfile.nurseryName))} className="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold shadow"><Icon name="excel" className="w-4 h-4" /> Export Inventory (.xlsx)</button>
              <button type="button" onClick={() => fileRef.current?.click()} className="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-slate-900 dark:bg-slate-700 text-white text-xs font-extrabold shadow"><Icon name="excel" className="w-4 h-4" /> Import Inventory (.xlsx / .csv)</button>
              <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleImport} className="hidden" />
            </div>
          </div>

          <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm space-y-5">
            <div><h2 className="text-xl font-extrabold">Administrator User Management • उपयोगकर्ता प्रबंधन</h2><p className="text-xs text-slate-500">Manage ERP login accounts & roles</p></div>
            <div className="overflow-x-auto rounded-xl border">
              <table className="w-full text-sm">
                <thead className="bg-slate-50 dark:bg-slate-800/70 text-xs uppercase text-slate-500"><tr><th className="text-left px-4 py-2.5">Username</th><th className="text-left px-3 py-2.5">Role</th><th className="text-center px-3 py-2.5">Status</th><th className="text-right px-4 py-2.5">Actions</th></tr></thead>
                <tbody className="divide-y">{users.map((u) => (
                  <tr key={u.id}>
                    <td className="px-4 py-3 font-extrabold">{u.username} {u.isPrimary && <span className="ml-1 text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">Primary</span>}</td>
                    <td className="px-3 py-3 text-xs font-semibold">{u.role}</td>
                    <td className="px-3 py-3 text-center"><span className={`px-2.5 py-0.5 rounded-full text-[11px] font-bold ${u.active ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}`}>{u.active ? 'Active' : 'Disabled'}</span></td>
                    <td className="px-4 py-3 text-right space-x-2">{!u.isPrimary && <><button onClick={() => requestAuth('Toggle User', `Change access for ${u.username}?`, () => onSaveUsers(users.map((x) => x.id === u.id ? { ...x, active: !x.active } : x)))} className="px-3 py-1 rounded-lg border text-xs font-bold">{u.active ? 'Disable' : 'Enable'}</button><button onClick={() => requestAuth('Delete User', `Remove "${u.username}"?`, () => onSaveUsers(users.filter((x) => x.id !== u.id)))} className="px-3 py-1 rounded-lg bg-rose-50 text-rose-600 border text-xs font-bold">Remove</button></>}</td>
                  </tr>
                ))}</tbody>
              </table>
            </div>
            <form onSubmit={(e) => { e.preventDefault(); if (!newU.username.trim() || !newU.password) return; requestAuth('Authorize User Creation', `Add user "${newU.username.trim()}".`, () => { onSaveUsers([...users, { id:'u-'+Date.now(), username:newU.username.trim(), password:newU.password, role:newU.role, active:true, isPrimary:false }]); setNewU({ username:'', password:'', role:'Staff' }); }); }} className="grid grid-cols-1 sm:grid-cols-4 gap-3 pt-2 border-t items-end">
              <input required type="text" value={newU.username} onChange={(e) => setNewU({ ...newU, username: e.target.value })} placeholder="New Username *" className="px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <input required type="password" value={newU.password} onChange={(e) => setNewU({ ...newU, password: e.target.value })} placeholder="Password *" className="px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <select value={newU.role} onChange={(e) => setNewU({ ...newU, role: e.target.value })} className="px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold"><option>Staff</option><option>Manager</option><option>Administrator</option></select>
              <button type="submit" className="py-2.5 px-4 rounded-xl bg-slate-900 dark:bg-emerald-600 text-white text-xs font-extrabold">+ Add User</button>
            </form>
          </div>

          <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm space-y-4">
            <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border flex items-center justify-between gap-4">
              <div><h3 className="font-extrabold text-base">Interface Theme • थीम मोड</h3><p className="text-xs text-slate-500">Toggle between Light and Dark themes</p></div>
              <div className="flex gap-2">
                <button onClick={() => setTheme('light')} className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-extrabold border ${theme === 'light' ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-slate-900'}`}><Icon name="sun" className="w-4 h-4" /> Light</button>
                <button onClick={() => setTheme('dark')} className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-extrabold border ${theme === 'dark' ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-slate-900'}`}><Icon name="moon" className="w-4 h-4" /> Dark</button>
              </div>
            </div>
            <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border flex items-center justify-between">
              <div><h3 className="font-extrabold text-sm">Signed-in: {currentUser?.username}</h3><p className="text-xs text-slate-500">{currentUser?.role} • {nurseryProfile.nurseryName}</p></div>
              <button onClick={onLogout} className="flex items-center gap-2 px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-extrabold"><Icon name="logout" className="w-4 h-4" /> Logout</button>
            </div>
          </div>
        </div>
      );
    }

    // 14. CLEAN DASHBOARD & APP SHELL
    function DashboardPage({ nurseryProfile, currentUser, products, sales, purchases, onNavigate, onOpenQR, onOpenCustomerQR }) {

      const allSales = sales.reduce((a, s) => a + s.total, 0);
      const todayPur = purchases.filter((p) => p.date === todayStr()).reduce((a, p) => a + p.total, 0);
      const allPur = purchases.reduce((a, p) => a + p.total, 0);

      return (
        <div className="space-y-8">

            <div className="space-y-1.5">
              <span className="inline-block px-3 py-1 rounded-full bg-white/15 text-xs font-bold">{nurseryProfile.nurseryName} ERP {nurseryProfile.ownerMobile ? `• 📞 ${nurseryProfile.ownerMobile}` : ''}</span>
              <h1 className="text-3xl font-extrabold tracking-tight">Welcome, {currentUser?.username || MASTER_USER}</h1>
              <p className="text-emerald-100 text-sm max-w-xl">Managing {products.length} plant varieties, non-inventory open item billing, password-protected adjustments & WhatsApp care guides.</p>
            </div>
            <div className="flex flex-wrap gap-3 shrink-0">
              <button onClick={onOpenQR} className="flex items-center gap-2.5 px-6 py-3.5 rounded-2xl bg-white text-emerald-900 hover:bg-emerald-50 font-extrabold text-sm shadow-xl"><Icon name="qr" className="w-5 h-5 text-emerald-700" /><span>Scan QR Code</span></button>
              <button onClick={onOpenCustomerQR} className="flex items-center gap-2.5 px-5 py-3.5 rounded-2xl bg-emerald-950/40 hover:bg-emerald-950/60 border border-white/25 text-white font-extrabold text-sm"><Icon name="external" className="w-5 h-5" /><span>Customer Catalog QR</span></button>
            </div>
          </div>

              <div className="flex items-center justify-between"><div className="p-3.5 rounded-2xl bg-emerald-100 text-emerald-700"><Icon name="grid" className="w-7 h-7" /></div><span className="text-xs font-bold text-emerald-600">Open Catalog →</span></div>
              <div className="pt-4"><h3 className="text-xl font-extrabold">Inventory & Catalog</h3><p className="text-xs text-slate-500 mt-1">{products.length} plant varieties</p></div>

              <div className="pt-4"><h3 className="text-xl font-extrabold">Sale Summary</h3><div className="mt-2 flex items-baseline justify-between"><span className="text-2xl font-extrabold text-emerald-600">₹{allSales.toLocaleString()}</span><span className="text-xs font-semibold text-slate-500">Today: ₹{todaySales.toLocaleString()}</span></div></div>

              <div className="flex items-center justify-between"><div className="p-3.5 rounded-2xl bg-amber-100 text-amber-700"><Icon name="truck" className="w-7 h-7" /></div><span className="text-xs font-bold text-amber-600">View Report →</span></div>
              <div className="pt-4"><h3 className="text-xl font-extrabold">Purchase Summary</h3><div className="mt-2 flex items-baseline justify-between"><span className="text-2xl font-extrabold">₹{allPur.toLocaleString()}</span><span className="text-xs font-semibold text-slate-500">Today: ₹{todayPur.toLocaleString()}</span></div></div>

          </div>

          <div>
            <h2 className="text-sm font-extrabold uppercase tracking-wider text-slate-400 mb-3">Quick Modules</h2>
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-3.5">
              {[
                { id:'pos', label:'Sales & POS', sub:'बिक्री बिलिंग', icon:'cart' },
                { id:'purchases', label:'Purchases', sub:'खरीद प्रविष्टि', icon:'truck' },
                { id:'stock', label:'Stock CRUD', sub:'स्टॉक प्रबंधन', icon:'boxes' },
                { id:'adjustments', label:'Adjustments', sub:'सैंपल / नुकसान', icon:'adjust' },
                { id:'workers', label:'Workers', sub:'उपस्थिति', icon:'users' },
                { id:'plant-care', label:'Plant Care DB', sub:'वैज्ञानिक डेटा', icon:'book' },
                { id:'bills', label:'Bill Gallery', sub:'बिल गैलरी', icon:'image' },
              ].map((m) => (
                <button key={m.id} onClick={() => onNavigate(m.id)} className="rounded-2xl bg-white dark:bg-slate-900 border p-4 text-left hover:border-emerald-500 hover:shadow transition">
                  <Icon name={m.icon} className="w-6 h-6 text-emerald-600 mb-2" /><div className="font-extrabold text-sm">{m.label}</div><div className="text-xs text-slate-500">{m.sub}</div>
