            {onExitPreview && <button onClick={onExitPreview} className="px-4 py-2 rounded-xl bg-white text-emerald-900 font-extrabold text-xs shadow">← Back to ERP</button>}
          </header>
          <div className="max-w-7xl mx-auto p-4 sm:p-6 space-y-5">
            <div className="flex flex-wrap gap-3 bg-white dark:bg-slate-900 p-4 rounded-2xl border shadow-sm">
              <div className="relative flex-1 min-w-[240px]"><Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" /><input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search English, Hindi or Hinglish..." className="w-full pl-10 pr-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm outline-none" /></div>
              <select value={catFilter} onChange={(e) => setCatFilter(e.target.value)} className="px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold">
                <option value="ALL">All Categories ({products.length})</option>
                {CATEGORIES.map((c) => <option key={c.en} value={c.en}>{c.en}</option>)}
              </select>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3.5">
              {filtered.map((p) => {
                const care = getCare(p), open = expandedCareId === p.id;
                return (
                  <div key={p.id} className="rounded-xl bg-white dark:bg-slate-900 border overflow-hidden shadow-sm flex flex-col">
                    <div className="h-24 bg-slate-100 dark:bg-slate-800 overflow-hidden">{p.image && <img src={p.image} alt={p.nameEn} className="w-full h-full object-cover" loading="lazy" />}</div>
                    <div className="p-2.5 flex-1 flex flex-col justify-between space-y-2">
                      <div><span className="text-[10px] font-bold text-emerald-700 block truncate">{p.category}</span><h4 className="font-extrabold text-xs line-clamp-2">{p.nameEn}</h4><p className="text-[11px] text-slate-500 truncate">{p.nameHi}</p></div>
                      <div className="flex items-center justify-between pt-1 border-t"><span className="font-extrabold text-sm text-emerald-600">₹{p.price}</span>{care && <button onClick={() => setExpandedCareId(open ? null : p.id)} className="text-[11px] font-bold text-sky-600">{open ? 'Hide' : 'Care'}</button>}</div>
                      {open && care && <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/40 text-[10px] space-y-1"><p><strong>Season:</strong> {care.season}</p><p><strong>Water:</strong> {care.water}</p><p><strong>Sun:</strong> {care.sunlight}</p><p><strong>Care:</strong> {care.care}</p></div>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function FullScreenQRScanner({ isOpen, onClose, products, plantCareDb }) {
      const [scannedIds, setScannedIds] = useState([]);
      const [checkedMap, setCheckedMap] = useState({});
      const [cameraActive, setCameraActive] = useState(false);
      const [camError, setCamError] = useState('');
      const [searchFilter, setSearchFilter] = useState('');
      const scannerRef = useRef(null);

      useEffect(() => { if (!isOpen) stopCamera(); return () => stopCamera(); }, [isOpen]);

      const startCamera = async () => {
        setCamError('');
        if (!window.Html5Qrcode) { setCamError('Camera QR library unavailable offline.'); return; }
        try {
          const qr = new window.Html5Qrcode('qr-reader-region');
          scannerRef.current = qr;
          await qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 240, height: 240 } }, (txt) => handleQRPayload(txt), () => {});
          setCameraActive(true);
        } catch { setCamError('Camera unavailable or denied.'); setCameraActive(false); }
      };

      const stopCamera = async () => {
        if (scannerRef.current) { try { if (cameraActive) await scannerRef.current.stop(); scannerRef.current.clear(); } catch {} scannerRef.current = null; }
        setCameraActive(false);
      };

      const handleQRPayload = (payload) => {
        const clean = payload.replace('SACH-PLANT:', '').trim();
        const found = products.find((p) => p.id === clean || p.nameEn.toLowerCase() === clean.toLowerCase());
        if (found) setScannedIds((prev) => (prev.includes(found.id) ? prev : [found.id, ...prev]));
      };

      const getCareInfo = (product) => {
        if (product.customCare && (product.customCare.care || product.customCare.season)) return product.customCare;
        return plantCareDb.find((c) => c.id === product.careId) || PREDEFINED_PLANT_CARE.find((c) => c.id === product.careId) || null;
      };

      if (!isOpen) return null;

      const scannedProducts = scannedIds.map((id) => products.find((p) => p.id === id)).filter(Boolean).filter((p) => smartMatch(p, searchFilter));
      const filteredQuickList = products.filter((p) => smartMatch(p, searchFilter)).slice(0, 60);

      return (
        <div className="fixed inset-0 z-50 bg-slate-50 dark:bg-slate-950 flex flex-col overflow-hidden">
          <div className="flex flex-wrap items-center justify-between gap-3 px-6 py-4 bg-white dark:bg-slate-900 border-b shadow-sm">
            <div className="flex items-center gap-3">
              <div className="p-2.5 rounded-xl bg-emerald-600 text-white"><Icon name="qr" className="w-6 h-6" /></div>
              <div><h2 className="text-xl font-extrabold">QR Plant Scanner • क्यूआर स्कैनर</h2><p className="text-xs text-slate-500">ONLY Photo, Name & Category • Check card for Plant Care</p></div>
            </div>
            <div className="flex items-center gap-2.5">
              {!cameraActive ? <button onClick={startCamera} className="px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold text-sm">Start Camera</button>
                : <button onClick={stopCamera} className="px-4 py-2 rounded-xl bg-amber-600 text-white font-bold text-sm">Stop Camera</button>}
              <button onClick={() => setScannedIds(products.map((p) => p.id))} className="px-4 py-2 rounded-xl bg-slate-800 text-white font-bold text-sm">Load All ({products.length})</button>
              <button onClick={onClose} className="p-2.5 rounded-xl border"><Icon name="close" className="w-5 h-5" /></button>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto p-6 space-y-6">
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="rounded-2xl bg-white dark:bg-slate-900 border p-4 flex flex-col items-center justify-center min-h-[190px]">
                <div id="qr-reader-region" className="w-full max-w-[260px] rounded-xl overflow-hidden" />
                {!cameraActive && <div className="text-center space-y-2 py-4"><Icon name="qr" className="w-10 h-10 mx-auto text-emerald-600 opacity-80" /><p className="text-xs text-slate-500">Start camera or select items</p>{camError && <p className="text-xs text-amber-600">{camError}</p>}</div>}
              </div>
              <div className="lg:col-span-2 rounded-2xl bg-white dark:bg-slate-900 border p-5 space-y-3">
                <div className="relative"><Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" /><input type="text" value={searchFilter} onChange={(e) => setSearchFilter(e.target.value)} placeholder="Search English / Hindi / Hinglish..." className="w-full pl-10 pr-4 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
                <div className="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto">
                  {filteredQuickList.map((p) => <button key={p.id} onClick={() => handleQRPayload(p.id)} className={`px-2.5 py-1 rounded-lg text-[11px] font-semibold border ${scannedIds.includes(p.id) ? 'bg-emerald-600 text-white' : 'bg-slate-50 dark:bg-slate-800'}`}>{p.nameEn} • {p.nameHi}</button>)}
                </div>
              </div>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
              {scannedProducts.map((item) => {
                const checked = !!checkedMap[item.id], care = getCareInfo(item);
                return (
                  <div key={item.id} className="rounded-xl bg-white dark:bg-slate-900 border shadow-sm overflow-hidden flex flex-col">
                    {item.image && <div className="h-32 w-full bg-slate-100 dark:bg-slate-800 overflow-hidden"><img src={item.image} alt={item.nameEn} className="w-full h-full object-cover" /></div>}
                    <div className="p-3 flex-1 flex flex-col justify-between space-y-2.5">
                      <div><span className="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 mb-1">{item.category}</span><h4 className="text-xs font-extrabold">{item.nameEn}</h4>{item.nameHi && <p className="text-[11px] text-slate-500">{item.nameHi}</p>}</div>
                      <label className="flex items-center gap-2 pt-2 border-t cursor-pointer"><input type="checkbox" checked={checked} onChange={() => setCheckedMap((prev) => ({ ...prev, [item.id]: !prev[item.id] }))} className="w-3.5 h-3.5 accent-emerald-600" /><span className="text-[11px] font-bold text-emerald-700 dark:text-emerald-400">Show Plant Care</span></label>
                      {checked && (care ? <div className="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/40 text-[10px] space-y-1"><p><strong>Season:</strong> {care.season}</p><p><strong>Care:</strong> {care.care}</p><p><strong>Water:</strong> {care.water}</p><p><strong>Sun:</strong> {care.sunlight}</p><p><strong>Fertilizer:</strong> {care.fertilizer}</p></div> : <div className="p-2 rounded-lg bg-rose-50 text-[10px] text-rose-700">No verified care profile.</div>)}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 8. CENTRAL POS CHECKOUT MODAL (Dynamic Qty, Mandatory Mobile, Non-Inventory Open Items, WhatsApp)
    // =========================================================================
    function CentralCheckoutModal({ isOpen, cart, setCart, products, onClose, onConfirmSale }) {
      const [customer, setCustomer] = useState('Walk-in Customer');
      const [customerMobile, setCustomerMobile] = useState('');
      const [mobileError, setMobileError] = useState('');
      const [discountType, setDiscountType] = useState('flat');
      const [discountValue, setDiscountValue] = useState(0);
      const [payMode, setPayMode] = useState('split');
      const [cashAmount, setCashAmount] = useState(0);
      const [upiAmount, setUpiAmount] = useState(0);
      const [openForm, setOpenForm] = useState({ nameEn: '', price: '', qty: 1 });

      const cartDetailed = useMemo(() => cart.map((c) => {
        if (c.isNonInventory) return { ...c, id: c.cartKey };
        const p = products.find((prod) => prod.id === c.productId);
        return p ? { ...p, cartKey: c.cartKey || p.id, isNonInventory: false, qty: c.qty } : null;
      }).filter(Boolean), [cart, products]);

      const subtotal = useMemo(() => cartDetailed.reduce((sum, i) => sum + i.price * i.qty, 0), [cartDetailed]);
      const discountAmount = useMemo(() => {
        const val = Math.max(0, Number(discountValue) || 0);
        return discountType === 'percent' ? Math.min(subtotal, Math.round((subtotal * Math.min(100, val)) / 100)) : Math.min(subtotal, val);
      }, [subtotal, discountType, discountValue]);
      const netTotal = Math.max(0, subtotal - discountAmount);

      useEffect(() => {
        if (!isOpen) return;
        setMobileError('');
        if (payMode === 'cash') { setCashAmount(netTotal); setUpiAmount(0); }
        else if (payMode === 'upi') { setCashAmount(0); setUpiAmount(netTotal); }
        else { setCashAmount((prev) => { const c = Math.min(netTotal, Math.max(0, Number(prev) || 0)); setUpiAmount(netTotal - c); return c; }); }
      }, [netTotal, payMode, isOpen]);

      if (!isOpen) return null;

      const updateCartQty = (cartKey, nextQty) => {
        const q = parseInt(nextQty, 10);
        if (isNaN(q) || q <= 0) setCart((prev) => prev.filter((c) => (c.cartKey || c.productId) !== cartKey));
        else setCart((prev) => prev.map((c) => ((c.cartKey || c.productId) === cartKey ? { ...c, qty: q } : c)));
      };

      const addOpenItemInsideCheckout = () => {
        if (!openForm.nameEn.trim() || Number(openForm.price) <= 0) return;
        setCart((prev) => [...prev, {
          cartKey: 'open-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5),
          isNonInventory: true,
          nameEn: openForm.nameEn.trim(),
          nameHi: 'गैर-स्टॉक खुला आइटम',
          category: 'Open Item (Non-Inventory)',
          price: Math.max(0, Number(openForm.price) || 0),
          qty: Math.max(1, parseInt(openForm.qty, 10) || 1)
        }]);
        setOpenForm({ nameEn: '', price: '', qty: 1 });
      };

      const handleCheckoutSubmit = () => {
        if (cartDetailed.length === 0) return;
        const digits = customerMobile.replace(/\D/g, '');
        if (digits.length < 10) {
          setMobileError('Customer mobile number (at least 10 digits) is mandatory to dispatch WhatsApp bill.');
          return;
        }
        onConfirmSale({
          customer: customer.trim() || 'Walk-in Customer',
          customerMobile: digits,
          items: cartDetailed.map((i) => ({ productId: i.isNonInventory ? i.cartKey : i.id, isNonInventory: !!i.isNonInventory, nameEn: i.nameEn, nameHi: i.nameHi, category: i.category, qty: i.qty, price: i.price })),
          subtotal, discountType, discountValue: Number(discountValue) || 0, discountAmount, total: netTotal, cashAmount, upiAmount
        });
        setCustomerMobile('');
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 backdrop-blur-sm p-4">
          <div className="w-full max-w-2xl rounded-3xl bg-white dark:bg-slate-900 border shadow-2xl overflow-hidden flex flex-col max-h-[92vh]">
            <div className="flex items-center justify-between px-6 py-4 bg-emerald-600 text-white">
              <div><h3 className="text-lg font-extrabold">POS Checkout & WhatsApp Dispatch • बिल भुगतान</h3><p className="text-xs text-emerald-100">Dynamic Qty • Non-Inventory Open Items • Mandatory Mobile • Cash & UPI Split</p></div>
              <button onClick={onClose} className="p-2 rounded-xl hover:bg-emerald-700"><Icon name="close" className="w-5 h-5" /></button>
            </div>

            <div className="p-6 overflow-y-auto space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label className="block text-xs font-bold uppercase text-slate-500 mb-1">Customer Name</label><input type="text" value={customer} onChange={(e) => setCustomer(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 font-semibold text-sm" /></div>
                <div><label className="block text-xs font-bold uppercase text-slate-500 mb-1">Customer Mobile (WhatsApp) *</label><input type="tel" required value={customerMobile} onChange={(e) => { setCustomerMobile(e.target.value); setMobileError(''); }} placeholder="10-digit mobile number" className={`w-full px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 font-bold text-sm outline-none ${mobileError ? 'border-rose-500 ring-2 ring-rose-500/20' : ''}`} /></div>
              </div>
              {mobileError && <p className="text-xs font-bold text-rose-600 -mt-2">{mobileError}</p>}

              {/* Quick Add Non-Inventory Open Item directly inside Checkout */}
              <div className="p-3 rounded-2xl bg-sky-50 dark:bg-sky-950/30 border border-sky-200 dark:border-sky-900 flex flex-wrap items-center gap-2">
                <span className="text-[11px] font-extrabold text-sky-800 dark:text-sky-300 w-full">Quick Add Non-Inventory Open Item (Soil / Loose Materials — No Stock Impact):</span>
                <input type="text" placeholder="Item (e.g. Loose Garden Soil)" value={openForm.nameEn} onChange={(e) => setOpenForm({ ...openForm, nameEn: e.target.value })} className="flex-1 min-w-[160px] px-3 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs" />
                <input type="number" min="1" placeholder="₹ Rate" value={openForm.price} onChange={(e) => setOpenForm({ ...openForm, price: e.target.value })} className="w-20 px-2.5 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs font-bold" />
                <input type="number" min="1" placeholder="Qty" value={openForm.qty} onChange={(e) => setOpenForm({ ...openForm, qty: e.target.value })} className="w-16 px-2 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs font-bold text-center" />
                <button type="button" onClick={addOpenItemInsideCheckout} className="px-3 py-1.5 rounded-lg bg-sky-600 text-white text-xs font-extrabold">+ Add Open Item</button>
              </div>

              <div className="rounded-2xl border overflow-hidden max-h-52 overflow-y-auto">
                <table className="w-full text-sm">
                  <thead className="bg-slate-100 dark:bg-slate-800 text-xs uppercase text-slate-500">
                    <tr><th className="text-left px-4 py-2">Item</th><th className="text-center px-2 py-2">Adjust Qty</th><th className="text-right px-3 py-2">Rate</th><th className="text-right px-4 py-2">Amount</th></tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {cartDetailed.length === 0 ? <tr><td colSpan="4" className="p-6 text-center text-xs text-slate-400">Cart is empty.</td></tr> : cartDetailed.map((item) => (
                      <tr key={item.cartKey}>
                        <td className="px-4 py-2 font-semibold">
                          <div className="flex items-center gap-1.5">
                            <span>{item.nameEn}</span>
                            {item.isNonInventory && <span className="px-1.5 py-0.5 rounded bg-sky-100 dark:bg-sky-900 text-sky-700 dark:text-sky-300 text-[9px] font-extrabold">Open / No Stock</span>}
                          </div>
                          {item.nameHi && <div className="text-[11px] text-slate-500">{item.nameHi}</div>}
                        </td>
                        <td className="px-2 py-2">
                          <div className="flex items-center justify-center gap-1">
                            <button type="button" onClick={() => updateCartQty(item.cartKey, item.qty - 1)} className="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 font-extrabold">-</button>
                            <input type="number" min="1" value={item.qty} onChange={(e) => updateCartQty(item.cartKey, e.target.value)} className="w-12 py-1 text-center rounded-lg border bg-white dark:bg-slate-900 font-bold text-xs" />
                            <button type="button" onClick={() => updateCartQty(item.cartKey, item.qty + 1)} className="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 font-extrabold">+</button>
                          </div>
                        </td>
                        <td className="text-right px-3 py-2">₹{item.price}</td>
                        <td className="text-right px-4 py-2 font-bold">₹{item.price * item.qty}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div className="rounded-2xl bg-slate-50 dark:bg-slate-800/60 p-4 border space-y-2">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <span className="text-sm font-bold">Total Bill Discount</span>
                  <div className="flex items-center gap-2">
                    <select value={discountType} onChange={(e) => setDiscountType(e.target.value)} className="px-3 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-sm font-semibold"><option value="flat">Flat ₹</option><option value="percent">Percent %</option></select>
                    <input type="number" min="0" value={discountValue} onChange={(e) => setDiscountValue(e.target.value)} className="w-24 px-3 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-sm font-bold text-right" />
                  </div>
                </div>
                <div className="flex justify-between text-sm"><span>Subtotal</span><span className="font-semibold">₹{subtotal.toLocaleString()}</span></div>
                <div className="flex justify-between text-sm text-rose-600"><span>Bill Discount</span><span className="font-semibold">- ₹{discountAmount.toLocaleString()}</span></div>
                <div className="flex justify-between text-lg font-extrabold pt-2 border-t"><span>Net Payable</span><span className="text-emerald-600">₹{netTotal.toLocaleString()}</span></div>
              </div>

              <div className="space-y-3">
                <label className="block text-xs font-bold uppercase text-slate-500">Payment (Strictly Cash & UPI)</label>
                <div className="grid grid-cols-3 gap-2.5">
                  {[{ id: 'cash', label: '100% Cash' }, { id: 'upi', label: '100% UPI' }, { id: 'split', label: 'Split (Cash + UPI)' }].map((m) => (
                    <button key={m.id} type="button" onClick={() => setPayMode(m.id)} className={`py-2.5 px-3 rounded-xl text-xs font-extrabold border ${payMode === m.id ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 dark:bg-slate-800'}`}>{m.label}</button>
                  ))}
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div><label className="block text-xs font-bold mb-1">Cash (₹)</label><input type="number" min="0" max={netTotal} disabled={payMode === 'upi'} value={cashAmount} onChange={(e) => { const c = Math.min(netTotal, Math.max(0, Number(e.target.value) || 0)); setCashAmount(c); setUpiAmount(netTotal - c); }} className="w-full px-4 py-2 rounded-xl border bg-white dark:bg-slate-800 font-bold disabled:opacity-50" /></div>
                  <div><label className="block text-xs font-bold mb-1">UPI (₹)</label><input type="number" min="0" max={netTotal} disabled={payMode === 'cash'} value={upiAmount} onChange={(e) => { const u = Math.min(netTotal, Math.max(0, Number(e.target.value) || 0)); setUpiAmount(u); setCashAmount(netTotal - u); }} className="w-full px-4 py-2 rounded-xl border bg-white dark:bg-slate-800 font-bold disabled:opacity-50" /></div>
                </div>
              </div>
            </div>

            <div className="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t flex justify-end gap-3">
              <button onClick={onClose} className="px-5 py-2.5 rounded-xl border font-bold text-sm">Cancel</button>
              <button onClick={handleCheckoutSubmit} disabled={cartDetailed.length === 0} className="flex items-center gap-2 px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm shadow-lg disabled:opacity-50">
                <Icon name="whatsapp" className="w-4 h-4" /><span>Complete Sale & Send WhatsApp Bill (₹{netTotal.toLocaleString()})</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    function WhatsAppDispatchModal({ dispatchInfo, onClose }) {
      const [copied, setCopied] = useState(false);
      if (!dispatchInfo) return null;
      return (
        <div className="fixed inset-0 z-[95] flex items-center justify-center bg-slate-950/75 backdrop-blur-sm p-4">
          <div className="w-full max-w-lg rounded-3xl bg-white dark:bg-slate-900 border shadow-2xl overflow-hidden">
            <div className="px-6 py-4 bg-emerald-600 text-white flex items-center justify-between">
              <div><h3 className="text-lg font-extrabold">Bill Saved & WhatsApp Message Ready</h3><p className="text-xs text-emerald-100">Tailored care instructions attached</p></div>
              <button onClick={onClose} className="p-2 rounded-xl hover:bg-emerald-700"><Icon name="close" className="w-5 h-5" /></button>
            </div>
            <div className="p-6 space-y-4">
              <pre className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border text-xs whitespace-pre-wrap max-h-64 overflow-y-auto font-sans">{dispatchInfo.text}</pre>
              <div className="flex flex-wrap gap-2.5 justify-end">
                <button onClick={() => { navigator.clipboard?.writeText(dispatchInfo.text); setCopied(true); setTimeout(() => setCopied(false), 2000); }} className="px-4 py-2.5 rounded-xl border text-xs font-extrabold">{copied ? '✓ Copied' : 'Copy Message'}</button>
                <a href={dispatchInfo.url} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold shadow"><Icon name="whatsapp" className="w-4 h-4" /> Open WhatsApp & Send</a>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 9. INVENTORY & CATALOG / SALES & POS BILLING (With Non-Inventory Open Item Sales)
    // =========================================================================
    function CatalogAndPOSPage({ mode, products, cart, setCart, onOpenCheckout, onOpenCustomerQR }) {
      const [search, setSearch] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [visibleCount, setVisibleCount] = useState(24);
      const [qtyInputs, setQtyInputs] = useState({});
      const [showOpenItemBox, setShowOpenItemBox] = useState(mode === 'pos');
      const [openItem, setOpenItem] = useState({ nameEn: '', price: '', qty: 1 });
      const sentinelRef = useRef(null);

      const filtered = useMemo(() => products.filter((p) => (selectedCategory === 'ALL' || p.category === selectedCategory) && smartMatch(p, search)), [products, search, selectedCategory]);
      useEffect(() => { setVisibleCount(24); }, [search, selectedCategory, mode]);

      useEffect(() => {
        const el = sentinelRef.current;
        if (!el) return;
        const obs = new IntersectionObserver((entries) => { if (entries[0].isIntersecting && visibleCount < filtered.length) setVisibleCount((prev) => Math.min(filtered.length, prev + 24)); }, { rootMargin: '220px' });
        obs.observe(el);
        return () => obs.disconnect();
      }, [visibleCount, filtered.length]);

      const visibleProducts = filtered.slice(0, visibleCount);
      const groupedByCategory = useMemo(() => {
        const map = {};
        visibleProducts.forEach((p) => {
          const key = p.category || 'Other';
          if (!map[key]) map[key] = { category: key, categoryHi: p.categoryHi || '', items: [] };
          map[key].items.push(p);
        });
        return Object.values(map);
      }, [visibleProducts]);

      const addToCart = (product) => {
        const qty = Math.max(1, parseInt(qtyInputs[product.id] || '1', 10) || 1);
        setCart((prev) => {
          const existing = prev.find((c) => !c.isNonInventory && c.productId === product.id);
          return existing ? prev.map((c) => (!c.isNonInventory && c.productId === product.id ? { ...c, qty: c.qty + qty } : c)) : [...prev, { cartKey: product.id, productId: product.id, isNonInventory: false, qty }];
        });
        setQtyInputs((prev) => ({ ...prev, [product.id]: '' }));
      };

      const addOpenItem = (e) => {
        e.preventDefault();
        if (!openItem.nameEn.trim() || Number(openItem.price) <= 0) return;
        setCart((prev) => [...prev, {
          cartKey: 'open-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5),
          isNonInventory: true,
          nameEn: openItem.nameEn.trim(),
          nameHi: 'गैर-स्टॉक खुला आइटम',
          category: 'Open Item (Non-Inventory)',
          price: Math.max(0, Number(openItem.price) || 0),
          qty: Math.max(1, parseInt(openItem.qty, 10) || 1)
        }]);
        setOpenItem({ nameEn: '', price: '', qty: 1 });
      };

      const cartCount = cart.reduce((s, c) => s + c.qty, 0);
      const cartTotal = cart.reduce((s, c) => {
        if (c.isNonInventory) return s + c.price * c.qty;
        const p = products.find((x) => x.id === c.productId);
        return s + (p ? p.price * c.qty : 0);
      }, 0);

      return (
        <div className="space-y-5">
          <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm">
            <div>
              <h2 className="text-2xl font-extrabold">{mode === 'pos' ? 'Sales & POS Billing • बिक्री व बिलिंग' : 'Inventory & Catalog • नर्सरी कैटलॉग'}</h2>
              <p className="text-xs text-slate-500 mt-0.5">Showing {visibleProducts.length} of {filtered.length} varieties ({products.length} total) • English / Hindi / Hinglish</p>
            </div>
            <div className="flex flex-wrap items-center gap-2.5">
              <div className="relative flex-1 min-w-[220px]"><Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" /><input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search: Gulab, गुलाब, Mango..." className="w-full pl-10 pr-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm outline-none" /></div>
              <button onClick={() => setShowOpenItemBox((v) => !v)} className="px-4 py-2.5 rounded-xl bg-sky-50 dark:bg-sky-950/50 text-sky-700 dark:text-sky-300 border border-sky-200 dark:border-sky-800 font-bold text-xs">
                + Non-Inventory Open Item
              </button>
              {mode === 'catalog' && <button onClick={onOpenCustomerQR} className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-emerald-600 text-emerald-700 dark:text-emerald-400 font-bold text-xs"><Icon name="qr" className="w-4 h-4" /><span>Customer Catalog QR</span></button>}
              <button onClick={onOpenCheckout} className="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow"><Icon name="cart" className="w-4 h-4" /><span>Checkout ({cartCount}) • ₹{cartTotal.toLocaleString()}</span></button>
            </div>
          </div>

          {/* Non-Inventory Open Item Sales Panel */}
          {showOpenItemBox && (
            <form onSubmit={addOpenItem} className="rounded-2xl bg-sky-50/80 dark:bg-sky-950/30 border border-sky-200 dark:border-sky-900 p-4 space-y-3">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h3 className="text-sm font-extrabold text-sky-900 dark:text-sky-200">Non-Inventory Open Item Sales • बिना स्टॉक वाला आइटम बिलिंग</h3>
                  <p className="text-[11px] text-sky-700 dark:text-sky-400">Bill loose soil, manure, pebbles, or planting labour without affecting tracked plant stock counts.</p>
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {[
                    { n: 'Loose Garden Soil (10 kg)', p: 80 },
                    { n: 'Loose Cow Dung Manure', p: 60 },
                    { n: 'River Pebbles (1 kg)', p: 70 },
                    { n: 'Cocopeat Loose (2 kg)', p: 90 },
                    { n: 'Garden Planting Labour', p: 250 }
                  ].map((pre) => (
                    <button key={pre.n} type="button" onClick={() => setOpenItem({ nameEn: pre.n, price: pre.p, qty: 1 })} className="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-900 border border-sky-200 dark:border-sky-800 text-[11px] font-bold hover:border-sky-500">
                      {pre.n} (₹{pre.p})
                    </button>
                  ))}
                </div>
              </div>
              <div className="flex flex-wrap gap-2.5 items-center">
                <input required type="text" placeholder="Item / Material Name (e.g. Loose Red Soil)" value={openItem.nameEn} onChange={(e) => setOpenItem({ ...openItem, nameEn: e.target.value })} className="flex-1 min-w-[220px] px-3.5 py-2 rounded-xl border bg-white dark:bg-slate-900 text-sm" />
                <input required type="number" min="1" placeholder="Rate ₹" value={openItem.price} onChange={(e) => setOpenItem({ ...openItem, price: e.target.value })} className="w-28 px-3 py-2 rounded-xl border bg-white dark:bg-slate-900 text-sm font-bold" />
                <input required type="number" min="1" placeholder="Qty" value={openItem.qty} onChange={(e) => setOpenItem({ ...openItem, qty: e.target.value })} className="w-20 px-3 py-2 rounded-xl border bg-white dark:bg-slate-900 text-sm font-bold text-center" />
                <button type="submit" className="px-5 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-extrabold text-sm">Add Open Item to Cart</button>
              </div>
            </form>
          )}

          <div className="flex flex-wrap items-center justify-between gap-2">
            <div className="flex flex-wrap gap-1.5">
              <button onClick={() => setSelectedCategory('ALL')} className={`px-3 py-1.5 rounded-xl text-xs font-bold border ${selectedCategory === 'ALL' ? 'bg-slate-900 dark:bg-emerald-600 text-white border-transparent' : 'bg-white dark:bg-slate-900'}`}>All ({products.length})</button>
              {CATEGORIES.map((c) => <button key={c.en} onClick={() => setSelectedCategory(c.en)} className={`px-3 py-1.5 rounded-xl text-xs font-bold border ${selectedCategory === c.en ? 'bg-slate-900 dark:bg-emerald-600 text-white border-transparent' : 'bg-white dark:bg-slate-900'}`}>{c.en}</button>)}
            </div>
            {visibleCount < filtered.length && <button onClick={() => setVisibleCount(filtered.length)} className="px-3.5 py-1.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 text-xs font-extrabold border border-emerald-200">Show All {filtered.length}</button>}
          </div>

          {cart.length > 0 && (
            <div className="rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900 p-3.5 flex flex-wrap items-center justify-between gap-3">
              <div className="flex flex-wrap items-center gap-2">
                <span className="text-xs font-extrabold uppercase text-emerald-800 dark:text-emerald-300">Cart:</span>
                {cart.map((c) => {
                  const label = c.isNonInventory ? `${c.nameEn} [Open]` : (products.find((x) => x.id === c.productId)?.nameEn || '');
                  const key = c.cartKey || c.productId;
                  return (
                    <span key={key} className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-xs font-bold ${c.isNonInventory ? 'bg-sky-50 dark:bg-sky-950 border-sky-300 text-sky-800 dark:text-sky-200' : 'bg-white dark:bg-slate-900 border-emerald-200'}`}>
                      {label} × {c.qty}
                      <button onClick={() => setCart((prev) => prev.filter((x) => (x.cartKey || x.productId) !== key))} className="text-rose-500 ml-1">×</button>
                    </span>
                  );
                })}
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => setCart([])} className="text-xs font-bold text-rose-600">Clear</button>
                <button onClick={onOpenCheckout} className="px-3.5 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-extrabold">Checkout →</button>
              </div>
            </div>
          )}

          {groupedByCategory.map((group) => (
            <section key={group.category}>
              <h3 className="text-lg font-extrabold tracking-tight border-b-2 border-emerald-600/30 pb-1.5 mb-3 flex items-center justify-between">
                <span>{group.category} {group.categoryHi && <span className="text-sm font-bold text-emerald-700 dark:text-emerald-400 ml-2">({group.categoryHi})</span>}</span>
                <span className="text-xs font-bold text-slate-500">{group.items.length} varieties</span>
              </h3>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
                {group.items.map((item) => (
                  <div key={item.id} className="rounded-xl bg-white dark:bg-slate-900 border shadow-sm hover:shadow-md transition overflow-hidden flex flex-col">
                    <div className="h-24 bg-slate-100 dark:bg-slate-800 overflow-hidden">{item.image ? <img src={item.image} alt={item.nameEn} className="w-full h-full object-cover" loading="lazy" /> : <div className="w-full h-full flex items-center justify-center text-slate-400"><Icon name="leaf" className="w-7 h-7" /></div>}</div>
                    <div className="p-2.5 flex-1 flex flex-col justify-between space-y-2">
                      <div><h4 className="text-xs font-extrabold leading-tight line-clamp-2">{item.nameEn}</h4><p className="text-[11px] font-semibold text-slate-500 truncate mt-0.5">{item.nameHi}</p><div className="mt-1 text-sm font-extrabold text-emerald-600">₹{item.price}</div></div>
                      <div className="flex items-center gap-1.5 pt-1.5 border-t">
                        <input type="number" min="1" placeholder="1" value={qtyInputs[item.id] ?? ''} onChange={(e) => setQtyInputs((prev) => ({ ...prev, [item.id]: e.target.value }))} className="w-12 px-1.5 py-1.5 rounded-lg border bg-slate-50 dark:bg-slate-800 text-xs font-bold text-center outline-none" />
                        <button onClick={() => addToCart(item)} className="flex-1 py-1.5 px-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-[11px] truncate">Add to Cart</button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </section>
          ))}

          <div ref={sentinelRef} className="py-5 text-center">
            {visibleCount < filtered.length ? <button onClick={() => setVisibleCount((prev) => Math.min(filtered.length, prev + 24))} className="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 font-bold text-xs">Load More ({filtered.length - visibleCount} more)...</button>
              : <span className="text-xs text-slate-400 font-semibold">All {filtered.length} varieties loaded</span>}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 10. DEDICATED PASSWORD-PROTECTED STOCK ADJUSTMENT MODULE
    // =========================================================================
    function StockAdjustmentModule({ products, adjustments, onAddAdjustment, onUpdateAdjustment, requestAuth }) {
      const [adjForm, setAdjForm] = useState({ productId: products[0]?.id || '', type: 'Free Sample', qty: 1, reason: '', date: todayStr() });
      const [editingAdjId, setEditingAdjId] = useState(null);
      const [editAdjDraft, setEditAdjDraft] = useState({ qty: 1, reason: '' });

      const handleAuthorizedSubmit = (e) => {
        e.preventDefault();
        const prod = products.find((p) => p.id === adjForm.productId);
        if (!prod || Number(adjForm.qty) <= 0) return;

        // Password-protected recording of Free Samples & Stock Loss
        requestAuth(
          'Authorize Stock Adjustment',
          `Verify administrator password to record "${adjForm.type}" (${adjForm.qty} × ${prod.nameEn}).`,
          () => {
            onAddAdjustment({
              id: 'ADJ-' + Date.now().toString().slice(-5),
              date: adjForm.date,
              productId: prod.id,
              productName: `${prod.nameEn} / ${prod.nameHi}`,
              type: adjForm.type,
              qty: Number(adjForm.qty),
              reason: adjForm.reason.trim() || adjForm.type,
              locked: true
            });
            setAdjForm((prev) => ({ ...prev, qty: 1, reason: '' }));
          }
        );
      };

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-extrabold">Password-Protected Stock Adjustments • स्टॉक समायोजन</h2>
              <p className="text-xs text-slate-500">Record Free Samples, Donations & Stock Loss/Damage • Every entry requires password authorization and auto-locks</p>
            </div>
            <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-amber-50 dark:bg-amber-950/50 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800 text-xs font-extrabold">
              <Icon name="shield" className="w-4 h-4" /> Password Protected Module
            </span>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <form onSubmit={handleAuthorizedSubmit} className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-4 h-fit">
              <h3 className="font-extrabold text-lg">Record Free Sample / Stock Loss</h3>
              <div>
                <label className="block text-xs font-bold mb-1">Select Plant / Item *</label>
                <select value={adjForm.productId} onChange={(e) => setAdjForm({ ...adjForm, productId: e.target.value })} className="w-full px-3 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold">
                  {products.map((p) => <option key={p.id} value={p.id}>{p.nameEn} ({p.nameHi}) — Stock: {p.stock}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-bold mb-1">Adjustment Type *</label>
                <select value={adjForm.type} onChange={(e) => setAdjForm({ ...adjForm, type: e.target.value })} className="w-full px-3 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold">
                  <option>Free Sample</option>
                  <option>Free Sales / Donation</option>
                  <option>Stock Loss / Damage</option>
                </select>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="block text-xs font-bold mb-1">Quantity *</label><input type="number" min="1" value={adjForm.qty} onChange={(e) => setAdjForm({ ...adjForm, qty: e.target.value })} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" /></div>
                <div><label className="block text-xs font-bold mb-1">Date *</label><input type="date" value={adjForm.date} onChange={(e) => setAdjForm({ ...adjForm, date: e.target.value })} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold" /></div>
              </div>
              <div><label className="block text-xs font-bold mb-1">Reason / Recipient</label><input type="text" value={adjForm.reason} onChange={(e) => setAdjForm({ ...adjForm, reason: e.target.value })} placeholder="e.g. Customer free sample / Heat damage" className="w-full px-3 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
              <button type="submit" className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm shadow">
                <Icon name="lock" className="w-4 h-4" /> Authorize & Record Adjustment
              </button>
            </form>

            <div className="lg:col-span-2 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm overflow-hidden">
              <div className="p-4 border-b flex items-center justify-between"><h3 className="font-extrabold">Adjustment Ledger ({adjustments.length})</h3><span className="text-xs text-slate-500">Unlock with password to edit</span></div>
              <div className="divide-y divide-slate-100 dark:divide-slate-800">
                {adjustments.map((adj) => {
                  const isEditing = editingAdjId === adj.id && !adj.locked;
                  return (
                    <div key={adj.id} className="p-4 flex flex-wrap items-center justify-between gap-4">
                      <div className="space-y-1 flex-1 min-w-[200px]">
                        <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full mr-2 ${adj.type.includes('Loss') || adj.type.includes('Damage') ? 'bg-rose-100 text-rose-700' : 'bg-sky-100 text-sky-700'}`}>{adj.type}</span>
                        <span className="text-xs text-slate-400">{adj.date}</span>
                        <div className="font-extrabold text-sm">{adj.productName}</div>
                        {isEditing ? (
                          <div className="flex flex-wrap gap-2 pt-2">
                            <input type="number" min="1" value={editAdjDraft.qty} onChange={(e) => setEditAdjDraft({ ...editAdjDraft, qty: Number(e.target.value) })} className="w-20 px-2 py-1 rounded-lg border bg-slate-50 dark:bg-slate-800 text-xs font-bold" />
                            <input type="text" value={editAdjDraft.reason} onChange={(e) => setEditAdjDraft({ ...editAdjDraft, reason: e.target.value })} className="flex-1 px-2 py-1 rounded-lg border bg-slate-50 dark:bg-slate-800 text-xs" />
                            <button onClick={() => { onUpdateAdjustment({ ...adj, qty: editAdjDraft.qty, reason: editAdjDraft.reason, locked: true }); setEditingAdjId(null); }} className="px-3 py-1 rounded-lg bg-emerald-600 text-white text-xs font-bold">Save & Lock</button>
                          </div>
                        ) : <p className="text-xs text-slate-500">Qty Deducted: <strong>{adj.qty}</strong> • {adj.reason}</p>}
                      </div>
                      <div className="flex items-center gap-2">
                        <button onClick={() => adj.locked ? requestAuth('Unlock Adjustment Entry', 'Enter password to unlock entry for editing.', () => onUpdateAdjustment({ ...adj, locked: false })) : (onUpdateAdjustment({ ...adj, locked: true }), setEditingAdjId(null))} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold border ${adj.locked ? 'bg-amber-50 border-amber-300 text-amber-700' : 'bg-emerald-50 border-emerald-300 text-emerald-700'}`}>
                          <Icon name={adj.locked ? 'lock' : 'unlock'} className="w-3.5 h-3.5" />{adj.locked ? 'Locked' : 'Unlocked'}
                        </button>
                        {!adj.locked && !isEditing && <button onClick={() => { setEditingAdjId(adj.id); setEditAdjDraft({ qty: adj.qty, reason: adj.reason }); }} className="px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold">Edit</button>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 11. PURCHASES & FULL CRUD STOCK MANAGEMENT
    // =========================================================================
    function PurchasesPage({ products, onRecordPurchase }) {
      const [search, setSearch] = useState('');
      const [supplier, setSupplier] = useState('Local Wholesale Nursery');
      const [billNo, setBillNo] = useState('');
      const [purchaseDate, setPurchaseDate] = useState(todayStr());
      const [draftItems, setDraftItems] = useState({});

      const filtered = useMemo(() => products.filter((p) => smartMatch(p, search)).slice(0, 60), [products, search]);
      const selectedList = useMemo(() => Object.entries(draftItems).filter(([, v]) => Number(v.qty) > 0).map(([pid, v]) => {
        const p = products.find((x) => x.id === pid);
        return p ? { productId: pid, nameEn: p.nameEn, nameHi: p.nameHi, category: p.category, qty: Number(v.qty), costPrice: Number(v.costPrice) || Math.round(p.price * 0.55) } : null;
      }).filter(Boolean), [draftItems, products]);
      const grandTotal = selectedList.reduce((s, i) => s + i.qty * i.costPrice, 0);

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div><h2 className="text-2xl font-extrabold">Purchases Entry • खरीद प्रविष्टि</h2><p className="text-xs text-slate-500">Recording purchases automatically increases stock</p></div>
              <button onClick={() => { if (!selectedList.length) return; onRecordPurchase({ date: purchaseDate, supplier: supplier.trim() || 'Wholesale Nursery', billNo: billNo.trim() || `BILL-${Date.now().toString().slice(-4)}`, items: selectedList, total: grandTotal }); setDraftItems({}); setBillNo(''); }} disabled={selectedList.length === 0} className="px-6 py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold text-sm shadow disabled:opacity-40">
                Save Purchase ({selectedList.length} items • ₹{grandTotal.toLocaleString()})
              </button>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
              <input type="text" value={supplier} onChange={(e) => setSupplier(e.target.value)} placeholder="Supplier Name" className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold" />
              <input type="text" value={billNo} onChange={(e) => setBillNo(e.target.value)} placeholder="Supplier Bill No." className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold" />
              <input type="date" value={purchaseDate} onChange={(e) => setPurchaseDate(e.target.value)} className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold" />
              <div className="relative"><Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" /><input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Filter plants..." className="w-full pl-10 pr-3 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
            </div>
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3.5">
            {filtered.map((item) => {
              const entry = draftItems[item.id] || { qty: '', costPrice: Math.round(item.price * 0.55) };
              return (
                <div key={item.id} className={`rounded-xl bg-white dark:bg-slate-900 border overflow-hidden flex flex-col ${Number(entry.qty) > 0 ? 'border-emerald-500 ring-2 ring-emerald-500/20' : ''}`}>
                  <div className="h-24 bg-slate-100 dark:bg-slate-800 overflow-hidden">{item.image && <img src={item.image} alt={item.nameEn} className="w-full h-full object-cover" loading="lazy" />}</div>
                  <div className="p-3 space-y-2 flex-1 flex flex-col justify-between">
                    <div><h4 className="font-extrabold text-xs line-clamp-2">{item.nameEn}</h4><p className="text-[11px] text-slate-500 truncate">{item.nameHi}</p><p className="text-[11px] text-slate-400">Stock: <strong>{item.stock}</strong></p></div>
                    <div className="grid grid-cols-2 gap-1.5 pt-1.5 border-t">
                      <input type="number" min="0" placeholder="Qty" value={entry.qty} onChange={(e) => setDraftItems((prev) => ({ ...prev, [item.id]: { ...entry, qty: e.target.value } }))} className="w-full px-2 py-1 rounded-lg border bg-slate-50 dark:bg-slate-800 text-xs font-bold" />
                      <input type="number" min="0" value={entry.costPrice} onChange={(e) => setDraftItems((prev) => ({ ...prev, [item.id]: { ...entry, costPrice: e.target.value } }))} className="w-full px-2 py-1 rounded-lg border bg-slate-50 dark:bg-slate-800 text-xs font-bold" />
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function StockManagementPage({ products, plantCareDb, onAddProduct, onUpdateProduct, onDeleteProduct, onNavigateAdjustments, onOpenCustomerQR }) {
      const [tab, setTab] = useState('stock');
      const [search, setSearch] = useState('');
      const [editingProduct, setEditingProduct] = useState(null);

      const getCareDefaults = (prod) => {
        if (prod?.customCare) return prod.customCare;
        const matched = plantCareDb.find((c) => c.id === prod?.careId) || PREDEFINED_PLANT_CARE.find((c) => c.id === prod?.careId);
        return matched ? { season: matched.season, care: matched.care, water: matched.water, sunlight: matched.sunlight, fertilizer: matched.fertilizer } : { season: '', care: '', water: '', sunlight: '', fertilizer: '' };
      };

      const emptyForm = { nameEn: '', nameHi: '', image: '', category: CATEGORIES[0].en, price: 60, stock: 25, threshold: 10, careId: PREDEFINED_PLANT_CARE[0].id, season: PREDEFINED_PLANT_CARE[0].season, care: PREDEFINED_PLANT_CARE[0].care, water: PREDEFINED_PLANT_CARE[0].water, sunlight: PREDEFINED_PLANT_CARE[0].sunlight, fertilizer: PREDEFINED_PLANT_CARE[0].fertilizer };
      const [newForm, setNewForm] = useState(emptyForm);

      const openEditModal = (prod) => {
        const c = getCareDefaults(prod);
        setEditingProduct({ ...prod, season: c.season || '', care: c.care || '', water: c.water || '', sunlight: c.sunlight || '', fertilizer: c.fertilizer || '' });
      };

      const handleFileToImageUrl = async (e, setter) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const dataUrl = await compressImageFile(file);
        setter((prev) => ({ ...prev, image: dataUrl }));
      };

      const filteredProducts = products.filter((p) => smartMatch(p, search));

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-extrabold">Stock Management • स्टॉक प्रबंधन (Full CRUD)</h2>
              <p className="text-xs text-slate-500">Edit Name, Image URL, Category, Care Instructions, Price, Stock & Threshold</p>
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={onOpenCustomerQR} className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl border border-emerald-600 text-emerald-700 dark:text-emerald-400 text-xs font-extrabold"><Icon name="qr" className="w-4 h-4" /> Customer Catalog QR</button>
              <button onClick={onNavigateAdjustments} className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-amber-50 dark:bg-amber-950/50 text-amber-800 dark:text-amber-300 border border-amber-200 text-xs font-extrabold"><Icon name="lock" className="w-3.5 h-3.5" /> Stock Adjustments</button>
              {[{ id: 'stock', label: `Stock CRUD (${products.length})` }, { id: 'add', label: '+ Add Plant' }].map((t) => (
                <button key={t.id} onClick={() => setTab(t.id)} className={`px-4 py-2 rounded-xl text-xs font-extrabold ${tab === t.id ? 'bg-emerald-600 text-white shadow' : 'bg-slate-100 dark:bg-slate-800'}`}>{t.label}</button>
              ))}
            </div>
          </div>

          {tab === 'stock' && (
            <div className="bg-white dark:bg-slate-900 rounded-2xl border shadow-sm overflow-hidden">
              <div className="p-4 border-b flex flex-wrap items-center justify-between gap-3">
                <div className="relative w-full max-w-md"><Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" /><input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Filter varieties (English / Hindi / Hinglish)..." className="w-full pl-10 pr-4 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
                <span className="text-xs font-bold text-slate-500">{filteredProducts.length} varieties</span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead className="bg-slate-50 dark:bg-slate-800/70 text-xs uppercase text-slate-500">
                    <tr><th className="text-left px-4 py-3">Photo & Name</th><th className="text-left px-3 py-3">Category</th><th className="text-center px-3 py-3">Stock</th><th className="text-center px-3 py-3">Threshold</th><th className="text-right px-3 py-3">Price</th><th className="text-right px-4 py-3">Actions</th></tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {filteredProducts.map((p) => (
                      <tr key={p.id} className="hover:bg-slate-50/70 dark:hover:bg-slate-800/40">
                        <td className="px-4 py-2.5"><div className="flex items-center gap-3">{p.image ? <img src={p.image} alt={p.nameEn} className="w-11 h-11 rounded-lg object-cover border shrink-0" loading="lazy" /> : <div className="w-11 h-11 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400"><Icon name="leaf" className="w-5 h-5" /></div>}<div><div className="font-extrabold text-sm">{p.nameEn}</div><div className="text-xs text-slate-500">{p.nameHi}</div></div></div></td>
                        <td className="px-3 py-2.5 text-xs font-semibold">{p.category}</td>
                        <td className="px-3 py-2.5 text-center"><span className={`inline-block px-2.5 py-0.5 rounded-full font-extrabold text-xs ${p.stock <= p.threshold ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>{p.stock}</span></td>
                        <td className="px-3 py-2.5 text-center font-bold text-xs text-slate-500">{p.threshold}</td>
                        <td className="px-3 py-2.5 text-right font-extrabold">₹{p.price}</td>
                        <td className="px-4 py-2.5 text-right whitespace-nowrap space-x-1.5">
                          <button onClick={() => openEditModal(p)} className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border border-emerald-200 text-xs font-bold"><Icon name="edit" className="w-3.5 h-3.5" /> Edit</button>
                          <button onClick={() => { if (window.confirm(`Delete "${p.nameEn}"?`)) onDeleteProduct(p.id); }} className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-rose-50 dark:bg-rose-950/50 text-rose-600 border border-rose-200 text-xs font-bold"><Icon name="trash" className="w-3.5 h-3.5" /> Delete</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {tab === 'add' && (
            <form onSubmit={(e) => { e.preventDefault(); if (!newForm.nameEn.trim()) return; const catObj = CATEGORIES.find((c) => c.en === newForm.category); onAddProduct({ id: 'p-' + Date.now(), nameEn: newForm.nameEn.trim(), nameHi: newForm.nameHi.trim(), image: newForm.image.trim(), category: newForm.category, categoryHi: catObj ? catObj.hi : '', price: Math.max(0, Number(newForm.price) || 0), stock: Math.max(0, Number(newForm.stock) || 0), threshold: Math.max(0, Number(newForm.threshold) || 0), careId: newForm.careId, customCare: { season: newForm.season.trim(), care: newForm.care.trim(), water: newForm.water.trim(), sunlight: newForm.sunlight.trim(), fertilizer: newForm.fertilizer.trim() } }); setNewForm(emptyForm); setTab('stock'); }} className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm max-w-3xl space-y-5">
              <h3 className="text-xl font-extrabold">Add New Plant Variety • नया पौधा जोड़ें</h3>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <input required type="text" value={newForm.nameEn} onChange={(e) => setNewForm({ ...newForm, nameEn: e.target.value })} placeholder="Plant Name (English) *" className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
                <input type="text" value={newForm.nameHi} onChange={(e) => setNewForm({ ...newForm, nameHi: e.target.value })} placeholder="Plant Name (Hindi)" className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
                <select value={newForm.category} onChange={(e) => setNewForm({ ...newForm, category: e.target.value })} className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold">{CATEGORIES.map((c) => <option key={c.en} value={c.en}>{c.en}</option>)}</select>
                <input required type="number" min="0" value={newForm.price} onChange={(e) => setNewForm({ ...newForm, price: e.target.value })} placeholder="Selling Price ₹" className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
                <input required type="number" min="0" value={newForm.stock} onChange={(e) => setNewForm({ ...newForm, stock: e.target.value })} placeholder="Stock" className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
                <input required type="number" min="0" value={newForm.threshold} onChange={(e) => setNewForm({ ...newForm, threshold: e.target.value })} placeholder="Threshold" className="px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
              </div>
              <div className="flex flex-wrap gap-3 items-center">
                <input type="text" value={newForm.image} onChange={(e) => setNewForm({ ...newForm, image: e.target.value })} placeholder="Image URL" className="flex-1 min-w-[220px] px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-xs font-mono" />
                <label className="cursor-pointer px-4 py-2.5 rounded-xl bg-slate-800 text-white text-xs font-bold">Upload<input type="file" accept="image/*" onChange={(e) => handleFileToImageUrl(e, setNewForm)} className="hidden" /></label>
              </div>
              <div className="p-4 rounded-2xl bg-emerald-50/70 dark:bg-emerald-950/30 border space-y-3">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <input type="text" value={newForm.season} onChange={(e) => setNewForm({ ...newForm, season: e.target.value })} placeholder="Season" className="px-3 py-2 rounded-xl border bg-white dark:bg-slate-900 text-xs" />
                  <input type="text" value={newForm.water} onChange={(e) => setNewForm({ ...newForm, water: e.target.value })} placeholder="Water" className="px-3 py-2 rounded-xl border bg-white dark:bg-slate-900 text-xs" />
                  <input type="text" value={newForm.sunlight} onChange={(e) => setNewForm({ ...newForm, sunlight: e.target.value })} placeholder="Sunlight" className="px-3 py-2 rounded-xl border bg-white dark:bg-slate-900 text-xs" />
                  <input type="text" value={newForm.fertilizer} onChange={(e) => setNewForm({ ...newForm, fertilizer: e.target.value })} placeholder="Fertilizer" className="px-3 py-2 rounded-xl border bg-white dark:bg-slate-900 text-xs" />
                </div>
                <textarea rows="2" value={newForm.care} onChange={(e) => setNewForm({ ...newForm, care: e.target.value })} placeholder="Care Instructions" className="w-full px-3 py-2 rounded-xl border bg-white dark:bg-slate-900 text-xs" />
              </div>
              <button type="submit" className="px-6 py-3 rounded-xl bg-emerald-600 text-white font-extrabold text-sm shadow">Save Plant</button>
            </form>
          )}

          {editingProduct && (
            <div className="fixed inset-0 z-[90] flex items-center justify-center bg-slate-950/75 backdrop-blur-sm p-4">
              <form onSubmit={(e) => { e.preventDefault(); const catObj = CATEGORIES.find((c) => c.en === editingProduct.category); onUpdateProduct({ id: editingProduct.id, nameEn: editingProduct.nameEn.trim(), nameHi: editingProduct.nameHi.trim(), image: editingProduct.image.trim(), category: editingProduct.category, categoryHi: catObj ? catObj.hi : '', price: Math.max(0, Number(editingProduct.price) || 0), stock: Math.max(0, Number(editingProduct.stock) || 0), threshold: Math.max(0, Number(editingProduct.threshold) || 0), careId: editingProduct.careId, customCare: { season: editingProduct.season.trim(), care: editingProduct.care.trim(), water: editingProduct.water.trim(), sunlight: editingProduct.sunlight.trim(), fertilizer: editingProduct.fertilizer.trim() } }); setEditingProduct(null); }} className="w-full max-w-2xl rounded-3xl bg-white dark:bg-slate-900 border shadow-2xl overflow-hidden flex flex-col max-h-[92vh]">
                <div className="px-6 py-4 bg-emerald-600 text-white flex items-center justify-between">
                  <div><h3 className="text-lg font-extrabold">Edit Plant Details (Full CRUD)</h3><p className="text-xs text-emerald-100">Name, Image URL, Category, Care Instructions, Price, Stock & Threshold</p></div>
                  <button type="button" onClick={() => setEditingProduct(null)} className="p-2 rounded-xl hover:bg-emerald-700"><Icon name="close" className="w-5 h-5" /></button>
                </div>
                <div className="p-6 overflow-y-auto space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><label className="block text-xs font-bold mb-1">Name (English) *</label><input required type="text" value={editingProduct.nameEn} onChange={(e) => setEditingProduct({ ...editingProduct, nameEn: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold" /></div>
                    <div><label className="block text-xs font-bold mb-1">Name (Hindi)</label><input type="text" value={editingProduct.nameHi} onChange={(e) => setEditingProduct({ ...editingProduct, nameHi: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
                    <div><label className="block text-xs font-bold mb-1">Category *</label><select value={editingProduct.category} onChange={(e) => setEditingProduct({ ...editingProduct, category: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold">{CATEGORIES.map((c) => <option key={c.en} value={c.en}>{c.en}</option>)}</select></div>
                    <div><label className="block text-xs font-bold mb-1">Price (₹)</label><input type="number" min="0" value={editingProduct.price} onChange={(e) => setEditingProduct({ ...editingProduct, price: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" /></div>
                    <div><label className="block text-xs font-bold mb-1">Stock *</label><input required type="number" min="0" value={editingProduct.stock} onChange={(e) => setEditingProduct({ ...editingProduct, stock: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" /></div>
                    <div><label className="block text-xs font-bold mb-1">Threshold *</label><input required type="number" min="0" value={editingProduct.threshold} onChange={(e) => setEditingProduct({ ...editingProduct, threshold: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" /></div>
                  </div>
                  <div className="flex flex-wrap gap-2.5 items-center">
                    <input type="text" value={editingProduct.image || ''} onChange={(e) => setEditingProduct({ ...editingProduct, image: e.target.value })} placeholder="Image URL" className="flex-1 min-w-[200px] px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-xs font-mono" />

                  </div>
                  <div className="p-4 rounded-2xl bg-emerald-50/70 dark:bg-emerald-950/30 border space-y-2.5">
                    <span className="block text-xs font-extrabold uppercase text-emerald-800 dark:text-emerald-300">Care Instructions</span>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                      <input type="text" value={editingProduct.season} onChange={(e) => setEditingProduct({ ...editingProduct, season: e.target.value })} placeholder="Season" className="px-3 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs" />
                      <input type="text" value={editingProduct.water} onChange={(e) => setEditingProduct({ ...editingProduct, water: e.target.value })} placeholder="Water" className="px-3 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs" />
                      <input type="text" value={editingProduct.sunlight} onChange={(e) => setEditingProduct({ ...editingProduct, sunlight: e.target.value })} placeholder="Sunlight" className="px-3 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs" />
                      <input type="text" value={editingProduct.fertilizer} onChange={(e) => setEditingProduct({ ...editingProduct, fertilizer: e.target.value })} placeholder="Fertilizer" className="px-3 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs" />
