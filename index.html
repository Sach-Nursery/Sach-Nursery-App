    function filterRecordsByRange(records, range, singleDate, customStart, customEnd) {
      if (range === 'single' || range === 'today') {
        const target = range === 'today' ? todayDDMMYYYY() : formatStrictDDMMYYYY(singleDate);
        return records.filter((r) => formatStrictDDMMYYYY(r.date) === target);
      }
      if (range === 'all') return records;
      const now = new Date();
      let minTime = 0, maxTime = Infinity;
      if (range === '1m') { const d = new Date(now); d.setMonth(d.getMonth() - 1); minTime = d.getTime(); }
      else if (range === '3m') { const d = new Date(now); d.setMonth(d.getMonth() - 3); minTime = d.getTime(); }
      else if (range === '6m') { const d = new Date(now); d.setMonth(d.getMonth() - 6); minTime = d.getTime(); }
      else if (range === '1y') { const d = new Date(now); d.setFullYear(d.getFullYear() - 1); minTime = d.getTime(); }
      else if (range === 'custom') {
        minTime = toComparableTime(customStart) || 0;
        maxTime = (toComparableTime(customEnd) || Infinity) + 86399999;
      }
      return records.filter((r) => { const t = toComparableTime(r.date); return t >= minTime && t <= maxTime; });
    }

    function SummaryReportPage({ type, records, currentUser, staffEditWindow, onUpdateEntry, onDeleteEntry, onOpenExport, requestPin, onBack }) {
      const isSale = type === 'sale';
      const [mode, setMode] = useState('single');
      const [singleDate, setSingleDate] = useState(todayDDMMYYYY());
      const [cStart, setCStart] = useState(daysAgoDDMMYYYY(30));
      const [cEnd, setCEnd] = useState(todayDDMMYYYY());
      const [editingRec, setEditingRec] = useState(null);

      const isAdmin = currentUser?.role === 'Administrator';
      const isStaff = currentUser?.role === 'Staff';
      const editWindowMs = getEditWindowMs(staffEditWindow);

      const canEdit = (rec) => {
        if (isAdmin) return true;
        if (!isSale || !isStaff) return false;
        return rec.createdBy === currentUser.username && rec.createdAt && (Date.now() - rec.createdAt) <= editWindowMs;
      };

      const filtered = useMemo(() => filterRecordsByRange(records, mode, singleDate, cStart, cEnd), [records, mode, singleDate, cStart, cEnd]);
      const isSingle = mode === 'single';

      const agg = useMemo(() => {
        const byI = {}, byC = {}; let qty = 0;
        filtered.forEach((rec) => (rec.items || []).forEach((it) => {
          const v = isSale ? it.qty * it.price : it.qty * it.costPrice; qty += it.qty;
          if (!byI[it.productId]) byI[it.productId] = { nameEn: it.nameEn, nameHi: it.nameHi, category: it.category || 'Other', qty: 0, amount: 0 };
          byI[it.productId].qty += it.qty; byI[it.productId].amount += v;
          const cat = it.category || 'Other';
          if (!byC[cat]) byC[cat] = { category: cat, qty: 0, amount: 0 };
          byC[cat].qty += it.qty; byC[cat].amount += v;
        }));
        return { items: Object.values(byI).sort((a, b) => b.amount - a.amount), categories: Object.values(byC).sort((a, b) => b.amount - a.amount), qty };
      }, [filtered, isSale]);

      const totalVal = filtered.reduce((s, r) => s + (r.total || 0), 0);

      const triggerExport = () => {
        const run = () => {
          const rows = isSingle
            ? filtered.flatMap((r) => (r.items || []).map((it) => ({
                ID: r.id, Date: formatStrictDDMMYYYY(r.date), Party: isSale ? r.customer : r.supplier,
                Item: `${it.nameHi || it.nameEn} (${it.nameEn})`, Qty: `${it.qty} ${it.unit||'pcs'}`,
                Amount: Math.round(it.qty * (isSale ? it.price : it.costPrice)), BillTotal: r.total
              })))
            : agg.items.map((it) => ({ Item: `${it.nameHi || it.nameEn} (${it.nameEn})`, Category: it.category, Qty: it.qty, Value: Math.round(it.amount) }));
          onOpenExport({
            title: isSale ? 'Sale Summary Report' : 'Purchase Summary Report',
            subtitle: `Period: ${mode} • Bills: ${filtered.length} • Total: Rs.${totalVal}`,
            fileBase: isSale ? 'Sale-Summary' : 'Purchase-Summary',
            columns: isSingle
              ? [{ key:'ID', label:'ID' }, { key:'Date', label:'Date' }, { key:'Party', label:'Party' }, { key:'Item', label:'Item' }, { key:'Amount', label:'Amount' }]
              : [{ key:'Item', label:'Item' }, { key:'Category', label:'Category' }, { key:'Qty', label:'Qty' }, { key:'Value', label:'Value' }],
            rows
          });
        };
        if (isAdmin) requestPin('Authorize Sensitive Export', 'Enter PIN 1010 to export summary.', run);
        else run();
      };

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div><h2 className="text-2xl font-extrabold">{isSale ? 'Sale Summary • बिक्री सारांश' : 'Purchase Summary • खरीद सारांश'}</h2><p className="text-xs text-slate-500">Dates strictly DD-MM-YYYY {isSale && isStaff && `• Staff Edit Window: ${staffEditWindow.value} ${staffEditWindow.unit}`}</p></div>
              <div className="flex flex-wrap items-center gap-2.5">
                {onBack && <button onClick={onBack} className="px-4 py-2 rounded-xl border text-xs font-extrabold">← Back</button>}
                <button onClick={triggerExport} style={{ backgroundColor: 'var(--accent-primary)' }} className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white text-xs font-extrabold shadow"><Icon name="share" className="w-4 h-4" /> Export PDF / Excel</button>
                <div className="px-4 py-2 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 border text-right"><div className="text-[11px] font-bold uppercase text-emerald-700">Total ({filtered.length})</div><div className="text-xl font-extrabold text-emerald-700">₹{totalVal.toLocaleString()}</div></div>
              </div>
            </div>
            <div className="flex flex-wrap items-center gap-2 pt-2">
              {[{id:'single',l:'Single Day'},{id:'1m',l:'1 Month'},{id:'3m',l:'3 Months'},{id:'6m',l:'6 Months'},{id:'1y',l:'1 Year'},{id:'all',l:'All Time'},{id:'custom',l:'Custom'}].map((p) => <button key={p.id} onClick={() => setMode(p.id)} style={mode === p.id ? { backgroundColor: 'var(--accent-primary)' } : {}} className={`px-3.5 py-2 rounded-xl text-xs font-extrabold border ${mode === p.id ? 'text-white border-transparent' : 'bg-slate-50 dark:bg-slate-800'}`}>{p.l}</button>)}
              {mode === 'single' && <DateInputDDMMYYYY value={singleDate} onChange={setSingleDate} className="ml-2" />}
              {mode === 'custom' && <div className="flex items-center gap-2 ml-2"><DateInputDDMMYYYY value={cStart} onChange={setCStart} /><span className="text-xs font-bold">to</span><DateInputDDMMYYYY value={cEnd} onChange={setCEnd} /></div>}
            </div>
          </div>

          {isSingle ? (
            <div className="space-y-4">
              {!filtered.length ? <div className="rounded-2xl border-2 border-dashed p-12 text-center text-slate-500">No records on {singleDate}.</div> : filtered.map((rec) => (
                <div key={rec.id} className="bg-white dark:bg-slate-900 rounded-2xl border p-5 shadow-sm space-y-3">
                  <div className="flex flex-wrap justify-between gap-2 pb-3 border-b">
                    <div>
                      <span className="text-xs font-extrabold px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 mr-2">{rec.id}</span>
                      <span className="font-extrabold">{isSale ? rec.customer : rec.supplier}</span>
                      <span className="text-xs text-slate-400 ml-2">{formatStrictDDMMYYYY(rec.date)} • {rec.time||''}</span>
                      {rec.createdBy && <span className="ml-2 text-[11px] px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500">By: {rec.createdBy}</span>}
                    </div>
                    <div className="flex items-center gap-2">
                      {canEdit(rec) && <button onClick={() => setEditingRec(JSON.parse(JSON.stringify(rec)))} className="px-3 py-1 rounded-lg bg-amber-50 text-amber-800 border border-amber-300 text-xs font-bold">Edit</button>}
                      {isAdmin && <button onClick={() => requestPin('Delete Record', `Enter PIN 1010 to delete ${rec.id}.`, () => onDeleteEntry(rec.id))} className="px-3 py-1 rounded-lg bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold">Delete</button>}
                      <div className="text-right ml-2"><div className="text-lg font-extrabold text-emerald-600">₹{rec.total.toLocaleString()}</div>{isSale && <div className="text-[11px] text-slate-500">Cash: ₹{rec.cashAmount} | UPI: ₹{rec.upiAmount}</div>}</div>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">{rec.items.map((it, idx) => <div key={idx} className="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 flex justify-between text-xs"><div><div className="font-bold">{it.nameHi || it.nameEn}</div><div className="text-slate-500">{it.nameEn}</div></div><div className="font-bold">{it.qty} {it.unit||'pcs'} × ₹{isSale ? it.price : it.costPrice}</div></div>)}</div>
                </div>
              ))}
            </div>
          ) : (

    function WorkersAttendancePage({ label, workers, onAddWorker, onUpdateWorker, onDeleteWorker, attendance, onSetAttendance }) {
      const [date, setDate] = useState(todayDDMMYYYY());
      const [form, setForm] = useState({ name:'', nameHi:'', role:'Gardener / माली', phone:'', dailyWage:500, photo:'' });
      const [editingW, setEditingW] = useState(null);
      const dayRec = attendance[date] || {}, monthPart = date.slice(3); // MM-YYYY

      const getM = (id, wage) => {
        let p = 0, h = 0;
        Object.entries(attendance).forEach(([d, m]) => { if (d.endsWith(monthPart)) { if (m[id]==='Present') p++; else if (m[id]==='Half-Day') h++; } });
        return { p, h, pay: (p + h * 0.5) * wage };
      };

      const handlePhoto = async (e, setter) => { const f = e.target.files?.[0]; if (!f) return; const img = await compressImageFile(f, 360, 0.8); setter((prev) => ({ ...prev, photo: img })); };

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div><h2 className="text-2xl font-extrabold">{label} • कर्मचारी व उपस्थिति</h2><p className="text-xs text-slate-500">Exclusive Admin Control (Add, Edit, Delete Workers with Photo Uploads)</p></div>
            <DateInputDDMMYYYY value={date} onChange={setDate} />
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm divide-y">
              {workers.map((w) => {
                const st = dayRec[w.id] || 'Unmarked', m = getM(w.id, w.dailyWage);
                return (
                  <div key={w.id} className="p-4 flex flex-wrap items-center justify-between gap-4">
                    <div className="flex items-center gap-3">
                      {w.photo ? <img src={w.photo} alt={w.name} className="w-12 h-12 rounded-full object-cover border" /> : <div className="w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-extrabold">{w.name[0]}</div>}
                      <div><div className="font-extrabold">{w.name} {w.nameHi && <span className="text-sm text-slate-500">({w.nameHi})</span>}</div><div className="text-xs text-slate-500">{w.role} • ₹{w.dailyWage}/day • {monthPart}: <strong>{m.p}P/{m.h}H</strong> (₹{m.pay})</div></div>
                    </div>
                    <div className="flex flex-wrap items-center gap-1.5">
                      {['Present','Half-Day','Absent'].map((opt) => <button key={opt} onClick={() => onSetAttendance(date, w.id, opt)} className={`px-2.5 py-1 rounded-xl text-xs font-extrabold border ${st === opt ? (opt==='Present'?'bg-emerald-600 text-white':opt==='Half-Day'?'bg-amber-500 text-white':'bg-rose-600 text-white') : 'bg-slate-50 dark:bg-slate-800'}`}>{opt}</button>)}
                      <button onClick={() => setEditingW({ ...w })} className="p-1.5 rounded-lg border text-xs font-bold"><Icon name="edit" className="w-3.5 h-3.5" /></button>
                      <button onClick={() => { if (window.confirm(`Delete worker ${w.name}?`)) onDeleteWorker(w.id); }} className="p-1.5 rounded-lg border text-rose-600 text-xs font-bold"><Icon name="trash" className="w-3.5 h-3.5" /></button>
                    </div>
                  </div>
                );
              })}
            </div>
            <form onSubmit={(e) => { e.preventDefault(); if (!form.name.trim()) return; onAddWorker({ ...form, id:'w-'+Date.now(), dailyWage:Number(form.dailyWage)||500 }); setForm({ name:'', nameHi:'', role:'Gardener / माली', phone:'', dailyWage:500, photo:'' }); }} className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-3 h-fit">
              <h3 className="font-extrabold text-lg">Add Worker</h3>
              <input required type="text" placeholder="Name (EN) *" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <input type="text" placeholder="Name (HI)" value={form.nameHi} onChange={(e) => setForm({ ...form, nameHi: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <input type="text" placeholder="Role" value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <input type="number" min="0" value={form.dailyWage} onChange={(e) => setForm({ ...form, dailyWage: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
              <label className="block cursor-pointer py-2 px-3 rounded-xl border text-xs font-bold text-center bg-slate-50 dark:bg-slate-800">{form.photo ? '✓ Photo Attached' : '+ Upload Worker Photo'}<input type="file" accept="image/*" onChange={(e) => handlePhoto(e, setForm)} className="hidden" /></label>
              <button type="submit" style={{ backgroundColor: 'var(--accent-primary)' }} className="w-full py-2.5 rounded-xl text-white font-extrabold text-sm">+ Add Worker</button>
            </form>
          </div>
          {editingW && (
            <div className="fixed inset-0 z-[95] flex items-center justify-center bg-slate-950/75 p-4">
              <form onSubmit={(e) => { e.preventDefault(); onUpdateWorker({ ...editingW, dailyWage: Number(editingW.dailyWage)||500 }); setEditingW(null); }} className="w-full max-w-sm rounded-2xl bg-white dark:bg-slate-900 border p-6 space-y-3 shadow-2xl">
                <h3 className="font-extrabold text-lg">Edit Worker</h3>
                <input required type="text" value={editingW.name} onChange={(e) => setEditingW({ ...editingW, name: e.target.value })} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
                <input type="text" value={editingW.nameHi||''} onChange={(e) => setEditingW({ ...editingW, nameHi: e.target.value })} placeholder="Hindi Name" className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
                <input type="text" value={editingW.role} onChange={(e) => setEditingW({ ...editingW, role: e.target.value })} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
                <input type="number" min="0" value={editingW.dailyWage} onChange={(e) => setEditingW({ ...editingW, dailyWage: e.target.value })} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
                <label className="block cursor-pointer py-2 px-3 rounded-xl border text-xs font-bold text-center">{editingW.photo ? 'Replace Photo' : '+ Upload Photo'}<input type="file" accept="image/*" onChange={(e) => handlePhoto(e, setEditingW)} className="hidden" /></label>
                <div className="flex justify-end gap-2 pt-2"><button type="button" onClick={() => setEditingW(null)} className="px-4 py-2 rounded-xl border text-xs font-bold">Cancel</button><button type="submit" style={{ backgroundColor: 'var(--accent-primary)' }} className="px-5 py-2 rounded-xl text-white text-xs font-extrabold">Update</button></div>
              </form>
            </div>
          )}
        </div>
      );
    }

            </div>
            <div className="flex gap-2">
              <button type="submit" style={{ backgroundColor: 'var(--accent-primary)' }} className="px-5 py-2.5 rounded-xl text-white text-xs font-extrabold shadow">Update All UI Labels</button>
              <button type="button" onClick={() => setLblDraft(DEFAULT_LABELS)} className="px-4 py-2.5 rounded-xl border text-xs font-bold">Reset Defaults</button>
            </div>
          </form>

          {/* 4. Staff Edit Window */}
          <form onSubmit={(e) => { e.preventDefault(); requestPin('Save Staff Edit Window', 'Enter PIN 1010 to update edit window.', () => onSaveEditWindow({ value: Math.max(0, Number(winDraft.value)||0), unit: winDraft.unit })); }} className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm space-y-4">
            <div><h2 className="text-xl font-extrabold">4. Staff Entry Edit Time Window</h2><p className="text-xs text-slate-500">Time duration during which Staff can edit their own sales entries</p></div>
            <div className="flex flex-wrap items-center gap-3">
              <input type="number" min="0" value={winDraft.value} onChange={(e) => setWinDraft({ ...winDraft, value: e.target.value })} className="w-28 px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
              <select value={winDraft.unit} onChange={(e) => setWinDraft({ ...winDraft, unit: e.target.value })} className="px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold">
                <option value="minutes">Minutes</option><option value="hours">Hours</option><option value="days">Days</option>
              </select>
              <button type="submit" style={{ backgroundColor: 'var(--accent-primary)' }} className="px-5 py-2.5 rounded-xl text-white text-xs font-extrabold shadow">Save Window</button>
            </div>
          </form>

          {/* 5. PIN-Authorized Inventory Excel Import & Export */}
          <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm space-y-4">
            <div className="flex flex-wrap justify-between gap-2">
              <div><h2 className="text-xl font-extrabold">5. Inventory Excel Import & Export</h2><p className="text-xs text-slate-500">Protected by Secondary PIN 1010 (Staff strictly denied import)</p></div>
              <span className="px-2.5 py-1 rounded-lg bg-amber-50 text-amber-700 text-[11px] font-bold border border-amber-200 h-fit">PIN 1010 Required</span>
            </div>
            <div className="flex flex-wrap gap-3">
              <button type="button" onClick={handleExportInv} style={{ backgroundColor: 'var(--accent-primary)' }} className="flex items-center gap-2 px-5 py-2.5 rounded-xl text-white text-xs font-extrabold shadow"><Icon name="excel" className="w-4 h-4" /> Export Inventory (.xlsx)</button>
              <button type="button" onClick={() => fileRef.current?.click()} className="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-slate-900 dark:bg-slate-700 text-white text-xs font-extrabold shadow"><Icon name="excel" className="w-4 h-4" /> Import Inventory (.xlsx / .csv)</button>
              <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleImport} className="hidden" />
            </div>
          </div>

          {/* 6. Administrator-Exclusive User & Credential Management */}
          <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm space-y-5">
            <div><h2 className="text-xl font-extrabold">6. User Management (Admin Exclusive)</h2><p className="text-xs text-slate-500">Staff role restricted exclusively to Sales & Sale Summary • Only Administrator can modify usernames/passwords</p></div>
            <div className="overflow-x-auto rounded-xl border">
              <table className="w-full text-sm">
                <thead className="bg-slate-50 dark:bg-slate-800/70 text-xs uppercase text-slate-500"><tr><th className="text-left px-4 py-2.5">Username</th><th className="text-left px-3 py-2.5">Role</th><th className="text-center px-3 py-2.5">Status</th><th className="text-right px-4 py-2.5">Actions</th></tr></thead>
                <tbody className="divide-y">{users.map((u) => (
                  <tr key={u.id}>
                    <td className="px-4 py-3 font-extrabold">{u.username} {u.isPrimary && <span className="ml-1 text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">Primary</span>}</td>
                    <td className="px-3 py-3 text-xs font-semibold">{u.role}</td>
                    <td className="px-3 py-3 text-center"><span className={`px-2.5 py-0.5 rounded-full text-[11px] font-bold ${u.active ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}`}>{u.active ? 'Active' : 'Disabled'}</span></td>
                    <td className="px-4 py-3 text-right space-x-2">
                      <button onClick={() => requestPin('PIN 1010: Edit Credentials', `Modify credentials for "${u.username}"`, () => setEditUserModal({ ...u }))} className="px-3 py-1 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold">Edit Credentials</button>
                      {!u.isPrimary && <><button onClick={() => requestPin('Toggle User', `Toggle ${u.username}?`, () => onSaveUsers(users.map((x) => x.id === u.id ? { ...x, active: !x.active } : x)))} className="px-3 py-1 rounded-lg border text-xs font-bold">{u.active ? 'Disable' : 'Enable'}</button><button onClick={() => requestPin('Delete User', `Remove "${u.username}"?`, () => onSaveUsers(users.filter((x) => x.id !== u.id)))} className="px-3 py-1 rounded-lg bg-rose-50 text-rose-600 border text-xs font-bold">Remove</button></>}
                    </td>
                  </tr>
                ))}</tbody>
              </table>
            </div>
            <form onSubmit={(e) => { e.preventDefault(); if (!newU.username.trim() || !newU.password) return; requestPin('PIN 1010: Add User', `Create ${newU.role} "${newU.username.trim()}".`, () => { onSaveUsers([...users, { id:'u-'+Date.now(), username:newU.username.trim(), password:newU.password, role:newU.role, active:true, isPrimary:false }]); setNewU({ username:'', password:'', role:'Staff' }); }); }} className="grid grid-cols-1 sm:grid-cols-4 gap-3 pt-2 border-t items-end">
              <input required type="text" value={newU.username} onChange={(e) => setNewU({ ...newU, username: e.target.value })} placeholder="New Username *" className="px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <input required type="password" value={newU.password} onChange={(e) => setNewU({ ...newU, password: e.target.value })} placeholder="Password *" className="px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <select value={newU.role} onChange={(e) => setNewU({ ...newU, role: e.target.value })} className="px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold"><option value="Staff">Staff (Sales & Sale Summary)</option><option value="Administrator">Administrator (Full Access)</option></select>
              <button type="submit" className="py-2.5 px-4 rounded-xl bg-slate-900 dark:bg-emerald-600 text-white text-xs font-extrabold">+ Add User</button>
            </form>
          </div>

          <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm flex items-center justify-between">
            <div><h3 className="font-extrabold text-sm">Signed-in: {currentUser?.username}</h3><p className="text-xs text-slate-500">{currentUser?.role} • {nurseryProfile.nurseryName}</p></div>
            <button onClick={onLogout} className="flex items-center gap-2 px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-extrabold"><Icon name="logout" className="w-4 h-4" /> Logout</button>
          </div>

          {editUserModal && (
            <div className="fixed inset-0 z-[95] flex items-center justify-center bg-slate-950/75 backdrop-blur-sm p-4">
              <form onSubmit={(e) => { e.preventDefault(); onSaveUsers(users.map((x) => x.id === editUserModal.id ? { ...editUserModal, username: editUserModal.username.trim() } : x)); setEditUserModal(null); }} className="w-full max-w-sm rounded-2xl bg-white dark:bg-slate-900 border p-6 space-y-4 shadow-2xl">
                <h3 className="text-lg font-extrabold">Edit Credentials (Admin Only)</h3>
                <div><label className="block text-xs font-bold mb-1">Username</label><input required type="text" value={editUserModal.username} onChange={(e) => setEditUserModal({ ...editUserModal, username: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" /></div>
                <div><label className="block text-xs font-bold mb-1">New Password</label><input required type="password" value={editUserModal.password} onChange={(e) => setEditUserModal({ ...editUserModal, password: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
                <div className="flex justify-end gap-2"><button type="button" onClick={() => setEditUserModal(null)} className="px-4 py-2 rounded-xl border text-xs font-bold">Cancel</button><button type="submit" style={{ backgroundColor: 'var(--accent-primary)' }} className="px-5 py-2 rounded-xl text-white text-xs font-extrabold">Save</button></div>
              </form>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 14. DASHBOARD: 4-CARD GRID WITH DROPDOWN RANGE SELECTORS & DUAL-VIEW ALERTS / STAFF SUMMARY
    // =========================================================================
    function DashboardPage({ labels, nurseryProfile, currentUser, products, sales, purchases, users, systemMessages, onNavigate, onOpenQR, onOpenCustomerPreview, onOpenExport, requestPin }) {
      // Single clickable dropdown per summary card
      const [saleRange, setSaleRange] = useState('today');
      const [saleCStart, setSaleCStart] = useState(daysAgoDDMMYYYY(30));
      const [saleCEnd, setSaleCEnd] = useState(todayDDMMYYYY());

      const [purRange, setPurRange] = useState('today');
      const [purCStart, setPurCStart] = useState(daysAgoDDMMYYYY(30));
      const [purCEnd, setPurCEnd] = useState(todayDDMMYYYY());

      // Dual-view Alerts & Notifications Card ('alerts' | 'staff-summary')
      const [alertTab, setAlertTab] = useState('alerts');
      const [staffRoleFilter, setStaffRoleFilter] = useState('ALL');
      const [staffUserFilter, setStaffUserFilter] = useState('ALL');
      const [staffRange, setStaffRange] = useState('all');
      const [staffCStart, setStaffCStart] = useState(daysAgoDDMMYYYY(30));
      const [staffCEnd, setStaffCEnd] = useState(todayDDMMYYYY());

      // Sale Summary Calculations (Today prominently + Cash & UPI breakdown)
      const saleStats = useMemo(() => {
        const list = filterRecordsByRange(sales, saleRange, todayDDMMYYYY(), saleCStart, saleCEnd);
        const todayList = sales.filter((s) => formatStrictDDMMYYYY(s.date) === todayDDMMYYYY());
        return {
          todayTotal: todayList.reduce((a, s) => a + s.total, 0),
          rangeTotal: list.reduce((a, s) => a + s.total, 0),
          cash: list.reduce((a, s) => a + (s.cashAmount || 0), 0),
          upi: list.reduce((a, s) => a + (s.upiAmount || 0), 0),
          count: list.length
        };
      }, [sales, saleRange, saleCStart, saleCEnd]);

      // Purchase Summary Calculations (Strictly Cash expenditure — NO UPI split)
      const purStats = useMemo(() => {
        const list = filterRecordsByRange(purchases, purRange, todayDDMMYYYY(), purCStart, purCEnd);
        const todayList = purchases.filter((p) => formatStrictDDMMYYYY(p.date) === todayDDMMYYYY());
        return {
          todayCash: todayList.reduce((a, p) => a + p.total, 0),
          rangeCash: list.reduce((a, p) => a + p.total, 0),
          count: list.length
        };
      }, [purchases, purRange, purCStart, purCEnd]);

      // Auto-clearing Stock Threshold Alerts + Predictive Agronomic Alerts from Crop Scheduler
      const activeAlerts = useMemo(() => {
        const stockWarnings = products
          .filter((p) => Number(p.stock) < Number(p.threshold))
          .map((p) => ({
            id: 'stk-' + p.id,
            category: 'Low Stock Threshold',
            severity: p.stock === 0 ? 'Critical' : 'Warning',
            message: `${p.nameHi} (${p.nameEn}): Stock ${p.stock} < Threshold ${p.threshold}`,
            date: todayDDMMYYYY()
          }));

        const agronomicAlerts = products
          .filter((p) => ['Fruit Plants', 'Flowering Plants', 'Medicinal & Herbs'].includes(p.category) && p.stock > 0)
          .slice(0, 6)
          .map((p) => {
            const c = getHindiCare(p);
            return {
              id: 'agro-' + p.id,
              category: 'Crop Scheduler Alert',
              severity: 'Advisory',
              message: `${p.nameHi}: मौसम (${c.season}) — ${c.water}`,
              date: todayDDMMYYYY()
            };
          });

        const sys = (systemMessages || []).map((m, i) => ({ id: 'sys-' + i, category: 'System', severity: 'Info', message: m, date: todayDDMMYYYY() }));
        return [...stockWarnings, ...agronomicAlerts, ...sys];
      }, [products, systemMessages]);

      // Staff Summary Calculation (filterable by Role & Individual Employee)
      const staffSummary = useMemo(() => {
        const ranged = filterRecordsByRange(sales, staffRange, todayDDMMYYYY(), staffCStart, staffCEnd);
        const allowedUsers = users.filter((u) => (staffRoleFilter === 'ALL' || u.role === staffRoleFilter) && (staffUserFilter === 'ALL' || u.username === staffUserFilter));
        const allowedNames = new Set(allowedUsers.map((u) => u.username));
        const matchedSales = ranged.filter((s) => allowedNames.has(s.createdBy));
        const byUser = {};
        matchedSales.forEach((s) => {
          const uObj = users.find((u) => u.username === s.createdBy);
          if (!byUser[s.createdBy]) byUser[s.createdBy] = { username: s.createdBy, role: uObj?.role || 'Staff', bills: 0, cash: 0, upi: 0, total: 0 };
          byUser[s.createdBy].bills += 1;
          byUser[s.createdBy].cash += s.cashAmount || 0;
          byUser[s.createdBy].upi += s.upiAmount || 0;
          byUser[s.createdBy].total += s.total || 0;
        });
        return { rows: Object.values(byUser), total: matchedSales.reduce((a, s) => a + s.total, 0), bills: matchedSales.length };
      }, [sales, users, staffRoleFilter, staffUserFilter, staffRange, staffCStart, staffCEnd]);

      const exportAlerts = () => {
        requestPin('Authorize Alerts Export', 'Enter PIN 1010 to export Threshold & Agronomic Alerts.', () => {
          onOpenExport({
            title: 'Threshold & Predictive Agronomic Alerts',
            subtitle: `${activeAlerts.length} Active Alerts • ${todayDDMMYYYY()}`,
            fileBase: 'Nursery-Alerts',
            columns: [{ key:'category', label:'Type' }, { key:'severity', label:'Severity' }, { key:'date', label:'Date' }, { key:'message', label:'Alert Message' }],
            rows: activeAlerts
          });
        });
      };

      const rangeOptions = [
        { id:'today', l:'Today' }, { id:'1m', l:'1 Month' }, { id:'3m', l:'3 Months' },
        { id:'6m', l:'6 Months' }, { id:'1y', l:'1 Year' }, { id:'all', l:'All Time' }, { id:'custom', l:'Custom' }
      ];

      return (
        <div className="space-y-7">
          {/* Top Banner */}
          <div style={{ background: `linear-gradient(135deg, var(--accent-primary), var(--accent-secondary))` }} className="rounded-3xl text-white p-6 shadow-xl flex flex-col lg:flex-row items-start lg:items-center justify-between gap-5">
            <div className="space-y-1">
              <span className="inline-block px-3 py-1 rounded-full bg-white/15 text-xs font-bold">{nurseryProfile.nurseryName} • {todayDDMMYYYY()}</span>
              <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight">{labels.dashboardTitle}</h1>
              <p className="text-white/85 text-xs sm:text-sm">Signed in as {currentUser?.username} ({currentUser?.role}) • Hybrid Offline-First Mode</p>
            </div>
            <div className="flex flex-wrap items-center gap-3">
              <button onClick={onOpenQR} className="flex items-center gap-2 px-5 py-3 rounded-2xl bg-white text-slate-900 font-extrabold text-sm shadow-lg"><Icon name="qr" className="w-5 h-5" /><span>Scan QR Code</span></button>
              <DigitalCatalogQRWidget nurseryProfile={nurseryProfile} size={58} onPreview={onOpenCustomerPreview} />
            </div>
          </div>

          {/* 4-Card Grid Layout */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {/* CARD 1: Inventory & Sales Shortcut */}
            <div className="rounded-3xl bg-white dark:bg-slate-900 border p-6 shadow-sm flex flex-col justify-between min-h-[240px]">
              <div className="flex items-start justify-between">
                <div style={{ backgroundColor: 'var(--accent-primary)' }} className="p-3.5 rounded-2xl text-white"><Icon name="cart" className="w-7 h-7" /></div>
                <button onClick={() => onNavigate('inventory-sales')} style={{ color: 'var(--accent-primary)' }} className="text-xs font-extrabold hover:underline">Open Module →</button>
              </div>
              <div className="space-y-2 pt-4">
                <h3 className="text-xl font-extrabold">{labels.inventorySalesTitle}</h3>
                <p className="text-xs text-slate-500">Unified Hindi-first POS & unrestricted {products.length} varieties with Voice Billing & Hindi Care Info.</p>
              </div>
              <div className="flex flex-wrap gap-2 pt-4">
                <button onClick={() => onNavigate('inventory-sales')} style={{ backgroundColor: 'var(--accent-primary)' }} className="px-4 py-2 rounded-xl text-white text-xs font-extrabold shadow">Start Billing</button>
                <button onClick={() => onNavigate('crop-scheduler')} className="px-4 py-2 rounded-xl border text-xs font-extrabold hover:border-emerald-500">Crop Scheduler</button>
              </div>
            </div>

            {/* CARD 2: Sale Summary Card (Single Dropdown + Today Total + Cash & UPI Split) */}
            <div className="rounded-3xl bg-white dark:bg-slate-900 border p-6 shadow-sm flex flex-col justify-between min-h-[240px]">
              <div className="flex items-center justify-between gap-2">
                <h3 className="text-lg font-extrabold">{labels.saleSummaryCardTitle}</h3>
                <select value={saleRange} onChange={(e) => setSaleRange(e.target.value)} className="px-3 py-1.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-xs font-bold outline-none">
                  {rangeOptions.map((o) => <option key={o.id} value={o.id}>{o.l}</option>)}
                </select>
              </div>
              {saleRange === 'custom' && (
                <div className="flex flex-wrap items-center gap-1.5 pt-2"><DateInputDDMMYYYY value={saleCStart} onChange={setSaleCStart} /><span className="text-xs">to</span><DateInputDDMMYYYY value={saleCEnd} onChange={setSaleCEnd} /></div>
              )}
              <div className="my-3 space-y-1">
                <div className="text-[11px] font-bold uppercase text-slate-400">Today's Total Sales</div>
                <div style={{ color: 'var(--accent-primary)' }} className="text-3xl font-extrabold">₹{saleStats.todayTotal.toLocaleString()}</div>
                {saleRange !== 'today' && <div className="text-xs font-bold text-slate-600 dark:text-slate-300">Selected Range ({saleRange}): ₹{saleStats.rangeTotal.toLocaleString()} ({saleStats.count} bills)</div>}
              </div>
              <div className="grid grid-cols-2 gap-2 pt-3 border-t text-xs">
                <div className="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/30"><span className="text-slate-500 block">Cash Received</span><strong className="text-sm text-emerald-700 dark:text-emerald-300">₹{saleStats.cash.toLocaleString()}</strong></div>
                <div className="p-2.5 rounded-xl bg-sky-50 dark:bg-sky-950/30"><span className="text-slate-500 block">UPI Received</span><strong className="text-sm text-sky-700 dark:text-sky-300">₹{saleStats.upi.toLocaleString()}</strong></div>
              </div>
            </div>

            {/* CARD 3: Purchase Summary Card (Single Dropdown + Strictly Cash Expenditures — NO UPI Split) */}
            <div className="rounded-3xl bg-white dark:bg-slate-900 border p-6 shadow-sm flex flex-col justify-between min-h-[240px]">
              <div className="flex items-center justify-between gap-2">
                <h3 className="text-lg font-extrabold">{labels.purchaseSummaryCardTitle}</h3>
                <select value={purRange} onChange={(e) => setPurRange(e.target.value)} className="px-3 py-1.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-xs font-bold outline-none">
                  {rangeOptions.map((o) => <option key={o.id} value={o.id}>{o.l}</option>)}
                </select>
              </div>
              {purRange === 'custom' && (
                <div className="flex flex-wrap items-center gap-1.5 pt-2"><DateInputDDMMYYYY value={purCStart} onChange={setPurCStart} /><span className="text-xs">to</span><DateInputDDMMYYYY value={purCEnd} onChange={setPurCEnd} /></div>
              )}
              <div className="my-3 space-y-1">
                <div className="text-[11px] font-bold uppercase text-slate-400">Today's Cash Expenditures</div>
                <div className="text-3xl font-extrabold text-amber-600 dark:text-amber-400">₹{purStats.todayCash.toLocaleString()}</div>
                {purRange !== 'today' && <div className="text-xs font-bold text-slate-600 dark:text-slate-300">Selected Range Cash ({purRange}): ₹{purStats.rangeCash.toLocaleString()}</div>}
              </div>
              <div className="pt-3 border-t flex items-center justify-between text-xs">
                <span className="font-semibold text-slate-500">Cash Purchases Recorded: <strong>{purStats.count}</strong></span>
                <button onClick={() => onNavigate('purchases')} className="font-extrabold text-amber-600 hover:underline">Open Purchases →</button>
              </div>
            </div>

            {/* CARD 4: Dual-View Notifications & Alerts / Staff Summary Card */}
            <div className="rounded-3xl bg-white dark:bg-slate-900 border p-6 shadow-sm flex flex-col justify-between min-h-[280px]">
              <div className="flex flex-wrap items-center justify-between gap-2 pb-3 border-b">
                <div className="flex items-center gap-2">
                  <Icon name="bell" className="w-5 h-5 text-rose-500" />
                  <h3 className="text-lg font-extrabold">{labels.alertsCardTitle}</h3>
                </div>
                <div className="flex items-center gap-1.5">
                  <button onClick={() => setAlertTab('alerts')} style={alertTab === 'alerts' ? { backgroundColor: 'var(--accent-primary)' } : {}} className={`px-3 py-1 rounded-lg text-[11px] font-extrabold ${alertTab === 'alerts' ? 'text-white' : 'bg-slate-100 dark:bg-slate-800'}`}>Alerts ({activeAlerts.length})</button>
                  <button onClick={() => setAlertTab('staff-summary')} style={alertTab === 'staff-summary' ? { backgroundColor: 'var(--accent-primary)' } : {}} className={`px-3 py-1 rounded-lg text-[11px] font-extrabold ${alertTab === 'staff-summary' ? 'text-white' : 'bg-slate-100 dark:bg-slate-800'}`}>Staff Summary</button>
                </div>
              </div>

              {alertTab === 'alerts' ? (
                <div className="flex-1 flex flex-col justify-between pt-3 space-y-3">
                  <div className="max-h-40 overflow-y-auto space-y-2 pr-1">
                    {activeAlerts.length === 0 ? <p className="text-xs text-slate-400">All thresholds healthy. Zero pending alerts.</p> : activeAlerts.map((al) => (
                      <div key={al.id} className={`p-2 rounded-xl text-xs border ${al.category === 'Low Stock Threshold' ? 'bg-rose-50 dark:bg-rose-950/30 border-rose-200 text-rose-800 dark:text-rose-300' : 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-200 text-emerald-800 dark:text-emerald-300'}`}>
                        <div className="flex justify-between font-extrabold text-[10px] uppercase"><span>{al.category}</span><span>{al.date}</span></div>
                        <div className="font-semibold mt-0.5">{al.message}</div>
                      </div>
                    ))}
                  </div>
                  <div className="flex justify-end pt-2 border-t">
                    <button onClick={exportAlerts} className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-extrabold"><Icon name="share" className="w-3.5 h-3.5" /> Export Alerts (PDF / Excel)</button>
                  </div>
                </div>
              ) : (
                <div className="flex-1 flex flex-col justify-between pt-3 space-y-3">
                  <div className="grid grid-cols-3 gap-2">
                    <select value={staffRoleFilter} onChange={(e) => setStaffRoleFilter(e.target.value)} className="px-2 py-1.5 rounded-lg border bg-slate-50 dark:bg-slate-800 text-[11px] font-bold">
                      <option value="ALL">All Roles</option><option value="Administrator">Administrator</option><option value="Staff">Staff</option>
                    </select>
                    <select value={staffUserFilter} onChange={(e) => setStaffUserFilter(e.target.value)} className="px-2 py-1.5 rounded-lg border bg-slate-50 dark:bg-slate-800 text-[11px] font-bold">
                      <option value="ALL">All Employees</option>
                      {users.map((u) => <option key={u.id} value={u.username}>{u.username}</option>)}
                    </select>
                    <select value={staffRange} onChange={(e) => setStaffRange(e.target.value)} className="px-2 py-1.5 rounded-lg border bg-slate-50 dark:bg-slate-800 text-[11px] font-bold">
                      {rangeOptions.map((o) => <option key={o.id} value={o.id}>{o.l}</option>)}
                    </select>
                  </div>
                  {staffRange === 'custom' && <div className="flex gap-1 items-center"><DateInputDDMMYYYY value={staffCStart} onChange={setStaffCStart} /><DateInputDDMMYYYY value={staffCEnd} onChange={setStaffCEnd} /></div>}
                  <div className="max-h-32 overflow-y-auto divide-y text-xs">
                    {staffSummary.rows.length === 0 ? <p className="text-slate-400 py-2">No sales for selected staff filter.</p> : staffSummary.rows.map((r) => (
                      <div key={r.username} className="py-1.5 flex justify-between items-center">
                        <div><strong className="font-extrabold">{r.username}</strong> <span className="text-[10px] text-slate-400">({r.role} • {r.bills} bills)</span></div>
                        <div className="text-right font-bold">₹{r.total.toLocaleString()} <span className="text-[10px] text-slate-400">(C:{r.cash}/U:{r.upi})</span></div>
                      </div>
                    ))}
                  </div>
                  <div className="flex justify-between items-center pt-2 border-t text-xs">
                    <span className="font-extrabold">Total: ₹{staffSummary.total.toLocaleString()}</span>
                    <button onClick={() => requestPin('Export Staff Summary', 'Enter PIN 1010 to export Staff Summary.', () => onOpenExport({ title: 'Staff Sales Summary', subtitle: `Role: ${staffRoleFilter} • Employee: ${staffUserFilter}`, fileBase: 'Staff-Summary', columns: [{key:'username',label:'Employee'},{key:'role',label:'Role'},{key:'bills',label:'Bills'},{key:'cash',label:'Cash'},{key:'upi',label:'UPI'},{key:'total',label:'Total'}], rows: staffSummary.rows }))} className="px-3 py-1.5 rounded-xl bg-slate-900 text-white font-extrabold">Export</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 15. ROOT APP SHELL (Session Persistence, Hybrid Sync, PIN Gateways, Dynamic CSS Theme)
    // =========================================================================
    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [loadingDb, setLoadingDb] = useState(true);
      const [sidebarExpanded, setSidebarExpanded] = useState(false);
      const [activePage, setActivePage] = useState('dashboard');
      const [customerMode, setCustomerMode] = useState(window.location.hash === '#price-free-catalog');

      const [nurseryProfile, setNurseryProfile] = useState(DEFAULT_PROFILE);
      const [themeCfg, setThemeCfg] = useState(DEFAULT_THEME_CFG);
      const [labels, setLabels] = useState(DEFAULT_LABELS);
      const [staffEditWindow, setStaffEditWindow] = useState(DEFAULT_EDIT_WINDOW);
      const [users, setUsers] = useState(DEFAULT_USERS);
      const [products, setProducts] = useState([]);
      const [sales, setSales] = useState([]);
      const [purchases, setPurchases] = useState([]);
      const [adjustments, setAdjustments] = useState([]);
      const [workers, setWorkers] = useState([]);
      const [attendance, setAttendance] = useState({});
      const [bills, setBills] = useState([]);
      const [cart, setCart] = useState([]);

      // Hybrid Offline Sync State
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [syncQueue, setSyncQueue] = useState([]);
      const [systemMessages, setSystemMessages] = useState([]);

      // Overlays
      const [qrOpen, setQrOpen] = useState(false);
      const [checkoutOpen, setCheckoutOpen] = useState(false);
      const [waDispatch, setWaDispatch] = useState(null);
      const [exportCfg, setExportCfg] = useState(null);
      const [toast, setToast] = useState('');
      const [pinModal, setPinModal] = useState({ open: false, title: '', subtitle: '', onOk: null });

      const showToast = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(''), 3200); }, []);
      const requestPin = useCallback((title, subtitle, onOk) => setPinModal({ open: true, title, subtitle, onOk }), []);

      // Register Service Worker & Background Sync Listeners
      useEffect(() => {
        registerHybridServiceWorker();
        const flushSync = async () => {
          const q = (await idb.get(SYNC_QUEUE_KEY)) || [];
          if (navigator.onLine && q.length > 0) {
            await idb.set(SYNC_QUEUE_KEY, []);
            setSyncQueue([]);
            setSystemMessages((prev) => [`Background Sync completed (${q.length} offline records synced).`, ...prev.slice(0, 4)]);
            showToast(`Background Sync: ${q.length} offline transactions synced.`);
          }
        };
        const onOnline = () => { setIsOnline(true); flushSync(); };
        const onOffline = () => setIsOnline(false);
        window.addEventListener('online', onOnline);
        window.addEventListener('offline', onOffline);
        if (navigator.serviceWorker) {
          navigator.serviceWorker.addEventListener('message', (ev) => { if (ev.data?.type === 'RUN_BG_SYNC') flushSync(); });
        }
        return () => { window.removeEventListener('online', onOnline); window.removeEventListener('offline', onOffline); };
      }, [showToast]);

      useEffect(() => {
        const onHash = () => setCustomerMode(window.location.hash === '#price-free-catalog');
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      // Boot & Session Persistence Hydration
      useEffect(() => {
        (async () => {
          const init = await idb.get('init_v6');
          if (!init) {
            await idb.set('nurseryProfile', DEFAULT_PROFILE);
            await idb.set('themeCfg', DEFAULT_THEME_CFG);
            await idb.set('labels', DEFAULT_LABELS);
            await idb.set('staffEditWindow', DEFAULT_EDIT_WINDOW);
            await idb.set('users', DEFAULT_USERS);
            await idb.set('products', SEED_PRODUCTS);
            await idb.set('sales', SEED_SALES);
            await idb.set('purchases', SEED_PURCHASES);
            await idb.set('adjustments', SEED_ADJUSTMENTS);
            await idb.set('workers', SEED_WORKERS);
            await idb.set('attendance', {});
            await idb.set('bills', []);
            await idb.set('init_v6', true);
          }
          const savedSession = await idb.get('activeSessionUser');
          const savedPage = await idb.get('activeSessionPage');
          setNurseryProfile((await idb.get('nurseryProfile')) || DEFAULT_PROFILE);
          setThemeCfg((await idb.get('themeCfg')) || DEFAULT_THEME_CFG);
          setLabels((await idb.get('labels')) || DEFAULT_LABELS);
          setStaffEditWindow((await idb.get('staffEditWindow')) || DEFAULT_EDIT_WINDOW);
          setUsers((await idb.get('users')) || DEFAULT_USERS);
          setProducts((await idb.get('products')) || SEED_PRODUCTS);
          setSales((await idb.get('sales')) || SEED_SALES);
          setPurchases((await idb.get('purchases')) || SEED_PURCHASES);
          setAdjustments((await idb.get('adjustments')) || SEED_ADJUSTMENTS);
          setWorkers((await idb.get('workers')) || SEED_WORKERS);
          setAttendance((await idb.get('attendance')) || {});
          setBills((await idb.get('bills')) || []);
          setSyncQueue((await idb.get(SYNC_QUEUE_KEY)) || []);
          if (savedSession) {
            setCurrentUser(savedSession);
            if (savedPage) setActivePage(savedPage);
          }
          setLoadingDb(false);
        })();
      }, []);

      // Apply Dynamic CSS Theme Variables & Persist Dark/Light Mode
      useEffect(() => {
        document.documentElement.classList.toggle('dark', themeCfg.mode === 'dark');
        document.documentElement.style.setProperty('--accent-primary', themeCfg.primaryColor || '#059669');
        document.documentElement.style.setProperty('--accent-secondary', themeCfg.secondaryColor || '#0f766e');
        if (!loadingDb) idb.set('themeCfg', themeCfg);
      }, [themeCfg, loadingDb]);

      const persistUserSession = (user, page) => {
        setCurrentUser(user);
        idb.set('activeSessionUser', user);
        if (page) { setActivePage(page); idb.set('activeSessionPage', page); }
      };

      const navigateTo = (pageId) => {
        // Secondary PIN 1010 enforced before accessing Purchase module or Settings module
        if (pageId === 'purchases' || pageId === 'settings') {
          requestPin(
            pageId === 'settings' ? 'Administrator Settings Gateway' : 'Purchase Module PIN Gateway',
            `Enter Secondary Security PIN (1010) to access ${pageId === 'settings' ? 'Settings' : 'Purchases'}.`,
            () => { setActivePage(pageId); idb.set('activeSessionPage', pageId); }
          );
          return;
        }
        setActivePage(pageId);
        idb.set('activeSessionPage', pageId);
      };

      const queueForBackgroundSync = async (entry) => {
        if (!navigator.onLine) {
          const nextQ = [...syncQueue, { ...entry, queuedAt: Date.now() }];
          setSyncQueue(nextQ);
          await idb.set(SYNC_QUEUE_KEY, nextQ);
          if ('serviceWorker' in navigator && 'SyncManager' in window) {
            try { const reg = await navigator.serviceWorker.ready; await reg.sync.register('nursery-bg-sync'); } catch {}
          }
        }
      };

      const saveProfile = (n) => { setNurseryProfile(n); idb.set('nurseryProfile', n); showToast('Profile saved.'); };
      const saveLabels = (n) => { setLabels(n); idb.set('labels', n); showToast('UI Labels updated.'); };
      const saveEditWindow = (n) => { setStaffEditWindow(n); idb.set('staffEditWindow', n); showToast('Edit window updated.'); };
      const saveUsers = (n) => { setUsers(n); idb.set('users', n); showToast('Users updated.'); };
      const saveProducts = (n) => { setProducts([...n]); idb.set('products', n); };
      const saveSales = (n) => { setSales(n); idb.set('sales', n); };
      const savePurchases = (n) => { setPurchases(n); idb.set('purchases', n); };
      const saveAdjustments = (n) => { setAdjustments(n); idb.set('adjustments', n); };
      const saveWorkers = (n) => { setWorkers(n); idb.set('workers', n); };
      const saveAttendance = (n) => { setAttendance(n); idb.set('attendance', n); };
      const saveBills = (n) => { setBills(n); idb.set('bills', n); };

      const handleConfirmSale = (salePayload) => {
        const newSale = {
          id: 'INV-' + (1000 + sales.length + 1), date: todayDDMMYYYY(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          createdBy: currentUser?.username || 'Davinder Brar', createdAt: Date.now(), ...salePayload
        };
        saveSales([newSale, ...sales]);
        saveProducts(products.map((p) => {
          const sold = salePayload.items.find((i) => !i.isNonInventory && i.productId === p.id);
          return sold ? { ...p, stock: Math.max(0, p.stock - sold.qty) } : p;
        }));
        queueForBackgroundSync({ kind: 'sale', id: newSale.id });
        setCart([]);
        setCheckoutOpen(false);
        const wa = buildWhatsAppBillPayload(newSale, nurseryProfile, products);
        setWaDispatch(wa);
        if (wa.url) { try { window.open(wa.url, '_blank', 'noopener,noreferrer'); } catch {} }
        showToast(`Sale ${newSale.id} saved.`);
      };

      const handleUpdateSale = (upd) => {
        const old = sales.find((s) => s.id === upd.id);
        if (old) {
          const delta = {};
          (old.items||[]).forEach((i) => { if (!i.isNonInventory) delta[i.productId] = (delta[i.productId]||0) + i.qty; });
          (upd.items||[]).forEach((i) => { if (!i.isNonInventory) delta[i.productId] = (delta[i.productId]||0) - i.qty; });
          saveProducts(products.map((p) => delta[p.id] ? { ...p, stock: Math.max(0, p.stock + delta[p.id]) } : p));
        }
        saveSales(sales.map((s) => s.id === upd.id ? upd : s));
        showToast(`Sale ${upd.id} updated.`);
      };

      const handleDeleteSale = (id) => {
        const old = sales.find((s) => s.id === id);
        if (old) {
          const restore = {};
          (old.items||[]).forEach((i) => { if (!i.isNonInventory) restore[i.productId] = (restore[i.productId]||0) + i.qty; });
          saveProducts(products.map((p) => restore[p.id] ? { ...p, stock: p.stock + restore[p.id] } : p));
        }
        saveSales(sales.filter((s) => s.id !== id));
        showToast(`Sale ${id} deleted.`);
      };

      const handleRecordPurchase = (purPayload) => {
        const newPur = { id: 'PUR-' + (500 + purchases.length + 1), time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), ...purPayload };
        savePurchases([newPur, ...purchases]);
        saveProducts(products.map((p) => {
          const b = purPayload.items.find((i) => i.productId === p.id);
          return b ? { ...p, stock: p.stock + b.qty } : p;
        }));
        queueForBackgroundSync({ kind: 'purchase', id: newPur.id });
        showToast(`Purchase ${newPur.id} saved.`);
      };

      const handleUpdatePurchase = (upd) => { savePurchases(purchases.map((p) => p.id === upd.id ? upd : p)); showToast(`Purchase ${upd.id} updated.`); };
      const handleDeletePurchase = (id) => { savePurchases(purchases.filter((p) => p.id !== id)); showToast(`Purchase ${id} deleted.`); };

      const handleAddAdjustment = (adj) => {
        saveAdjustments([adj, ...adjustments]);
        saveProducts(products.map((p) => (p.id === adj.productId ? { ...p, stock: Math.max(0, p.stock - adj.qty) } : p)));
        showToast('Adjustment saved & locked.');
      };

      const handleImportProducts = (rows) => {
        let updated = 0, added = 0;
        const map = new Map(products.map((p) => [p.id, p]));
        rows.forEach((r) => {
          const nameEn = String(r.nameEn || r.Name || '').trim(); if (!nameEn) return;
          const t = (r.id && map.get(String(r.id))) || [...map.values()].find((p) => p.nameEn.toLowerCase() === nameEn.toLowerCase());
          const catEn = String(r.category || t?.category || CATEGORIES[0].en);
          const co = CATEGORIES.find((c) => c.en === catEn);
          const obj = {
            id: t ? t.id : (r.id ? String(r.id) : 'p-' + Date.now() + '-' + Math.random().toString(36).slice(2,5)),
            nameEn, nameHi: String(r.nameHi ?? t?.nameHi ?? ''), botanicalName: t?.botanicalName || 'Cultivar',
            category: catEn, categoryHi: String(r.categoryHi || co?.hi || t?.categoryHi || ''),
            price: Number(r.price ?? t?.price ?? 0)||0, stock: Number(r.stock ?? t?.stock ?? 0)||0, threshold: Number(r.threshold ?? t?.threshold ?? 10)||0,
            image: String(r.image ?? t?.image ?? ''), careId: String(r.careId || t?.careId || 'pc-rose'),
            customCare: (r.season || r.care || r.water || r.sunlight || r.fertilizer) ? { season:String(r.season||''), care:String(r.care||''), water:String(r.water||''), sunlight:String(r.sunlight||''), fertilizer:String(r.fertilizer||'') } : t?.customCare
          };
          if (t) updated++; else added++;
          map.set(obj.id, obj);
        });
        saveProducts(Array.from(map.values()));
        showToast(`Excel import: ${updated} updated, ${added} added.`);
      };

      if (loadingDb) return <div className="min-h-screen flex items-center justify-center bg-slate-950 text-white font-bold">Loading Hybrid ERP...</div>;
      if (customerMode) return <DynamicPriceFreeCatalogView products={products} nurseryProfile={nurseryProfile} onExit={currentUser ? () => { if (window.location.hash === '#price-free-catalog') window.history.replaceState(null, '', window.location.pathname + window.location.search); setCustomerMode(false); } : null} />;
      if (!currentUser) return <LoginScreen nurseryProfile={nurseryProfile} themeCfg={themeCfg} users={users} onLogin={(u) => persistUserSession(u, u.role === 'Staff' ? 'inventory-sales' : 'dashboard')} />;

      const isStaff = currentUser.role === 'Staff';
      const adminNavItems = [
        { id:'dashboard', label: labels.dashboardTitle, icon:'home' },
        { id:'inventory-sales', label: labels.inventorySalesTitle, icon:'cart' },
        { id:'purchases', label: labels.purchasesTitle, icon:'truck' },
        { id:'stock', label: labels.stockMgmtTitle, icon:'boxes' },
        { id:'crop-scheduler', label: labels.cropSchedulerTitle, icon:'calendar' },
        { id:'workers', label: labels.workersTitle, icon:'users' },
        { id:'bills', label: labels.billGalleryTitle, icon:'image' },
        { id:'settings', label: labels.settingsTitle, icon:'settings' },
      ];
      const staffNavItems = [
        { id:'inventory-sales', label: labels.inventorySalesTitle, icon:'cart' },
        { id:'sale-summary', label: 'Sale Summary', icon:'chart' }
      ];
      const navItems = isStaff ? staffNavItems : adminNavItems;
      const effectivePage = isStaff && !['inventory-sales', 'sale-summary'].includes(activePage) ? 'inventory-sales' : activePage;

      return (
        <div className="min-h-screen flex bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
          <aside className={`fixed lg:sticky top-0 left-0 z-40 h-screen bg-white dark:bg-slate-900 border-r transition-all duration-200 flex flex-col no-print ${sidebarExpanded ? 'w-64 translate-x-0' : 'w-0 -translate-x-full lg:w-20 lg:translate-x-0 overflow-hidden'}`}>
            <div className="h-16 flex items-center px-4 border-b shrink-0 gap-3">
              <div style={{ backgroundColor: 'var(--accent-primary)' }} className="w-10 h-10 rounded-xl text-white flex items-center justify-center shrink-0"><Icon name="leaf" className="w-6 h-6" /></div>
              {sidebarExpanded && <span className="font-extrabold text-base truncate">{nurseryProfile.nurseryName}</span>}
            </div>
            <nav className="flex-1 overflow-y-auto p-3 space-y-1">
              {navItems.map((it) => (
                <button key={it.id} onClick={() => { navigateTo(it.id); if (window.innerWidth < 1024) setSidebarExpanded(false); }} title={it.label} style={effectivePage === it.id ? { backgroundColor: 'var(--accent-primary)' } : {}} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm transition ${effectivePage === it.id ? 'text-white shadow' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'} ${!sidebarExpanded ? 'lg:justify-center' : ''}`}>
                  <Icon name={it.icon} className="w-5 h-5 shrink-0" />{sidebarExpanded && <span className="truncate">{it.label}</span>}
                </button>
              ))}
            </nav>
          </aside>

          <div className="flex-1 flex flex-col min-w-0">
            <header className="sticky top-0 z-30 h-16 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b px-4 sm:px-6 flex items-center justify-between gap-3 no-print">
              <div className="flex items-center gap-3">
                <button onClick={() => setSidebarExpanded((p) => !p)} className="flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-xs"><Icon name="menu" className="w-5 h-5" /><span className="hidden sm:inline">{sidebarExpanded ? 'Collapse' : 'Menu'}</span></button>
                <span className="font-extrabold text-lg hidden sm:inline">{labels.appTitle}</span>
                <span className={`px-2 py-0.5 rounded-full text-[10px] font-extrabold ${isOnline ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-800'}`}>
                  {isOnline ? '● Online' : `● Offline (${syncQueue.length} queued)`}
                </span>
              </div>
              <div className="flex items-center gap-2">
                {!isStaff ? (
                  <>
                    <button onClick={() => navigateTo('workers')} className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 text-emerald-800 dark:text-emerald-300 border border-emerald-200 font-extrabold text-xs"><Icon name="users" className="w-4 h-4" /><span className="hidden md:inline">{labels.workersTitle}</span></button>
                    <button onClick={() => setQrOpen(true)} className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-900 text-white font-bold text-xs"><Icon name="qr" className="w-4 h-4" /><span className="hidden md:inline">QR Scanner</span></button>
                  </>
                ) : (
                  <button onClick={() => persistUserSession(null, null)} className="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-rose-600 text-white font-extrabold text-xs"><Icon name="logout" className="w-4 h-4" />Logout</button>
                )}
              </div>
            </header>

            <main className="flex-1 p-4 sm:p-6 lg:p-8 max-w-[1520px] w-full mx-auto">
              {effectivePage === 'dashboard' && !isStaff && <DashboardPage labels={labels} nurseryProfile={nurseryProfile} currentUser={currentUser} products={products} sales={sales} purchases={purchases} users={users} systemMessages={systemMessages} onNavigate={navigateTo} onOpenQR={() => setQrOpen(true)} onOpenCustomerPreview={() => setCustomerMode(true)} onOpenExport={setExportCfg} requestPin={requestPin} />}
              {effectivePage === 'inventory-sales' && <UnifiedInventoryAndSalesPage label={labels.inventorySalesTitle} products={products} cart={cart} setCart={setCart} nurseryProfile={nurseryProfile} onOpenCheckout={() => setCheckoutOpen(true)} onOpenSaleSummary={() => setActivePage('sale-summary')} onOpenCustomerPreview={() => setCustomerMode(true)} onShowToast={showToast} />}
              {effectivePage === 'sale-summary' && <SummaryReportPage type="sale" records={sales} currentUser={currentUser} staffEditWindow={staffEditWindow} onUpdateEntry={handleUpdateSale} onDeleteEntry={handleDeleteSale} onOpenExport={setExportCfg} requestPin={requestPin} onBack={() => setActivePage('inventory-sales')} />}
              {effectivePage === 'purchases' && !isStaff && <PurchasesPage label={labels.purchasesTitle} products={products} onRecordPurchase={handleRecordPurchase} onOpenPurchaseSummary={() => setActivePage('purchase-summary')} />}
              {effectivePage === 'purchase-summary' && !isStaff && <SummaryReportPage type="purchase" records={purchases} currentUser={currentUser} staffEditWindow={staffEditWindow} onUpdateEntry={handleUpdatePurchase} onDeleteEntry={handleDeletePurchase} onOpenExport={setExportCfg} requestPin={requestPin} onBack={() => setActivePage('purchases')} />}
              {effectivePage === 'stock' && !isStaff && <StockManagementPage label={labels.stockMgmtTitle} products={products} onAddProduct={(p) => { saveProducts([p, ...products]); showToast(`Added "${p.nameHi || p.nameEn}".`); }} onUpdateProduct={(u) => { saveProducts(products.map((x) => x.id === u.id ? u : x)); showToast(`Updated "${u.nameHi || u.nameEn}".`); }} onDeleteProduct={(id) => { saveProducts(products.filter((x) => x.id !== id)); showToast('Plant deleted.'); }} adjustments={adjustments} onAddAdjustment={handleAddAdjustment} onUpdateAdjustment={(u) => saveAdjustments(adjustments.map((a) => a.id === u.id ? u : a))} requestPin={requestPin} onOpenExport={setExportCfg} />}
              {effectivePage === 'crop-scheduler' && !isStaff && <CropSchedulerPage label={labels.cropSchedulerTitle} products={products} onOpenExport={setExportCfg} />}
              {effectivePage === 'workers' && !isStaff && <WorkersAttendancePage label={labels.workersTitle} workers={workers} onAddWorker={(w) => { saveWorkers([...workers, w]); showToast(`Added ${w.name}.`); }} onUpdateWorker={(u) => { saveWorkers(workers.map((x) => x.id === u.id ? u : x)); showToast(`Updated ${u.name}.`); }} onDeleteWorker={(id) => { saveWorkers(workers.filter((x) => x.id !== id)); showToast('Worker deleted.'); }} attendance={attendance} onSetAttendance={(d, w, s) => saveAttendance({ ...attendance, [d]: { ...(attendance[d]||{}), [w]: s } })} />}
              {effectivePage === 'bills' && !isStaff && <BillGalleryPage label={labels.billGalleryTitle} bills={bills} onAddBill={(b) => { saveBills([b, ...bills]); showToast('Bill uploaded.'); }} onDeleteBill={(id) => { saveBills(bills.filter((b) => b.id !== id)); showToast('Bill deleted.'); }} requestPin={requestPin} onOpenExport={setExportCfg} />}
              {effectivePage === 'settings' && !isStaff && <SettingsPage labels={labels} onSaveLabels={saveLabels} themeCfg={themeCfg} onSaveThemeCfg={setThemeCfg} nurseryProfile={nurseryProfile} onSaveProfile={saveProfile} staffEditWindow={staffEditWindow} onSaveEditWindow={saveEditWindow} users={users} onSaveUsers={saveUsers} currentUser={currentUser} products={products} onImportProducts={handleImportProducts} requestPin={requestPin} onLogout={() => persistUserSession(null, null)} />}
            </main>
          </div>

          <FullScreenQRScanner isOpen={qrOpen} onClose={() => setQrOpen(false)} products={products} />
          <CentralCheckoutModal isOpen={checkoutOpen} cart={cart} setCart={setCart} products={products} onClose={() => setCheckoutOpen(false)} onConfirmSale={handleConfirmSale} />
          <WhatsAppDispatchModal dispatchInfo={waDispatch} onClose={() => setWaDispatch(null)} />
          <ExportShareModal config={exportCfg} onClose={() => setExportCfg(null)} />
          <PinVerificationModal isOpen={pinModal.open} title={pinModal.title} subtitle={pinModal.subtitle} onCancel={() => setPinModal({ open: false, title: '', subtitle: '', onOk: null })} onSuccess={() => { const fn = pinModal.onOk; setPinModal({ open: false, title: '', subtitle: '', onOk: null }); if (fn) fn(); }} />
          {toast && <div className="fixed bottom-5 right-5 z-[130] px-5 py-3 rounded-2xl bg-slate-900 dark:bg-emerald-600 text-white font-bold text-sm shadow-2xl">{toast}</div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
