    // =========================================================================
    // 8. CHECKOUT MODAL (Editable Rate, Product Variants, Open Item Units, Blank Defaults)
    // =========================================================================
    function CentralCheckoutModal({ isOpen, cart, setCart, products, onClose, onConfirmSale }) {
      const [customer, setCustomer] = useState('');
      const [customerMobile, setCustomerMobile] = useState('');
      const [discountType, setDiscountType] = useState('flat');
      const [discountValue, setDiscountValue] = useState('');
      const [payMode, setPayMode] = useState('split');
      const [cashAmount, setCashAmount] = useState('');
      const [upiAmount, setUpiAmount] = useState('');
      const [openForm, setOpenForm] = useState({ nameEn: '', price: '', qty: '', unit: 'kg' });

      const cartDetailed = useMemo(() => cart.map((c) => {
        if (c.isNonInventory) return { ...c, id: c.cartKey };
        const p = products.find((x) => x.id === c.productId);
        if (!p) return null;
        const v = (p.variants || []).find((vr) => vr.id === c.variantId) || p.variants?.[0] || { id: p.id, label: 'Standard', price: p.price, stock: p.stock };
        const rate = c.overrideRate !== undefined ? Number(c.overrideRate) : Number(v.price);
        return { ...p, cartKey: c.cartKey, variantId: v.id, variantLabel: v.label, maxStock: v.stock, price: rate, isNonInventory: false, qty: c.qty, unit: 'pcs' };
      }).filter(Boolean), [cart, products]);

      const subtotal = useMemo(() => cartDetailed.reduce((s, i) => s + (Number(i.price)||0) * (Number(i.qty)||0), 0), [cartDetailed]);
      const discountAmount = useMemo(() => {
        const v = Math.max(0, Number(discountValue) || 0);
        return discountType === 'percent' ? Math.min(subtotal, Math.round((subtotal * Math.min(100, v)) / 100)) : Math.min(subtotal, v);
      }, [subtotal, discountType, discountValue]);
      const netTotal = Math.max(0, Math.round(subtotal - discountAmount));

      useEffect(() => {
        if (!isOpen) return;
        if (payMode === 'cash') { setCashAmount(String(netTotal)); setUpiAmount('0'); }
        else if (payMode === 'upi') { setCashAmount('0'); setUpiAmount(String(netTotal)); }
        else {
          const c = Math.min(netTotal, Math.max(0, Number(cashAmount) || 0));
          setCashAmount(String(c));
          setUpiAmount(String(netTotal - c));
        }
      }, [netTotal, payMode, isOpen]);

      if (!isOpen) return null;

      const updateQty = (key, q) => {
        const n = parseFloat(q);
        if (isNaN(n) || n <= 0) { setCart((prev) => prev.filter((c) => c.cartKey !== key)); return; }
        const entry = cartDetailed.find((x) => x.cartKey === key);
        if (entry && !entry.isNonInventory && n > entry.maxStock) {
          alert(`Only ${entry.maxStock} units available for ${entry.nameHi || entry.nameEn} (${entry.variantLabel}).`);
          return;
        }
        setCart((prev) => prev.map((c) => (c.cartKey === key ? { ...c, qty: n } : c)));
      };

      const updateRate = (key, r) => {
        const val = Math.max(0, Number(r) || 0);
        setCart((prev) => prev.map((c) => (c.cartKey === key ? (c.isNonInventory ? { ...c, price: val } : { ...c, overrideRate: val }) : c)));
      };

      const addOpenInside = () => {
        if (!openForm.nameEn.trim() || Number(openForm.price) <= 0) return;
        setCart((prev) => [...prev, { cartKey: 'open-' + Date.now() + '-' + Math.random().toString(36).slice(2,5), isNonInventory: true, nameEn: openForm.nameEn.trim(), nameHi: 'गैर-स्टॉक खुला आइटम', category: 'Open Item (Non-Inventory)', price: Math.max(0, Number(openForm.price)||0), qty: Math.max(0.1, parseFloat(openForm.qty)||1), unit: openForm.unit }]);
        setOpenForm({ nameEn: '', price: '', qty: '', unit: 'kg' });
      };

      const submitSale = () => {
        if (!cartDetailed.length) return;
        const d = customerMobile.replace(/\D/g, '');
        onConfirmSale({
          customer: customer.trim() || 'Walk-in Customer', customerMobile: d,
          items: cartDetailed.map((i) => ({ productId: i.isNonInventory ? i.cartKey : i.id, variantId: i.variantId, variantLabel: i.variantLabel, isNonInventory: !!i.isNonInventory, nameEn: i.nameEn, nameHi: i.nameHi, category: i.category, qty: i.qty, unit: i.unit || 'pcs', price: i.price })),
          subtotal: Math.round(subtotal), discountType, discountValue: Number(discountValue)||0, discountAmount: Math.round(discountAmount), total: netTotal, cashAmount: Number(cashAmount)||0, upiAmount: Number(upiAmount)||0
        });
        setCustomer(''); setCustomerMobile(''); setDiscountValue('');
      };

      return (
        <div className="fixed inset-0 z-[105] flex items-center justify-center bg-slate-950/75 backdrop-blur-sm p-4" onClick={onClose}>
          <div className="w-full max-w-3xl rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden flex flex-col max-h-[92vh] text-slate-900 dark:text-slate-100" onClick={(e) => e.stopPropagation()}>
            <div style={{ backgroundColor: 'var(--accent-primary)' }} className="flex items-center justify-between px-6 py-4 text-white">
              <div><h3 className="text-lg font-extrabold">POS Checkout & WhatsApp Dispatch</h3><p className="text-xs opacity-90">Editable Transaction Rates • Optional Customer Details • Cash & UPI Split</p></div>
              <button onClick={onClose} className="p-2 rounded-xl hover:bg-black/15"><Icon name="close" className="w-5 h-5" /></button>
            </div>
            <div className="p-6 overflow-y-auto space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label className="block text-xs font-bold uppercase text-slate-500 mb-1">Customer Name (Optional)</label><input type="text" value={customer} onChange={(e) => setCustomer(e.target.value)} placeholder="Customer Name" className="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-semibold" /></div>
                <div><label className="block text-xs font-bold uppercase text-slate-500 mb-1">WhatsApp Mobile (Optional)</label><input type="tel" value={customerMobile} onChange={(e) => setCustomerMobile(e.target.value)} placeholder="Mobile Number" className="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-bold" /></div>
              </div>

              <div className="p-3 rounded-2xl bg-sky-50 dark:bg-sky-950/30 border border-sky-200 dark:border-sky-900 flex flex-wrap items-center gap-2">
                <span className="text-[11px] font-extrabold text-sky-800 dark:text-sky-300 w-full">Open Item (Soil / Loose Materials — Select Unit):</span>
                <input type="text" placeholder="Item Name" value={openForm.nameEn} onChange={(e) => setOpenForm({ ...openForm, nameEn: e.target.value })} className="flex-1 min-w-[130px] px-3 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs" />
                <input type="number" min="1" placeholder="Rate ₹" value={openForm.price} onChange={(e) => setOpenForm({ ...openForm, price: e.target.value })} className="w-20 px-2 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs font-bold" />
                <input type="number" min="0.1" step="0.1" placeholder="Qty" value={openForm.qty} onChange={(e) => setOpenForm({ ...openForm, qty: e.target.value })} className="w-16 px-2 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs font-bold text-center" />
                <select value={openForm.unit} onChange={(e) => setOpenForm({ ...openForm, unit: e.target.value })} className="px-2 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-xs font-bold"><option value="kg">kg</option><option value="pcs">pcs</option><option value="L">L</option></select>
                <button type="button" onClick={addOpenInside} className="px-3 py-1.5 rounded-lg bg-sky-600 text-white text-xs font-extrabold">+ Add Open</button>
              </div>

              <div className="rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-56 overflow-y-auto">
                <table className="w-full text-sm">
                  <thead className="sticky top-0 z-10 bg-slate-100 dark:bg-slate-800 text-xs uppercase text-slate-600 dark:text-slate-300"><tr><th className="text-left px-4 py-2">Item</th><th className="text-center px-2 py-2">Qty / Unit</th><th className="text-center px-2 py-2">Rate (₹ Editable)</th><th className="text-right px-4 py-2">Amount</th></tr></thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {cartDetailed.length === 0 ? <tr><td colSpan="4" className="p-6 text-center text-xs text-slate-400">Cart is empty.</td></tr> : cartDetailed.map((i) => (
                      <tr key={i.cartKey}>
                        <td className="px-4 py-2"><div className="font-extrabold text-sm">{i.nameHi || i.nameEn} {i.variantLabel && <span className="text-[10px] px-1.5 py-0.5 rounded bg-emerald-100 dark:bg-emerald-900/50 text-emerald-800 dark:text-emerald-300">{i.variantLabel}</span>}</div><div className="text-[11px] text-slate-500">{i.nameEn}</div></td>
                        <td className="px-2 py-2"><div className="flex items-center justify-center gap-1"><button type="button" onClick={() => updateQty(i.cartKey, i.qty - 1)} className="w-6 h-6 rounded bg-slate-100 dark:bg-slate-800 font-bold">-</button><input type="number" min="0.1" step="0.1" value={i.qty} onChange={(e) => updateQty(i.cartKey, e.target.value)} className="w-12 py-1 text-center rounded border bg-white dark:bg-slate-900 font-bold text-xs" /><span className="text-[10px] font-bold text-slate-500">{i.unit||'pcs'}</span><button type="button" onClick={() => updateQty(i.cartKey, i.qty + 1)} className="w-6 h-6 rounded bg-slate-100 dark:bg-slate-800 font-bold">+</button></div></td>
                        <td className="px-2 py-2 text-center"><input type="number" min="0" value={i.price} onChange={(e) => updateRate(i.cartKey, e.target.value)} className="w-20 py-1 px-2 text-center rounded-lg border border-emerald-400 bg-emerald-50/40 dark:bg-slate-800 font-extrabold text-xs" /></td>
                        <td className="text-right px-4 py-2 font-bold">₹{Math.round(i.price * i.qty)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div className="rounded-2xl bg-slate-50 dark:bg-slate-800/60 p-4 border border-slate-200 dark:border-slate-700 space-y-2">
                <div className="flex flex-wrap items-center justify-between gap-3"><span className="text-sm font-bold">Total Bill Discount</span><div className="flex gap-2"><select value={discountType} onChange={(e) => setDiscountType(e.target.value)} className="px-3 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-sm font-semibold"><option value="flat">Flat ₹</option><option value="percent">Percent %</option></select><input type="number" min="0" placeholder="0" value={discountValue} onChange={(e) => setDiscountValue(e.target.value)} className="w-24 px-3 py-1.5 rounded-lg border bg-white dark:bg-slate-900 text-sm font-bold text-right" /></div></div>
                <div className="flex justify-between text-sm"><span>Subtotal</span><span className="font-semibold">₹{Math.round(subtotal).toLocaleString()}</span></div>
                <div className="flex justify-between text-sm text-rose-600 dark:text-rose-400"><span>Bill Discount</span><span className="font-semibold">- ₹{Math.round(discountAmount).toLocaleString()}</span></div>
                <div className="flex justify-between text-lg font-extrabold pt-2 border-t border-slate-200 dark:border-slate-700"><span>Net Payable</span><span style={{ color: 'var(--accent-primary)' }}>₹{netTotal.toLocaleString()}</span></div>
              </div>

              <div className="space-y-3">
                <label className="block text-xs font-bold uppercase text-slate-500">Payment (Cash & UPI Only)</label>
                <div className="grid grid-cols-3 gap-2.5">{[{ id:'cash', label:'100% Cash' }, { id:'upi', label:'100% UPI' }, { id:'split', label:'Split (Cash + UPI)' }].map((m) => <button key={m.id} type="button" onClick={() => setPayMode(m.id)} style={payMode === m.id ? { backgroundColor: 'var(--accent-primary)' } : {}} className={`py-2.5 px-3 rounded-xl text-xs font-extrabold border ${payMode === m.id ? 'text-white border-transparent' : 'bg-slate-50 dark:bg-slate-800 border-slate-300 dark:border-slate-700'}`}>{m.label}</button>)}</div>
                <div className="grid grid-cols-2 gap-4">
                  <div><label className="block text-xs font-bold mb-1">Cash (₹)</label><input type="number" min="0" max={netTotal} disabled={payMode === 'upi'} value={cashAmount} onChange={(e) => { const c = Math.min(netTotal, Math.max(0, Number(e.target.value)||0)); setCashAmount(String(c)); setUpiAmount(String(netTotal - c)); }} className="w-full px-4 py-2 rounded-xl border bg-white dark:bg-slate-800 font-bold disabled:opacity-50" /></div>
                  <div><label className="block text-xs font-bold mb-1">UPI (₹)</label><input type="number" min="0" max={netTotal} disabled={payMode === 'cash'} value={upiAmount} onChange={(e) => { const u = Math.min(netTotal, Math.max(0, Number(e.target.value)||0)); setUpiAmount(String(u)); setCashAmount(String(netTotal - u)); }} className="w-full px-4 py-2 rounded-xl border bg-white dark:bg-slate-800 font-bold disabled:opacity-50" /></div>
                </div>
              </div>
            </div>
            <div className="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-3">
              <button onClick={onClose} className="px-5 py-2.5 rounded-xl border font-bold text-sm">Cancel</button>
              <button onClick={submitSale} disabled={!cartDetailed.length} style={{ backgroundColor: 'var(--accent-primary)' }} className="flex items-center gap-2 px-6 py-2.5 rounded-xl text-white font-extrabold text-sm shadow-lg disabled:opacity-50"><Icon name="whatsapp" className="w-4 h-4" /><span>Complete Sale (₹{netTotal.toLocaleString()})</span></button>
            </div>
          </div>
        </div>
      );
    }

    function WhatsAppDispatchModal({ dispatchInfo, onClose }) {
      const [copied, setCopied] = useState(false);
      const [manualPhone, setManualPhone] = useState('');
      if (!dispatchInfo) return null;
      const cleanManual = manualPhone.replace(/\D/g, '');
      const targetUrl = dispatchInfo.url || (cleanManual.length >= 10 ? `https://wa.me/${cleanManual.length === 10 ? '91' + cleanManual : cleanManual}?text=${encodeURIComponent(dispatchInfo.text)}` : '');
      return (
        <div className="fixed inset-0 z-[105] flex items-center justify-center bg-slate-950/75 backdrop-blur-sm p-4" onClick={onClose}>
          <div className="w-full max-w-lg rounded-3xl bg-white dark:bg-slate-900 border shadow-2xl overflow-hidden text-slate-900 dark:text-slate-100" onClick={(e) => e.stopPropagation()}>
            <div style={{ backgroundColor: 'var(--accent-primary)' }} className="px-6 py-4 text-white flex items-center justify-between">
              <div><h3 className="text-lg font-extrabold">Invoice & Botanical Care Dispatch</h3></div>
              <button onClick={onClose} className="p-2 rounded-xl hover:bg-black/15"><Icon name="close" className="w-5 h-5" /></button>
            </div>
            <div className="p-6 space-y-4">
              <pre className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border text-xs whitespace-pre-wrap max-h-60 overflow-y-auto font-sans">{dispatchInfo.text}</pre>
              {!dispatchInfo.url && <input type="tel" value={manualPhone} onChange={(e) => setManualPhone(e.target.value)} placeholder="Optional: Enter WhatsApp mobile number" className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />}
              <div className="flex flex-wrap gap-2.5 justify-end">
                <button onClick={() => { navigator.clipboard?.writeText(dispatchInfo.text); setCopied(true); setTimeout(() => setCopied(false), 2000); }} className="px-4 py-2.5 rounded-xl border text-xs font-extrabold">{copied ? '✓ Copied' : 'Copy'}</button>
                {targetUrl && <a href={targetUrl} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold shadow"><Icon name="whatsapp" className="w-4 h-4" /> Send on WhatsApp</a>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 9. UNIFIED INVENTORY & SALES (Card Click -> Detail Modal, Variants, Sticky Upward Search, Zero-Match Speech)
    // =========================================================================
    const ProductGridCard = memo(({ item, selectedVariantId, onVariantChange, qtyValue, onQtyChange, onAdd, onOpenDetail }) => {
      const variants = item.variants?.length ? item.variants : [{ id: item.id, label: 'Standard', price: item.price, stock: item.stock, threshold: item.threshold }];
      const activeVar = variants.find((v) => v.id === selectedVariantId) || variants[0];
      const isLow = Number(activeVar.stock) < Number(activeVar.threshold);
      const isZero = Number(activeVar.stock) <= 0;

      return (
        <div
          onClick={() => onOpenDetail(item)}
          className={`cursor-pointer rounded-2xl border shadow-sm hover:shadow-md transition overflow-hidden flex flex-col ${isLow ? 'bg-rose-50/90 dark:bg-rose-950/40 border-rose-500 ring-2 ring-rose-500/35' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800'}`}
        >
          <div className="h-28 bg-slate-100 dark:bg-slate-800 overflow-hidden relative">
            {item.image ? <img src={item.image} alt={item.nameEn} className="w-full h-full object-cover" loading="lazy" /> : <div className="w-full h-full flex items-center justify-center text-slate-400"><Icon name="leaf" className="w-7 h-7" /></div>}
            {isZero ? <span className="absolute top-1.5 left-1.5 px-2 py-0.5 rounded-md bg-rose-700 text-white text-[9px] font-extrabold shadow">Out of Stock</span>
              : isLow ? <span className="absolute top-1.5 left-1.5 px-2 py-0.5 rounded-md bg-rose-600 text-white text-[9px] font-extrabold shadow">Low ({activeVar.stock}/{activeVar.threshold})</span> : null}
          </div>
          <div className="p-3 flex-1 flex flex-col justify-between space-y-2.5">
            <div>
              <h4 className="text-sm font-extrabold leading-tight line-clamp-2 text-slate-900 dark:text-white">{item.nameHi || item.nameEn}</h4>
              <p className="text-[11px] font-medium text-slate-500 dark:text-slate-400 truncate mt-0.5">{item.nameEn}</p>
              {/* Variant Tier Selector */}
              <div className="mt-2" onClick={(e) => e.stopPropagation()}>
                <select value={activeVar.id} onChange={(e) => onVariantChange(item.id, e.target.value)} className="w-full px-2 py-1 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-[11px] font-bold">
                  {variants.map((v) => <option key={v.id} value={v.id}>{v.label} — ₹{v.price} ({v.stock})</option>)}
                </select>
              </div>
              <div className="mt-1.5 flex items-center justify-between">
                <span style={{ color: 'var(--accent-primary)' }} className="text-sm font-extrabold">₹{activeVar.price}</span>
                <span className={`text-[10px] font-bold ${isLow ? 'text-rose-600 dark:text-rose-400' : 'text-slate-500 dark:text-slate-400'}`}>Stock: {activeVar.stock}</span>
              </div>
            </div>

            <div className="flex items-center gap-1.5 pt-2 border-t border-slate-200/70 dark:border-slate-800" onClick={(e) => e.stopPropagation()}>
              <input type="number" min="1" placeholder="Qty" value={qtyValue} onChange={(e) => onQtyChange(item.id, e.target.value)} className="w-12 px-1.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-bold text-center outline-none" />
              <button type="button" onClick={() => onAdd(item, activeVar)} style={{ backgroundColor: 'var(--accent-primary)' }} className="flex-1 py-1.5 px-2 rounded-lg text-white font-bold text-[11px] truncate hover:opacity-90">Add to Cart</button>
              <button type="button" onClick={() => onOpenDetail(item)} className="w-7 h-7 rounded-lg bg-sky-100 dark:bg-sky-900/50 text-sky-700 dark:text-sky-300 hover:bg-sky-600 hover:text-white flex items-center justify-center shrink-0">
                <Icon name="info" className="w-4 h-4" />
              </button>
            </div>
          </div>
        </div>
      );
    });

    function UnifiedInventoryAndSalesPage({ label, products, cart, setCart, nurseryProfile, onOpenCheckout, onOpenSaleSummary, onOpenCustomerPreview, onShowToast, onZeroMatch }) {
      const [search, setSearch] = useState('');
      const [cat, setCat] = useState('ALL');
      const [qtyMap, setQtyMap] = useState({});
      const [varMap, setVarMap] = useState({});
      const [showOpen, setShowOpen] = useState(false);
      const [openItem, setOpenItem] = useState({ nameEn: '', price: '', qty: '', unit: 'kg' });
      const [detailProduct, setDetailProduct] = useState(null);
      const [stockAlert, setStockAlert] = useState('');
      const [listening, setListening] = useState(false);
      const [voiceText, setVoiceText] = useState('');
      const [voiceLog, setVoiceLog] = useState('');
      const recogRef = useRef(null);
      const scrollDir = useScrollDirection();

      const filtered = useMemo(() => products.filter((p) => (cat === 'ALL' || p.category === cat) && smartMatch(p, search)), [products, search, cat]);
      const grouped = useMemo(() => {
        const m = {};
        filtered.forEach((p) => { if (!m[p.category]) m[p.category] = { category: p.category, categoryHi: p.categoryHi, items: [] }; m[p.category].items.push(p); });
        return Object.values(m);
      }, [filtered]);

      // Zero-Match Speech & Visual Fallback ("Chacha eh hai nahi")
      useEffect(() => {
        const q = search.trim();
        if (!q || filtered.length > 0) return;
        const timer = setTimeout(() => { onZeroMatch(q); }, 480);
        return () => clearTimeout(timer);
      }, [search, filtered.length, onZeroMatch]);

      const handleQtyChange = useCallback((id, val) => setQtyMap((p) => ({ ...p, [id]: val })), []);
      const handleVarChange = useCallback((id, vid) => setVarMap((p) => ({ ...p, [id]: vid })), []);

      const tryAddProductToCart = useCallback((p, activeVarOverride = null, requestedQtyOverride = null) => {
        const v = activeVarOverride || (p.variants || []).find((x) => x.id === varMap[p.id]) || p.variants?.[0] || { id: p.id, label: 'Standard', price: p.price, stock: p.stock };
        const reqQty = requestedQtyOverride ?? Math.max(1, parseInt(qtyMap[p.id] || '1', 10) || 1);
        const key = `${p.id}::${v.id}`;
        const alreadyInCart = cart.find((c) => c.cartKey === key)?.qty || 0;
        const available = Number(v.stock) || 0;

        if (available <= 0) { setStockAlert(`Out of Stock: "${p.nameHi || p.nameEn}" (${v.label}) has 0 units available.`); return false; }
        if (alreadyInCart + reqQty > available) { setStockAlert(`Insufficient Stock: Only ${available} units available (${alreadyInCart} in cart).`); return false; }

        setCart((prev) => {
          const ex = prev.find((c) => c.cartKey === key);
          return ex ? prev.map((c) => c.cartKey === key ? { ...c, qty: c.qty + reqQty } : c) : [...prev, { cartKey: key, productId: p.id, variantId: v.id, isNonInventory: false, qty: reqQty, unit: 'pcs' }];
        });
        setQtyMap((prev) => ({ ...prev, [p.id]: '' }));
        return true;
      }, [cart, qtyMap, varMap, setCart]);

      const executeVoiceCommand = (transcript) => {
        const parsed = parseVoiceBillingCommand(transcript, products);
        const added = [];
        parsed.matchedItems.forEach(({ product, qty }) => { if (tryAddProductToCart(product, null, qty)) added.push(`${qty} × ${product.nameHi || product.nameEn}`); });
        if (added.length) { setVoiceLog(`✓ Added: ${added.join(', ')}`); onShowToast(`Voice added: ${added.join(', ')}`); }
        else if (parsed.unmatched.length) { setVoiceLog(`⚠ No match: "${parsed.unmatched.join(', ')}"`); onZeroMatch(parsed.unmatched.join(', ')); }
        if (parsed.triggerCheckout && (cart.length || added.length)) onOpenCheckout();
      };

      const toggleVoiceMic = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { setVoiceLog('Voice recognition unavailable. Type command & click Parse.'); return; }
        if (listening && recogRef.current) { recogRef.current.stop(); setListening(false); return; }
        const recog = new SR();
        recog.lang = 'hi-IN'; recog.interimResults = false;
        recog.onresult = (ev) => { const txt = ev.results[0][0].transcript; setVoiceText(txt); executeVoiceCommand(txt); };
        recog.onerror = () => { setListening(false); setVoiceLog('Microphone error or denied.'); };
        recog.onend = () => setListening(false);
        recogRef.current = recog; setListening(true); recog.start();
      };

      const addOpen = (e) => {
        e.preventDefault();
        if (!openItem.nameEn.trim() || Number(openItem.price) <= 0) return;
        setCart((prev) => [...prev, { cartKey: 'open-' + Date.now() + '-' + Math.random().toString(36).slice(2,5), isNonInventory: true, nameEn: openItem.nameEn.trim(), nameHi: 'गैर-स्टॉक खुला आइटम', category: 'Open Item (Non-Inventory)', price: Math.max(0, Number(openItem.price)||0), qty: Math.max(0.1, parseFloat(openItem.qty)||1), unit: openItem.unit }]);
        setOpenItem({ nameEn: '', price: '', qty: '', unit: 'kg' });
      };

      const cartCount = cart.reduce((s, c) => s + Number(c.qty), 0);
      const cartTotal = cart.reduce((s, c) => {
        if (c.isNonInventory) return s + c.price * c.qty;
        const p = products.find((x) => x.id === c.productId);
        const v = (p?.variants || []).find((vr) => vr.id === c.variantId) || p?.variants?.[0];
        const rate = c.overrideRate !== undefined ? c.overrideRate : (v?.price ?? p?.price ?? 0);
        return s + rate * c.qty;
      }, 0);

      return (
        <div className="space-y-5">
          {/* Header + Actions */}
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col xl:flex-row xl:items-center justify-between gap-4">
            <div><h2 className="text-2xl font-extrabold">{label}</h2><p className="text-xs text-slate-500 dark:text-slate-400">Showing all {filtered.length} of {products.length} items • Tap any card for details</p></div>
            <div className="flex flex-wrap items-center gap-2.5">
              <DigitalCatalogQRWidget nurseryProfile={nurseryProfile} size={62} onPreview={onOpenCustomerPreview} />
              <button onClick={onOpenSaleSummary} className="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-900 dark:bg-slate-700 text-white font-extrabold text-xs shadow"><Icon name="chart" className="w-4 h-4" /> Sale Summary</button>
              <button onClick={onOpenCheckout} style={{ backgroundColor: 'var(--accent-primary)' }} className="flex items-center gap-2 px-5 py-2.5 rounded-xl text-white font-extrabold text-sm shadow"><Icon name="cart" className="w-4 h-4" /> Checkout ({Number(cartCount.toFixed(1))}) • ₹{Math.round(cartTotal).toLocaleString()}</button>
            </div>
          </div>

          {/* Sticky-Upward Search & Voice Billing Bar */}
          <div className={`${scrollDir === 'up' ? 'sticky top-16 z-20 shadow-md' : 'relative'} bg-white/95 dark:bg-slate-900/95 backdrop-blur p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-2 transition-all`}>
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-2.5">
              <div className="lg:col-span-5 relative"><Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" /><input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search plants, varieties, or categories..." className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm outline-none" /></div>
              <div className="lg:col-span-5 flex gap-1.5">
                <button type="button" onClick={toggleVoiceMic} className={`flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-extrabold border shrink-0 ${listening ? 'bg-rose-600 text-white animate-pulse border-rose-600' : 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border-emerald-300'}`}><Icon name="mic" className="w-4 h-4" />{listening ? 'Listening...' : 'Voice'}</button>
                <input type="text" value={voiceText} onChange={(e) => setVoiceText(e.target.value)} placeholder='Voice command (e.g. "2 gulab")' className="flex-1 px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs" />
                <button type="button" onClick={() => executeVoiceCommand(voiceText)} className="px-3 py-2 rounded-xl bg-slate-900 dark:bg-slate-700 text-white text-xs font-bold">Run</button>
              </div>
              <button onClick={() => setShowOpen((v) => !v)} className="lg:col-span-2 px-3 py-2.5 rounded-xl bg-sky-50 dark:bg-sky-950/50 text-sky-700 dark:text-sky-300 border border-sky-200 dark:border-sky-800 font-bold text-xs">+ Open Item</button>
            </div>
            {voiceLog && <p className="text-xs font-bold text-emerald-700 dark:text-emerald-400">{voiceLog}</p>}
          </div>

          {stockAlert && (
            <div className="fixed inset-0 z-[125] flex items-center justify-center bg-slate-950/60 p-4" onClick={() => setStockAlert('')}>
              <div className="max-w-sm w-full rounded-2xl bg-white dark:bg-slate-900 border-2 border-rose-500 p-6 shadow-2xl text-center space-y-4 text-slate-900 dark:text-slate-100" onClick={(e) => e.stopPropagation()}>
                <h3 className="text-lg font-extrabold text-rose-600">Out of Stock / Limit Alert</h3>
                <p className="text-sm font-semibold">{stockAlert}</p>
                <button onClick={() => setStockAlert('')} className="px-6 py-2 rounded-xl bg-rose-600 text-white font-extrabold text-sm">OK</button>
              </div>
            </div>
          )}

          {showOpen && (
            <form onSubmit={addOpen} className="rounded-2xl bg-sky-50/80 dark:bg-sky-950/30 border border-sky-200 dark:border-sky-900 p-4 space-y-3">
              <h3 className="text-sm font-extrabold text-sky-900 dark:text-sky-200">Open Item Sales (Standardized Units: kg / pcs / L)</h3>
              <div className="flex flex-wrap gap-2 items-center">
                <input required type="text" placeholder="Item Description" value={openItem.nameEn} onChange={(e) => setOpenItem({ ...openItem, nameEn: e.target.value })} className="flex-1 min-w-[200px] px-3.5 py-2 rounded-xl border bg-white dark:bg-slate-900 text-sm" />
                <input required type="number" min="1" placeholder="Rate ₹" value={openItem.price} onChange={(e) => setOpenItem({ ...openItem, price: e.target.value })} className="w-24 px-3 py-2 rounded-xl border bg-white dark:bg-slate-900 text-sm font-bold" />
                <input required type="number" min="0.1" step="0.1" placeholder="Qty" value={openItem.qty} onChange={(e) => setOpenItem({ ...openItem, qty: e.target.value })} className="w-20 px-3 py-2 rounded-xl border bg-white dark:bg-slate-900 text-sm font-bold text-center" />
                <select required value={openItem.unit} onChange={(e) => setOpenItem({ ...openItem, unit: e.target.value })} className="px-3 py-2 rounded-xl border bg-white dark:bg-slate-900 text-sm font-bold"><option value="kg">kilograms (kg)</option><option value="pcs">pieces (pcs)</option><option value="L">liters (L)</option></select>
                <button type="submit" className="px-5 py-2 rounded-xl bg-sky-600 text-white font-extrabold text-sm">Add Open Item</button>
              </div>
            </form>
          )}

          <div className="flex flex-wrap gap-1.5">
            <button onClick={() => setCat('ALL')} style={cat === 'ALL' ? { backgroundColor: 'var(--accent-primary)' } : {}} className={`px-3 py-1.5 rounded-xl text-xs font-bold border ${cat === 'ALL' ? 'text-white border-transparent' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800'}`}>All ({products.length})</button>
            {CATEGORIES.map((c) => <button key={c.en} onClick={() => setCat(c.en)} style={cat === c.en ? { backgroundColor: 'var(--accent-primary)' } : {}} className={`px-3 py-1.5 rounded-xl text-xs font-bold border ${cat === c.en ? 'text-white border-transparent' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800'}`}>{c.hi} ({c.en})</button>)}
          </div>

          {cart.length > 0 && (
            <div className="rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900 p-3.5 flex flex-wrap items-center justify-between gap-3">
              <div className="flex flex-wrap items-center gap-2">
                <span className="text-xs font-extrabold uppercase text-emerald-800 dark:text-emerald-300">Cart:</span>
                {cart.map((c) => {
                  const pObj = products.find((x) => x.id === c.productId);
                  const lbl = c.isNonInventory ? `${c.nameEn} [Open]` : (pObj?.nameHi || pObj?.nameEn || '');
                  return <span key={c.cartKey} className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border bg-white dark:bg-slate-900 text-xs font-bold">{lbl} × {c.qty} {c.unit||'pcs'}<button onClick={() => setCart((p) => p.filter((x) => x.cartKey !== c.cartKey))} className="text-rose-500 ml-1">×</button></span>;
                })}
              </div>
              <div className="flex gap-2"><button onClick={() => setCart([])} className="text-xs font-bold text-rose-600">Clear</button><button onClick={onOpenCheckout} style={{ backgroundColor: 'var(--accent-primary)' }} className="px-3.5 py-1.5 rounded-lg text-white text-xs font-extrabold">Checkout →</button></div>
            </div>
          )}

          {grouped.map((g) => (
            <section key={g.category}>
              <h3 className="sticky top-16 z-10 bg-slate-50/95 dark:bg-slate-950/95 backdrop-blur py-2 text-lg font-extrabold border-b-2 border-emerald-600/30 mb-3 flex justify-between">
                <span>{g.categoryHi} <span className="text-sm font-bold text-slate-500 ml-2">({g.category})</span></span>
                <span className="text-xs text-slate-500">{g.items.length}</span>
              </h3>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3.5">
                {g.items.map((it) => (
                  <ProductGridCard key={it.id} item={it} selectedVariantId={varMap[it.id]} onVariantChange={handleVarChange} qtyValue={qtyMap[it.id] ?? ''} onQtyChange={handleQtyChange} onAdd={tryAddProductToCart} onOpenDetail={setDetailProduct} />
                ))}
              </div>
            </section>
          ))}

          <PlantDetailModal product={detailProduct} onClose={() => setDetailProduct(null)} />
        </div>
      );
    }

    // =========================================================================
    // 10. STOCK MANAGEMENT (NO Add Plant, Low Stock Filter, Multi-Tier Export, Stock Adjustment)
    // =========================================================================
    function StockAdjustmentSection({ products, adjustments, onAddAdjustment, onUpdateAdjustment, requestPin, onOpenExport, onBack }) {
      const [plantSearch, setPlantSearch] = useState('');
      const [ddOpen, setDdOpen] = useState(false);
      const [selId, setSelId] = useState('');
      const [adjType, setAdjType] = useState('मुफ्त वितरण / Giveaway');
      const [partyName, setPartyName] = useState('');
      const [qty, setQty] = useState('');
      const [notes, setNotes] = useState('');
      const [date, setDate] = useState(todayDDMMYYYY());
      const [exportFilter, setExportFilter] = useState('BOTH');

      const selProd = products.find((p) => p.id === selId);
      const filteredPlants = useMemo(() => products.filter((p) => smartMatch(p, plantSearch)), [products, plantSearch]);

      const submit = (e) => {
        e.preventDefault();
        if (!selProd || Number(qty) <= 0 || !notes.trim()) return;
        requestPin('Authorize Stock Adjustment', `Enter PIN to record ${adjType}.`, () => {
          onAddAdjustment({
            id: 'ADJ-' + Date.now().toString().slice(-5), date: formatStrictDDMMYYYY(date),
            productId: selProd.id, productName: `${selProd.nameHi} / ${selProd.nameEn}`,
            type: adjType, partyName: adjType.includes('Giveaway') ? partyName.trim() : '',
            qty: Number(qty), reason: notes.trim(), locked: true
          });
          setQty(''); setNotes(''); setPartyName('');
        });
      };

      const triggerExport = () => {
        const subset = adjustments.filter((a) => exportFilter === 'GIVEAWAY' ? a.type.includes('Giveaway') : exportFilter === 'DAMAGE' ? a.type.includes('Damage') : true);
        requestPin('Authorize Adjustment Export', 'Enter PIN to export Stock Adjustment report.', () => {
          onOpenExport({
            title: `Stock Adjustments (${exportFilter})`, subtitle: `${subset.length} records`, fileBase: `Stock-Adjustments-${exportFilter}`,
            columns: [{ key:'date', label:'Date' }, { key:'type', label:'Category' }, { key:'party', label:'Party' }, { key:'productName', label:'Plant' }, { key:'qty', label:'Qty' }, { key:'reason', label:'Notes' }],
            rows: subset.map((a) => ({ date: formatStrictDDMMYYYY(a.date), type: a.type, party: a.partyName || '-', productName: a.productName, qty: a.qty, reason: a.reason }))
          });
        });
      };

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div><h2 className="text-2xl font-extrabold">Stock Adjustment • स्टॉक समायोजन</h2><p className="text-xs text-slate-500">मुफ्त वितरण / Giveaway (with Party Name) & खराब सामान / Damage Stock</p></div>
            <div className="flex flex-wrap items-center gap-2">
              <select value={exportFilter} onChange={(e) => setExportFilter(e.target.value)} className="px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-xs font-bold">
                <option value="BOTH">Both Combined</option><option value="GIVEAWAY">Giveaway Only</option><option value="DAMAGE">Damage Stock Only</option>
              </select>
              <button onClick={triggerExport} style={{ backgroundColor: 'var(--accent-primary)' }} className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-white text-xs font-extrabold"><Icon name="share" className="w-4 h-4" /> Export & Share</button>
              <button onClick={onBack} className="px-4 py-2 rounded-xl border text-xs font-extrabold">← Back</button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <form onSubmit={submit} className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-4 h-fit">
              <h3 className="font-extrabold text-lg">Non-Revenue Outflow Entry</h3>
              <div className="relative">
                <label className="block text-xs font-bold mb-1">Search & Select Product *</label>
                <div className="relative">
                  <Icon name="search" className="w-4 h-4 absolute left-3 top-3 text-slate-400" />
                  <input type="text" value={plantSearch} onFocus={() => setDdOpen(true)} onChange={(e) => { setPlantSearch(e.target.value); setDdOpen(true); }} placeholder="Search plants, varieties..." className="w-full pl-9 pr-3 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold" />
                </div>
                {ddOpen && (
                  <div className="absolute z-30 mt-1 w-full max-h-56 overflow-y-auto rounded-xl bg-white dark:bg-slate-900 border shadow-2xl divide-y">
                    {filteredPlants.map((p) => (
                      <button key={p.id} type="button" onClick={() => { setSelId(p.id); setPlantSearch(`${p.nameHi} (${p.nameEn})`); setDdOpen(false); }} className="w-full text-left px-3 py-2 hover:bg-emerald-50 dark:hover:bg-slate-800 text-xs flex justify-between">
                        <div><div className="font-extrabold">{p.nameHi}</div><div className="text-[10px] text-slate-500">{p.nameEn}</div></div>
                        <span className="font-bold text-emerald-600">Stock: {p.stock}</span>
                      </button>
                    ))}
                  </div>
                )}
              </div>

              <div>
                <label className="block text-xs font-bold mb-1">Category *</label>
                <select value={adjType} onChange={(e) => setAdjType(e.target.value)} className="w-full px-3 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold">
                  <option value="मुफ्त वितरण / Giveaway">मुफ्त वितरण / Giveaway</option>
                  <option value="खराब सामान / Damage Stock">खराब सामान / Damage Stock</option>
                </select>
              </div>

              {adjType.includes('Giveaway') && (
                <div><label className="block text-xs font-bold mb-1">Party Name (Recipient)</label><input type="text" value={partyName} onChange={(e) => setPartyName(e.target.value)} placeholder="Recipient / Party Name" className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
              )}

              <div className="grid grid-cols-2 gap-3">
                <div><label className="block text-xs font-bold mb-1">Qty Removed *</label><input required type="number" min="1" value={qty} onChange={(e) => setQty(e.target.value)} placeholder="Qty" className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" /></div>
                <div><label className="block text-xs font-bold mb-1">Date (DD-MM-YYYY)</label><DateInputDDMMYYYY value={date} onChange={setDate} /></div>
              </div>

              <div><label className="block text-xs font-bold mb-1">Mandatory Adjustment Notes *</label><textarea required rows="2" value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Mandatory reason..." className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
              <button type="submit" style={{ backgroundColor: 'var(--accent-primary)' }} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-white font-extrabold text-sm"><Icon name="lock" className="w-4 h-4" /> Authorize & Record</button>
            </form>

            <div className="lg:col-span-2 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm divide-y">
              {adjustments.map((a) => (
                <div key={a.id} className="p-4 flex flex-wrap items-center justify-between gap-4">
                  <div className="space-y-1 flex-1 min-w-[200px]">
                    <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full mr-2 ${a.type.includes('Damage') || a.type.includes('खराब') ? 'bg-rose-100 text-rose-700' : 'bg-sky-100 text-sky-700'}`}>{a.type}</span>
                    <span className="text-xs text-slate-400">{formatStrictDDMMYYYY(a.date)}</span>
                    <div className="font-extrabold text-sm">{a.productName}</div>
                    <p className="text-xs text-slate-500">Qty: <strong>{a.qty}</strong> {a.partyName ? `• Party: ${a.partyName}` : ''} • {a.reason}</p>
                  </div>
                  <button onClick={() => requestPin('Toggle Lock', 'Enter PIN to toggle lock.', () => onUpdateAdjustment({ ...a, locked: !a.locked }))} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold border ${a.locked ? 'bg-amber-50 border-amber-300 text-amber-700' : 'bg-emerald-50 border-emerald-300 text-emerald-700'}`}><Icon name={a.locked ? 'lock' : 'unlock'} className="w-3.5 h-3.5" />{a.locked ? 'Locked' : 'Unlocked'}</button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function StockManagementPage({ label, products, onUpdateProduct, onDeleteProduct, adjustments, onAddAdjustment, onUpdateAdjustment, requestPin, onOpenExport }) {
      const [subView, setSubView] = useState('stock'); // 'stock' | 'low-stock' | 'adjustments'
      const [search, setSearch] = useState('');
      const [editing, setEditing] = useState(null);
      const [exportModalOpen, setExportModalOpen] = useState(false);
      const [expTier, setExpTier] = useState('valuation'); // 'basic' | 'stock' | 'valuation' | 'care'
      const [expCats, setExpCats] = useState(CATEGORIES.map((c) => c.en));
      const scrollDir = useScrollDirection();

      if (subView === 'adjustments') {
        return <StockAdjustmentSection products={products} adjustments={adjustments} onAddAdjustment={onAddAdjustment} onUpdateAdjustment={onUpdateAdjustment} requestPin={requestPin} onOpenExport={onOpenExport} onBack={() => setSubView('stock')} />;
      }

      const lowStockList = useMemo(() => products.filter((p) => (p.variants || []).some((v) => Number(v.stock) < Number(v.threshold)) || Number(p.stock) < Number(p.threshold)), [products]);
      const baseList = subView === 'low-stock' ? lowStockList : products;
      const filtered = useMemo(() => baseList.filter((p) => smartMatch(p, search)), [baseList, search]);

      const runMultiTierExport = () => {
        const subset = products.filter((p) => expCats.includes(p.category));
        setExportModalOpen(false);
        requestPin('Authorize Multi-Tier Inventory Export', 'Enter PIN to export segmented inventory.', () => {
          if (expTier === 'basic') {
            onOpenExport({ title:'Basic Item List', subtitle:`Categories: ${expCats.length}`, fileBase:'Inventory-Basic', columns:[{key:'nameHi',label:'Primary Name'},{key:'nameEn',label:'Alternate Name'},{key:'category',label:'Category'}], rows:subset.map((p)=>({nameHi:p.nameHi||p.nameEn,nameEn:p.nameEn,category:p.category})) });
          } else if (expTier === 'stock') {
            onOpenExport({ title:'Inventory Stock Levels', subtitle:`Categories: ${expCats.length}`, fileBase:'Inventory-Stock', columns:[{key:'nameHi',label:'Name'},{key:'category',label:'Category'},{key:'stock',label:'Stock'},{key:'threshold',label:'Threshold'}], rows:subset.map((p)=>({nameHi:p.nameHi||p.nameEn,category:p.category,stock:p.stock,threshold:p.threshold})) });
          } else if (expTier === 'care') {
            onOpenExport({ title:'Plant Care Documentation', subtitle:'Name & Maintenance Instructions', fileBase:'Plant-Care-Docs', columns:[{key:'name',label:'Plant Name'},{key:'care',label:'Maintenance Instructions'},{key:'source',label:'Botanical Source'}], rows:subset.map((p)=>{const c=getPlantCare(p);return{name:`${p.nameHi||p.nameEn} (${p.nameEn})`,care:`मौसम: ${c.season} | पानी: ${c.water} | धूप: ${c.sunlight} | खाद: ${c.fertilizer} | ${c.care}`,source:c.source};}) });
          } else {
            onOpenExport({ title:'Inventory Valuation Report', subtitle:`Categories: ${expCats.length}`, fileBase:'Inventory-Valuation', columns:[{key:'nameHi',label:'Plant'},{key:'stock',label:'Stock'},{key:'price',label:'Selling Price'},{key:'valuation',label:'Valuation'}], rows:subset.map((p)=>({nameHi:`${p.nameHi||p.nameEn} (${p.nameEn})`,stock:p.stock,price:p.price,valuation:p.stock*p.price})) });
          }
        });
      };

      const handleImg = async (e) => { const f = e.target.files?.[0]; if (!f) return; const u = await compressImageFile(f); setEditing((p) => ({ ...p, image: u })); };

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div><h2 className="text-2xl font-extrabold">{label}</h2><p className="text-xs text-slate-500">PIN Protected Edits/Deletions • Low Stock Filter • Multi-Tier Export • Stock Adjustment</p></div>
            <div className="flex flex-wrap gap-2">
              <button onClick={() => setSubView('stock')} style={subView === 'stock' ? { backgroundColor: 'var(--accent-primary)' } : {}} className={`px-4 py-2 rounded-xl text-xs font-extrabold ${subView === 'stock' ? 'text-white' : 'bg-slate-100 dark:bg-slate-800'}`}>All Stock ({products.length})</button>
              <button onClick={() => setSubView('low-stock')} className={`px-4 py-2 rounded-xl text-xs font-extrabold border ${subView === 'low-stock' ? 'bg-rose-600 text-white border-rose-600' : 'bg-rose-50 dark:bg-rose-950/40 text-rose-700 border-rose-300'}`}>Low Stock ({lowStockList.length})</button>
              <button onClick={() => setSubView('adjustments')} className="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-amber-50 dark:bg-amber-950/50 text-amber-800 dark:text-amber-300 border border-amber-300 text-xs font-extrabold"><Icon name="lock" className="w-3.5 h-3.5" /> Stock Adjustment</button>
              <button onClick={() => setExportModalOpen(true)} style={{ backgroundColor: 'var(--accent-primary)' }} className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-white text-xs font-extrabold"><Icon name="share" className="w-4 h-4" /> Export Inventory</button>
            </div>
          </div>

          <div className="bg-white dark:bg-slate-900 rounded-2xl border shadow-sm overflow-hidden">
            <div className={`${scrollDir === 'up' ? 'sticky top-16 z-20' : 'relative'} bg-white dark:bg-slate-900 p-4 border-b flex flex-wrap items-center justify-between gap-3`}>
              <div className="relative w-full max-w-md"><Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" /><input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search plants, varieties..." className="w-full pl-10 pr-4 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
              <span className="text-xs font-bold text-slate-500">{filtered.length} items</span>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead className="sticky top-0 z-10 bg-slate-100 dark:bg-slate-800 text-xs uppercase text-slate-600 dark:text-slate-300"><tr><th className="text-left px-4 py-3">Photo & Name</th><th className="text-left px-3 py-3">Variants & Tiers</th><th className="text-center px-3 py-3">Total Stock</th><th className="text-right px-4 py-3">PIN Actions</th></tr></thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                  {filtered.map((p) => (
                    <tr key={p.id} className="hover:bg-slate-50/70 dark:hover:bg-slate-800/40">
                      <td className="px-4 py-2.5"><div className="flex items-center gap-3">{p.image ? <img src={p.image} alt={p.nameEn} className="w-11 h-11 rounded-lg object-cover border shrink-0" loading="lazy" /> : <div className="w-11 h-11 rounded-lg bg-slate-100 flex items-center justify-center"><Icon name="leaf" className="w-5 h-5 text-slate-400" /></div>}<div><div className="font-extrabold">{p.nameHi || p.nameEn}</div><div className="text-xs text-slate-500">{p.nameEn} • {p.category}</div></div></div></td>
                      <td className="px-3 py-2.5 text-xs space-y-1">{(p.variants || []).map((v) => <div key={v.id} className={`inline-block mr-1.5 px-2 py-0.5 rounded-md border ${v.stock < v.threshold ? 'bg-rose-50 border-rose-300 text-rose-700' : 'bg-slate-50 dark:bg-slate-800'}`}>{v.label}: ₹{v.price} ({v.stock})</div>)}</td>
                      <td className="px-3 py-2.5 text-center font-extrabold">{p.stock}</td>
                      <td className="px-4 py-2.5 text-right whitespace-nowrap space-x-1.5">
                        <button onClick={() => requestPin('PIN Required to Edit', `Authorize edit for "${p.nameHi || p.nameEn}".`, () => { const c = getPlantCare(p); setEditing({ ...p, season: c.season, care: c.care, water: c.water, sunlight: c.sunlight, fertilizer: c.fertilizer, variants: JSON.parse(JSON.stringify(p.variants || [{ id: p.id+'-std', label:'Standard', price:p.price, stock:p.stock, threshold:p.threshold }])) }); })} className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold"><Icon name="lock" className="w-3 h-3" /> Edit</button>
                        <button onClick={() => requestPin('PIN Required to Delete', `Authorize delete for "${p.nameHi || p.nameEn}".`, () => onDeleteProduct(p.id))} className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold"><Icon name="trash" className="w-3 h-3" /> Delete</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Multi-Tier Inventory Export Dialog */}
          {exportModalOpen && (
            <div className="fixed inset-0 z-[105] flex items-center justify-center bg-slate-950/75 p-4" onClick={() => setExportModalOpen(false)}>
              <div className="w-full max-w-lg rounded-3xl bg-white dark:bg-slate-900 border p-6 space-y-4 shadow-2xl" onClick={(e) => e.stopPropagation()}>
                <h3 className="text-lg font-extrabold">Multi-Tier Inventory Export</h3>
                <div>
                  <label className="block text-xs font-bold mb-1.5">1. Select Report Tier</label>
                  <select value={expTier} onChange={(e) => setExpTier(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold">
                    <option value="basic">Tier 1: Basic Item List</option>
                    <option value="stock">Tier 2: Item List with Current Stock Levels</option>
                    <option value="valuation">Tier 3: Comprehensive Valuation Report (Stock + Selling Prices)</option>
                    <option value="care">Plant Care Documentation (Name & Maintenance Instructions Only)</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1.5">2. Filter Categories</label>
                  <div className="grid grid-cols-2 gap-1.5 max-h-40 overflow-y-auto p-2 rounded-xl border bg-slate-50 dark:bg-slate-800">
                    {CATEGORIES.map((c) => (
                      <label key={c.en} className="flex items-center gap-2 text-xs font-semibold cursor-pointer">
                        <input type="checkbox" checked={expCats.includes(c.en)} onChange={() => setExpCats((prev) => prev.includes(c.en) ? prev.filter((x) => x !== c.en) : [...prev, c.en])} className="accent-emerald-600" />
                        <span>{c.hi}</span>
                      </label>
                    ))}
                  </div>
                </div>
                <div className="flex justify-end gap-2"><button onClick={() => setExportModalOpen(false)} className="px-4 py-2 rounded-xl border text-xs font-bold">Cancel</button><button onClick={runMultiTierExport} style={{ backgroundColor: 'var(--accent-primary)' }} className="px-5 py-2 rounded-xl text-white text-xs font-extrabold">Continue to PIN & Export</button></div>
              </div>
            </div>
          )}

          {/* Full Variant + Care Edit Modal */}
          {editing && (
            <div className="fixed inset-0 z-[105] flex items-center justify-center bg-slate-950/75 p-4" onClick={() => setEditing(null)}>
              <form onSubmit={(e) => {
                e.preventDefault();
                const co = CATEGORIES.find((c) => c.en === editing.category);
                const totStk = editing.variants.reduce((s, v) => s + Number(v.stock || 0), 0);
                onUpdateProduct({ ...editing, categoryHi: co ? co.hi : '', price: Number(editing.variants[0]?.price || editing.price), stock: totStk, threshold: Number(editing.variants[0]?.threshold || editing.threshold), customCare: { season: editing.season, care: editing.care, water: editing.water, sunlight: editing.sunlight, fertilizer: editing.fertilizer } });
                setEditing(null);
              }} className="w-full max-w-2xl rounded-3xl bg-white dark:bg-slate-900 border shadow-2xl overflow-hidden flex flex-col max-h-[92vh]" onClick={(e) => e.stopPropagation()}>
                <div style={{ backgroundColor: 'var(--accent-primary)' }} className="px-6 py-4 text-white flex justify-between items-center"><h3 className="text-lg font-extrabold">Edit Plant & Variants</h3><button type="button" onClick={() => setEditing(null)}><Icon name="close" className="w-5 h-5" /></button></div>
                <div className="p-6 overflow-y-auto space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div><label className="block text-xs font-bold mb-1">Alternate Name</label><input required type="text" value={editing.nameEn} onChange={(e) => setEditing({ ...editing, nameEn: e.target.value })} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
                    <div><label className="block text-xs font-bold mb-1">Primary Name</label><input type="text" value={editing.nameHi} onChange={(e) => setEditing({ ...editing, nameHi: e.target.value })} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
                  </div>
                  <div className="flex gap-2 items-center"><input type="text" value={editing.image || ''} onChange={(e) => setEditing({ ...editing, image: e.target.value })} placeholder="Image URL" className="flex-1 px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-xs font-mono" /><label className="cursor-pointer px-3.5 py-2 rounded-xl bg-slate-800 text-white text-xs font-bold">Upload<input type="file" accept="image/*" onChange={handleImg} className="hidden" /></label></div>

              </form>

      useEffect(() => {
