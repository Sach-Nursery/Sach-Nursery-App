    // =========================================================================
    // 12. SUMMARY REPORTS, WORKERS, STRICT PLANT CARE DB & BILL GALLERY
    // =========================================================================
    function SummaryReportPage({ type, records }) {
      const isSale = type === 'sale';
      const [mode, setMode] = useState('single');
      const [singleDate, setSingleDate] = useState(todayStr());
      const [customStart, setCustomStart] = useState(daysAgoStr(30));
      const [customEnd, setCustomEnd] = useState(todayStr());

      const { filteredRecords, isSingleDay } = useMemo(() => {
        if (mode === 'single') return { isSingleDay: true, filteredRecords: records.filter((r) => r.date === singleDate) };
        const now = new Date();
        let startStr = '1970-01-01', endStr = '2999-12-31';
        if (mode === '1m') { const d = new Date(now); d.setMonth(d.getMonth() - 1); startStr = d.toISOString().slice(0, 10); }
        else if (mode === '3m') { const d = new Date(now); d.setMonth(d.getMonth() - 3); startStr = d.toISOString().slice(0, 10); }
        else if (mode === '6m') { const d = new Date(now); d.setMonth(d.getMonth() - 6); startStr = d.toISOString().slice(0, 10); }
        else if (mode === '1y') { const d = new Date(now); d.setFullYear(d.getFullYear() - 1); startStr = d.toISOString().slice(0, 10); }
        else if (mode === 'custom') { startStr = customStart; endStr = customEnd; }
        return { isSingleDay: false, filteredRecords: records.filter((r) => r.date >= startStr && r.date <= endStr) };
      }, [records, mode, singleDate, customStart, customEnd]);

      const aggregated = useMemo(() => {
        const byItem = {}, byCategory = {};
        let totalQty = 0;
        filteredRecords.forEach((rec) => {
          (rec.items || []).forEach((it) => {
            const lineVal = isSale ? it.qty * it.price : it.qty * it.costPrice;
            totalQty += it.qty;
            if (!byItem[it.productId]) byItem[it.productId] = { nameEn: it.nameEn, nameHi: it.nameHi, category: it.category || 'Other', qty: 0, amount: 0 };
            byItem[it.productId].qty += it.qty; byItem[it.productId].amount += lineVal;
            const cat = it.category || 'Other';
            if (!byCategory[cat]) byCategory[cat] = { category: cat, qty: 0, amount: 0 };
            byCategory[cat].qty += it.qty; byCategory[cat].amount += lineVal;
          });
        });
        return { items: Object.values(byItem).sort((a, b) => b.amount - a.amount), categories: Object.values(byCategory).sort((a, b) => b.amount - a.amount), totalQty };
      }, [filteredRecords, isSale]);

      const totalPeriodValue = filteredRecords.reduce((s, r) => s + (r.total || 0), 0);

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div><h2 className="text-2xl font-extrabold">{isSale ? 'Sale Summary • बिक्री सारांश' : 'Purchase Summary • खरीद सारांश'}</h2><p className="text-xs text-slate-500">{isSingleDay ? 'Single-Day: Detailed transactions' : 'Multi-Day: Aggregated by item & category'}</p></div>
              <div className="px-4 py-2 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 border text-right"><div className="text-[11px] font-bold uppercase text-emerald-700">Total ({filteredRecords.length})</div><div className="text-xl font-extrabold text-emerald-700 dark:text-emerald-300">₹{totalPeriodValue.toLocaleString()}</div></div>
            </div>
            <div className="flex flex-wrap items-center gap-2 pt-2">
              {[{ id: 'single', label: 'Single Day' }, { id: '1m', label: '1 Month' }, { id: '3m', label: '3 Months' }, { id: '6m', label: '6 Months' }, { id: '1y', label: '1 Year' }, { id: 'all', label: 'All Time' }, { id: 'custom', label: 'Custom Range' }].map((p) => (
                <button key={p.id} onClick={() => setMode(p.id)} className={`px-3.5 py-2 rounded-xl text-xs font-extrabold border ${mode === p.id ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 dark:bg-slate-800'}`}>{p.label}</button>
              ))}
              {mode === 'single' && <input type="date" value={singleDate} onChange={(e) => setSingleDate(e.target.value)} className="ml-2 px-3 py-1.5 rounded-xl border bg-white dark:bg-slate-800 text-xs font-bold" />}
              {mode === 'custom' && <div className="flex items-center gap-2 ml-2"><input type="date" value={customStart} onChange={(e) => setCustomStart(e.target.value)} className="px-3 py-1.5 rounded-xl border bg-white dark:bg-slate-800 text-xs font-bold" /><span className="text-xs font-bold">to</span><input type="date" value={customEnd} onChange={(e) => setCustomEnd(e.target.value)} className="px-3 py-1.5 rounded-xl border bg-white dark:bg-slate-800 text-xs font-bold" /></div>}
            </div>
          </div>

          {isSingleDay ? (
            <div className="space-y-4">
              {filteredRecords.length === 0 ? <div className="rounded-2xl border-2 border-dashed p-12 text-center text-slate-500">No records on {singleDate}.</div>
                : filteredRecords.map((rec) => (
                  <div key={rec.id} className="bg-white dark:bg-slate-900 rounded-2xl border p-5 shadow-sm space-y-3">
                    <div className="flex flex-wrap items-center justify-between gap-2 pb-3 border-b">
                      <div><span className="text-xs font-extrabold px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 mr-2">{rec.id}</span><span className="font-extrabold">{isSale ? rec.customer : rec.supplier}</span><span className="text-xs text-slate-400 ml-2">{rec.date} • {rec.time || ''}</span></div>
                      <div className="text-right"><div className="text-lg font-extrabold text-emerald-600">₹{rec.total.toLocaleString()}</div>{isSale && <div className="text-[11px] text-slate-500">Cash: ₹{rec.cashAmount} | UPI: ₹{rec.upiAmount}</div>}</div>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
                      {rec.items.map((it, idx) => <div key={idx} className="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 flex justify-between text-xs"><div><div className="font-bold">{it.nameEn}</div><div className="text-slate-500">{it.nameHi}</div></div><div className="font-bold">{it.qty} × ₹{isSale ? it.price : it.costPrice}</div></div>)}
                    </div>
                  </div>
                ))}
            </div>
          ) : (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="bg-white dark:bg-slate-900 rounded-2xl border shadow-sm overflow-hidden h-fit">
                <div className="p-4 border-b font-extrabold">By Category</div>
                <table className="w-full text-sm">
                  <thead className="bg-slate-50 dark:bg-slate-800/60 text-xs uppercase text-slate-500"><tr><th className="text-left px-4 py-2.5">Category</th><th className="text-center px-3 py-2.5">Qty</th><th className="text-right px-4 py-2.5">Total</th></tr></thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">{aggregated.categories.map((c) => <tr key={c.category}><td className="px-4 py-3 font-bold">{c.category}</td><td className="px-3 py-3 text-center">{c.qty}</td><td className="px-4 py-3 text-right font-extrabold text-emerald-600">₹{c.amount.toLocaleString()}</td></tr>)}</tbody>
                </table>
              </div>
              <div className="lg:col-span-2 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm overflow-hidden">
                <div className="p-4 border-b flex justify-between"><span className="font-extrabold">By Item</span><span className="text-xs font-bold text-slate-500">Units: {aggregated.totalQty}</span></div>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead className="bg-slate-50 dark:bg-slate-800/60 text-xs uppercase text-slate-500"><tr><th className="text-left px-4 py-2.5">Item</th><th className="text-left px-4 py-2.5">Category</th><th className="text-center px-3 py-2.5">Qty</th><th className="text-right px-4 py-2.5">Value</th></tr></thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800">{aggregated.items.map((it, idx) => <tr key={idx}><td className="px-4 py-3"><div className="font-extrabold">{it.nameEn}</div><div className="text-xs text-slate-500">{it.nameHi}</div></td><td className="px-4 py-3 text-xs text-slate-500">{it.category}</td><td className="px-3 py-3 text-center font-bold">{it.qty}</td><td className="px-4 py-3 text-right font-extrabold text-emerald-600">₹{it.amount.toLocaleString()}</td></tr>)}</tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function WorkersAttendancePage({ workers, onAddWorker, attendance, onSetAttendance }) {
      const [selectedDate, setSelectedDate] = useState(todayStr());
      const [newW, setNewW] = useState({ name: '', nameHi: '', role: 'Gardener / माली', phone: '', dailyWage: 500 });
      const dayRecord = attendance[selectedDate] || {};
      const selectedMonth = selectedDate.slice(0, 7);

      const getMonthly = (wid, wage) => {
        let p = 0, h = 0;
        Object.entries(attendance).forEach(([d, m]) => { if (d.startsWith(selectedMonth)) { if (m[wid] === 'Present') p++; else if (m[wid] === 'Half-Day') h++; } });
        return { p, h, pay: (p + h * 0.5) * wage };
      };

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div><h2 className="text-2xl font-extrabold">Workers & Attendance • कर्मचारी व उपस्थिति</h2><p className="text-xs text-slate-500">Daily roll call & monthly wages</p></div>
            <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm divide-y divide-slate-100 dark:divide-slate-800">
              {workers.map((w) => {
                const st = dayRecord[w.id] || 'Unmarked', m = getMonthly(w.id, w.dailyWage);
                return (
                  <div key={w.id} className="p-4 flex flex-wrap items-center justify-between gap-4">
                    <div><div className="font-extrabold">{w.name} {w.nameHi && <span className="text-sm text-slate-500">({w.nameHi})</span>}</div><div className="text-xs text-slate-500">{w.role} • ₹{w.dailyWage}/day • {selectedMonth}: <strong>{m.p}P/{m.h}H</strong> (₹{m.pay})</div></div>
                    <div className="flex gap-1.5">{['Present', 'Half-Day', 'Absent'].map((opt) => <button key={opt} onClick={() => onSetAttendance(selectedDate, w.id, opt)} className={`px-3 py-1.5 rounded-xl text-xs font-extrabold border ${st === opt ? (opt === 'Present' ? 'bg-emerald-600 text-white' : opt === 'Half-Day' ? 'bg-amber-500 text-white' : 'bg-rose-600 text-white') : 'bg-slate-50 dark:bg-slate-800'}`}>{opt}</button>)}</div>
                  </div>
                );
              })}
            </div>
            <form onSubmit={(e) => { e.preventDefault(); if (!newW.name.trim()) return; onAddWorker({ ...newW, id: 'w-' + Date.now(), dailyWage: Number(newW.dailyWage) || 500 }); setNewW({ name: '', nameHi: '', role: 'Gardener / माली', phone: '', dailyWage: 500 }); }} className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-3 h-fit">
              <h3 className="font-extrabold text-lg">Add Worker</h3>
              <input required type="text" placeholder="Name (English) *" value={newW.name} onChange={(e) => setNewW({ ...newW, name: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <input type="text" placeholder="Name (Hindi)" value={newW.nameHi} onChange={(e) => setNewW({ ...newW, nameHi: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <input type="text" placeholder="Role" value={newW.role} onChange={(e) => setNewW({ ...newW, role: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" />
              <input type="number" min="0" value={newW.dailyWage} onChange={(e) => setNewW({ ...newW, dailyWage: e.target.value })} className="w-full px-3.5 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" />
              <button type="submit" className="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold text-sm">+ Add Worker</button>
            </form>
          </div>
        </div>
      );
    }

    function PlantCareDatabasePage({ plantCareDb, onAddEntry, onUpdateEntry, requestAuth }) {
      const [searchInput, setSearchInput] = useState('');
      const [searchError, setSearchError] = useState('');
      const [selectedPredefinedId, setSelectedPredefinedId] = useState('');
      const [editingId, setEditingId] = useState(null);
      const [editDraft, setEditDraft] = useState(null);

      const availableToAdd = useMemo(() => {
        const activeIds = new Set(plantCareDb.map((c) => c.id));
        return PREDEFINED_PLANT_CARE.filter((c) => !activeIds.has(c.id));
      }, [plantCareDb]);

      const filtered = useMemo(() => {
        const q = searchInput.trim().toLowerCase();
        if (!q) return plantCareDb;
        return plantCareDb.filter((c) => c.commonEn.toLowerCase().includes(q) || c.commonHi.toLowerCase().includes(q) || c.botanicalName.toLowerCase().includes(q) || c.family.toLowerCase().includes(q));
      }, [plantCareDb, searchInput]);

      useEffect(() => {
        const q = searchInput.trim();
        if (q && filtered.length === 0) setSearchError(`Error: Unknown plant "${q}" is not in the verified Plant Care Database. Automatic fallback generation is disabled — select strictly from the pre-defined dropdown.`);
        else setSearchError('');
      }, [searchInput, filtered.length]);

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div><h2 className="text-2xl font-extrabold">Plant Care Database • पादप देखभाल डेटाबेस</h2><p className="text-xs text-slate-500">Strict Pre-defined Dropdown Only • Unknown search shows error • Password-protected edits</p></div>
              <span className="px-3 py-1.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 text-xs font-extrabold border">{plantCareDb.length} / {PREDEFINED_PLANT_CARE.length} Active</span>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 pt-2 border-t">
              <form onSubmit={(e) => { e.preventDefault(); if (searchInput.trim() && filtered.length === 0) setSearchError(`Error: Plant "${searchInput.trim()}" not found in pre-defined database.`); }} className="flex gap-2">
                <div className="relative flex-1"><Icon name="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400" /><input type="text" value={searchInput} onChange={(e) => setSearchInput(e.target.value)} placeholder="Search pre-defined entries..." className="w-full pl-10 pr-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm outline-none" /></div>
                <button type="submit" className="px-4 py-2.5 rounded-xl bg-slate-900 dark:bg-slate-700 text-white text-xs font-extrabold">Search</button>
              </form>
              <form onSubmit={(e) => { e.preventDefault(); const found = PREDEFINED_PLANT_CARE.find((c) => c.id === selectedPredefinedId); if (found) { onAddEntry({ ...found, verified: true }); setSelectedPredefinedId(''); } }} className="flex gap-2">
                <select required value={selectedPredefinedId} onChange={(e) => setSelectedPredefinedId(e.target.value)} className="flex-1 px-3.5 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold">
                  <option value="">{availableToAdd.length === 0 ? 'All pre-defined entries loaded' : '-- Select Pre-defined Entry --'}</option>
                  {availableToAdd.map((entry) => <option key={entry.id} value={entry.id}>{entry.commonEn} ({entry.commonHi}) — {entry.botanicalName}</option>)}
                </select>
                <button type="submit" disabled={!selectedPredefinedId} className="px-4 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold disabled:opacity-40">+ Add</button>
              </form>
            </div>
            {searchError && <div className="p-4 rounded-xl bg-rose-50 dark:bg-rose-950/60 border border-rose-300 text-rose-700 dark:text-rose-300 flex items-start gap-3"><Icon name="alert" className="w-5 h-5 shrink-0" /><span className="text-xs font-bold">{searchError}</span></div>}
          </div>
          {!searchError && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              {filtered.map((item) => {
                const isEditing = editingId === item.id && editDraft;
                return (
                  <div key={item.id} className="bg-white dark:bg-slate-900 rounded-2xl border p-5 shadow-sm space-y-3">
                    <div className="flex items-start justify-between gap-3">
                      <div><span className="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800 mb-1">✓ Pre-defined Verified</span><h3 className="text-lg font-extrabold">{item.commonEn} • {item.commonHi}</h3><p className="text-xs italic text-slate-500">{item.botanicalName} ({item.family})</p></div>
                      {!isEditing && <button onClick={() => requestAuth('Authorize DB Modification', `Edit "${item.commonEn}"`, () => { setEditingId(item.id); setEditDraft({ ...item }); })} className="flex items-center gap-1 px-3 py-1.5 rounded-xl border text-xs font-bold"><Icon name="lock" className="w-3.5 h-3.5" /> Edit</button>}
                    </div>
                    {isEditing ? (
                      <div className="space-y-2 text-xs pt-2">
                        {['season', 'care', 'water', 'sunlight', 'fertilizer'].map((f) => <div key={f}><label className="block font-bold uppercase text-[10px] text-slate-400">{f}</label><input type="text" value={editDraft[f]} onChange={(e) => setEditDraft({ ...editDraft, [f]: e.target.value })} className="w-full px-3 py-1.5 rounded-lg border bg-slate-50 dark:bg-slate-800" /></div>)}
                        <div className="flex justify-end gap-2 pt-2"><button onClick={() => setEditingId(null)} className="px-3 py-1.5 rounded-lg border font-bold">Cancel</button><button onClick={() => { onUpdateEntry(editDraft); setEditingId(null); }} className="px-4 py-1.5 rounded-lg bg-emerald-600 text-white font-bold">Save</button></div>
                      </div>
                    ) : (
                      <div className="space-y-1.5 text-xs text-slate-700 dark:text-slate-300"><p><strong>Season:</strong> {item.season}</p><p><strong>Care:</strong> {item.care}</p><p><strong>Water:</strong> {item.water}</p><p><strong>Sunlight:</strong> {item.sunlight}</p><p><strong>Fertilizer:</strong> {item.fertilizer}</p><p className="text-[11px] text-slate-400 pt-1 border-t">Source: {item.source}</p></div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function SettingsPage({ theme, setTheme, nurseryProfile, onSaveProfile, users, onSaveUsers, currentUser, products, plantCareDb, onImportProducts, requestAuth, onLogout }) {
      const [profileDraft, setProfileDraft] = useState(nurseryProfile);
      const [newUser, setNewUser] = useState({ username: '', password: '', role: 'Staff' });
      const importInputRef = useRef(null);

      useEffect(() => { setProfileDraft(nurseryProfile); }, [nurseryProfile]);

      const handleExportExcel = () => {
        requestAuth(
          'Authorize Inventory Excel Export',
          'Enter administrator password to export full inventory to Excel.',
          () => exportInventoryToExcel(products, plantCareDb, nurseryProfile.nurseryName)
        );
      };

      const handleImportFileChosen = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        e.target.value = '';
        requestAuth(
          'Authorize Inventory Excel Import',
          `Verify administrator password to import & merge "${file.name}" into inventory.`,
          async () => {
            const rows = await parseInventoryExcelFile(file);
            if (!rows || rows.length === 0) { alert('No valid rows found in file.'); return; }
            onImportProducts(rows);
          }
        );
      };

      return (
        <div className="max-w-4xl space-y-6">
          {/* Nursery Identity */}
          <form onSubmit={(e) => { e.preventDefault(); onSaveProfile({ nurseryName: profileDraft.nurseryName.trim() || 'Sach Nursery', ownerMobile: profileDraft.ownerMobile.trim() }); }} className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm space-y-4">
            <div><h2 className="text-xl font-extrabold">Nursery Profile • नर्सरी विवरण</h2><p className="text-xs text-slate-500">Used on ERP headers, customer catalog & WhatsApp bills</p></div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div><label className="block text-xs font-bold mb-1">Nursery Name *</label><input required type="text" value={profileDraft.nurseryName} onChange={(e) => setProfileDraft({ ...profileDraft, nurseryName: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" /></div>
              <div><label className="block text-xs font-bold mb-1">Owner Mobile Number *</label><input required type="tel" value={profileDraft.ownerMobile} onChange={(e) => setProfileDraft({ ...profileDraft, ownerMobile: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-bold" /></div>

            <div className="flex flex-wrap items-center justify-between gap-3">

                <p className="text-xs text-slate-500">Password-authorized full inventory export (.xlsx) and bulk import/update (.xlsx / .xls / .csv)</p>

              <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-amber-50 dark:bg-amber-950/50 text-amber-700 text-[11px] font-bold border border-amber-200"><Icon name="lock" className="w-3.5 h-3.5" /> Password Required</span>
            </div>
            <div className="flex flex-wrap gap-3 pt-1">
              <button type="button" onClick={handleExportExcel} className="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow">
                <Icon name="excel" className="w-4 h-4" /> Export Full Inventory to Excel (.xlsx)
              </button>
              <button type="button" onClick={() => importInputRef.current?.click()} className="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 text-white text-xs font-extrabold shadow">
                <Icon name="excel" className="w-4 h-4" /> Import Inventory from Excel / CSV
              </button>
              <input ref={importInputRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleImportFileChosen} className="hidden" />

            <p className="text-[11px] text-slate-400">Tip: Export first to obtain an editable Excel template with all columns (`id`, `nameEn`, `nameHi`, `category`, `price`, `stock`, `threshold`, `image`, `season`, `care`, `water`, `sunlight`, `fertilizer`).</p>

          <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm space-y-5">
            <div><h2 className="text-xl font-extrabold">Administrator User Management • उपयोगकर्ता प्रबंधन</h2><p className="text-xs text-slate-500">Manage ERP login accounts & roles</p></div>
            <div className="overflow-x-auto rounded-xl border">
              <table className="w-full text-sm">
                <thead className="bg-slate-50 dark:bg-slate-800/70 text-xs uppercase text-slate-500"><tr><th className="text-left px-4 py-2.5">Username</th><th className="text-left px-3 py-2.5">Role</th><th className="text-center px-3 py-2.5">Status</th><th className="text-right px-4 py-2.5">Actions</th></tr></thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                  {users.map((u) => (
                    <tr key={u.id}>
                      <td className="px-4 py-3 font-extrabold">{u.username} {u.isPrimary && <span className="ml-1 text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">Primary</span>}</td>
                      <td className="px-3 py-3 text-xs font-semibold">{u.role}</td>
                      <td className="px-3 py-3 text-center"><span className={`px-2.5 py-0.5 rounded-full text-[11px] font-bold ${u.active ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}`}>{u.active ? 'Active' : 'Disabled'}</span></td>

                            <button onClick={() => requestAuth('Toggle User', `Change access for ${u.username}?`, () => onSaveUsers(users.map((x) => x.id === u.id ? { ...x, active: !x.active } : x)))} className="px-3 py-1 rounded-lg border text-xs font-bold">{u.active ? 'Disable' : 'Enable'}</button>

            <form onSubmit={(e) => { e.preventDefault(); if (!newUser.username.trim() || !newUser.password) return; requestAuth('Authorize User Creation', `Add user "${newUser.username.trim()}".`, () => { onSaveUsers([...users, { id: 'u-' + Date.now(), username: newUser.username.trim(), password: newUser.password, role: newUser.role, active: true, isPrimary: false }]); setNewUser({ username: '', password: '', role: 'Staff' }); }); }} className="grid grid-cols-1 sm:grid-cols-4 gap-3 pt-2 border-t items-end">
              <div><label className="block text-[11px] font-bold mb-1">Username *</label><input required type="text" value={newUser.username} onChange={(e) => setNewUser({ ...newUser, username: e.target.value })} placeholder="Username" className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
              <div><label className="block text-[11px] font-bold mb-1">Password *</label><input required type="password" value={newUser.password} onChange={(e) => setNewUser({ ...newUser, password: e.target.value })} placeholder="••••••••" className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm" /></div>
              <div><label className="block text-[11px] font-bold mb-1">Role</label><select value={newUser.role} onChange={(e) => setNewUser({ ...newUser, role: e.target.value })} className="w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm font-semibold"><option>Staff</option><option>Manager</option><option>Administrator</option></select></div>
              <button type="submit" className="py-2.5 px-4 rounded-xl bg-slate-900 dark:bg-emerald-600 text-white text-xs font-extrabold">+ Add User</button>

          {/* Theme Toggle Strictly Inside Settings + Logout */}
          <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border shadow-sm space-y-4">
            <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border flex items-center justify-between gap-4">
              <div><h3 className="font-extrabold text-base">Interface Theme • थीम मोड</h3><p className="text-xs text-slate-500">Toggle between Light and Dark themes</p></div>
              <div className="flex gap-2">
                <button onClick={() => setTheme('light')} className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-extrabold border ${theme === 'light' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white dark:bg-slate-900'}`}><Icon name="sun" className="w-4 h-4" /> Light</button>
                <button onClick={() => setTheme('dark')} className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-extrabold border ${theme === 'dark' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white dark:bg-slate-900'}`}><Icon name="moon" className="w-4 h-4" /> Dark</button>
              </div>
            </div>
            <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border flex items-center justify-between">
              <div><h3 className="font-extrabold text-sm">Signed-in: {currentUser?.username}</h3><p className="text-xs text-slate-500">{currentUser?.role} • {nurseryProfile.nurseryName}</p></div>
              <button onClick={onLogout} className="flex items-center gap-2 px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-extrabold"><Icon name="logout" className="w-4 h-4" /> Logout</button>
            </div>

        </div>
      );

            <div className="space-y-1.5">
              <span className="inline-block px-3 py-1 rounded-full bg-white/15 text-xs font-bold">{nurseryProfile.nurseryName} ERP {nurseryProfile.ownerMobile ? `• 📞 ${nurseryProfile.ownerMobile}` : ''}</span>
              <h1 className="text-3xl font-extrabold tracking-tight">Welcome, {currentUser?.username || MASTER_USER}</h1>
              <p className="text-emerald-100 text-sm max-w-xl">Managing {products.length} plant varieties, non-inventory open item billing, password-protected adjustments & WhatsApp care guides.</p>

            <div className="flex flex-wrap gap-3 shrink-0">

              <button onClick={onOpenCustomerQR} className="flex items-center gap-2.5 px-5 py-3.5 rounded-2xl bg-emerald-950/40 hover:bg-emerald-950/60 border border-white/25 text-white font-extrabold text-sm"><Icon name="external" className="w-5 h-5" /><span>Customer Catalog QR</span></button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <button onClick={() => onNavigate('catalog')} className="text-left group rounded-3xl bg-white dark:bg-slate-900 border p-6 shadow-sm hover:shadow-lg hover:border-emerald-500 transition flex flex-col justify-between min-h-[175px]">
              <div className="flex items-center justify-between"><div className="p-3.5 rounded-2xl bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700"><Icon name="grid" className="w-7 h-7" /></div><span className="text-xs font-bold text-emerald-600">Open Catalog →</span></div>
              <div className="pt-4"><h3 className="text-xl font-extrabold">Inventory & Catalog</h3><p className="text-xs text-slate-500 mt-1">{products.length} plant varieties</p></div>

            <button onClick={() => onNavigate('sale-summary')} className="text-left group rounded-3xl bg-white dark:bg-slate-900 border p-6 shadow-sm hover:shadow-lg hover:border-emerald-500 transition flex flex-col justify-between min-h-[175px]">
              <div className="flex items-center justify-between"><div className="p-3.5 rounded-2xl bg-sky-100 dark:bg-sky-950/60 text-sky-700"><Icon name="chart" className="w-7 h-7" /></div><span className="text-xs font-bold text-sky-600">View Report →</span></div>
              <div className="pt-4"><h3 className="text-xl font-extrabold">Sale Summary</h3><div className="mt-2 flex items-baseline justify-between"><span className="text-2xl font-extrabold text-emerald-600">₹{allSalesTotal.toLocaleString()}</span><span className="text-xs font-semibold text-slate-500">Today: ₹{todaySalesTotal.toLocaleString()}</span></div></div>
            </button>
            <button onClick={() => onNavigate('purchase-summary')} className="text-left group rounded-3xl bg-white dark:bg-slate-900 border p-6 shadow-sm hover:shadow-lg hover:border-emerald-500 transition flex flex-col justify-between min-h-[175px]">
              <div className="flex items-center justify-between"><div className="p-3.5 rounded-2xl bg-amber-100 dark:bg-amber-950/60 text-amber-700"><Icon name="truck" className="w-7 h-7" /></div><span className="text-xs font-bold text-amber-600">View Report →</span></div>
              <div className="pt-4"><h3 className="text-xl font-extrabold">Purchase Summary</h3><div className="mt-2 flex items-baseline justify-between"><span className="text-2xl font-extrabold">₹{allPurchasesTotal.toLocaleString()}</span><span className="text-xs font-semibold text-slate-500">Today: ₹{todayPurchasesTotal.toLocaleString()}</span></div></div>
            </button>
          </div>

          <div>
            <h2 className="text-sm font-extrabold uppercase tracking-wider text-slate-400 mb-3">Quick Modules</h2>
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-3.5">
              {[
                { id: 'pos', label: 'Sales & POS', sub: 'बिक्री बिलिंग', icon: 'cart' },
                { id: 'purchases', label: 'Purchases', sub: 'खरीद प्रविष्टि', icon: 'truck' },
                { id: 'stock', label: 'Stock CRUD', sub: 'स्टॉक प्रबंधन', icon: 'boxes' },
                { id: 'adjustments', label: 'Adjustments', sub: 'सैंपल / नुकसान', icon: 'adjust' },
                { id: 'workers', label: 'Workers', sub: 'उपस्थिति', icon: 'users' },
                { id: 'plant-care', label: 'Plant Care DB', sub: 'वैज्ञानिक डेटा', icon: 'book' },
                { id: 'bills', label: 'Bill Gallery', sub: 'बिल गैलरी', icon: 'image' },
              ].map((m) => (
                <button key={m.id} onClick={() => onNavigate(m.id)} className="rounded-2xl bg-white dark:bg-slate-900 border p-4 text-left hover:border-emerald-500 hover:shadow transition">
                  <Icon name={m.icon} className="w-6 h-6 text-emerald-600 mb-2" /><div className="font-extrabold text-sm">{m.label}</div><div className="text-xs text-slate-500">{m.sub}</div>

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [loadingDb, setLoadingDb] = useState(true);
      const [sidebarExpanded, setSidebarExpanded] = useState(false);
      const [activePage, setActivePage] = useState('dashboard');
      const [theme, setTheme] = useState('light');
      const [customerPreviewMode, setCustomerPreviewMode] = useState(window.location.hash === '#customer-catalog');

      const [nurseryProfile, setNurseryProfile] = useState(DEFAULT_NURSERY_PROFILE);
      const [users, setUsers] = useState(DEFAULT_USERS);
      const [products, setProducts] = useState([]);
      const [sales, setSales] = useState([]);
      const [purchases, setPurchases] = useState([]);
      const [adjustments, setAdjustments] = useState([]);
      const [plantCareDb, setPlantCareDb] = useState([]);
      const [workers, setWorkers] = useState([]);
      const [attendance, setAttendance] = useState({});
      const [bills, setBills] = useState([]);
      const [cart, setCart] = useState([]);

      const [qrOpen, setQrOpen] = useState(false);
      const [customerQrOpen, setCustomerQrOpen] = useState(false);
      const [checkoutOpen, setCheckoutOpen] = useState(false);
      const [waDispatch, setWaDispatch] = useState(null);
      const [toast, setToast] = useState('');
      const [authModal, setAuthModal] = useState({ open: false, title: '', subtitle: '', onOk: null });

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3200); };
      const requestAuth = useCallback((title, subtitle, onOk) => { setAuthModal({ open: true, title, subtitle, onOk }); }, []);

      useEffect(() => {
        const onHash = () => setCustomerPreviewMode(window.location.hash === '#customer-catalog');
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      useEffect(() => {
        (async () => {
          const initialized = await idb.get('initialized_v4_168');
          if (!initialized) {
            await idb.set('nurseryProfile', DEFAULT_NURSERY_PROFILE);
            await idb.set('users', DEFAULT_USERS);
            await idb.set('products', SEED_PRODUCTS);
            await idb.set('sales', SEED_SALES);
            await idb.set('purchases', SEED_PURCHASES);
            await idb.set('adjustments', SEED_ADJUSTMENTS);
            await idb.set('plantCareDb', PREDEFINED_PLANT_CARE.slice(0, 12));
            await idb.set('workers', SEED_WORKERS);
            await idb.set('attendance', {});
            await idb.set('bills', []);
            await idb.set('theme', 'light');
            await idb.set('initialized_v4_168', true);
          }
          setNurseryProfile((await idb.get('nurseryProfile')) || DEFAULT_NURSERY_PROFILE);
          setUsers((await idb.get('users')) || DEFAULT_USERS);
          setProducts((await idb.get('products')) || SEED_PRODUCTS);
          setSales((await idb.get('sales')) || SEED_SALES);
          setPurchases((await idb.get('purchases')) || SEED_PURCHASES);
          setAdjustments((await idb.get('adjustments')) || SEED_ADJUSTMENTS);
          setPlantCareDb((await idb.get('plantCareDb')) || PREDEFINED_PLANT_CARE.slice(0, 12));
          setWorkers((await idb.get('workers')) || SEED_WORKERS);
          setAttendance((await idb.get('attendance')) || {});
          setBills((await idb.get('bills')) || []);
          setTheme((await idb.get('theme')) || 'light');
          setLoadingDb(false);
        })();
      }, []);

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') root.classList.add('dark');
        else root.classList.remove('dark');
        if (!loadingDb) idb.set('theme', theme);
      }, [theme, loadingDb]);

      const saveProfile = (next) => { setNurseryProfile(next); idb.set('nurseryProfile', next); showToast('Nursery settings saved.'); };
      const saveUsers = (next) => { setUsers(next); idb.set('users', next); showToast('User accounts updated.'); };
      const saveProducts = (next) => { setProducts(next); idb.set('products', next); };
      const saveSales = (next) => { setSales(next); idb.set('sales', next); };
      const savePurchases = (next) => { setPurchases(next); idb.set('purchases', next); };
      const saveAdjustments = (next) => { setAdjustments(next); idb.set('adjustments', next); };
      const savePlantCareDb = (next) => { setPlantCareDb(next); idb.set('plantCareDb', next); };
      const saveWorkers = (next) => { setWorkers(next); idb.set('workers', next); };
      const saveAttendance = (next) => { setAttendance(next); idb.set('attendance', next); };
      const saveBills = (next) => { setBills(next); idb.set('bills', next); };

      const handleConfirmSale = (salePayload) => {
        const newSale = { id: 'INV-' + (1000 + sales.length + 1), date: todayStr(), time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), ...salePayload };
        saveSales([newSale, ...sales]);
        // Only deduct stock for tracked inventory items (Non-Inventory Open Items leave stock untouched!)
        saveProducts(products.map((p) => {
          const sold = salePayload.items.find((i) => !i.isNonInventory && i.productId === p.id);
          return sold ? { ...p, stock: Math.max(0, p.stock - sold.qty) } : p;
        }));
        setCart([]);
        setCheckoutOpen(false);
        const waPayload = buildWhatsAppBillPayload(newSale, nurseryProfile, products, plantCareDb);
        setWaDispatch(waPayload);
        try { window.open(waPayload.url, '_blank', 'noopener,noreferrer'); } catch {}
        showToast(`Sale ${newSale.id} saved & WhatsApp bill ready.`);
      };

      const handleRecordPurchase = (purPayload) => {
        const newPur = { id: 'PUR-' + (500 + purchases.length + 1), time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), ...purPayload };
        savePurchases([newPur, ...purchases]);
        saveProducts(products.map((p) => {
          const bought = purPayload.items.find((i) => i.productId === p.id);
          return bought ? { ...p, stock: p.stock + bought.qty } : p;
        }));
        showToast(`Purchase ${newPur.id} saved & stock increased.`);
      };

      const handleAddAdjustment = (adj) => {
        saveAdjustments([adj, ...adjustments]);
        saveProducts(products.map((p) => (p.id === adj.productId ? { ...p, stock: Math.max(0, p.stock - adj.qty) } : p)));
        showToast('Stock adjustment authorized, saved & locked.');
      };

      const handleImportProducts = (rows) => {
        let updated = 0, added = 0;
        const nextMap = new Map(products.map((p) => [p.id, p]));
        rows.forEach((r) => {
          const nameEn = String(r.nameEn || r.Name || '').trim();
          if (!nameEn) return;
          const existingById = r.id && nextMap.get(String(r.id));
          const existingByName = !existingById ? [...nextMap.values()].find((p) => p.nameEn.toLowerCase() === nameEn.toLowerCase()) : null;
          const target = existingById || existingByName;
          const catEn = String(r.category || target?.category || CATEGORIES[0].en);
          const catObj = CATEGORIES.find((c) => c.en === catEn);
          const itemObj = {
            id: target ? target.id : (r.id ? String(r.id) : 'p-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5)),
            nameEn,
            nameHi: String(r.nameHi ?? target?.nameHi ?? ''),
            category: catEn,
            categoryHi: String(r.categoryHi || catObj?.hi || target?.categoryHi || ''),
            price: Number(r.price ?? target?.price ?? 0) || 0,
            stock: Number(r.stock ?? target?.stock ?? 0) || 0,
            threshold: Number(r.threshold ?? target?.threshold ?? 10) || 0,
            image: String(r.image ?? target?.image ?? ''),
            careId: String(r.careId || target?.careId || PREDEFINED_PLANT_CARE[0].id),
            customCare: (r.season || r.care || r.water || r.sunlight || r.fertilizer)
              ? { season: String(r.season || ''), care: String(r.care || ''), water: String(r.water || ''), sunlight: String(r.sunlight || ''), fertilizer: String(r.fertilizer || '') }
              : target?.customCare
          };
          if (target) updated++; else added++;
          nextMap.set(itemObj.id, itemObj);
        });
        saveProducts(Array.from(nextMap.values()));
        showToast(`Excel import complete: ${updated} updated, ${added} added.`);
      };

      if (loadingDb) return <div className="min-h-screen flex items-center justify-center bg-slate-950 text-white font-bold">Loading ERP...</div>;

      if (customerPreviewMode) {
        return <CustomerFacingCatalogView products={products} plantCareDb={plantCareDb} nurseryProfile={nurseryProfile} onExitPreview={currentUser ? () => { if (window.location.hash === '#customer-catalog') window.history.replaceState(null, '', window.location.pathname + window.location.search); setCustomerPreviewMode(false); } : null} />;
      }

      if (!currentUser) return <LoginScreen nurseryProfile={nurseryProfile} users={users} onLogin={(user) => setCurrentUser(user)} />;

      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: 'home' },
        { id: 'catalog', label: 'Inventory & Catalog', icon: 'grid' },
        { id: 'pos', label: 'Sales & POS Billing', icon: 'cart' },
        { id: 'purchases', label: 'Purchases', icon: 'truck' },
        { id: 'stock', label: 'Stock Management', icon: 'boxes' },
        { id: 'adjustments', label: 'Stock Adjustments', icon: 'adjust' },
        { id: 'sale-summary', label: 'Sale Summary', icon: 'chart' },
        { id: 'purchase-summary', label: 'Purchase Summary', icon: 'chart' },
        { id: 'workers', label: 'Workers & Attendance', icon: 'users' },
        { id: 'plant-care', label: 'Plant Care DB', icon: 'book' },
        { id: 'bills', label: 'Bill Gallery', icon: 'image' },
        { id: 'settings', label: 'Settings', icon: 'settings' },
      ];

      return (
        <div className="min-h-screen flex bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
          <aside className={`fixed lg:sticky top-0 left-0 z-40 h-screen bg-white dark:bg-slate-900 border-r transition-all duration-200 flex flex-col no-print ${sidebarExpanded ? 'w-64 translate-x-0' : 'w-0 -translate-x-full lg:w-20 lg:translate-x-0 overflow-hidden'}`}>
            <div className="h-16 flex items-center px-4 border-b shrink-0 gap-3">
              <div className="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center shrink-0"><Icon name="leaf" className="w-6 h-6" /></div>
              {sidebarExpanded && <span className="font-extrabold text-base truncate">{nurseryProfile.nurseryName}</span>}
            </div>
            <nav className="flex-1 overflow-y-auto p-3 space-y-1">
              {navItems.map((item) => (
                <button key={item.id} onClick={() => { setActivePage(item.id); if (window.innerWidth < 1024) setSidebarExpanded(false); }} title={item.label} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm transition ${activePage === item.id ? 'bg-emerald-600 text-white shadow' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'} ${!sidebarExpanded ? 'lg:justify-center' : ''}`}>
                  <Icon name={item.icon} className="w-5 h-5 shrink-0" />
                  {sidebarExpanded && <span className="truncate">{item.label}</span>}
                </button>
              ))}
            </nav>
          </aside>

          <div className="flex-1 flex flex-col min-w-0">
            <header className="sticky top-0 z-30 h-16 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b px-4 sm:px-6 flex items-center justify-between gap-3 no-print">
              <div className="flex items-center gap-3">
                <button onClick={() => setSidebarExpanded((prev) => !prev)} className="flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-emerald-600 hover:text-white font-bold text-xs transition"><Icon name="menu" className="w-5 h-5" /><span className="hidden sm:inline">{sidebarExpanded ? 'Collapse' : 'Menu'}</span></button>
                <span className="font-extrabold text-lg tracking-tight hidden sm:inline">{nurseryProfile.nurseryName} ERP</span>
              </div>
              <div className="flex items-center gap-2.5">
                <button onClick={() => setActivePage('workers')} className={`flex items-center gap-2 px-4 py-2 rounded-xl font-extrabold text-xs border transition ${activePage === 'workers' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-emerald-50 dark:bg-emerald-950/50 text-emerald-800 dark:text-emerald-300 border-emerald-200 hover:bg-emerald-600 hover:text-white'}`}>
                  <Icon name="users" className="w-4 h-4" /><span>Workers & Attendance</span>
                </button>
                <button onClick={() => setQrOpen(true)} className="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-slate-900 dark:bg-slate-700 text-white font-bold text-xs hover:bg-emerald-700 transition">
                  <Icon name="qr" className="w-4 h-4" /><span className="hidden md:inline">QR Scanner</span>
                </button>
              </div>
            </header>

            <main className="flex-1 p-4 sm:p-6 lg:p-8 max-w-[1520px] w-full mx-auto">
              {activePage === 'dashboard' && <DashboardPage nurseryProfile={nurseryProfile} currentUser={currentUser} products={products} sales={sales} purchases={purchases} onNavigate={setActivePage} onOpenQR={() => setQrOpen(true)} onOpenCustomerQR={() => setCustomerQrOpen(true)} />}
              {(activePage === 'catalog' || activePage === 'pos') && <CatalogAndPOSPage mode={activePage} products={products} cart={cart
