              <div className="my-3 space-y-1">
                <div className="text-[11px] font-bold uppercase text-slate-400">Today's Total Sales</div>
                <div style={{ color: 'var(--accent-primary)' }} className="text-3xl font-extrabold">₹{saleStats.todayTotal.toLocaleString()}</div>
                {saleRange !== 'today' && <div className="text-xs font-bold text-slate-600 dark:text-slate-300">Range ({saleRange}): ₹{saleStats.rangeTotal.toLocaleString()} ({saleStats.count} bills)</div>}
              </div>
              <div className="grid grid-cols-2 gap-2 pt-3 border-t border-slate-100 dark:border-slate-800 text-xs">
                <div className="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/30"><span className="text-slate-500 dark:text-slate-400 block">Cash Received</span><strong className="text-sm text-emerald-700 dark:text-emerald-300">₹{saleStats.cash.toLocaleString()}</strong></div>
                <div className="p-2.5 rounded-xl bg-sky-50 dark:bg-sky-950/30"><span className="text-slate-500 dark:text-slate-400 block">UPI Received</span><strong className="text-sm text-sky-700 dark:text-sky-300">₹{saleStats.upi.toLocaleString()}</strong></div>
              </div>
            </div>

            {/* CARD 3: Entire Card Clickable -> Purchase Records View (Strictly Cash Expenditures) */}
            <div onClick={() => onNavigate('purchase-summary')} className="cursor-pointer rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 shadow-sm hover:shadow-lg hover:border-emerald-500 transition flex flex-col justify-between min-h-[240px]">
              <div className="flex items-center justify-between gap-2">
                <h3 className="text-lg font-extrabold">{labels.purchaseSummaryCardTitle}</h3>
                <select value={purRange} onClick={(e) => e.stopPropagation()} onChange={(e) => setPurRange(e.target.value)} className="px-3 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-bold outline-none">
                  {rangeOptions.map((o) => <option key={o.id} value={o.id}>{o.l}</option>)}
                </select>
              </div>
              {purRange === 'custom' && (
                <div className="flex flex-wrap items-center gap-1.5 pt-2" onClick={(e) => e.stopPropagation()}><DateInputDDMMYYYY value={purCStart} onChange={setPurCStart} /><span className="text-xs">to</span><DateInputDDMMYYYY value={purCEnd} onChange={setPurCEnd} /></div>
              )}
              <div className="my-3 space-y-1">
                <div className="text-[11px] font-bold uppercase text-slate-400">Today's Cash Expenditures</div>
                <div className="text-3xl font-extrabold text-amber-600 dark:text-amber-400">₹{purStats.todayCash.toLocaleString()}</div>
                {purRange !== 'today' && <div className="text-xs font-bold text-slate-600 dark:text-slate-300">Range Cash ({purRange}): ₹{purStats.rangeCash.toLocaleString()}</div>}
              </div>
              <div className="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs">
                <span className="font-semibold text-slate-500 dark:text-slate-400">Bills: <strong>{purStats.count}</strong></span>
                <span className="font-extrabold text-amber-600 dark:text-amber-400">View Purchase Records →</span>
              </div>
            </div>

            {/* CARD 4: Entire Card Clickable -> Dedicated Notifications & Alerts Page */}
            <div onClick={() => onNavigate('notifications-alerts')} className="cursor-pointer rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 shadow-sm hover:shadow-lg hover:border-emerald-500 transition flex flex-col justify-between min-h-[240px]">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2.5"><div className="p-3 rounded-2xl bg-rose-100 dark:bg-rose-950/60 text-rose-600 dark:text-rose-300"><Icon name="bell" className="w-6 h-6" /></div><h3 className="text-lg font-extrabold">{labels.alertsPageTitle}</h3></div>
                <span className="text-xs font-extrabold text-rose-600 dark:text-rose-400">Open Alerts & Staff →</span>
              </div>
              <div className="my-3 space-y-2">
                <div className="flex items-center justify-between p-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-900 text-xs">
                  <span className="font-bold text-rose-800 dark:text-rose-300">Low Stock Threshold Warnings</span>
                  <span className="px-2 py-0.5 rounded-full bg-rose-600 text-white font-extrabold">{lowCount}</span>
                </div>
                <div className="flex items-center justify-between p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-900 text-xs">
                  <span className="font-bold text-emerald-800 dark:text-emerald-300">Active Staff & Agronomic Alerts</span>
                  <span className="px-2 py-0.5 rounded-full bg-emerald-600 text-white font-extrabold">{users.length} Users</span>
                </div>
              </div>
              <div className="text-[11px] font-semibold text-slate-500 dark:text-slate-400 pt-2 border-t border-slate-100 dark:border-slate-800">
                Includes Low Stock Alerts, Staff Summary & Activity Logs
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 18. ROOT APP SHELL (Global Escape Listener, Zero-Match Speech Popup, Hybrid Sync, RBAC)
    // =========================================================================
    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [loadingDb, setLoadingDb] = useState(true);
      const [sidebarExpanded, setSidebarExpanded] = useState(false);
      const [activePage, setActivePage] = useState('dashboard');
      const [customerMode, setCustomerMode] = useState(window.location.hash === '#price-free-catalog');

      const [nurseryProfile, setNurseryProfile] = useState(DEFAULT_PROFILE);
      const [themeCfg, setThemeCfg] = useState(DEFAULT_THEME_CFG);
      const [labels, setLabels] = useState(DEFAULT_LABELS);
      const [staffEditWindow, setStaffEditWindow] = useState(DEFAULT_EDIT_WINDOW);
      const [users, setUsers] = useState(DEFAULT_USERS);
      const [products, setProducts] = useState([]);
      const [sales, setSales] = useState([]);
      const [purchases, setPurchases] = useState([]);
      const [adjustments, setAdjustments] = useState([]);
      const [workers, setWorkers] = useState([]);
      const [attendance, setAttendance] = useState({});

      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [syncQueue, setSyncQueue] = useState([]);
      const [lastFeedSync, setLastFeedSync] = useState(todayDDMMYYYY());
      const [systemMessages, setSystemMessages] = useState([]);

      const [cart, setCart] = useState([]);
      const [checkoutOpen, setCheckoutOpen] = useState(false);
      const [waDispatch, setWaDispatch] = useState(null);
      const [exportCfg, setExportCfg] = useState(null);
      const [zeroMatchQuery, setZeroMatchQuery] = useState('');
      const [toast, setToast] = useState('');
      const [pinModal, setPinModal] = useState({ open: false, title: '', subtitle: '', onOk: null });

      const showToast = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(''), 3200); }, []);
      const requestPin = useCallback((title, subtitle, onOk) => setPinModal({ open: true, title, subtitle, onOk }), []);

      const handleZeroMatch = useCallback((q) => {
        setZeroMatchQuery(q);
        speakZeroMatchPhrase();
      }, []);

      // Global 'Escape' Key Listener closing active modals/popups
      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.key !== 'Escape') return;
          if (pinModal.open) { setPinModal({ open: false, title: '', subtitle: '', onOk: null }); return; }
          if (zeroMatchQuery) { setZeroMatchQuery(''); return; }
          if (exportCfg) { setExportCfg(null); return; }
          if (waDispatch) { setWaDispatch(null); return; }
          if (checkoutOpen) { setCheckoutOpen(false); return; }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [pinModal.open, zeroMatchQuery, exportCfg, waDispatch, checkoutOpen]);

      // Hybrid Service Worker + Background Sync + Automated Botanical Feed Sync
      useEffect(() => {
        registerHybridSW();
        const flushSync = async () => {
          const q = (await idb.get(SYNC_QUEUE_KEY)) || [];
          if (navigator.onLine && q.length > 0) {
            await idb.set(SYNC_QUEUE_KEY, []);
            setSyncQueue([]);
            setSystemMessages((p) => [`Background Sync completed (${q.length} offline records).`, ...p.slice(0, 4)]);
            showToast(`Synced ${q.length} offline transactions.`);
          }
          setLastFeedSync(todayDDMMYYYY());
        };
        const onOn = () => { setIsOnline(true); flushSync(); };
        const onOff = () => setIsOnline(false);
        window.addEventListener('online', onOn);
        window.addEventListener('offline', onOff);
        const feedTimer = setInterval(() => { if (navigator.onLine) setLastFeedSync(todayDDMMYYYY()); }, 300000);
        return () => { window.removeEventListener('online', onOn); window.removeEventListener('offline', onOff); clearInterval(feedTimer); };
      }, [showToast]);

      useEffect(() => {
        const onHash = () => setCustomerMode(window.location.hash === '#price-free-catalog');
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      useEffect(() => {
        (async () => {
          const init = await idb.get('init_v7');
          if (!init) {
            await idb.set('nurseryProfile', DEFAULT_PROFILE);
            await idb.set('themeCfg', DEFAULT_THEME_CFG);
            await idb.set('labels', DEFAULT_LABELS);
            await idb.set('staffEditWindow', DEFAULT_EDIT_WINDOW);
            await idb.set('users', DEFAULT_USERS);
            await idb.set('products', SEED_PRODUCTS);
            await idb.set('sales', SEED_SALES);
            await idb.set('purchases', SEED_PURCHASES);
            await idb.set('adjustments', SEED_ADJUSTMENTS);
            await idb.set('workers', SEED_WORKERS);
            await idb.set('attendance', {});
            await idb.set('init_v7', true);
          }
          const savedSession = await idb.get('activeSessionUser');
          const savedPage = await idb.get('activeSessionPage');
          setNurseryProfile((await idb.get('nurseryProfile')) || DEFAULT_PROFILE);
          setThemeCfg((await idb.get('themeCfg')) || DEFAULT_THEME_CFG);
          setLabels((await idb.get('labels')) || DEFAULT_LABELS);
          setStaffEditWindow((await idb.get('staffEditWindow')) || DEFAULT_EDIT_WINDOW);
          setUsers((await idb.get('users')) || DEFAULT_USERS);
          setProducts((await idb.get('products')) || SEED_PRODUCTS);
          setSales((await idb.get('sales')) || SEED_SALES);
          setPurchases((await idb.get('purchases')) || SEED_PURCHASES);
          setAdjustments((await idb.get('adjustments')) || SEED_ADJUSTMENTS);
          setWorkers((await idb.get('workers')) || SEED_WORKERS);
          setAttendance((await idb.get('attendance')) || {});
          setSyncQueue((await idb.get(SYNC_QUEUE_KEY)) || []);
          if (savedSession) { setCurrentUser(savedSession); if (savedPage) setActivePage(savedPage); }
          setLoadingDb(false);
        })();
      }, []);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', themeCfg.mode === 'dark');
        document.documentElement.style.setProperty('--accent-primary', themeCfg.primaryColor || '#059669');
        document.documentElement.style.setProperty('--accent-secondary', themeCfg.secondaryColor || '#0f766e');
        updateWebManifest(nurseryProfile.nurseryName, themeCfg.primaryColor || '#059669');
        if (!loadingDb) idb.set('themeCfg', themeCfg);
      }, [themeCfg, nurseryProfile.nurseryName, loadingDb]);

      const persistSession = (user, page) => {
        setCurrentUser(user); idb.set('activeSessionUser', user);
        if (page) { setActivePage(page); idb.set('activeSessionPage', page); }
      };

      const navigateTo = (pageId) => {
        if (pageId === 'purchases' || pageId === 'settings') {
          requestPin(
            pageId === 'settings' ? 'Administrator Settings Gateway' : 'Purchase Module PIN Gateway',
            `Enter Secondary Security PIN to access ${pageId}.`,
            () => { setActivePage(pageId); idb.set('activeSessionPage', pageId); }
          );
          return;
        }
        setActivePage(pageId);
        idb.set('activeSessionPage', pageId);
      };

      const queueOffline = async (entry) => {
        if (!navigator.onLine) {
          const nq = [...syncQueue, { ...entry, queuedAt: Date.now() }];
          setSyncQueue(nq); await idb.set(SYNC_QUEUE_KEY, nq);
        }
      };

      const saveProfile = (n) => { setNurseryProfile(n); idb.set('nurseryProfile', n); showToast('Profile saved.'); };
      const saveLabels = (n) => { setLabels(n); idb.set('labels', n); showToast('Global headers updated.'); };
      const saveEditWindow = (n) => { setStaffEditWindow(n); idb.set('staffEditWindow', n); showToast('Edit window updated.'); };
      const saveUsers = (n) => { setUsers(n); idb.set('users', n); showToast('Users updated.'); };
      // Event-driven catalog sync when stock changes or reaches zero
      const saveProducts = (n) => { setProducts([...n]); idb.set('products', n); };
      const saveSales = (n) => { setSales(n); idb.set('sales', n); };
      const savePurchases = (n) => { setPurchases(n); idb.set('purchases', n); };
      const saveAdjustments = (n) => { setAdjustments(n); idb.set('adjustments', n); };
      const saveWorkers = (n) => { setWorkers(n); idb.set('workers', n); };
      const saveAttendance = (n) => { setAttendance(n); idb.set('attendance', n); };

      const handleConfirmSale = (salePayload) => {
        const newSale = { id: 'INV-' + (1000 + sales.length + 1), date: todayDDMMYYYY(), time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), createdBy: currentUser?.username || 'Davinder Brar', createdAt: Date.now(), ...salePayload };
        saveSales([newSale, ...sales]);
        const nextProds = products.map((p) => {
          const soldForProd = salePayload.items.filter((i) => !i.isNonInventory && i.productId === p.id);
          if (!soldForProd.length) return p;
          const nextVars = (p.variants || []).map((v) => {
            const sv = soldForProd.find((s) => s.variantId === v.id);
            return sv ? { ...v, stock: Math.max(0, v.stock - sv.qty) } : v;
          });
          const totStk = nextVars.length ? nextVars.reduce((a, v) => a + v.stock, 0) : Math.max(0, p.stock - soldForProd.reduce((a, s) => a + s.qty, 0));
          return { ...p, variants: nextVars, stock: totStk };
        });
        saveProducts(nextProds);
        queueOffline({ kind: 'sale', id: newSale.id });
        setCart([]); setCheckoutOpen(false);
        const wa = buildWhatsAppBillPayload(newSale, nurseryProfile, nextProds);
        setWaDispatch(wa);
        if (wa.url) { try { window.open(wa.url, '_blank', 'noopener,noreferrer'); } catch {} }
        showToast(`Sale ${newSale.id} saved.`);
      };

      const handleUpdateSale = (upd) => { saveSales(sales.map((s) => s.id === upd.id ? upd : s)); showToast(`Sale ${upd.id} updated.`); };
      const handleDeleteSale = (id) => { saveSales(sales.filter((s) => s.id !== id)); showToast(`Sale ${id} deleted.`); };

      const handleRecordPurchase = (purPayload) => {
        const newPur = { id: 'PUR-' + (500 + purchases.length + 1), time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), ...purPayload };
        savePurchases([newPur, ...purchases]);
        saveProducts(products.map((p) => {
          const b = purPayload.items.find((i) => i.productId === p.id);
          if (!b) return p;
          const nextVars = (p.variants || []).map((v, idx) => idx === 0 ? { ...v, stock: v.stock + b.qty } : v);
          return { ...p, variants: nextVars, stock: p.stock + b.qty };
        }));
        queueOffline({ kind: 'purchase', id: newPur.id });
        showToast(`Purchase ${newPur.id} saved.`);
      };

      const handleImportPurchaseExcel = (rows) => {
        let updated = 0, added = 0;
        const map = new Map(products.map((p) => [p.id, p]));
        rows.forEach((r) => {
          const nameEn = String(r.nameEn || r.Name || '').trim(); if (!nameEn) return;
          const t = (r.id && map.get(String(r.id))) || [...map.values()].find((p) => p.nameEn.toLowerCase() === nameEn.toLowerCase());
          const catEn = String(r.category || t?.category || CATEGORIES[0].en);
          const co = CATEGORIES.find((c) => c.en === catEn);
          const pr = Number(r.price ?? t?.price ?? 0)||0, stk = Number(r.stock ?? t?.stock ?? 0)||0, th = Number(r.threshold ?? t?.threshold ?? 10)||0;
          const id = t ? t.id : (r.id ? String(r.id) : 'p-' + Date.now() + '-' + Math.random().toString(36).slice(2,5));
          const obj = { id, nameEn, nameHi: String(r.nameHi ?? t?.nameHi ?? ''), botanicalName: t?.botanicalName || 'Cultivar', category: catEn, categoryHi: String(r.categoryHi || co?.hi || t?.categoryHi || ''), price: pr, stock: stk, threshold: th, image: String(r.image ?? t?.image ?? ''), careId: String(r.careId || t?.careId || 'pc-rose'), variants: t?.variants || [{ id: `${id}-std`, label: 'Standard', price: pr, stock: stk, threshold: th }] };
          if (t) updated++; else added++;
          map.set(id, obj);
        });
        saveProducts(Array.from(map.values()));
        showToast(`Procurement Excel import: ${updated} updated, ${added} added.`);
      };

      const handleAddAdjustment = (adj) => {
        saveAdjustments([adj, ...adjustments]);
        saveProducts(products.map((p) => {
          if (p.id !== adj.productId) return p;
          const nextVars = (p.variants || []).map((v, idx) => idx === 0 ? { ...v, stock: Math.max(0, v.stock - adj.qty) } : v);
          return { ...p, variants: nextVars, stock: Math.max(0, p.stock - adj.qty) };
        }));
        showToast('Adjustment saved & locked.');
      };

      if (loadingDb) return <div className="min-h-screen flex items-center justify-center bg-slate-950 text-white font-bold">Loading ERP...</div>;
      if (customerMode) return <DynamicPriceFreeCatalogView products={products} nurseryProfile={nurseryProfile} onExit={currentUser ? () => { if (window.location.hash === '#price-free-catalog') window.history.replaceState(null, '', window.location.pathname + window.location.search); setCustomerMode(false); } : null} />;
      if (!currentUser) return <LoginScreen nurseryProfile={nurseryProfile} themeCfg={themeCfg} users={users} onLogin={(u) => persistSession(u, u.role === 'Staff' ? 'inventory-sales' : 'dashboard')} />;

      const isStaff = currentUser.role === 'Staff';
      // Bill Gallery completely concealed from navigation
      const adminNavItems = [
        { id:'dashboard', label: labels.dashboardTitle, icon:'home' },
        { id:'inventory-sales', label: labels.inventorySalesTitle, icon:'cart' },
        { id:'purchases', label: labels.purchasesTitle, icon:'truck' },
        { id:'stock', label: labels.stockMgmtTitle, icon:'boxes' },
        { id:'crop-scheduler', label: labels.cropSchedulerTitle, icon:'calendar' },
        { id:'workers', label: labels.workersTitle, icon:'users' },
        { id:'notifications-alerts', label: labels.alertsPageTitle, icon:'bell' },
        { id:'settings', label: labels.settingsTitle, icon:'settings' },
      ];
      const staffNavItems = [
        { id:'inventory-sales', label: labels.inventorySalesTitle, icon:'cart' },
        { id:'sale-summary', label: 'Sale Summary', icon:'chart' }
      ];
      const navItems = isStaff ? staffNavItems : adminNavItems;
      const effectivePage = isStaff && !['inventory-sales', 'sale-summary'].includes(activePage) ? 'inventory-sales' : activePage;

      return (
        <div className="min-h-screen flex bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
          <aside className={`fixed lg:sticky top-0 left-0 z-40 h-screen bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 transition-all duration-200 flex flex-col no-print ${sidebarExpanded ? 'w-64 translate-x-0' : 'w-0 -translate-x-full lg:w-20 lg:translate-x-0 overflow-hidden'}`}>
            <div className="h-16 flex items-center px-3 border-b border-slate-200 dark:border-slate-800 shrink-0 gap-2.5">
              <SachLogo className="w-10 h-11 shrink-0" />
              {sidebarExpanded && <span className="font-extrabold text-base truncate">{nurseryProfile.nurseryName}</span>}
            </div>
            <nav className="flex-1 overflow-y-auto p-3 space-y-1">
              {navItems.map((it) => (
                <button key={it.id} onClick={() => { navigateTo(it.id); if (window.innerWidth < 1024) setSidebarExpanded(false); }} title={it.label} style={effectivePage === it.id ? { backgroundColor: 'var(--accent-primary)' } : {}} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm transition ${effectivePage === it.id ? 'text-white shadow' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'} ${!sidebarExpanded ? 'lg:justify-center' : ''}`}>
                  <Icon name={it.icon} className="w-5 h-5 shrink-0" />{sidebarExpanded && <span className="truncate">{it.label}</span>}
                </button>
              ))}
            </nav>
          </aside>

          <div className="flex-1 flex flex-col min-w-0">
            <header className="sticky top-0 z-30 h-16 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 flex items-center justify-between gap-3 no-print">
              <div className="flex items-center gap-3">
                <button onClick={() => setSidebarExpanded((p) => !p)} className="flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-xs"><Icon name="menu" className="w-5 h-5" /><span className="hidden sm:inline">{sidebarExpanded ? 'Collapse' : 'Menu'}</span></button>
                <span className="font-extrabold text-lg hidden sm:inline">{labels.appTitle}</span>
                <span className={`px-2 py-0.5 rounded-full text-[10px] font-extrabold ${isOnline ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-800'}`}>{isOnline ? '● Online' : `● Offline (${syncQueue.length})`}</span>
              </div>
              <div className="flex items-center gap-2">
                {!isStaff ? (
                  <>
                    <button onClick={() => navigateTo('workers')} className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 font-extrabold text-xs"><Icon name="users" className="w-4 h-4" /><span className="hidden md:inline">{labels.workersTitle}</span></button>
                    <button onClick={() => persistSession(null, null)} className="px-3 py-2 rounded-xl bg-rose-600 text-white font-bold text-xs">Logout</button>
                  </>
                ) : (
                  <button onClick={() => persistSession(null, null)} className="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-rose-600 text-white font-extrabold text-xs"><Icon name="logout" className="w-4 h-4" />Logout</button>
                )}
              </div>
            </header>

            <main className="flex-1 p-4 sm:p-6 lg:p-8 max-w-[1520px] w-full mx-auto">
              {effectivePage === 'dashboard' && !isStaff && <DashboardPage labels={labels} nurseryProfile={nurseryProfile} currentUser={currentUser} products={products} sales={sales} purchases={purchases} users={users} systemMessages={systemMessages} onNavigate={navigateTo} onOpenCustomerPreview={() => setCustomerMode(true)} />}
              {effectivePage === 'inventory-sales' && <UnifiedInventoryAndSalesPage label={labels.inventorySalesTitle} products={products} cart={cart} setCart={setCart} nurseryProfile={nurseryProfile} onOpenCheckout={() => setCheckoutOpen(true)} onOpenSaleSummary={() => setActivePage('sale-summary')} onOpenCustomerPreview={() => setCustomerMode(true)} onShowToast={showToast} onZeroMatch={handleZeroMatch} />}
              {effectivePage === 'sale-summary' && <SummaryReportPage type="sale" records={sales} currentUser={currentUser} staffEditWindow={staffEditWindow} onUpdateEntry={handleUpdateSale} onDeleteEntry={handleDeleteSale} onOpenExport={setExportCfg} requestPin={requestPin} onBack={() => setActivePage('inventory-sales')} />}
              {effectivePage === 'purchases' && !isStaff && <PurchasesPage label={labels.purchasesTitle} products={products} purchases={purchases} onAddProduct={(p) => { saveProducts([p, ...products]); showToast(`Added "${p.nameHi || p.nameEn}".`); }} onRecordPurchase={handleRecordPurchase} onImportPurchaseExcel={handleImportPurchaseExcel} onOpenPurchaseSummary={() => setActivePage('purchase-summary')} onOpenExport={setExportCfg} requestPin={requestPin} onZeroMatch={handleZeroMatch} />}
              {effectivePage === 'purchase-summary' && !isStaff && <SummaryReportPage type="purchase" records={purchases} currentUser={currentUser} staffEditWindow={staffEditWindow} onUpdateEntry={(u) => { savePurchases(purchases.map((p) => p.id === u.id ? u : p)); showToast('Purchase updated.'); }} onDeleteEntry={(id) => { savePurchases(purchases.filter((p) => p.id !== id)); showToast('Purchase deleted.'); }} onOpenExport={setExportCfg} requestPin={requestPin} onBack={() => setActivePage('purchases')} />}
              {effectivePage === 'stock' && !isStaff && <StockManagementPage label={labels.stockMgmtTitle} products={products} onUpdateProduct={(u) => { saveProducts(products.map((x) => x.id === u.id ? u : x)); showToast(`Updated "${u.nameHi || u.nameEn}".`); }} onDeleteProduct={(id) => { saveProducts(products.filter((x) => x.id !== id)); showToast('Plant deleted.'); }} adjustments={adjustments} onAddAdjustment={handleAddAdjustment} onUpdateAdjustment={(u) => saveAdjustments(adjustments.map((a) => a.id === u.id ? u : a))} requestPin={requestPin} onOpenExport={setExportCfg} />}
              {effectivePage === 'crop-scheduler' && !isStaff && <CropSchedulerPage label={labels.cropSchedulerTitle} products={products} lastFeedSync={lastFeedSync} onSyncFeeds={() => { setLastFeedSync(todayDDMMYYYY()); showToast('Botanical seasonal feeds synced.'); }} onOpenExport={setExportCfg} requestPin={requestPin} />}
              {effectivePage === 'workers' && !isStaff && <WorkersAttendancePage label={labels.workersTitle} workers={workers} onAddWorker={(w) => { saveWorkers([...workers, w]); showToast(`Added ${w.name}.`); }} onUpdateWorker={(u) => { saveWorkers(workers.map((x) => x.id === u.id ? u : x)); showToast('Worker updated.'); }} onDeleteWorker={(id) => { saveWorkers(workers.filter((x) => x.id !== id)); showToast('Worker deleted.'); }} attendance={attendance} onSetAttendance={(d, w, s) => saveAttendance({ ...attendance, [d]: { ...(attendance[d]||{}), [w]: s } })} requestPin={requestPin} onOpenExport={setExportCfg} onShowToast={showToast} />}
              {effectivePage === 'notifications-alerts' && !isStaff && <NotificationsAndAlertsPage label={labels.alertsPageTitle} products={products} sales={sales} users={users} systemMessages={systemMessages} onOpenExport={setExportCfg} requestPin={requestPin} />}
              {effectivePage === 'settings' && !isStaff && <SettingsPage labels={labels} onSaveLabels={saveLabels} themeCfg={themeCfg} onSaveThemeCfg={setThemeCfg} nurseryProfile={nurseryProfile} onSaveProfile={saveProfile} staffEditWindow={staffEditWindow} onSaveEditWindow={saveEditWindow} users={users} onSaveUsers={saveUsers} currentUser={currentUser} requestPin={requestPin} onLogout={() => persistSession(null, null)} />}
            </main>
          </div>

          <CentralCheckoutModal isOpen={checkoutOpen} cart={cart} setCart={setCart} products={products} onClose={() => setCheckoutOpen(false)} onConfirmSale={handleConfirmSale} />
          <WhatsAppDispatchModal dispatchInfo={waDispatch} onClose={() => setWaDispatch(null)} />
          <ExportShareModal config={exportCfg} onClose={() => setExportCfg(null)} />
          <PinVerificationModal isOpen={pinModal.open} title={pinModal.title} subtitle={pinModal.subtitle} onCancel={() => setPinModal({ open: false, title: '', subtitle: '', onOk: null })} onSuccess={() => { const fn = pinModal.onOk; setPinModal({ open: false, title: '', subtitle: '', onOk: null }); if (fn) fn(); }} />

          {/* Zero-Match Voice & Visual Popup ("Chacha eh hai nahi") */}
          {zeroMatchQuery && (
            <div className="fixed inset-0 z-[125] flex items-center justify-center bg-slate-950/60 p-4" onClick={() => setZeroMatchQuery('')}>
              <div className="max-w-sm w-full rounded-3xl bg-white dark:bg-slate-900 border-2 border-amber-500 p-6 shadow-2xl text-center space-y-4 text-slate-900 dark:text-slate-100" onClick={(e) => e.stopPropagation()}>
                <div className="w-12 h-12 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center mx-auto font-extrabold text-xl">!</div>
                <h3 className="text-xl font-extrabold text-amber-700 dark:text-amber-400">Chacha eh hai nahi</h3>
                <p className="text-xs text-slate-500 dark:text-slate-400">No inventory items matched "{zeroMatchQuery}".</p>
                <button onClick={() => setZeroMatchQuery('')} style={{ backgroundColor: 'var(--accent-primary)' }} className="px-6 py-2 rounded-xl text-white font-extrabold text-xs">Dismiss (Esc)</button>
              </div>
            </div>
          )}

          {toast && <div className="fixed bottom-5 right-5 z-[130] px-5 py-3 rounded-2xl bg-slate-900 dark:bg-emerald-600 text-white font-bold text-sm shadow-2xl">{toast}</div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
